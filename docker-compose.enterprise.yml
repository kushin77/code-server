services:
  code-server-ide:
    image: codercom/code-server:4.19.0
    container_name: code-server-ide
    ports:
    - 8090:8080
    environment:
    - PASSWORD=${CODE_SERVER_PASSWORD:-password123}
    - SUDO_PASSWORD=${CODE_SERVER_PASSWORD:-password123}
    - SUDO_PASSWORD_HASH=${CODE_SERVER_PASSWORD_HASH}
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8888/health
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: code-server-minio
    ports:
    - 9010:9000
    - 9011:9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
    - minio_data:/data
    networks:
    - services
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9000/minio/health/live
      interval: 30s
      timeout: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M
  appsmith:
    image: appsmith/appsmith-ce:v1.9.57
    container_name: code-server-appsmith
    ports:
    - 8084:80
    environment:
    - APPSMITH_DISABLE_TELEMETRY=true
    - APPSMITH_GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
    - APPSMITH_MAIL_ENABLED=${APPSMITH_MAIL_ENABLED:-false}
    - APPSMITH_INSTANCE_NAME=${APPSMITH_INSTANCE_NAME:-kushnir-cloud-ide}
    # OAuth Configuration (REQUIRED for production - see GOOGLE_OAUTH_SETUP_GUIDE.md)
    - OAUTH_GOOGLE_CLIENT_ID=${OAUTH_GOOGLE_CLIENT_ID}
    - OAUTH_GOOGLE_CLIENT_SECRET=${OAUTH_GOOGLE_CLIENT_SECRET}
    # GitHub OAuth is optional
    - OAUTH_GITHUB_CLIENT_ID=${OAUTH_GITHUB_CLIENT_ID:-}
    - OAUTH_GITHUB_CLIENT_SECRET=${OAUTH_GITHUB_CLIENT_SECRET:-}
    volumes:
    - appsmith_stacks:/appsmith-stacks
    networks:
    - services
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost/
      interval: 60s
      timeout: 10s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M
  vault:
    image: hashicorp/vault:1.13.0
    container_name: code-server-vault
    ports:
    - 8200:8200
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-devtoken}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
    - IPC_LOCK
    networks:
    - services
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - VAULT_ADDR=http://127.0.0.1:8200 vault status >/dev/null 2>&1 || exit 1
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
  artifact-repository:
    image: sonatype/nexus3:3.68.1
    container_name: code-server-artifact-repo
    ports:
    - 8083:8081
    environment:
    - NEXUS_CONTEXT=nexus
    - INSTALL4J_ADD_VM_PARAMS=-Xms1024m -Xmx1024m -XX:MaxDirectMemorySize=1024m
    volumes:
    - nexus_data:/nexus-data
    networks:
    - services
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8081/nexus/
      interval: 60s
      timeout: 10s
      start_period: 300s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
  control-plane:
    build:
      context: .
      dockerfile: apps/control-plane/Dockerfile
    # Internal image: control-plane v1.0.0 (built locally)
    image: code-server-control-plane:${CONTROL_PLANE_VERSION:-v1.0.0}
    container_name: code-server-control-plane
    ports:
    - 8086:8082
    environment:
    - SERVICE_NAME=control-plane
    - CONTROL_PLANE_PORT=8082
    - CONTROL_PLANE_HOST=0.0.0.0
    - LOG_LEVEL=INFO
    - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST:-code-server-postgres}:5432/${DB_NAME}
    - REDIS_URL=redis://${REDIS_HOST:-code-server-redis}:6379/4
    networks:
    - services
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8082/health
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M

volumes:
  code_server_data:
    driver: local
  gitlab_config:
    driver: local
  gitlab_logs:
    driver: local
  gitlab_data:
    driver: local
  gitlab_runner_data:
    driver: local
  minio_data:
    driver: local
  appsmith_stacks:
    driver: local
networks:
  services:
    external: true
    name: services
