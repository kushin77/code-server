name: GitHub Free Maximization Baseline

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/ci/check-github-free-usage.sh'
      - 'docs/ops/GITHUB-FREE-MAXIMIZATION-PLAN.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/ci/check-github-free-usage.sh'
      - 'docs/ops/GITHUB-FREE-MAXIMIZATION-PLAN.md'
  schedule:
    - cron: '15 3 * * 1'

jobs:
  inventory-github-free-usage:
    name: Inventory GitHub Free Usage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Run GitHub Free usage inventory
        run: bash scripts/ci/check-github-free-usage.sh
        shell: bash

      - name: Upload GitHub Free usage report
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808  # v4.3.3
        if: always()
        with:
          name: github-free-maximization-report
          path: artifacts/triage/github-free-maximization-report.*
          retention-days: 90
