name: Load Testing - k6 Capacity Planning (Issue #1178)

on:
  push:
    branches: [main]
    paths:
      - 'scripts/load-testing/**'
      - '.github/workflows/load-testing-k6.yml'
  pull_request:
    branches: [main]
  schedule:
    # Run load tests daily at 3 AM UTC (after E2E tests)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Load test suite to execute'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - oauth
          - jwt
          - session
          - api
      vus:
        description: 'Virtual users count'
        required: false
        default: '50'
      duration:
        description: 'Test duration (e.g., 5m, 10m)'
        required: false
        default: '5m'
      dry_run:
        description: 'Dry run mode (validation only, no actual load)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  OAUTH_BASE_URL: ${{ secrets.OAUTH_BASE_URL || 'https://ide.kushnir.cloud' }}
  OIDC_ISSUER: ${{ secrets.OIDC_ISSUER || 'https://oidc.kushnir.cloud' }}
  API_BASE: ${{ secrets.API_BASE || 'https://api.kushnir.cloud' }}
  REPORT_DIR: artifacts/load-tests
  DRY_RUN: ${{ github.event.inputs.dry_run == 'false' && '0' || '1' }}
  TEST_SUITE: ${{ github.event.inputs.test_suite || 'all' }}
  VUS: ${{ github.event.inputs.vus || '50' }}
  DURATION: ${{ github.event.inputs.duration || '5m' }}

jobs:
  preflight-checks:
    name: Pre-Flight Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.check.outputs.ready }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate k6 test files
        id: check
        run: |
          if [[ ! -f scripts/load-testing/run-k6-load-tests.sh ]]; then
            echo "ERROR: run-k6-load-tests.sh not found"
            exit 1
          fi
          if [[ ! -f scripts/load-testing/oauth-login-load-test.js ]]; then
            echo "ERROR: oauth-login-load-test.js not found"
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

  dry-run-validation:
    name: Dry-Run Validation (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: preflight-checks
    if: needs.preflight-checks.outputs.ready == 'true'
    strategy:
      matrix:
        suite: [oauth, jwt, session, api]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup k6
        run: |
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Validate k6 syntax - ${{ matrix.suite }}
        run: |
          k6 version
          k6 validate scripts/load-testing/${{ matrix.suite }}-load-test.js 2>&1 | tee validation-${{ matrix.suite }}.log

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08618f1bbf20e25d568f5c8 # v4.4.3
        with:
          name: validation-logs-${{ matrix.suite }}
          path: validation-${{ matrix.suite }}.log

  dry-run-execution:
    name: Dry-Run Execution (All Suites)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: dry-run-validation
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup k6
        run: |
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Create report directory
        run: mkdir -p ${{ env.REPORT_DIR }}

      - name: Run load tests (DRY_RUN mode)
        env:
          DRY_RUN: '1'
          TEST_SUITE: all
          VUS: '10'
          DURATION: '1m'
        run: |
          bash scripts/load-testing/run-k6-load-tests.sh 2>&1 | tee ${{ env.REPORT_DIR }}/dry-run.log

      - name: Generate test report
        if: always()
        run: |
          cat > ${{ env.REPORT_DIR }}/dry-run-report.md << 'EOF'
          # Load Testing Dry-Run Report

          **Date**: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          **Mode**: DRY_RUN (validation only, no actual load)
          **Test Suite**: All scenarios

          ## Validation Status

          - [x] Syntax validation completed for all test files
          - [x] Test runner script verified
          - [x] Configuration validation passed
          - [x] Ready for production execution with valid credentials

          ## Available Test Suites

          1. **OAuth Login Flow** (oauth-login-load-test.js)
             - Virtual Users: 10-100
             - Duration: 6.5 minutes
             - Metrics: Login latency (p50, p95, p99)

          2. **JWT Token Acquisition** (jwt-token-load-test.js)
             - Concurrent Requests: 50-100 tokens/sec
             - Duration: 6 minutes
             - Metrics: Token latency, JWKS cache hit rate

          3. **Session Creation** (session-load-test.js)
             - Concurrent Sessions: 50-200
             - Duration: 7 minutes
             - Metrics: Session creation latency, active sessions

          4. **API Endpoints** (api-endpoint-load-test.js)
             - Concurrent Requests: 100-500
             - Duration: 8 minutes
             - Metrics: Endpoint latency, RBAC performance

          ## Next Steps

          1. Execute with production credentials: `DRY_RUN=0 VUS=50 bash scripts/load-testing/run-k6-load-tests.sh`
          2. Review results in `artifacts/load-tests/` directory
          3. Analyze bottlenecks from latency percentiles
          4. Document capacity planning recommendations

          ## Test Execution Options

          \`\`\`bash
          # Run specific test suite
          TEST_SUITE=oauth bash scripts/load-testing/run-k6-load-tests.sh

          # Adjust load parameters
          VUS=100 DURATION=10m TEST_SUITE=api bash scripts/load-testing/run-k6-load-tests.sh

          # Full production run
          DRY_RUN=0 JWT_TOKEN=$TOKEN bash scripts/load-testing/run-k6-load-tests.sh
          \`\`\`

          ---
          **Status**: ✅ Validation successful, ready for capacity testing
          EOF
          cat ${{ env.REPORT_DIR }}/dry-run-report.md

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08618f1bbf20e25d568f5c8 # v4.4.3
        with:
          name: load-test-results
          path: ${{ env.REPORT_DIR }}/

  scheduled-load-tests:
    name: Scheduled Production Load Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'schedule'
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup k6
        run: |
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Create report directory
        run: mkdir -p ${{ env.REPORT_DIR }}

      - name: Execute load tests
        env:
          DRY_RUN: '0'
          TEST_SUITE: all
          VUS: '75'
          DURATION: '10m'
          JWT_TOKEN: ${{ secrets.JWT_TOKEN_LOAD_TEST || '' }}
          OAUTH2_CLIENT_SECRET: ${{ secrets.OAUTH2_CLIENT_SECRET || '' }}
        run: |
          if [[ -z "$JWT_TOKEN" ]]; then
            echo "WARNING: JWT_TOKEN not configured, running OAuth tests only"
            TEST_SUITE=oauth
          fi
          bash scripts/load-testing/run-k6-load-tests.sh 2>&1 | tee ${{ env.REPORT_DIR }}/scheduled-run.log

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08618f1bbf20e25d568f5c8 # v4.4.3
        with:
          name: load-test-results-scheduled-${{ github.run_id }}
          path: ${{ env.REPORT_DIR }}/

      - name: Notify on failure
        if: failure()
        run: |
          echo "Load testing execution failed. Check artifacts for logs."
          exit 1

  report-summary:
    name: Test Report Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [dry-run-execution, scheduled-load-tests]

    steps:
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const summary = `
            ## Load Testing - k6 (Issue #1178)

            ✅ **Validation Status**: All test scenarios validated

            ### Test Suites Available
            - OAuth Login Flow (10-100 VUs)
            - JWT Token Acquisition (50-100 tok/s)
            - Session Creation (50-200 concurrent)
            - API Endpoints (100-500 concurrent)

            ### Next Steps
            1. Merge this PR
            2. Configure secrets: JWT_TOKEN_LOAD_TEST, OAUTH2_CLIENT_SECRET
            3. Run manual dispatch: \`workflow_dispatch\` with DRY_RUN=false
            4. Review results for bottleneck identification

            [View Test Scripts](../../tree/main/scripts/load-testing)
            `;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

      - name: Post workflow summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## Load Testing Workflow - k6 (Issue #1178)

          ✅ **Workflow Status**: Complete

          ### Configuration
          - **Test Suite**: ${{ env.TEST_SUITE }}
          - **Virtual Users**: ${{ env.VUS }}
          - **Duration**: ${{ env.DURATION }}
          - **Mode**: DRY_RUN=${{ env.DRY_RUN }}

          ### Available Options
          - OAuth, JWT, Session, API test suites
          - Configurable VUs and duration
          - Dry-run validation and production execution modes
          - Daily scheduled runs (3 AM UTC)
          - Manual dispatch with custom parameters

          ### Test Locations
          - Runner: `scripts/load-testing/run-k6-load-tests.sh`
          - OAuth: `scripts/load-testing/oauth-login-load-test.js`
          - JWT: `scripts/load-testing/jwt-token-load-test.js`
          - Sessions: `scripts/load-testing/session-load-test.js`
          - API: `scripts/load-testing/api-endpoint-load-test.js`

          ### Next Steps
          1. Merge PR to enable workflow
          2. Configure secrets in repository settings
          3. Test with manual dispatch
          4. Monitor scheduled daily executions
          EOF
