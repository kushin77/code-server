# @file        playbooks/healing/caddy-502.yaml
# @description Remediation playbook for Caddy 502 Bad Gateway errors
# @owner       Phase 4 — Ecosystem & Autonomy

name: caddy-502-restart-proxy
description: "Restarts oauth2-proxy to resolve Caddy 502 Bad Gateway errors"
anomaly_type: caddy-502
version: "1.0.0"

# Diagnosis phase: verify the root cause
diagnosis:
  - name: "Check Caddy error logs"
    type: shell
    command: "docker logs caddy | grep -i 'bad gateway' | tail -5"
    on_error: continue
    timeout: 10
  
  - name: "Check oauth2-proxy status"
    type: docker
    command: "docker inspect oauth2-proxy --format='{{.State.Status}}'"
    on_error: continue
    timeout: 10
  
  - name: "Verify oauth2-proxy is not responding"
    type: http
    command: "curl -s -o /dev/null -w '%{http_code}' http://localhost:4180/ping"
    on_error: continue
    timeout: 5

# Remediation phase: fix the issue
remediation:
  - name: "Restart oauth2-proxy container"
    type: docker
    command: "docker restart oauth2-proxy"
    on_error: stop
    timeout: 30
  
  - name: "Wait for oauth2-proxy to become healthy"
    type: shell
    command: "sleep 5 && docker inspect oauth2-proxy --format='{{.State.Health.Status}}' | grep -q healthy"
    on_error: stop
    timeout: 60

# Validation phase: confirm fix worked
validation:
  - name: "Check oauth2-proxy is now healthy"
    type: docker
    command: "docker inspect oauth2-proxy --format='{{.State.Status}}'"
    on_error: continue
    timeout: 10
  
  - name: "Verify Caddy can reach oauth2-proxy"
    type: http
    command: "curl -s -I http://oauth2-proxy:4180/ping | head -1 | grep -q 200"
    on_error: continue
    timeout: 10
  
  - name: "Check Caddy no longer returning 502"
    type: shell
    command: "docker logs caddy --since 2m | grep -i 'bad gateway' | wc -l | grep -q 0"
    on_error: continue
    timeout: 10

# Rollback phase: undo changes if validation fails
rollback:
  - name: "Restore previous oauth2-proxy state"
    type: docker
    command: "docker exec oauth2-proxy systemctl restart oauth2-proxy || true"
    on_error: continue
    timeout: 30

# Post-remediation
post:
  publish_event: "healing.caddy-502"
  store_memory: true
  success_criteria:
    - "Caddy no longer returning 502 errors (rate < 0.01/sec)"
    - "oauth2-proxy health check passing"
    - "No errors in last 5 minutes"
