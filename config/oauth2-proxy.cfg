# OAuth2 Proxy configuration for the code-server gateway
http_address = "0.0.0.0:4180"
reverse_proxy = true
provider = "github"
redirect_url = "https://kushnir.local/oauth2/callback"
scope = "user:email read:org"
set_xauthrequest = true
pass_access_token = false
pass_user_headers = true
skip_provider_button = false
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
email_domains = ["*"]
upstreams = ["static://202"]