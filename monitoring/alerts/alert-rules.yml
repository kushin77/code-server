# @file        monitoring/alerts/alert-rules.yml
# @module      observability/alerts
# @description Unified observability alert rules for logs, traces, and GPU metrics
# @governance  GOV-002: Immutable, version-controlled, no hardcoded secrets
# Issue #1532: Centralized Observability & SLOG

groups:
  - name: observability_stack
    interval: 30s
    rules:
      - alert: LokiUnavailable
        expr: up{job="loki"} == 0
        for: 2m
        labels:
          severity: critical
          component: logging
        annotations:
          summary: "Loki is unavailable"
          description: "Loki is not responding to scrape checks"
          runbook: "docs/OBSERVABILITY-GUIDE.md"

      - alert: PromtailStopped
        expr: up{job="promtail"} == 0
        for: 2m
        labels:
          severity: critical
          component: logging
        annotations:
          summary: "Promtail stopped shipping logs"
          description: "Promtail is not scraping container logs"
          runbook: "docs/OBSERVABILITY-GUIDE.md"

      - alert: OTelCollectorUnavailable
        expr: up{job="otel-collector"} == 0
        for: 2m
        labels:
          severity: critical
          component: tracing
        annotations:
          summary: "OpenTelemetry Collector is unavailable"
          description: "OTel Collector is not receiving or exporting telemetry"
          runbook: "docs/OBSERVABILITY-GUIDE.md"

      - alert: TempoUnavailable
        expr: up{job="tempo"} == 0
        for: 2m
        labels:
          severity: warning
          component: tracing
        annotations:
          summary: "Tempo is unavailable"
          description: "Tempo is not responding to health checks"
          runbook: "docs/OBSERVABILITY-GUIDE.md"

      - alert: AlertmanagerUnavailable
        expr: up{job="alertmanager"} == 0
        for: 2m
        labels:
          severity: critical
          component: alerting
        annotations:
          summary: "Alertmanager is unavailable"
          description: "Alertmanager is not responding to scrape checks"
          runbook: "docs/OBSERVABILITY-GUIDE.md"

  - name: gpu_health
    interval: 30s
    rules:
      - alert: GPUUtilizationHigh
        expr: avg_over_time(DCGM_FI_DEV_GPU_UTIL[5m]) > 90
        for: 10m
        labels:
          severity: warning
          component: gpu
        annotations:
          summary: "GPU utilization is high"
          description: "Average GPU utilization exceeded 90% for 10m"
          runbook: "docs/OBSERVABILITY-GUIDE.md"

      - alert: GPUMemoryPressure
        expr: (DCGM_FI_DEV_FB_USED / DCGM_FI_DEV_FB_TOTAL) > 0.9
        for: 10m
        labels:
          severity: warning
          component: gpu
        annotations:
          summary: "GPU memory pressure detected"
          description: "GPU frame buffer usage is above 90%"
          runbook: "docs/OBSERVABILITY-GUIDE.md"

      - alert: GPUECCErrorsDetected
        expr: increase(DCGM_FI_DEV_ECC_DBE_VOL_TOTAL[15m]) > 0
        for: 1m
        labels:
          severity: critical
          component: gpu
        annotations:
          summary: "GPU ECC errors detected"
          description: "Volatile double-bit ECC errors have been observed"
          runbook: "docs/OBSERVABILITY-GUIDE.md"

  - name: service_slos
    interval: 30s
    rules:
      - alert: ControlPlaneAvailabilitySLOViolation
        expr: (sum(rate(control_plane_requests_total{status=~"2.."}[5m])) / clamp_min(sum(rate(control_plane_requests_total[5m])), 1e-9)) < 0.999
        for: 5m
        labels:
          severity: critical
          service: control-plane
          sli: availability
        annotations:
          summary: "Control plane availability SLO violated"
          description: "Availability has dropped below 99.9% over the 5m window"
          runbook: "docs/OBSERVABILITY-GUIDE.md"

      - alert: ControlPlaneErrorRateSLOViolation
        expr: (sum(rate(control_plane_errors_total[5m])) / clamp_min(sum(rate(control_plane_requests_total[5m])), 1e-9)) > 0.001
        for: 2m
        labels:
          severity: critical
          service: control-plane
          sli: error_rate
        annotations:
          summary: "Control plane error-rate SLO violated"
          description: "Error rate has exceeded 0.1% over the 5m window"
          runbook: "docs/OBSERVABILITY-GUIDE.md"

      - alert: ControlPlaneLatencyP99SLOViolation
        expr: histogram_quantile(0.99, sum by (le) (rate(control_plane_request_latency_seconds_bucket[5m]))) > 0.5
        for: 5m
        labels:
          severity: warning
          service: control-plane
          sli: latency_p99
        annotations:
          summary: "Control plane latency SLO violated"
          description: "P99 latency exceeded 500ms over the 5m window"
          runbook: "docs/OBSERVABILITY-GUIDE.md"
