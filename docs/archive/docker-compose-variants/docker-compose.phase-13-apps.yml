version: '3.8'

services:
  # ============================================================================
  # PHASE 13: APPLICATION MICROSERVICES LAYER
  # ============================================================================
  # These services represent the actual application layer deployed on top of
  # the Phase 12 infrastructure foundation. Services are configured to:
  # - Connect to existing databases, cache, and message queues
  # - Expose metrics to Prometheus for observability
  # - Forward logs to Loki for centralized logging
  # - Integrate with the Caddy API gateway
  # ============================================================================

  # ─────────────────────────────────────────────────────────────────────────
  # API GATEWAY APPLICATION SERVICES
  # ─────────────────────────────────────────────────────────────────────────

  api-service:
    image: code-server/api-service:latest
    container_name: code-server-api-service
    networks:
      - code-server-network
    environment:
      SERVICE_NAME: "api-service"
      SERVICE_PORT: "8000"
      DATABASE_URL: "postgresql://postgres:postgres_password_secure@code-server-postgres:5432/app_db"
      REDIS_URL: "redis://:code_server_redis_password@code-server-redis:6379/0"
      KAFKA_BROKERS: "code-server-redpanda:9092"
      PROMETHEUS_PORT: "9001"
      LOG_LEVEL: "info"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://code-server-otel-collector:4318"
    ports:
      - "8000:8000"
      - "9001:9001"
    depends_on:
      code-server-postgres:
        condition: service_healthy
      code-server-redis:
        condition: service_started
      code-server-redpanda:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    labels:
      environment: "production"
      tier: "application"
      monitoring: "enabled"

  user-service:
    image: code-server/user-service:latest
    container_name: code-server-user-service
    networks:
      - code-server-network
    environment:
      SERVICE_NAME: "user-service"
      SERVICE_PORT: "8001"
      DATABASE_URL: "postgresql://postgres:postgres_password_secure@code-server-postgres:5432/app_db"
      REDIS_URL: "redis://:code_server_redis_password@code-server-redis:6379/1"
      KAFKA_BROKERS: "code-server-redpanda:9092"
      PROMETHEUS_PORT: "9002"
      LOG_LEVEL: "info"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://code-server-otel-collector:4318"
    ports:
      - "8001:8001"
      - "9002:9002"
    depends_on:
      code-server-postgres:
        condition: service_healthy
      code-server-redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    labels:
      environment: "production"
      tier: "application"
      monitoring: "enabled"

  data-service:
    image: code-server/data-service:latest
    container_name: code-server-data-service
    networks:
      - code-server-network
    environment:
      SERVICE_NAME: "data-service"
      SERVICE_PORT: "8002"
      DATABASE_URL: "postgresql://postgres:postgres_password_secure@code-server-postgres:5432/app_db"
      ELASTICSEARCH_URL: "http://code-server-elastic:9200"
      QDRANT_URL: "http://code-server-qdrant:6333"
      KAFKA_BROKERS: "code-server-redpanda:9092"
      PROMETHEUS_PORT: "9003"
      LOG_LEVEL: "info"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://code-server-otel-collector:4318"
    ports:
      - "8002:8002"
      - "9003:9003"
    depends_on:
      code-server-postgres:
        condition: service_healthy
      code-server-elastic:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    labels:
      environment: "production"
      tier: "application"
      monitoring: "enabled"

  # ─────────────────────────────────────────────────────────────────────────
  # BUSINESS LOGIC SERVICES
  # ─────────────────────────────────────────────────────────────────────────

  business-logic-service:
    image: code-server/business-logic-service:latest
    container_name: code-server-business-logic-service
    networks:
      - code-server-network
    environment:
      SERVICE_NAME: "business-logic-service"
      SERVICE_PORT: "8003"
      DATABASE_URL: "postgresql://postgres:postgres_password_secure@code-server-postgres:5432/app_db"
      REDIS_URL: "redis://:code_server_redis_password@code-server-redis:6379/2"
      KAFKA_BROKERS: "code-server-redpanda:9092"
      API_SERVICE_URL: "http://code-server-api-service:8000"
      PROMETHEUS_PORT: "9004"
      LOG_LEVEL: "info"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://code-server-otel-collector:4318"
    ports:
      - "8003:8003"
      - "9004:9004"
    depends_on:
      code-server-postgres:
        condition: service_healthy
      code-server-redis:
        condition: service_started
      api-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    labels:
      environment: "production"
      tier: "application"
      monitoring: "enabled"

  # ─────────────────────────────────────────────────────────────────────────
  # NOTIFICATION & MESSAGING SERVICES
  # ─────────────────────────────────────────────────────────────────────────

  notification-service:
    image: code-server/notification-service:latest
    container_name: code-server-notification-service
    networks:
      - code-server-network
    environment:
      SERVICE_NAME: "notification-service"
      SERVICE_PORT: "8004"
      KAFKA_BROKERS: "code-server-redpanda:9092"
      KAFKA_CONSUMER_GROUP: "notification-service"
      REDIS_URL: "redis://:code_server_redis_password@code-server-redis:6379/3"
      PROMETHEUS_PORT: "9005"
      LOG_LEVEL: "info"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://code-server-otel-collector:4318"
    ports:
      - "8004:8004"
      - "9005:9005"
    depends_on:
      code-server-redpanda:
        condition: service_started
      code-server-redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    labels:
      environment: "production"
      tier: "application"
      monitoring: "enabled"

  # ─────────────────────────────────────────────────────────────────────────
  # ANALYTICS & REPORTING SERVICES
  # ─────────────────────────────────────────────────────────────────────────

  analytics-service:
    image: code-server/analytics-service:latest
    container_name: code-server-analytics-service
    networks:
      - code-server-network
    environment:
      SERVICE_NAME: "analytics-service"
      SERVICE_PORT: "8005"
      DATABASE_URL: "postgresql://postgres:postgres_password_secure@code-server-postgres:5432/app_db"
      ELASTICSEARCH_URL: "http://code-server-elastic:9200"
      KAFKA_BROKERS: "code-server-redpanda:9092"
      PROMETHEUS_PORT: "9006"
      LOG_LEVEL: "info"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://code-server-otel-collector:4318"
    ports:
      - "8005:8005"
      - "9006:9006"
    depends_on:
      code-server-postgres:
        condition: service_healthy
      code-server-elastic:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    labels:
      environment: "production"
      tier: "application"
      monitoring: "enabled"

  # ─────────────────────────────────────────────────────────────────────────
  # BACKGROUND JOB & WORKER SERVICES
  # ─────────────────────────────────────────────────────────────────────────

  worker-service:
    image: code-server/worker-service:latest
    container_name: code-server-worker-service
    networks:
      - code-server-network
    environment:
      SERVICE_NAME: "worker-service"
      KAFKA_BROKERS: "code-server-redpanda:9092"
      KAFKA_CONSUMER_GROUP: "worker-service"
      DATABASE_URL: "postgresql://postgres:postgres_password_secure@code-server-postgres:5432/app_db"
      REDIS_URL: "redis://:code_server_redis_password@code-server-redis:6379/4"
      PROMETHEUS_PORT: "9007"
      LOG_LEVEL: "info"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://code-server-otel-collector:4318"
    ports:
      - "9007:9007"
    depends_on:
      code-server-redpanda:
        condition: service_started
      code-server-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9007/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    labels:
      environment: "production"
      tier: "application"
      monitoring: "enabled"

  # ─────────────────────────────────────────────────────────────────────────
  # CACHE MANAGEMENT SERVICE
  # ─────────────────────────────────────────────────────────────────────────

  cache-service:
    image: code-server/cache-service:latest
    container_name: code-server-cache-service
    networks:
      - code-server-network
    environment:
      SERVICE_NAME: "cache-service"
      SERVICE_PORT: "8006"
      REDIS_URL: "redis://:code_server_redis_password@code-server-redis:6379/5"
      PROMETHEUS_PORT: "9008"
      LOG_LEVEL: "info"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://code-server-otel-collector:4318"
    ports:
      - "8006:8006"
      - "9008:9008"
    depends_on:
      code-server-redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    labels:
      environment: "production"
      tier: "application"
      monitoring: "enabled"

networks:
  code-server-network:
    external: true
    name: code-server_code-server-network

# ============================================================================
# DEPLOYMENT NOTES
# ============================================================================
#
# 1. IMAGE PLACEHOLDERS:
#    - Replace 'code-server/xxx:latest' with your actual Docker image URIs
#    - Push images to the Docker Registry at registry.kushnir.cloud:5000
#    - Or use your public container registry
#
# 2. ENVIRONMENT CONFIGURATION:
#    - Database credentials: Use secrets management in production
#    - Service URLs: Update to match your deployment environment
#    - OTEL endpoints: Optional; remove if not using distributed tracing
#
# 3. PORT ASSIGNMENTS:
#    - API ports: 8000-8006 (application endpoints)
#    - Prometheus ports: 9001-9008 (metrics endpoints)
#    - Adjust port bindings based on your infrastructure
#
# 4. HEALTH CHECKS:
#    - All services expect /health endpoint
#    - Implement this endpoint in your applications
#    - Returns 200 OK for healthy state
#
# 5. DATABASE INITIALIZATION:
#    - Run migrations before deploying applications
#    - Create app_db database and required schemas
#    - Initialize Redis keys as needed
#
# 6. OBSERVABILITY INTEGRATION:
#    - Prometheus scrapes metrics from :900x ports
#    - Loki collects logs from container stdout
#    - Tempo receives traces from OTEL_EXPORTER_OTLP_ENDPOINT
#    - Grafana dashboards: Create custom dashboards for each service
#
# 7. DEPLOYMENT COMMAND:
#    docker-compose -f docker-compose.phase-13-apps.yml up -d
#
# 8. SERVICE DISCOVERY:
#    - All services registered with Consul at code-server-consul:8500
#    - Use Consul DNS for service-to-service communication
#    - Example: curl http://api-service.service.consul:8000
#
# ============================================================================
