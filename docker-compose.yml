# @file docker-compose.yml
# @module infrastructure
# @description Production-grade Docker Compose for ElevatedIQ DevOS stack
# @governance GOV-002 - All services must have health checks and logging

services:
  # ========================================================================
  # CORE INFRASTRUCTURE
  # ========================================================================

  grafana-init:
    image: alpine:3.20@sha256:11e21d688290576dda723e6f6d61c4493f6b126f2535af6e6a3efcc3a6e99cb5
    container_name: grafana-init
    user: "0:0"
    command:
      - sh
      - -lc
      - mkdir -p /var/lib/grafana; owner="$$(stat -c '%u:%g' /var/lib/grafana 2>/dev/null || true)"; [ "$$owner" = "472:472" ] || chown -R 472:472 /var/lib/grafana
    volumes:
      - grafana_data:/var/lib/grafana
    restart: "no"
    networks:
      - services

  redis-init:
    image: alpine:3.20@sha256:11e21d688290576dda723e6f6d61c4493f6b126f2535af6e6a3efcc3a6e99cb5
    container_name: redis-init
    user: "0:0"
    command:
      - sh
      - -lc
      - mkdir -p /data; owner="$$(stat -c '%u:%g' /data 2>/dev/null || true)"; [ "$$owner" = "999:999" ] || chown -R 999:999 /data
    volumes:
      - redis_data:/data
    restart: "no"
    networks:
      - services

  redpanda-init:
    image: alpine:3.20@sha256:11e21d688290576dda723e6f6d61c4493f6b126f2535af6e6a3efcc3a6e99cb5
    container_name: redpanda-init
    user: "0:0"
    command:
      - sh
      - -lc
      - mkdir -p /var/lib/redpanda/data; owner="$$(stat -c '%u:%g' /var/lib/redpanda/data 2>/dev/null || true)"; [ "$$owner" = "101:101" ] || chown -R 101:101 /var/lib/redpanda/data
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    restart: "no"
    networks:
      - services

  prometheus-init:
    image: alpine:3.20@sha256:11e21d688290576dda723e6f6d61c4493f6b126f2535af6e6a3efcc3a6e99cb5
    container_name: prometheus-init
    user: "0:0"
    command:
      - sh
      - -lc
      - mkdir -p /prometheus; owner="$$(stat -c '%u:%g' /prometheus 2>/dev/null || true)"; [ "$$owner" = "65534:65534" ] || chown -R 65534:65534 /prometheus
    volumes:
      - prometheus_data:/prometheus
    restart: "no"
    networks:
      - services

  loki-init:
    image: alpine:3.20@sha256:11e21d688290576dda723e6f6d61c4493f6b126f2535af6e6a3efcc3a6e99cb5
    container_name: loki-init
    user: "0:0"
    command:
      - sh
      - -lc
      - mkdir -p /loki; owner="$$(stat -c '%u:%g' /loki 2>/dev/null || true)"; [ "$$owner" = "10001:10001" ] || chown -R 10001:10001 /loki
    volumes:
      - loki_data:/loki
    restart: "no"
    networks:
      - services

  alertmanager-init:
    image: alpine:3.20@sha256:11e21d688290576dda723e6f6d61c4493f6b126f2535af6e6a3efcc3a6e99cb5
    container_name: alertmanager-init
    user: "0:0"
    command:
      - sh
      - -lc
      - mkdir -p /alertmanager; owner="$$(stat -c '%u:%g' /alertmanager 2>/dev/null || true)"; [ "$$owner" = "65534:65534" ] || chown -R 65534:65534 /alertmanager
    volumes:
      - alertmanager_data:/alertmanager
    restart: "no"
    networks:
      - services

  opa:
    image: openpolicyagent/opa:0.58.0@sha256:63186b7f0d95e51cf4c7ee38cae6fd2cf9168020abd09d48104bd87c99f863fe
    container_name: opa-service
    user: "101:101"  # @security P0 #969 - Run as non-root openpolicyagent user
    command: run --server --log-level=info --set decision_logs.console=true
    ports:
      - "8181:8181"
    volumes:
      - ./policies:/policies:ro
      - ./config:/opa-src:ro
    environment:
      - OPA_ADDR=0.0.0.0:8181
      - LOG_LEVEL=info
    healthcheck:
      test:
        - CMD
        - /opa
        - version
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - services
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
        reservations:
          cpus: "0.25"
          memory: 256m
    labels:
      io.elevatediq.component: "policy-engine"
      io.elevatediq.tier: "infrastructure"

  # ========================================================================
  # IDENTITY & AUTHENTICATION
  # ========================================================================

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.5.1@sha256:e797b3934eb8d7cb2756b67e59be2ef29c18c2b45da763f540ece66d843cec85
    container_name: oauth2-proxy
    user: "65534:65534"  # @security P0 #969 - Run as non-root nobody user
    command:
      - --config=/etc/oauth2-proxy/oauth2-proxy.cfg
    ports:
      - "4180:4180"
    volumes:
      - ./config/oauth2-proxy/oauth2-proxy.cfg:/etc/oauth2-proxy/oauth2-proxy.cfg:ro
    environment:
      - OAUTH2_PROXY_CLIENT_ID=${OAUTH2_CLIENT_ID}
      - OAUTH2_PROXY_CLIENT_SECRET=${OAUTH2_CLIENT_SECRET}
      - OAUTH2_PROXY_COOKIE_SECRET=${OAUTH2_COOKIE_SECRET:?OAUTH2_COOKIE_SECRET must be set}
    healthcheck:
      test:
        - CMD
        - /bin/oauth2-proxy
        - --version
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - services
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
        reservations:
          cpus: "0.25"
          memory: 128m

  # ========================================================================
  # REVERSE PROXY & GATEWAY
  # ========================================================================

  caddy:
    image: caddy:2.7.4@sha256:505de4e957da923672a8c79f16581e9b717a2479a8d5ddb909ab2d1b351f2ba4
    container_name: caddy-gateway
    user: "101:101"  # @security P0 #969 - Run as non-root www-data user
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./config/caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - APEX_DOMAIN=${APEX_DOMAIN}
      - TLS_EMAIL=${TLS_EMAIL}
      - LOG_LEVEL=${LOG_LEVEL}
    healthcheck:
      test:
        - CMD
        - caddy
        - version
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - services
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
        reservations:
          cpus: "0.5"
          memory: 256m
    labels:
      io.elevatediq.component: "gateway"
      io.elevatediq.tier: "infrastructure"

  # ========================================================================
  # OBSERVABILITY
  # ========================================================================

  prometheus:
    image: prom/prometheus:v2.48.0@sha256:b440bc0e8aa5bab44a782952c09516b6a50f9d7b2325c1ffafac7bc833298e2e
    container_name: prometheus
    user: "65534:65534"  # @security P0 #969 - Run as non-root nobody user
    command:
      - "--config.file=/prometheus-config/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-remote-write-receiver"
    ports:
      - "9090:9090"
    volumes:
      - ./config:/prometheus-config:ro
      - ./monitoring/alerts:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    environment:
      - TZ=UTC
    healthcheck:
      test:
        - CMD-SHELL
        - "(prometheus --version >/dev/null && echo OK || exit 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - services
    depends_on:
      prometheus-init:
        condition: service_completed_successfully
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
        reservations:
          cpus: "0.5"
          memory: 512m

  grafana:
    image: grafana/grafana:10.2.0@sha256:1ee0c54286b8ca09a3dd1419ff8653e7780a148a006ac088544203bb0affe550
    container_name: grafana-dashboards
    user: "472:472"  # @security P0 #969 - Run as non-root grafana user
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    healthcheck:
      test:
        - CMD
        - curl
        - "-f"
        - "http://localhost:3000/api/health"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - services
    depends_on:
      - prometheus
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
        reservations:
          cpus: "0.5"
          memory: 256m

  loki:
    image: grafana/loki:2.9.4@sha256:f379a20ce9dd815884ed6446aad8819b81a8ba4d36b548ca14be8cecbc6cbca0
    container_name: loki-logs
    user: "10001:10001"  # @security P0 #969 - Run as non-root loki user
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./config/loki:/etc/loki:ro
      - loki_data:/loki
    environment:
      - LOG_LEVEL=info
    healthcheck:
      test:
        - CMD-SHELL
        - "(loki --version >/dev/null && echo OK || exit 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - services
    depends_on:
      loki-init:
        condition: service_completed_successfully
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
        reservations:
          cpus: "0.5"
          memory: 256m

  alertmanager:
    image: prom/alertmanager:v0.27.0@sha256:e13b6ed5cb929eeaee733479dce55e10eb3bc2e9c4586c705a4e8da41e5eacf5
    container_name: alertmanager
    user: "65534:65534"  # @security P0 #969 - Run as non-root nobody user
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--web.external-url=http://localhost:9093"
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    healthcheck:
      test:
        - CMD-SHELL
        - "(amtool --version >/dev/null && echo OK || exit 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - services
    depends_on:
      prometheus:
        condition: service_started
      alertmanager-init:
        condition: service_completed_successfully
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
        reservations:
          cpus: "0.25"
          memory: 128m

  # ========================================================================
  # VECTOR DATABASE & SEARCH
  # ========================================================================

  qdrant-init:
    image: alpine:3.20@sha256:11e21d688290576dda723e6f6d61c4493f6b126f2535af6e6a3efcc3a6e99cb5
    container_name: qdrant-init
    user: "0:0"
    command:
      - sh
      - -lc
      - mkdir -p /qdrant/storage; owner="$$(stat -c '%u:%g' /qdrant/storage 2>/dev/null || true)"; [ "$$owner" = "1000:1000" ] || chown -R 1000:1000 /qdrant/storage
    volumes:
      - qdrant_data:/qdrant/storage
    restart: "no"
    networks:
      - services

  qdrant:
    image: qdrant/qdrant:v1.7.0@sha256:ff1639878418c0572f50a7e1314874e399537eb97e6d2f42d6b987a07a2c4c4f
    container_name: qdrant-vectors
    user: "1000:1000"  # @security P0 #969 - Run as non-root qdrant user
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./config/qdrant-config.yaml:/qdrant/config/local_config.yaml:ro
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - QDRANT__STORAGE__STORAGE_PATH=/qdrant/storage
      - QDRANT__STORAGE__SNAPSHOTS_PATH=/qdrant/storage/snapshots
      - QDRANT__STORAGE__WAL_PATH=/qdrant/storage/wal
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    depends_on:
      qdrant-init:
        condition: service_completed_successfully
    networks:
      - services
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
        reservations:
          cpus: "1.0"
          memory: 1g

  memory-engine:
    build:
      context: apps/memory-engine
      dockerfile: Dockerfile
    container_name: memory-engine
    user: "1000:1000"
    ports:
      - "8001:8001"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - OLLAMA_HOST=http://ollama:11434
      - MEMORY_ENGINE_PORT=8001
      - MEMORY_ENGINE_HOST=0.0.0.0
      - LOG_LEVEL=INFO
    depends_on:
      qdrant:
        condition: service_started
      ollama:
        condition: service_healthy
    volumes:
      - ./apps/memory-engine:/app
    healthcheck:
      test:
        - CMD
        - curl
        - "-f"
        - "http://localhost:8001/health"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - services
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
        reservations:
          cpus: "0.5"
          memory: 512m
    profiles:
      - "ai"

  multimodal-ai:
    build:
      context: apps/multimodal-ai
      dockerfile: Dockerfile
    container_name: multimodal-ai
    user: "1000:1000"
    ports:
      - "8040:8040"
    environment:
      - VISION_BACKEND=${VISION_BACKEND:-ollama}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_VISION_MODEL=${OLLAMA_VISION_MODEL:-llava:13b}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3:8b}
      - DIAGRAM_LLM_BACKEND=${DIAGRAM_LLM_BACKEND:-ollama}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - WHISPER_MODEL=${WHISPER_MODEL:-base}
      - TTS_BACKEND=${TTS_BACKEND:-gtts}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8040/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - services
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4g
        reservations:
          cpus: "0.5"
          memory: 512m
    profiles:
      - "ai"
    labels:
      io.elevatediq.component: "multimodal-ai"
      io.elevatediq.tier: "application"

  reputation-engine:
    build:
      context: apps/reputation_engine
      dockerfile: Dockerfile
    container_name: reputation-engine
    user: "1001:1001"
    ports:
      - "8002:8000"
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      - KAFKA_BROKER=redpanda:9092
      - OPA_URL=http://opa:8181
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      opa:
        condition: service_healthy
    volumes:
      - ./apps/reputation_engine:/app
    restart: unless-stopped
    networks:
      - services
      - database
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
        reservations:
          cpus: "0.25"
          memory: 256m
    profiles:
      - "ai"
      - "governance"

  agent-runtime:
    build:
      context: apps/agent-runtime
      dockerfile: Dockerfile
    container_name: agent-runtime
    user: "1003:1003"  # @security P0 #969 - Run as non-root agent-runtime user
    ports:
      - "8020:8020"
    environment:
      - AGENT_RUNTIME_PORT=8020
      - AGENT_RUNTIME_HOST=0.0.0.0
      - LOG_LEVEL=INFO
      - OPA_URL=http://opa:8181
      - REPUTATION_ENGINE_URL=http://reputation-engine:8000
    depends_on:
      opa:
        condition: service_healthy
      reputation-engine:
        condition: service_healthy
    volumes:
      - ./apps/agent-runtime:/app
    healthcheck:
      test:
        - CMD
        - curl
        - "-f"
        - "http://localhost:8020/health"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - services
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
        reservations:
          cpus: "0.5"
          memory: 256m
    profiles:
      - "ai"
      - "governance"
      - "all"

  env-provisioner:
    build:
      context: apps/env-provisioner
      dockerfile: Dockerfile
    container_name: env-provisioner
    user: "1002:1002"
    ports:
      - "8050:8050"
    environment:
      - LOG_LEVEL=INFO
      - REPO_ROOT=/app
    volumes:
      - ./apps/env-provisioner:/app
      - ./config:/app/config:ro
      - ./artifacts:/app/artifacts
      - ./docker-compose.yml:/app/docker-compose.yml:ro
    restart: unless-stopped
    networks:
      - ingress
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
        reservations:
          cpus: "0.25"
          memory: 256m
    profiles:
      - "infrastructure"
      - "all"

  activity-feed:
    build:
      context: apps/activity_feed
      dockerfile: ../reputation_engine/Dockerfile
    container_name: activity-feed
    user: "1001:1001"
    ports:
      - "8003:8000"
    environment:
      - KAFKA_BROKER=redpanda:9092
      - LOG_LEVEL=INFO
    depends_on:
      redpanda:
        condition: service_healthy
    volumes:
      - ./apps/activity_feed:/app
    restart: unless-stopped
    networks:
      - services
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
        reservations:
          cpus: "0.25"
          memory: 256m
    profiles:
      - "ai"
      - "governance"

  paperclip:
    build:
      context: apps/paperclip
      dockerfile: Dockerfile
    container_name: paperclip-control-plane
    user: "1002:1002"
    ports:
      - "8010:8010"
    environment:
      - OPA_URL=http://opa:8181
      - REPUTATION_ENGINE_URL=http://reputation-engine:8000
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      opa:
        condition: service_healthy
      reputation-engine:
        condition: service_healthy
    volumes:
      - ./apps/paperclip:/app
    restart: unless-stopped
    networks:
      - services
      - database
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - curl
        - "-f"
        - "http://localhost:8010/health"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
        reservations:
          cpus: "0.25"
          memory: 256m
    profiles:
      - "governance"
      - "all"

  execution-scheduler:
    build:
      context: apps/execution-scheduler
      dockerfile: Dockerfile
