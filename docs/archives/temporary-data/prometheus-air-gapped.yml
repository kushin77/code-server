global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    cluster: 'air-gapped'
    deployment: 'on-prem'

# No external alertmanagers - use local instance only
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Local rules only
rule_files:
  - '/etc/prometheus/rules.yml'

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Synapse homeserver metrics (internal only)
  - job_name: 'synapse'
    static_configs:
      - targets: ['synapse:8008']
    metrics_path: '/_synapse/metrics'
    scrape_interval: 30s

  # Code-Server metrics
  - job_name: 'code-server'
    static_configs:
      - targets: ['code-server:8080']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # PostgreSQL exporter
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
    scrape_interval: 30s

  # Redis exporter
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 30s

  # Caddy metrics
  - job_name: 'caddy'
    static_configs:
      - targets: ['caddy:2019']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # Node exporter (host-level metrics, if available)
  - job_name: 'node'
    static_configs:
      - targets: ['127.0.0.1:9100']
    scrape_interval: 30s
    scrape_timeout: 10s
