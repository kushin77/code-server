name: "🐛 Bug"
description: "Defect, broken functionality, or regression"
title: "🐛 <short description of bug>"
labels: ["bug", "P2", "needs-priority"]
assignees: []
body:
  - type: dropdown
    id: severity
    attributes:
      label: "Severity / Priority"
      options:
        - P0 — Critical (outage, data loss, security)
        - P1 — High (major feature broken)
        - P2 — Medium (workaround exists)
        - P3 — Low (cosmetic, minor)
      default: 2
    validations:
      required: true

  - type: dropdown
    id: epic
    attributes:
      label: "Related Epic"
      description: "Which initiative is affected?"
      options:
        - "epic:pmo-excellence"
        - "epic:oidc-auth"
        - "epic:resilience"
        - "epic:observability"
        - "epic:security-hardening"
        - "epic:kushnir-cloud"
        - "None"
      default: 6
    validations:
      required: true

  - type: textarea
    id: bug_description
    attributes:
      label: "🐛 Bug Description"
      description: "What is broken?"
      placeholder: "When I [action], [unexpected behavior] occurs instead of [expected behavior]"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: "📋 Steps to Reproduce"
      description: "How to reliably trigger the bug"
      placeholder: |
        1. Do this
        2. Then do that
        3. Observe [unexpected behavior]
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: "✅ Expected Behavior"
      description: "What should happen instead?"
      placeholder: "The system should..."
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: "🔧 Environment"
      description: "Host, version, configuration"
      placeholder: |
        - Host: 192.168.168.31
        - OS: Ubuntu 20.04
        - Version: commit abc123
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: "📊 Relevant Logs/Errors"
      description: "Error messages, stack traces"
      placeholder: "```\nError: ...\n```"
    validations:
      required: false

  - type: textarea
    id: agent_steps
    attributes:
      label: "🤖 Agent Execution Steps"
      description: "How to fix this bug"
      placeholder: |
        1. Create branch: git checkout -b fix/epic-name-N-bug-desc
        2. Reproduce bug locally
        3. Add test case that fails: tests/bug.test.ts
        4. Fix the code: src/component.ts
        5. Verify test passes
        6. Commit: git commit -m "fix: ..."
        7. Create PR with "Closes #N"
        8. Run: bash scripts/pmo/complete-issue.sh kushin77/code-server N
    validations:
      required: true

  - type: checkboxes
    id: completion_gate
    attributes:
      label: "🎯 Completion Gate"
      options:
        - label: "gate:committed — Fix committed to branch"
        - label: "gate:merged — PR merged to main"
        - label: "gate:deployed — Fix deployed on 192.168.168.31"
        - label: "gate:cleaned — Branch deleted"
    validations:
      required: true
