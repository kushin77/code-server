version: '3.8'

services:
  # MinIO S3 Backend - Centralized Terraform State Storage
  minio:
    # MinIO stable release: 2024-01-29
    image: minio/minio:RELEASE.2024-01-29T03-56-32Z
    container_name: minio
    hostname: minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin-change-me}
      MINIO_BROWSER_REDIRECT_URL: http://localhost:9001
    ports:
      - "9000:9000"  # API port
      - "9001:9001"  # Web console port
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - code-server-network
    restart: unless-stopped
    command: >
      server /data --console-address ":9001"

  # MinIO Client Helper - Initialize buckets and policies
  minio-init:
    # MinIO MC stable release: 2024-01-16
    image: minio/mc:RELEASE.2024-01-16T16-07-38Z
    container_name: minio-init
    depends_on:
      - minio
    environment:
      MC_HOST_minio: http://minioadmin:${MINIO_PASSWORD:-minioadmin-change-me}@minio:9000
    volumes:
      - ./scripts/minio-init.sh:/init.sh:ro
    entrypoint: >
      /bin/sh -c "
      sleep 5 &&
      /mc alias set minio http://minio:9000 minioadmin ${MINIO_PASSWORD:-minioadmin-change-me} &&
      /mc mb --ignore-existing minio/terraform-state &&
      /mc mb --ignore-existing minio/terraform-backup &&
      /mc version enable minio/terraform-state &&
      /mc version enable minio/terraform-backup &&
      /mc ilm import minio/terraform-state < /tmp/lifecycle.json || true &&
      echo 'MinIO buckets initialized successfully'
      "
    networks:
      - code-server-network
    restart: on-failure

networks:
  code-server-network:
    driver: bridge

volumes:
  minio-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/akushnir/code-server/.minio/data
