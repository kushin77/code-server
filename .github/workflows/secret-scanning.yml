name: Secret Scanning - P0 #980

# @file secret-scanning.yml
# @module security
# @description GitHub Actions workflow for detecting secrets accidentally committed to repo
# @governance GOV-002 - P0 Security: Prevent secrets from being committed to version control
# @security CRITICAL - Runs on every push and PR to catch credential leaks

on:
  push:
    branches:
      - main
      - develop
      - '*.security'
  pull_request:
    branches:
      - main
      - develop
  schedule:
    # Run nightly scan for historical secrets that may have slipped through
    - cron: '0 2 * * *'

jobs:
  # ============================================================================
  # TRUFFLEHOG - Advanced secret scanning (detects AWS keys, API keys, tokens, etc)
  # ============================================================================
  trufflehog-scan:
    name: TruffleHog Secret Detection
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@a5ac7e51b41094c153705408e0e3a0dd2b15a8fd
        with:
          fetch-depth: 0  # Full history for better detection

      - name: Run TruffleHog scanner
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: >
            --debug
            --json
            --concurrency=8
        continue-on-error: true  # Continue to next check even if findings

      - name: Check TruffleHog results
        if: failure()
        run: |
          echo "❌ SECURITY ALERT: Potential secrets detected by TruffleHog"
          echo "   Review findings and remove before pushing"
          exit 1

  # ============================================================================
  # GIT-SECRETS - Check for common secret patterns
  # ============================================================================
  git-secrets-scan:
    name: Git Secrets Pattern Detection
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@a5ac7e51b41094c153705408e0e3a0dd2b15a8fd
        with:
          fetch-depth: 0

      - name: Install git-secrets
        run: |
          git clone https://github.com/awslabs/git-secrets.git /tmp/git-secrets
          cd /tmp/git-secrets && sudo make install

      - name: Configure git-secrets patterns
        run: |
          git secrets --install
          git secrets --register-aws
          # Additional patterns
          git secrets --add 'secret734'
          git secrets --add 'hardcoded.*password'
          git secrets --add 'api.?key.*=.*["\x27]'
          git secrets --add 'database.*password.*=.*["\x27]'

      - name: Scan for secrets with git-secrets
        run: |
          git secrets --scan || {
            echo "❌ SECURITY ALERT: Secrets detected by git-secrets"
            exit 1
          }

  # ============================================================================
  # GITHUB NATIVE SECRET SCANNING
  # ============================================================================
  validate-env-files:
    name: Environment File Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@a5ac7e51b41094c153705408e0e3a0dd2b15a8fd

      - name: Check for .env files in repo
        run: |
          if find . -name ".env*" -type f ! -name ".env.example" ! -name ".env.security" ! -name ".gitignore" 2>/dev/null | grep -q .; then
            echo "❌ SECURITY ALERT: .env files found in repository"
            echo "   These should not be committed - they contain secrets"
            find . -name ".env*" -type f ! -name ".env.example" ! -name ".env.security"
            exit 1
          fi
          echo "✓ No .env files found in repository"

      - name: Check for common secret patterns
        run: |
          echo "Scanning for common secret patterns..."
          FOUND_SECRETS=0
          
          # Check for AWS credentials
          if grep -r 'AKIA\|aws_secret_access_key\|aws_access_key_id' . \
            --include="*.js" --include="*.ts" --include="*.py" --include="*.go" \
            --include="*.yml" --include="*.yaml" --exclude-dir=.git 2>/dev/null; then
            echo "❌ Found AWS credential patterns"
            FOUND_SECRETS=1
          fi
          
          # Check for GitHub tokens
          if grep -r 'ghp_\|github_token\|GITHUB_TOKEN' . \
            --include="*.js" --include="*.ts" --include="*.py" --include="*.go" \
            --include="*.yml" --include="*.yaml" --exclude-dir=.git 2>/dev/null; then
            echo "❌ Found GitHub token patterns"
            FOUND_SECRETS=1
          fi
          
          # Check for API keys
          if grep -r 'api[_-]?key.*=\|apiKey.*=\|API_KEY.*=' . \
            --include="*.js" --include="*.ts" --include="*.py" --include="*.go" \
            --include="*.yml" --include="*.yaml" --exclude-dir=.git 2>/dev/null | \
            grep -v 'GITHUB_TOKEN\|\.env\|config\|example' ; then
            echo "⚠️  Found potential API key patterns (review manually)"
          fi
          
          exit ${FOUND_SECRETS}

  # ============================================================================
  # REPORT & SUMMARY
  # ============================================================================
  report:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    needs: [trufflehog-scan, git-secrets-scan, validate-env-files]
    if: always()
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check scan status
        run: |
          if [ "${{ needs.trufflehog-scan.result }}" = "failure" ] || \
             [ "${{ needs.git-secrets-scan.result }}" = "failure" ] || \
             [ "${{ needs.validate-env-files.result }}" = "failure" ]; then
            echo "❌ SECURITY SCAN FAILED - Secrets or sensitive data detected"
            echo ""
            echo "📋 Required Actions:"
            echo "  1. Review all findings in the logs above"
            echo "  2. Remove any secrets from the commit"
            echo "  3. Force push with clean history: git push --force-with-lease"
            echo "  4. Consider rotating any exposed secrets"
            echo ""
            echo "🔒 Security Policy:"
            echo "  - NO credentials in version control"
            echo "  - Use Google Secret Manager (GSM) for all secrets"
            echo "  - Use environment variables for local development"
            echo "  - Check .env.security for required env vars"
            exit 1
          else
            echo "✓ SECURITY SCAN PASSED - No secrets detected"
          fi

      - name: Create security report
        if: always()
        run: |
          cat > security-scan-report.md << 'EOF'
          # Security Scan Report
          
          **Date**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')
          **Workflow**: Secret Scanning (P0 #980)
          **Branch**: ${{ github.ref }}
          **Commit**: ${{ github.sha }}
          
          ## Scan Results
          - TruffleHog: ${{ needs.trufflehog-scan.result }}
          - Git Secrets: ${{ needs.git-secrets-scan.result }}
          - Env File Validation: ${{ needs.validate-env-files.result }}
          
          ## Security Checks
          - ✓ All three scanning methods executed
          - ✓ AWS credentials pattern check
          - ✓ GitHub tokens pattern check
          - ✓ API keys pattern check
          - ✓ Environment files validation
          
          ## Recommendations
          1. Review any warnings in the log output
          2. Never commit secrets to version control
          3. Always use external secret management (GSM, Vault, etc.)
          4. Rotate any exposed credentials immediately
          5. For local development, use .env.security with env vars
          EOF

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@0b2256b2c1aaaf07d41658773d8e91fb221abb04
        with:
          name: security-scan-report
          path: security-scan-report.md
          retention-days: 30

# =============================================================================
# WORKFLOW STATUS & NOTIFICATIONS
# =============================================================================
# Success: All scans pass, no secrets detected → workflow succeeds
# Failure: Secrets detected → workflow fails, blocks merge
# Manual Review: If TruffleHog finds potential issues, review before clearing
