name: GPU Upgrade Note Dedup Guard

on:
  pull_request:
    paths:
      - "docs/configs/GPU-UPGRADE-ACTION-NEEDED.txt"
      - "docs/archives/legacy-archive/gpu-attempts/GPU-UPGRADE-ACTION-NEEDED.txt"
      - "scripts/ci/check-gpu-upgrade-note-dedup.sh"
      - ".github/workflows/gpu-upgrade-note-dedup-guard.yml"
  push:
    branches: [main]
    paths:
      - "docs/configs/GPU-UPGRADE-ACTION-NEEDED.txt"
      - "docs/archives/legacy-archive/gpu-attempts/GPU-UPGRADE-ACTION-NEEDED.txt"
      - "scripts/ci/check-gpu-upgrade-note-dedup.sh"
      - ".github/workflows/gpu-upgrade-note-dedup-guard.yml"

permissions:
  contents: read

jobs:
  validate-gpu-note-dedup:
    name: Validate GPU upgrade note dedup policy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate archive pointer policy
        run: bash scripts/ci/check-gpu-upgrade-note-dedup.sh
