name: "✅ Task"
description: "Implementation, investigation, or execution work"
title: "<type>: <short description>"
labels: ["task", "P2", "needs-priority"]
assignees: []
body:
  - type: dropdown
    id: priority
    attributes:
      label: "Priority"
      options:
        - P0 — Critical
        - P1 — High
        - P2 — Medium (default)
        - P3 — Low
      default: 2
    validations:
      required: true

  - type: dropdown
    id: epic
    attributes:
      label: "Epic"
      options:
        - "epic:pmo-excellence"
        - "epic:oidc-auth"
        - "epic:resilience"
        - "epic:observability"
        - "epic:security-hardening"
        - "epic:kushnir-cloud"
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: "Task Type"
      options:
        - "investigation"
        - "implementation"
        - "documentation"
        - "refactoring"
        - "testing"
        - "deployment"
        - "maintenance"
      default: 1
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "📝 Description"
      description: "What needs to be done and why?"
      placeholder: "Investigate [topic] and determine [outcome]. This is needed because [reason]."
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: "✅ Acceptance Criteria / Definition of Done"
      description: "How do we know this is complete?"
      placeholder: |
        - [ ] Investigation complete with findings documented
        - [ ] Decision made and communicated
        - [ ] Action items identified
        - [ ] Code/documentation updated
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: "🔗 Context & Dependencies"
      description: "Related issues, documentation, blockers"
      placeholder: |
        Related issues: #123, #456
        Blocking: #789
        Documentation: docs/guide.md
    validations:
      required: false

  - type: textarea
    id: agent_steps
    attributes:
      label: "🤖 Agent Execution Steps"
      description: "Step-by-step work instructions"
      placeholder: |
        1. Research: Read docs/guide.md and issue #123
        2. Create branch: git checkout -b task/epic-name-N-description
        3. Investigate or implement: [detailed steps]
        4. Document findings in: docs/findings.md
        5. Commit: git add . && git commit -m "task: ..."
        6. Create PR with "Closes #N"
        7. Run: bash scripts/pmo/complete-issue.sh kushin77/code-server N
    validations:
      required: true

  - type: checkboxes
    id: completion_gate
    attributes:
      label: "🎯 Completion Gate"
      options:
        - label: "gate:committed — Work committed"
        - label: "gate:merged — PR merged to main"
        - label: "gate:deployed — Deployed if applicable"
        - label: "gate:cleaned — Branch deleted"
    validations:
      required: true
