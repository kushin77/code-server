# Ingress template for ephemeral session routes
# This template is used by the route manager to dynamically create ingress resources
# for each session.
#
# Template variables (filled by route manager):
# - {{ session_id }}: e.g., "eph-a1b2c3d4"
# - {{ dev_session_domain }}: e.g., "dev.kushnir.cloud"
# - {{ pod_name }}: e.g., "code-server-eph-a1b2c3d4"
# - {{ pod_port }}: e.g., 8080
# - {{ ttl_seconds }}: e.g., 3600
# - {{ expiry_time }}: e.g., "2026-04-20T13:34:56Z"
# - {{ auth_token_name }}: e.g., "eph-a1b2c3d4-auth"

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eph-{{ session_id }}
  namespace: ephemeral-sessions
  labels:
    app.kubernetes.io/name: ephemeral-session
    app.kubernetes.io/session-id: eph-{{ session_id }}
    app.kubernetes.io/managed-by: session-orchestrator
  annotations:
    # Path rewriting: strip the session ID prefix from the path
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    # Rate limiting: 10 requests per second per session
    nginx.ingress.kubernetes.io/limit-rps: "10"
    # Session-aware logging
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Session-ID: eph-{{ session_id }}";
      more_set_headers "X-Session-Expires: {{ expiry_time }}";
      more_set_headers "X-Session-TTL: {{ ttl_seconds }}";
      proxy_set_header X-Original-URI $request_uri;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
    # Enable access logs for this ingress
    nginx.ingress.kubernetes.io/enable-access-log: "true"
    # Disable cert redirects (we provide HTTPS via Cloudflare)
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - {{ dev_session_domain }}
      secretName: dev-kushnir-cloud-cert
  rules:
    - host: {{ dev_session_domain }}
      http:
        paths:
          # Match: /eph-XXXX or /eph-XXXX/...
          # Path rewrite: /eph-XXXX/api/test → /api/test
          - path: /eph-{{ session_id }}(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: code-server-eph-{{ session_id }}
                port:
                  number: {{ pod_port }}

---
# Service for the ephemeral session pod
apiVersion: v1
kind: Service
metadata:
  name: code-server-eph-{{ session_id }}
  namespace: ephemeral-sessions
  labels:
    app.kubernetes.io/name: code-server
    app.kubernetes.io/session-id: eph-{{ session_id }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/session-id: eph-{{ session_id }}
  ports:
    - name: http
      port: {{ pod_port }}
      targetPort: {{ pod_port }}
      protocol: TCP

---
# ConfigMap to store session metadata
apiVersion: v1
kind: ConfigMap
metadata:
  name: eph-{{ session_id }}-config
  namespace: ephemeral-sessions
  labels:
    app.kubernetes.io/session-id: eph-{{ session_id }}
data:
  session-id: "eph-{{ session_id }}"
  pod-name: "{{ pod_name }}"
  pod-port: "{{ pod_port }}"
  ttl-seconds: "{{ ttl_seconds }}"
  created-at: "{{ creation_time }}"
  expires-at: "{{ expiry_time }}"
  auth-secret: "{{ auth_token_name }}"
