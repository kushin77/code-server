version: '3.8'

# Phase 14 Expansion - Mock Services for Testing
# 10 additional application services

services:
  web-service:
    image: alpine:3.20
    container_name: code-server-web-service
    networks:
      - code-server-network
    command: "tail -f /dev/null"
    environment:
      SERVICE_NAME: "web-service"
      SERVICE_PORT: "3000"
    restart: unless-stopped
    labels:
      tier: "application"
      domain: "web"

