# @file        .github/workflows/unit-tests.yml
# @module      ci/testing
# @description Unit & integration tests — bats (bash), pytest (Python API contracts)
# @governance  GOV-002: IaC, immutable, idempotent
# Issue #1537: Testing & QA 100x

name: Unit & Integration Tests

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/unit/**'
      - 'tests/integration/**'
      - '.github/workflows/unit-tests.yml'
  pull_request:
    branches: [main]
  schedule:
    # Nightly at 03:00 UTC — regression detection
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  # ── Bash Unit Tests (bats) ──────────────────────────────────────────────────
  bash-unit-tests:
    name: Bash unit tests (bats)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install bats-core
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bats
          bats --version

      - name: Install stub dependencies
        run: |
          # bats tests need bash 4+ features
          bash --version
          # Ensure required test helpers available
          sudo apt-get install -y coreutils netcat-openbsd

      - name: Run bash unit tests
        run: |
          echo "=== Running bats unit tests ==="
          bats --tap --recursive tests/unit/bash/
        env:
          # Minimal env so tests can source scripts/_common/
          PRIMARY_HOST: primary.test.local
          REPLICA_HOST: replica.test.local
          NAS_HOST: nas.test.local
          APEX_DOMAIN: test.local
          ADMIN_EMAIL: ops@test.local
          DEPLOYMENT_MODE: test
          SSH_KEY: /tmp/test-key
          SSH_USER: ops
          BOOTSTRAP_STATE_DIR: /tmp/bats-bootstrap

      - name: Upload bats test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bats-results
          path: test-results/bats/
          if-no-files-found: ignore

  # ── Python API Integration Tests ────────────────────────────────────────────
  api-integration-tests:
    name: API integration tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # Stub services for contract tests
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install test dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-timeout requests httpx

      - name: Run API integration tests (mock mode)
        run: |
          echo "=== Running API integration tests ==="
          pytest tests/integration/ \
            -m "integration" \
            --timeout=30 \
            -v \
            --tb=short \
            -x \
            --junit-xml=test-results/integration/results.xml
        env:
          ENV_PROVISIONER_URL: http://localhost:8080
          REPUTATION_ENGINE_URL: http://localhost:8081
          CI: "true"
          SMOKE_ONLY: "true"

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: test-results/integration/
          if-no-files-found: ignore

  # ── CI Audit Scripts ────────────────────────────────────────────────────────
  ci-audit-scripts:
    name: CI audit scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: DNS service discovery validation
        run: bash scripts/ci/validate-dns-service-discovery.sh
        env:
          APEX_DOMAIN: kushnir.cloud

      - name: Terraform version pins validation
        run: bash scripts/ci/validate-terraform-version-pins.sh

      - name: Config SSOT validation
        run: bash scripts/ci/validate-config-ssot.sh

  # ── Test Summary ─────────────────────────────────────────────────────────────
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [bash-unit-tests, api-integration-tests, ci-audit-scripts]
    if: always()

    steps:
      - name: Summary
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Bash unit tests (bats) | ${{ needs.bash-unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| API integration tests  | ${{ needs.api-integration-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CI audit scripts       | ${{ needs.ci-audit-scripts.result }} |" >> $GITHUB_STEP_SUMMARY
