# @file        docker-compose.ai.yml
# @module      infrastructure/ai
# @description AI/Ollama workloads — isolated compose override profile
# @governance  GOV-002: IaC, immutable, idempotent
# Issue #1546: AI/Ollama Repository Separation
#
# Usage (standalone AI stack):
#   docker compose -f docker-compose.yml -f docker-compose.ai.yml --profile ai up -d
#
# Future: When AI workloads are fully migrated to kushin77/ollama repo,
# this file can be referenced as an external compose file:
#   docker compose -f https://raw.githubusercontent.com/kushin77/ollama/main/docker-compose.yml ...

# ── AI Services ───────────────────────────────────────────────────────────────
# These services are candidates for migration to kushin77/ollama.
# They are duplicated here as a migration intermediate step.
# See: docs/architecture/AI-REPO-SEPARATION.md

services:
  ollama:
    image: ollama/ollama:0.1.16@sha256:3a3ec7ea8e006aea63ce13b7027069687ed34cc85bbd7bbebf1f565db587511a
    container_name: code-server-ollama
    profiles:
      - ai
      - all
    user: "11434:11434"  # @security P0 #969 - Run as non-root ollama user
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/home/ollama/.ollama
    environment:
      - HOME=/home/ollama
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_MODELS=/home/ollama/.ollama/models
    healthcheck:
      test: ["CMD", "ollama", "--version"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - services
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: "8G"
        reservations:
          cpus: "2"
          memory: "4G"

  multimodal-ai:
    build:
      context: apps/multimodal-ai
      dockerfile: Dockerfile
    container_name: code-server-multimodal-ai
    profiles:
      - ai
      - all
    ports:
      - "8003:8003"
    environment:
      - VISION_BACKEND=${VISION_BACKEND:-ollama}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_VISION_MODEL=${OLLAMA_VISION_MODEL:-llava:13b}
      - DIAGRAM_LLM_BACKEND=${DIAGRAM_LLM_BACKEND:-ollama}
      - DIAGRAM_LLM_MODEL=${DIAGRAM_LLM_MODEL:-llama3:8b}
      - WHISPER_MODEL=${WHISPER_MODEL:-base}
      - TTS_BACKEND=${TTS_BACKEND:-gtts}
      - AZURE_TTS_KEY=${AZURE_TTS_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - services
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: "4G"
        reservations:
          cpus: "1.0"
          memory: "2G"

volumes:
  ollama_models:
    driver: local

networks:
  services:
    external: true
    name: code-server-enterprise_services
