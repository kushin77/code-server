global:
  resolve_timeout: 5m
  slack_api_url: 'https://hooks.slack.com/services/YOUR_WORKSPACE/YOUR_CHANNEL/YOUR_TOKEN_HERE'
  # For email: update SMTP settings below
  # smtp_smarthost: 'smtp.gmail.com:587'
  # smtp_auth_username: 'your-alerts-email@gmail.com'
  # smtp_auth_password: 'your-app-specific-password'
  # smtp_from: 'your-alerts-email@gmail.com'

templates:
  - '/etc/alertmanager/templates/*.tmpl'

route:
  receiver: 'default-receiver'
  group_by: ['alertname', 'cluster', 'service', 'severity']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 4h
  
  # Critical alerts go to multiple channels
  routes:
    - match:
        severity: critical
      receiver: 'critical-incidents'
      group_wait: 5s
      group_interval: 5s
      repeat_interval: 1h
      continue: true
    
    # PostgreSQL replication alerts - highest priority
    - match:
        component: database
        alertname: PostgreSQLReplicationNotActive
      receiver: 'database-critical'
      group_wait: 2s
      group_interval: 2s
      repeat_interval: 30m
      continue: true
    
    # High severity API alerts
    - match:
        severity: high
        component: api
      receiver: 'api-incidents'
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 2h
      continue: true
    
    # Infrastructure warnings
    - match:
        severity: warning
        component: infrastructure
      receiver: 'infra-warnings'
      group_wait: 30s
      group_interval: 30s
      repeat_interval: 6h

receivers:
  # Critical incidents - immediate notification
  - name: 'critical-incidents'
    slack_configs:
      - channel: '#critical-incidents'
        title: '🚨 CRITICAL: {{ .GroupLabels.alertname }}'
        text: |
          *Severity:* {{ .GroupLabels.severity }}
          *Component:* {{ .GroupLabels.component }}
          *Service:* {{ .GroupLabels.job }}
          *Instance:* {{ .GroupLabels.instance }}
          
          {{ range .Alerts.Firing }}
          *Alert:* {{ .Labels.alertname }}
          *Description:* {{ .Annotations.description }}
          *Runbook:* {{ .Annotations.runbook }}
          {{ end }}
        send_resolved: true
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'
    pagerduty_configs:
      - service_key: '{{ env "PAGERDUTY_SERVICE_KEY" }}'
        description: '{{ .GroupLabels.alertname }} - {{ .GroupLabels.component }}'
        details:
          firing: '{{ template "pagerduty.default.instances" .Alerts.Firing }}'
    email_configs:
      - to: 'ops-team-critical@example.com'
        headers:
          Subject: '[CRITICAL] {{ .GroupLabels.alertname }}'

  # Database critical alerts
  - name: 'database-critical'
    slack_configs:
      - channel: '#database-alerts'
        title: '🔴 DATABASE CRITICAL: {{ .GroupLabels.alertname }}'
        text: |
          *Alert:* PostgreSQL Replication Issue
          *Severity:* CRITICAL
          
          {{ range .Alerts.Firing }}
          *Description:* {{ .Annotations.description }}
          *Runbook:* {{ .Annotations.runbook }}
          *Instructions:*
          1. SSH to replica: ssh ubuntu@192.168.168.42
          2. Check status: cd /home/ubuntu/code-server && bash verify-postgresql-replication-part2.sh
          3. If not in recovery: bash orchestrate-postgresql-replication-fix.sh
          {{ end }}
        send_resolved: true
        color: 'danger'
    pagerduty_configs:
      - service_key: '{{ env "PAGERDUTY_DATABASE_KEY" }}'
        description: 'PostgreSQL {{ .GroupLabels.alertname }}'
        severity: 'critical'

  # API incidents
  - name: 'api-incidents'
    slack_configs:
      - channel: '#api-incidents'
        title: '⚠️ API INCIDENT: {{ .GroupLabels.alertname }}'
        text: |
          *Severity:* {{ .GroupLabels.severity }}
          *Service:* API Server
          
          {{ range .Alerts.Firing }}
          *Issue:* {{ .Annotations.summary }}
          *Details:* {{ .Annotations.description }}
          *Runbook:* {{ .Annotations.runbook }}
          {{ end }}
        send_resolved: true
        color: 'warning'
    email_configs:
      - to: 'api-team@example.com'
        headers:
          Subject: '[API] {{ .GroupLabels.alertname }}'

  # Infrastructure warnings
  - name: 'infra-warnings'
    slack_configs:
      - channel: '#infra-warnings'
        title: '⚡ INFRASTRUCTURE WARNING: {{ .GroupLabels.alertname }}'
        text: |
          *Component:* {{ .GroupLabels.component }}
          *Host:* {{ .GroupLabels.instance }}
          
          {{ range .Alerts.Firing }}
          *Issue:* {{ .Annotations.summary }}
          *Details:* {{ .Annotations.description }}
          {{ end }}
        send_resolved: true
        color: '#FFA500'

  # Default receiver - all other alerts
  - name: 'default-receiver'
    slack_configs:
      - channel: '#monitoring'
        title: 'Alert: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true
        color: '{{ if eq .Status "firing" }}warning{{ else }}good{{ end }}'

inhibit_rules:
  # Suppress warning alerts if critical alert exists
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'component', 'instance']

  # Suppress info alerts if warning alert exists
  - source_match:
      severity: 'warning'
    target_match:
      severity: 'info'
    equal: ['alertname', 'component', 'instance']

  # Don't alert on replica issues if primary is down
  - source_match:
      component: 'database'
      alertname: 'PostgreSQLDown'
      instance: '192.168.168.31'
    target_match:
      component: 'database'
    equal: ['alertname']
