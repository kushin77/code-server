# GOV-002: Enterprise Governance Header
# METADATA: NETWORK_POLICY_TEMPLATE
# PURPOSE: Kubernetes NetworkPolicy for zero-trust pod communication
# PATTERN: Explicit allow lists, deny all default

{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "code-server-enterprise.fullname" . }}-default-deny
  labels:
    {{- include "code-server-enterprise.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress: []
  egress: []

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "code-server-enterprise.fullname" . }}-allow-internal
  labels:
    {{- include "code-server-enterprise.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "code-server-enterprise.selectorLabels" . | nindent 6 }}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: {{ .Release.Namespace }}
    - podSelector:
        matchLabels:
          {{- include "code-server-enterprise.selectorLabels" . | nindent 10 }}
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: {{ .Release.Namespace }}
    - podSelector:
        matchLabels:
          {{- include "code-server-enterprise.selectorLabels" . | nindent 10 }}
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: UDP
      port: 53
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
{{- end }}
