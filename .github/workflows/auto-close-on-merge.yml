name: Auto-Close Issues on PR Merge
# @governance GOV-002 - All gh calls use --repo flag

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to process'
        required: true

concurrency:
  group: merge-close-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  auto-close-on-merge:
    name: Close Linked Issues
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      issues: write
      contents: read
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set Up Environment
        run: |
          mkdir -p artifacts
          echo "GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> $GITHUB_ENV
          echo "GITHUB_REPO=${{ github.repository }}" >> $GITHUB_ENV
      
      - name: Check if PR is Merged
        id: check_merge
        run: |
          pr_number=${{ github.event.pull_request.number }}
          merged=$(gh pr view $pr_number --repo "$GITHUB_REPO" --json merged -q '.merged')
          echo "is_merged=$merged" >> $GITHUB_OUTPUT
      
      - name: Run Auto-Close Script
        if: steps.check_merge.outputs.is_merged == 'true'
        run: |
          chmod +x scripts/ops/auto-close-issue-on-merge.sh
          pr_number=${{ github.event.pull_request.number }}
          merge_commit=${{ github.event.pull_request.merge_commit_sha }}
          
          scripts/ops/auto-close-issue-on-merge.sh "$pr_number" "$merge_commit" || true
      
      - name: Report Status
        if: always()
        run: |
          if [ -f artifacts/pr-merge-issue-close-report.json ]; then
            cat artifacts/pr-merge-issue-close-report.json
            
            closed=$(jq -r '.issues_closed' artifacts/pr-merge-issue-close-report.json)
            if [ "$closed" -gt 0 ]; then
              echo "✅ Auto-closed $closed issue(s)"
            fi
          fi
      
      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-merge-issue-close-report
          path: artifacts/pr-merge-issue-close-report.json
          retention-days: 30
