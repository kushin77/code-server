version: "3.9"

# @file docker-compose.override.yml
# @module infrastructure
# @description Local development overrides for Docker Compose services
# @governance GOV-002 - Production-grade service configurations
# @note This file is managed by Terraform and should not be edited manually

services:
  opa:
    command: run --server --log-level=info
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8181/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  oauth2-proxy:
    command:
      - --http-address=0.0.0.0:4180
      - --upstream=http://caddy:80
      - --email-domain=*
      - --provider=google
      - --cookie-secure=false
      - --cookie-secret=secret12345678901234567890123456
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4180/ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  qdrant:
    user: "0:0"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/readyz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  ollama:
    user: "0:0"
    environment:
      - OLLAMA_MODELS=/root/.ollama/models
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:11434/api/tags || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
