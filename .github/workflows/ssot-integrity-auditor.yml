name: SSOT Integrity Auditor

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ssot-integrity-auditor
  cancel-in-progress: false

jobs:
  scan:
    name: Scan SSOT Drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y jq gh

      - name: Authenticate gh CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh auth status

      - name: Run policy SSOT scan
        id: policy
        continue-on-error: true
        run: |
          set +e
          bash scripts/ci/check-policy-ssot.sh policy-ssot-report.json
          rc=$?
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          if [[ -f policy-ssot-report.json ]]; then
            duplicate_count=$(jq -r '.summary.duplicate_statements' policy-ssot-report.json)
            contradiction_count=$(jq -r '.summary.contradictions' policy-ssot-report.json)
          else
            duplicate_count=0
            contradiction_count=0
          fi
          echo "duplicate_count=$duplicate_count" >> "$GITHUB_OUTPUT"
          echo "contradiction_count=$contradiction_count" >> "$GITHUB_OUTPUT"

      - name: Run config SSOT scan
        id: config
        continue-on-error: true
        run: |
          set +e
          bash scripts/ci/generate-config-ssot-report.sh
          rc=$?
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          if [[ -f artifacts/config-ssot/config-ssot-report.json ]]; then
            count=$(jq -r '.count' artifacts/config-ssot/config-ssot-report.json)
          else
            count=0
          fi
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Summarize drift
        id: summarize
        run: |
          set -euo pipefail
          total_duplicates='${{ steps.policy.outputs.duplicate_count }}'
          total_contradictions='${{ steps.policy.outputs.contradiction_count }}'
          config_count='${{ steps.config.outputs.count }}'
          total_findings=$(( total_duplicates + total_contradictions ))
          echo "total_findings=$total_findings" >> "$GITHUB_OUTPUT"
          cat > ssot-drift-summary.md <<EOF
          <!-- ssot-integrity-auditor -->
          # SSOT Drift Summary

          Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)

          - Policy SSOT duplicates: ${total_duplicates}
          - Policy SSOT contradictions: ${total_contradictions}
          - Config SSOT canonical entries: ${config_count}

          ## Registry

          - [SSOT Registry](docs/governance/SSOT-REGISTRY.md)
          - [SSOT Drift Dashboard](docs/status/SSOT-DRIFT-DASHBOARD.md)
          EOF

      - name: Create or update drift issue
        if: steps.summarize.outputs.total_findings != '0' || steps.policy.outputs.exit_code != '0' || steps.config.outputs.exit_code != '0'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('ssot-drift-summary.md', 'utf8');
            const title = 'P1: SSOT drift detected';
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', per_page: 100 });
            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body, labels: ['P1', 'governance', 'automation'] });
            }

      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: ssot-drift-summary
          path: |
            policy-ssot-report.json
            artifacts/config-ssot/config-ssot-report.json
            artifacts/config-ssot/config-ssot-report.md
            ssot-drift-summary.md

      - name: Write summary
        if: always()
        run: |
          echo "## SSOT Integrity Auditor" >> "$GITHUB_STEP_SUMMARY"
          echo "- Policy exit code: ${{ steps.policy.outputs.exit_code }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Config exit code: ${{ steps.config.outputs.exit_code }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Total findings: ${{ steps.summarize.outputs.total_findings }}" >> "$GITHUB_STEP_SUMMARY"