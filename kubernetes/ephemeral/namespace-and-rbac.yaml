apiVersion: v1
kind: Namespace
metadata:
  name: ephemeral-sessions
  labels:
    app.kubernetes.io/name: ephemeral-sessions
    app.kubernetes.io/part-of: code-server

---
# ServiceAccount for route manager with Ingress CRUD permissions
apiVersion: v1
kind: ServiceAccount
metadata:
  name: route-manager
  namespace: ephemeral-sessions

---
# ClusterRole for route manager
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ephemeral-route-manager
rules:
  # Ingress management
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  
  # Service management
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  
  # Pod management (read-only for cleanup verification)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  
  # Secret management (auth tokens)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  
  # ConfigMap management (session metadata)
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  
  # Events for audit trail
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]

---
# ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ephemeral-route-manager-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ephemeral-route-manager
subjects:
  - kind: ServiceAccount
    name: route-manager
    namespace: ephemeral-sessions

---
# NetworkPolicy: restrict traffic to ephemeral sessions namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ephemeral-sessions-default-deny
  namespace: ephemeral-sessions
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Allow DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
    # Allow egress to internet for downloads
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
