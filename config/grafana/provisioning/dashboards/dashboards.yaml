# @file        config/grafana/provisioning/dashboards/dashboards.yaml
# @module      observability/grafana
# @description Grafana dashboard provisioning configuration
# @governance  GOV-002: Version-controlled, immutable

apiVersion: 1

providers:
  - name: default
    orgId: 1
    folder: ""
    folderUid: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: true
