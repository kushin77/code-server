# @file        docker-compose.observability.yml
# @module      infrastructure/observability
# @description Observability overlay for logs shipping and GPU metrics
# @governance  GOV-002: IaC, immutable, idempotent
# Issue #1532: Centralized Observability & SLOG
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml --profile observability up -d
#
# This overlay adds the missing log shipper and GPU exporter layers on top of
# the core observability stack already defined in docker-compose.yml.

services:
  promtail:
    image: grafana/promtail:2.9.4
    container_name: code-server-promtail
    user: "0:0"
    command:
      - --config.file=/etc/promtail/config.yml
    volumes:
      - ./config/promtail.yaml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - promtail_positions:/var/lib/promtail
    ports:
      - "3101:3101"
    healthcheck:
      test:
        - CMD
        - wget
        - "--quiet"
        - "--tries=1"
        - "--spider"
        - "http://localhost:3101/ready"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - services
    depends_on:
      - loki
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    profiles:
      - "observability"
      - "all"

  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.5-3.4.1-ubuntu22.04
    container_name: code-server-dcgm-exporter
    gpus: all
    ports:
      - "9400:9400"
    environment:
      - DCGM_EXPORTER_LISTEN=:9400
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    healthcheck:
      test:
        - CMD
        - wget
        - "--quiet"
        - "--tries=1"
        - "--spider"
        - "http://localhost:9400/metrics"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - services
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    profiles:
      - "observability"
      - "ai"
      - "all"

volumes:
  promtail_positions:
    driver: local
