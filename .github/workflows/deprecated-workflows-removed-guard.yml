name: CI — Deprecated Workflows Guard

on:
  pull_request:
    paths:
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'

jobs:
  deprecated-workflows-guard:
    runs-on: ubuntu-latest
    name: Verify Deprecated Workflows Removed
    steps:
      - uses: actions/checkout@v4
      
      - name: Run deprecated workflows guard
        run: bash scripts/ci/check-deprecated-workflows-removed.sh
        shell: bash
