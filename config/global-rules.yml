groups:
  - name: GlobalInfrastructure
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "Service {{ $labels.job }} (instance {{ $labels.instance }}) has been down for more than 2 minutes."

      - alert: HighCPULoad
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is above 90% (current: {{ $value | printf \"%.2f\" }}%)"

      - alert: LowDiskSpace
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Low disk space on {{ $labels.instance }}"
          description: "Available disk space is below 10% (current: {{ $value | printf \"%.2f\" }}%)"

  - name: MicroservicesPerformance
    rules:
      - alert: HighErrorRate
        expr: sum by (job) (rate(http_requests_total{status=~"5.."}[5m])) / sum by (job) (rate(http_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High error rate (5xx) on {{ $labels.job }}"
          description: "Error rate is above 5% (current: {{ $value | printf \"%.2f\" }}%)"

      - alert: P99LatencyHigh
        expr: histogram_quantile(0.99, sum by (le, job) (rate(http_request_duration_seconds_bucket[5m]))) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High P99 latency on {{ $labels.job }}"
          description: "P99 latency is above 2 seconds (current: {{ $value | printf \"%.2f\" }}s)"

  - name: BusinessLogicAlerts
    rules:
      - alert: ReputationScoreDrift
        expr: abs(avg_over_time(reputation_score_total[1h]) - avg_over_time(reputation_score_total[24h] offset 1d)) > 20
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Reputation score drift detected"
          description: "Major shift in reputation scores compared to last 24h"

      - alert: AgentExecutionFailures
        expr: rate(agent_execution_errors_total[10m]) > 0.1
        for: 5m
        labels:
          severity: high
        annotations:
          summary: "Agent execution failures spike"
          description: "Higher than normal agent execution failures detected"
