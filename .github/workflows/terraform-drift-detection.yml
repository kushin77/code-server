name: Terraform Drift Detection

on:
  schedule:
    - cron: '0 2 * * *'  # Nightly at 2:00 AM UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  terraform-drift-detection:
    name: Detect Terraform Infrastructure Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@651341c2fa7f66240621b20bab1d4ff9dc1b2666  # v2.1.0
        with:
          terraform_version: ~1.5

      - name: Terraform Format Check
        id: fmt
        run: |
          cd terraform
          terraform fmt -check
        continue-on-error: true

      - name: Terraform Init (read-only)
        id: init
        run: |
          cd terraform
          terraform init
        env:
          # Provide S3-compatible backend credentials if needed
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_KEY }}
        continue-on-error: true

      - name: Terraform Validate
        id: validate
        run: |
          cd terraform
          terraform validate
        continue-on-error: true

      - name: Terraform Plan (Drift Detection)
        id: plan
        run: |
          cd terraform
          terraform plan -detailed-exitcode -no-color -out=tfplan 2>&1 | tee tfplan.txt || EXIT_CODE=$?
          EXIT_CODE=${EXIT_CODE:-$?}
          echo "terraform_exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          echo "Has changes: $([ $EXIT_CODE -eq 2 ] && echo true || echo false)" >> $GITHUB_OUTPUT
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_KEY }}
        continue-on-error: true

      - name: Generate Plan Summary
        id: summary
        run: |
          PLAN_FILE="terraform/tfplan.txt"
          if [[ -f "$PLAN_FILE" ]]; then
            # Extract key changes (first 100 lines max)
            head -100 "$PLAN_FILE" > /tmp/plan_summary.txt
            # Count resource changes
            ADDITIONS=$(grep -c "^.*+.*$" /tmp/plan_summary.txt || echo 0)
            MODIFICATIONS=$(grep -c "^.*~.*$" /tmp/plan_summary.txt || echo 0)
            DELETIONS=$(grep -c "^.*-.*$" /tmp/plan_summary.txt || echo 0)
            echo "additions=$ADDITIONS" >> $GITHUB_OUTPUT
            echo "modifications=$MODIFICATIONS" >> $GITHUB_OUTPUT
            echo "deletions=$DELETIONS" >> $GITHUB_OUTPUT
            echo "plan_exists=true" >> $GITHUB_OUTPUT
          else
            echo "plan_exists=false" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Create Drift Detection Issue
        if: steps.plan.outputs.terraform_exit_code == '2'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const planFile = 'terraform/tfplan.txt';
            let planContent = '';
            
            try {
              if (fs.existsSync(planFile)) {
                planContent = fs.readFileSync(planFile, 'utf8');
                // Limit to first 3000 characters to avoid truncation
                planContent = planContent.substring(0, 3000);
                if (planContent.length >= 3000) planContent += '\n... (truncated)';
              }
            } catch (err) {
              planContent = '(unable to read plan file)';
            }
            
            const exitCode = '${{ steps.plan.outputs.terraform_exit_code }}';
            const additions = '${{ steps.summary.outputs.additions }}' || 'unknown';
            const modifications = '${{ steps.summary.outputs.modifications }}' || 'unknown';
            const deletions = '${{ steps.summary.outputs.deletions }}' || 'unknown';
            
            const title = '🚨 Terraform Drift Detected — Infrastructure Divergence from Declared State';
            const timestamp = new Date().toISOString();
            const body = `## Drift Detection Report
            
**Timestamp**: ${timestamp}
**Status**: Infrastructure has diverged from Terraform-declared state
**Exit Code**: ${exitCode} (2 = changes detected)

### Summary
- Resource Additions: ${additions}
- Resource Modifications: ${modifications}
- Resource Deletions: ${deletions}

### Plan Output (First 3000 chars)
\`\`\`
${planContent}
\`\`\`

### What This Means
Real infrastructure state does not match the Terraform plan. This can occur due to:
1. Manual infrastructure changes made outside of Terraform
2. Service updates that modified resources
3. External policies or guards modifying resources
4. Incomplete or out-of-date Terraform code

### Recommended Action
1. Review the plan output above to understand what diverged
2. Decide: reconcile Terraform code OR apply changes to infrastructure
3. Document the decision in this issue
4. See: [Terraform Drift Documentation](docs/terraform-operations.md)

### Resolution Paths
- **Path A (Recommended)**: Update Terraform code to match real state, then apply
- **Path B**: Run \`terraform refresh\` and manually reconcile
- **Path C**: Document intentional drift with a waiver (see docs/terraform-waivers.md)

**Labels**: infrastructure, terraform, drift-detected`;
            
            // Check if issue already exists (within last 24 hours)
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'drift-detected',
              per_page: 10
            });
            
            const recentDriftIssue = issues.data.find(issue => {
              const createdAt = new Date(issue.created_at);
              const hoursSince = (Date.now() - createdAt.getTime()) / (1000 * 60 * 60);
              return hoursSince < 24 && issue.title.includes('Terraform Drift');
            });
            
            if (recentDriftIssue) {
              // Update existing issue
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: recentDriftIssue.number,
                body: body
              });
              core.info(`Updated existing drift issue #${recentDriftIssue.number}`);
            } else {
              // Create new issue
              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['infrastructure', 'terraform', 'drift-detected', 'P1']
              });
              core.info(`Created new drift issue #${issue.data.number}`);
            }

      - name: Report Drift Check Results
        if: always()
        run: |
          EXIT_CODE=${{ steps.plan.outputs.terraform_exit_code }}
          
          if [[ "$EXIT_CODE" == "0" ]]; then
            echo "✅ No drift detected — Infrastructure matches declared state"
          elif [[ "$EXIT_CODE" == "2" ]]; then
            echo "⚠️  Drift detected — GitHub issue has been created"
          else
            echo "❌ Terraform plan check encountered an error (exit code: $EXIT_CODE)"
          fi

      - name: Upload Plan Artifact
        if: always()
        uses: actions/upload-artifact@65462800fd760344e62e32a76ebc27f8506e98e1  # v4.3.3
        with:
          name: terraform-drift-plan
          path: terraform/tfplan.txt
          retention-days: 30
