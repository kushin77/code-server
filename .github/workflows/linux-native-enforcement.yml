name: Linux-Native Mandate Enforcement (#885)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-no-powershell:
    name: Enforce Linux-native mandate (no PowerShell/Windows artifacts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Run Linux-native enforcement guard
        shell: bash
        run: |
          set -euo pipefail
          
          BASE_SHA="${{ github.event.pull_request.base.sha || github.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          
          echo "Checking Linux-native mandate enforcement (issue #885)"
          echo "Base SHA: $BASE_SHA"
          echo "Head SHA: $HEAD_SHA"
          
          # Run the enforcement guard script
          bash scripts/ci/check-no-powershell.sh
          
          exit_code=$?
          
          if [[ $exit_code -ne 0 ]]; then
            echo ""
            echo "❌ Linux-native enforcement FAILED"
            echo ""
            echo "Violations detected (see log above)."
            echo "This PR introduces PowerShell/Windows artifacts that violate the Linux-native mandate."
            echo ""
            echo "To fix:"
            echo "1. Remove or rewrite artifacts as pure bash/POSIX shell"
            echo "2. Remove Windows-specific paths, commands, and syntax"
            echo "3. See docs/CONTRIBUTING.md for Linux-native guidelines"
            echo ""
            exit 1
          fi
          
          echo "✅ Linux-native enforcement PASSED"
          exit 0
