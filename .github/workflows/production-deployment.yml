name: Kushnir.cloud (KC) Production Deployment & Verification

on:
  workflow_run:
    workflows: ['E2E Full Test Suite (Issues #986-990)']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip E2E tests and deploy directly'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      deployment_type:
        description: 'Deployment type'
        required: false
        default: 'standard'
        type: choice
        options:
          - standard
          - hotfix
          - rollback

env:
  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || '192.168.168.31' }}
  GCP_PROJECT: ${{ secrets.GCP_PROJECT || 'kushin77-ops' }}

jobs:
  check-tests:
    name: Verify Test Results
    runs-on: ubuntu-latest
    outputs:
      tests_passed: ${{ steps.check.outputs.tests_passed }}
    steps:
      - name: Check workflow trigger
        id: check
        if: github.event_name == 'workflow_run'
        run: |
          if [ "${{ github.event.workflow_run.conclusion }}" == "success" ]; then
            echo "tests_passed=true" >> $GITHUB_OUTPUT
          else
            echo "tests_passed=false" >> $GITHUB_OUTPUT
            echo "❌ Upstream tests failed - skipping deployment"
            exit 1
          fi

      - name: Skip test check for manual dispatch
        id: manual_check
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.skip_tests }}" == "true" ]; then
            echo "tests_passed=true" >> $GITHUB_OUTPUT
          else
            echo "tests_passed=unknown" >> $GITHUB_OUTPUT
          fi

  pre-deployment:
    name: Pre-Deployment Validation
    runs-on: ubuntu-latest
    needs: check-tests
    if: needs.check-tests.outputs.tests_passed == 'true'
    timeout-minutes: 15

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Run pre-deployment checks
        run: |
          echo "## Pre-Deployment Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Tests passed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Code ready for deployment" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Secrets accessible" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Deployment host reachable" >> $GITHUB_STEP_SUMMARY

      - name: Verify infrastructure code
        run: |
          # Validate Terraform
          terraform -chdir=. validate
          
          # Validate docker-compose
          docker-compose -f docker-compose.yml config > /dev/null

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: pre-deployment
    timeout-minutes: 30

    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.5.0'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: |
          terraform plan -out=tfplan -json > tfplan.json
          terraform show -json tfplan > tfplan-detailed.json

      - name: Upload Terraform plan
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: terraform-plan
          path: tfplan*
          retention-days: 7

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('tfplan.json', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '```\n' + plan + '\n```'
            });

  deployment:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: terraform-plan
    environment:
      name: production
    timeout-minutes: 30

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.5.0'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Download Terraform plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: terraform-plan

      - name: Terraform Init
        run: terraform init

      - name: Apply Terraform
        run: terraform apply -auto-approve tfplan

      - name: Verify deployment
        run: |
          echo "Waiting for services to stabilize..."
          sleep 30
          
          # Check Docker services
          ssh -o StrictHostKeyChecking=no akushnir@${{ env.DEPLOY_HOST }} \
            "cd code-server-enterprise && docker compose ps"

      - name: Record deployment
        run: |
          cat > DEPLOYMENT-RECORD-$(date +%Y-%m-%d-%H%M%S).md << 'EOF'
          # Production Deployment Record
          
          **Timestamp**: $(date -u)
          **Deployed By**: GitHub Actions
          **Trigger**: Workflow ${{ github.workflow }}
          **Commit**: ${{ github.sha }}
          
          ## Status
          ✅ Deployment Complete
          
          ## Next Steps
          1. Run post-deployment verification
          2. Monitor service health
          3. Check application logs
          EOF

      - name: Upload deployment record
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: deployment-record
          path: DEPLOYMENT-RECORD-*.md
          retention-days: 90

  post-deployment-verification:
    name: Post-Deployment Verification
    runs-on: ubuntu-latest
    needs: deployment
    if: always()
    timeout-minutes: 60

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify all services operational
        run: |
          echo "## Post-Deployment Verification" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Running 8-phase verification..." >> $GITHUB_STEP_SUMMARY

      - name: Phase 1 - Service Health Checks
        run: |
          ssh -o StrictHostKeyChecking=no akushnir@${{ env.DEPLOY_HOST }} \
            "cd code-server-enterprise && docker compose ps" | tee service-health.txt
          
          # Check health check status
          grep -q "healthy" service-health.txt || exit 1
          echo "✅ Phase 1: Service Health Checks - PASSED" >> $GITHUB_STEP_SUMMARY

      - name: Phase 2 - Database Connectivity
        run: |
          ssh -o StrictHostKeyChecking=no akushnir@${{ env.DEPLOY_HOST }} \
            "cd code-server-enterprise && docker compose exec -T postgres pg_isready" || exit 1
          echo "✅ Phase 2: Database Connectivity - PASSED" >> $GITHUB_STEP_SUMMARY

      - name: Phase 3 - Redis Replication
        run: |
          ssh -o StrictHostKeyChecking=no akushnir@${{ env.DEPLOY_HOST }} \
            "cd code-server-enterprise && docker compose exec -T redis redis-cli INFO replication" || exit 1
          echo "✅ Phase 3: Redis Replication - PASSED" >> $GITHUB_STEP_SUMMARY

      - name: Phase 4 - OAuth Configuration
        run: |
          curl -s -I https://kushnir.cloud/oauth2/auth -H "X-Forwarded-Email: test@test.com" | grep -q "200\|401" || exit 1
          echo "✅ Phase 4: OAuth Configuration - PASSED" >> $GITHUB_STEP_SUMMARY

      - name: Phase 5 - IDE Accessibility
        run: |
          curl -s -I https://kushnir.cloud/ | grep -q "200\|302\|401" || exit 1
          echo "✅ Phase 5: IDE Accessibility - PASSED" >> $GITHUB_STEP_SUMMARY

      - name: Phase 6 - Monitoring Stack
        run: |
          curl -s -I https://prometheus.kushnir.cloud/ | grep -q "200" || exit 1
          curl -s -I https://grafana.kushnir.cloud/ | grep -q "200\|302" || exit 1
          echo "✅ Phase 6: Monitoring Stack - PASSED" >> $GITHUB_STEP_SUMMARY

      - name: Phase 7 - Alerting System
        run: |
          curl -s -I https://alertmanager.kushnir.cloud/ | grep -q "200" || exit 1
          echo "✅ Phase 7: Alerting System - PASSED" >> $GITHUB_STEP_SUMMARY

      - name: Phase 8 - Backup Systems
        run: |
          ssh -o StrictHostKeyChecking=no akushnir@${{ env.DEPLOY_HOST }} \
            "test -f /mnt/nas/backups/latest && echo 'Backups operational'" || exit 1
          echo "✅ Phase 8: Backup Systems - PASSED" >> $GITHUB_STEP_SUMMARY

      - name: Final Summary
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## ✅ Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All 8 verification phases passed." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Live Endpoints" >> $GITHUB_STEP_SUMMARY
          echo "- IDE: https://kushnir.cloud" >> $GITHUB_STEP_SUMMARY
          echo "- Prometheus: https://prometheus.kushnir.cloud" >> $GITHUB_STEP_SUMMARY
          echo "- Grafana: https://grafana.kushnir.cloud" >> $GITHUB_STEP_SUMMARY
          echo "- AlertManager: https://alertmanager.kushnir.cloud" >> $GITHUB_STEP_SUMMARY
          echo "- Jaeger: https://jaeger.kushnir.cloud" >> $GITHUB_STEP_SUMMARY

  notify:
    name: Deployment Notification
    runs-on: ubuntu-latest
    needs: post-deployment-verification
    if: always()

    steps:
      - name: Create deployment status
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            const status = '${{ needs.post-deployment-verification.result }}' === 'success' ? 'success' : 'failure';
            const conclusion = status === 'success' ? '✅ PRODUCTION LIVE' : '❌ DEPLOYMENT FAILED';
            
            github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: context.payload.deployment.id,
              state: status,
              description: conclusion,
              environment_url: 'https://kushnir.cloud'
            });

      - name: Final status summary
        run: |
          echo "## Production Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ${{ needs.post-deployment-verification.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp**: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
