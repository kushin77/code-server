name: "🏗️ Infrastructure"
description: "Infrastructure, deployment, or operational change"
title: "infra: <short description>"
labels: ["infrastructure", "P2", "needs-priority"]
assignees: []
body:
  - type: dropdown
    id: priority
    attributes:
      label: "Priority"
      options:
        - P0 — Critical/Blocking
        - P1 — High/Degradation
        - P2 — Medium/Enhancement
        - P3 — Low/Nice-to-have
      default: 2
    validations:
      required: true

  - type: dropdown
    id: epic
    attributes:
      label: "Epic"
      description: "Which initiative does this belong to?"
      options:
        - "epic:pmo-excellence"
        - "epic:oidc-auth"
        - "epic:resilience"
        - "epic:observability"
        - "epic:security-hardening"
        - "epic:policy-templates"
        - "epic:kushnir-cloud"
        - "None"
      default: 6
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: "📦 Scope"
      description: "What infrastructure change is required?"
      placeholder: "Describe the service, host, environment, or config surface to update."
    validations:
      required: true

  - type: textarea
    id: implementation_plan
    attributes:
      label: "🛠️ Implementation Plan"
      description: "What files or systems will change?"
      placeholder: |
        Files to touch:
        - docker-compose.yml
        - Caddyfile

        Systems impacted:
        - 192.168.168.31
        - 192.168.168.42
    validations:
      required: true

  - type: textarea
    id: rollback_plan
    attributes:
      label: "↩️ Rollback Plan"
      description: "How do we revert safely?"
      placeholder: "Describe the exact rollback command or restoration steps."
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: "✅ Validation"
      description: "How do we verify the change?"
      placeholder: |
        - Health checks
        - Config validation
        - Replica parity
        - Deployment smoke test
    validations:
      required: true

  - type: textarea
    id: agent_steps
    attributes:
      label: "🤖 Agent Execution Steps"
      description: "Step-by-step instructions for Copilot"
      placeholder: |
        1. Create branch: git checkout -b infra/<issue>-<short-name>
        2. Reproduce or inspect the current state
        3. Implement the minimal change in canonical files only
        4. Add or update tests / validation checks
        5. Commit with a conventional commit message
        6. Push branch and open PR with Fixes #N
        7. Deploy or validate on both replicas
        8. Run: bash scripts/pmo/complete-issue.sh kushin77/code-server N
    validations:
      required: true

  - type: checkboxes
    id: completion_gate
    attributes:
      label: "🎯 Completion Gate"
      options:
        - label: "gate:committed — Changes committed to branch"
        - label: "gate:merged — PR merged to main"
        - label: "gate:validated — Validation passed on target hosts"
        - label: "gate:cleaned — Branch deleted and repo is clean"
    validations:
      required: true