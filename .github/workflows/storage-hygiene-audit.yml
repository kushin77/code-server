name: Storage Hygiene Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  docker-storage-hygiene:
    name: Docker storage hygiene dry-run report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run storage hygiene dry-run
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ops/docker-storage-hygiene.sh --dry-run

      - name: Upload storage hygiene artifacts
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: storage-hygiene-artifacts
          path: |
            artifacts/triage/docker-storage-hygiene-report.log
            artifacts/metrics/docker-storage-metrics.json
            artifacts/metrics/docker-storage-metrics.history.jsonl
          if-no-files-found: warn
