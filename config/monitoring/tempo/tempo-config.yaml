# @file        config/tempo.yaml
# @module      observability/tempo
# @description Grafana Tempo distributed tracing backend configuration
# @governance  GOV-002: Immutable, version-controlled, no hardcoded secrets

server:
  http_listen_port: 3200
  grpc_listen_port: 9095
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m
  trace_idle_period: 10s
  max_block_bytes: 1_000_000

compactor:
  compaction:
    block_retention: 720h    # 30 days

metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: code-server-enterprise
  storage:
    path: /var/tempo/generator/wal

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal
    block:
      bloom_filter_false_positive: 0.05

querier:
  max_concurrent_queries: 20
  search:
    prefer_self: 10

query_frontend:
  max_retries: 3
  search:
    duration_slo: 5s
    throughput_bytes_slo: 1.073741824e+09
  trace_by_id:
    duration_slo: 5s

overrides:
  defaults:
    ingestion:
      rate_limit_bytes: 15_000_000
      burst_size_bytes: 20_000_000
      max_traces_per_user: 10_000
    read:
      max_bytes_per_tag_values_query: 5_000_000
