name: E2E Tests with GSM Credentials

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to test'
        required: false
        default: 'all'
        type: choice
        options:
          - chromium
          - firefox
          - webkit
          - all

env:
  GCP_PROJECT: kushin77-ops
  REQUIRE_VPN: '0'

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      id-token: write  # Required for OIDC token to GCP

    steps:
      # ========================================================================
      # Setup
      # ========================================================================

      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # ========================================================================
      # Authenticate to GCP and Fetch GSM Secrets
      # ========================================================================

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Fetch QA credentials from GSM
        id: secrets
        run: |
          # Fetch QA email
          QA_EMAIL=$(gcloud secrets versions access latest --secret="qa-user-email" --project="$GCP_PROJECT")
          echo "qa_email=$QA_EMAIL" >> $GITHUB_OUTPUT
          echo "✓ Fetched qa-user-email: $QA_EMAIL"
          
          # Fetch service account key
          QA_KEY=$(gcloud secrets versions access latest --secret="qa-service-account-key" --project="$GCP_PROJECT")
          # Save to temp file (GitHub Actions will mask it)
          echo "$QA_KEY" > /tmp/qa-key.json
          chmod 600 /tmp/qa-key.json
          echo "✓ Fetched qa-service-account-key ($(wc -c < /tmp/qa-key.json") bytes)"

      # ========================================================================
      # Run E2E Tests
      # ========================================================================

      - name: Run E2E tests (all browsers)
        if: github.event.inputs.browser == 'all' || github.event.inputs.browser == ''
        env:
          E2E_USER_EMAIL: ${{ steps.secrets.outputs.qa_email }}
          E2E_USER_KEY: ${{ env.QA_KEY }}
          GCP_PROJECT: ${{ env.GCP_PROJECT }}
        run: |
          # Set environment variables for test runner
          export E2E_USER_EMAIL="${{ steps.secrets.outputs.qa_email }}"
          export GCP_PROJECT="$GCP_PROJECT"
          export REQUIRE_VPN=0
          
          echo "🧪 Running E2E tests with QA account: $E2E_USER_EMAIL"
          npx playwright test tests/e2e/specs/
        continue-on-error: false

      - name: Run E2E tests (specific browser)
        if: github.event.inputs.browser != 'all' && github.event.inputs.browser != ''
        env:
          E2E_USER_EMAIL: ${{ steps.secrets.outputs.qa_email }}
          PLAYWRIGHT_PROJECT: ${{ github.event.inputs.browser }}
        run: |
          export E2E_USER_EMAIL="${{ steps.secrets.outputs.qa_email }}"
          export GCP_PROJECT="$GCP_PROJECT"
          export REQUIRE_VPN=0
          
          echo "🧪 Running E2E tests (${{ github.event.inputs.browser }}) with QA account: $E2E_USER_EMAIL"
          npx playwright test tests/e2e/specs/ --project="${{ github.event.inputs.browser }}"
        continue-on-error: false

      # ========================================================================
      # Upload Results
      # ========================================================================

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test videos
        if: failure()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: test-videos
          path: test-results/
          retention-days: 7

      # ========================================================================
      # Summary
      # ========================================================================

      - name: Test summary
        if: always()
        run: |
          echo "## E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **QA Account**: ${{ steps.secrets.outputs.qa_email }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Credentials Source**: Google Secret Manager" >> $GITHUB_STEP_SUMMARY
          echo "- **Security**: Service account key (no plaintext passwords)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View Playwright Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts)" >> $GITHUB_STEP_SUMMARY
