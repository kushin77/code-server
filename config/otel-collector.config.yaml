# @file        config/otel-collector.yaml
# @module      observability/otel-collector
# @description OpenTelemetry Collector — receives OTLP traces/metrics/logs, exports to Tempo + Prometheus + Loki
# @governance  GOV-002: Immutable, version-controlled, no hardcoded secrets

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  # Prometheus scrape receiver — pulls metrics from services that expose /metrics
  prometheus:
    config:
      scrape_configs:
        - job_name: otel-collector-self
          static_configs:
            - targets: ["localhost:8888"]

processors:
  # Batch processor: buffer spans/metrics for efficiency
  batch:
    timeout: 5s
    send_batch_size: 512
    send_batch_max_size: 1024

  # Memory limiter: prevent OOM under high load
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 128

exporters:
  # Traces → Tempo
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # Metrics → Prometheus (remote write)
  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write
    tls:
      insecure_skip_verify: true

  # Logs → Loki
  loki:
    endpoint: http://loki:3100/loki/api/v1/push
    default_labels_enabled:
      exporter: false
      job: true

  # Debug: log all telemetry at info level (disable in production)
  debug:
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  pprof:
    endpoint: 0.0.0.0:1777
  zpages:
    endpoint: 0.0.0.0:55679

service:
  extensions: [health_check, pprof, zpages]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo, debug]
    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, batch]
      exporters: [prometheusremotewrite, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [loki, debug]

  telemetry:
    logs:
      level: info
    metrics:
      address: 0.0.0.0:8888
