services:
  code-server-ide:
    image: codercom/code-server:4.19.0
    container_name: code-server-ide
    ports:
    - 8090:8080
    environment:
    - PASSWORD=${CODE_SERVER_PASSWORD:-password123}
    - SUDO_PASSWORD=${CODE_SERVER_PASSWORD:-password123}
    - SUDO_PASSWORD_HASH=${CODE_SERVER_PASSWORD_HASH}
    volumes:
    - code_server_data:/home/coder
    networks:
    - services
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8080/
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M
  gitlab:
    image: gitlab/gitlab-ce:15.11.11-ce.0
    container_name: code-server-gitlab
    ports:
    - 8101:80
    - 8444:443
    - '2223:22'
    environment:
      GITLAB_OMNIBUS_CONFIG: 'external_url ''http://gitlab.kushnir.cloud''

        gitlab_rails[''gitlab_shell_ssh_port''] = 2222

        gitlab_rails[''db_adapter''] = ''postgresql''

        gitlab_rails[''db_host''] = ''${DB_HOST:-code-server-postgres}''

        gitlab_rails[''db_username''] = ''${DB_USER}''

        gitlab_rails[''db_password''] = ''${DB_PASSWORD}''

        gitlab_rails[''db_database''] = ''${DB_NAME:-gitlabdb}''

        nginx[''redirect_http_to_https''] = false

        puma[''worker_processes''] = 0

        '
      GITLAB_SKIP_UNMIGRATED_DATA_CHECK: "true"
    volumes:
    - gitlab_config:/etc/gitlab
    - gitlab_logs:/var/log/gitlab
    - gitlab_data:/var/opt/gitlab
    networks:
    - services
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - >-
        for attempt in 1 2 3 4 5; do
          curl -fsS http://localhost/help >/dev/null && exit 0;
          sleep 2;
        done;
        exit 1
      interval: 60s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
  gitlab-runner:
    image: gitlab/gitlab-runner:latest
    container_name: code-server-gitlab-runner
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - gitlab_runner_data:/home/gitlab-runner
    environment:
    - CI_SERVER_URL=http://gitlab:80/
    - REGISTRATION_TOKEN=${GITLAB_RUNNER_TOKEN:-}
    - RUNNER_EXECUTOR=docker
    - DOCKER_HOST=unix:///var/run/docker.sock
    networks:
    - services
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M
    healthcheck:
      test:
      - CMD
      - gitlab-runner
      - list
      - --config
      - /etc/gitlab-runner/config.toml
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  testing-service:
    build:
      context: .
      dockerfile: apps/testing-service/Dockerfile
    image: code-server-enterprise-testing:latest
    container_name: code-server-testing
    environment:
    - SERVICE_NAME=testing-service
    - TEST_RUNNER_HOST=0.0.0.0
    - TEST_RUNNER_PORT=8888
    - LOG_LEVEL=INFO
    - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST:-code-server-postgres}:5432/${DB_NAME}
    - REDIS_URL=redis://${REDIS_HOST:-code-server-redis}:6379/3
    - KAFKA_BOOTSTRAP_SERVERS=code-server-redpanda:9092
    ports:
    - 8888:8888
    networks:
    - services
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8888/health
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M
  minio:
    image: minio/minio:latest
    container_name: code-server-minio
    ports:
    - 9010:9000
    - 9011:9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
    - minio_data:/data
    networks:
    - services
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9000/minio/health/live
      interval: 30s
      timeout: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M
  appsmith:
    image: appsmith/appsmith-ce:latest
    container_name: code-server-appsmith
    ports:
    - 8084:80
    environment:
    - APPSMITH_DISABLE_TELEMETRY=true
    - APPSMITH_GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
    - APPSMITH_MAIL_ENABLED=${APPSMITH_MAIL_ENABLED:-false}
    - APPSMITH_INSTANCE_NAME=${APPSMITH_INSTANCE_NAME:-kushnir-cloud-ide}
    - OAUTH_GOOGLE_CLIENT_ID=${OAUTH_GOOGLE_CLIENT_ID:-}
    - OAUTH_GOOGLE_CLIENT_SECRET=${OAUTH_GOOGLE_CLIENT_SECRET:-}
    - OAUTH_GITHUB_CLIENT_ID=${OAUTH_GITHUB_CLIENT_ID:-}
    - OAUTH_GITHUB_CLIENT_SECRET=${OAUTH_GITHUB_CLIENT_SECRET:-}
    volumes:
    - appsmith_stacks:/appsmith-stacks
    networks:
    - services
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost/
      interval: 60s
      timeout: 10s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M
  vault:
    image: hashicorp/vault:1.13.0
    container_name: code-server-vault
    ports:
    - 8200:8200
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-devtoken}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
    - IPC_LOCK
    networks:
    - services
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - VAULT_ADDR=http://127.0.0.1:8200 vault status >/dev/null 2>&1 || exit 1
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
  artifact-repository:
    image: sonatype/nexus3:3.68.1
    container_name: code-server-artifact-repo
    ports:
    - 8083:8081
    environment:
    - NEXUS_CONTEXT=nexus
    - INSTALL4J_ADD_VM_PARAMS=-Xms1024m -Xmx1024m -XX:MaxDirectMemorySize=1024m
    volumes:
    - nexus_data:/nexus-data
    networks:
    - services
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8081/nexus/
      interval: 60s
      timeout: 10s
      start_period: 300s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
  control-plane:
    build:
      context: .
      dockerfile: apps/control-plane/Dockerfile
    image: code-server-control-plane:latest
    container_name: code-server-control-plane
    ports:
    - 8086:8082
    environment:
    - SERVICE_NAME=control-plane
    - CONTROL_PLANE_PORT=8082
    - CONTROL_PLANE_HOST=0.0.0.0
    - LOG_LEVEL=INFO
    - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST:-code-server-postgres}:5432/${DB_NAME}
    - REDIS_URL=redis://${REDIS_HOST:-code-server-redis}:6379/4
    networks:
    - services
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8082/health
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M

  hermes-integration:
    build:
      context: ./apps/hermes-integration
      dockerfile: Dockerfile
    image: hermes-integration:latest
    container_name: hermes-integration
    ports:
      - "8000:8000"
    environment:
      - HERMES_REPO_PATH=/mnt/hermes-agent
      - PYTHONUNBUFFERED=1
    volumes:
      - /home/akushnir/hermes-agent:/mnt/hermes-agent:ro
      - /home/akushnir/code-server/apps/hermes-integration:/app
    networks:
      - services
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8000/health
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M

volumes:
  code_server_data:
    driver: local
  gitlab_config:
    driver: local
  gitlab_logs:
    driver: local
  gitlab_data:
    driver: local
  gitlab_runner_data:
    driver: local
  minio_data:
    driver: local
  appsmith_stacks:
    driver: local
  nexus_data:
    driver: local
networks:
  services:
    external: true
    name: services
