name: Dependency Health & License Audit

on:
  pull_request:
    paths:
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'apps/*/package.json'
      - 'src/*/package.json'
      - 'requirements.txt'
      - 'setup.py'
      - 'Dockerfile*'
      - '.license-policy.json'
  schedule:
    # Weekly dependency audit on Monday at 2 AM UTC
    - cron: '0 2 * * 1'

jobs:
  audit-nodejs:
    name: Audit Node.js Dependencies (pnpm)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Node.js and pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320  # v2
        with:
          version: 9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Run pnpm audit (moderate level)
        run: |
          mkdir -p artifacts/triage
          pnpm audit --audit-level=moderate --json > artifacts/triage/pnpm-audit.json || true
          pnpm audit --audit-level=moderate > artifacts/triage/pnpm-audit.txt || true
        continue-on-error: true

      - name: Parse audit results and fail on critical
        run: |
          if [ -f artifacts/triage/pnpm-audit.json ]; then
            critical_count=$(jq '.metadata.vulnerabilities.critical // 0' artifacts/triage/pnpm-audit.json || echo "0")
            high_count=$(jq '.metadata.vulnerabilities.high // 0' artifacts/triage/pnpm-audit.json || echo "0")
            
            echo "## Vulnerability Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Critical | $critical_count |" >> $GITHUB_STEP_SUMMARY
            echo "| High | $high_count |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            if [ "$critical_count" -gt 0 ]; then
              echo "❌ CRITICAL vulnerabilities found. This PR cannot be merged." >> $GITHUB_STEP_SUMMARY
              exit 1
            fi
            
            if [ "$high_count" -gt 0 ]; then
              echo "⚠️  HIGH severity vulnerabilities detected. Requires security team review before merge." >> $GITHUB_STEP_SUMMARY
            fi
          fi

      - name: Upload audit reports
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808  # v4.3.3
        if: always()
        with:
          name: nodejs-audit-reports
          path: artifacts/triage/pnpm-audit.*
          retention-days: 90

  audit-licenses:
    name: Audit License Compliance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Node.js and pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320  # v2
        with:
          version: 9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install license-checker globally
        run: npm install -g license-checker@latest

      - name: Run license-checker
        run: |
          mkdir -p artifacts/triage
          license-checker --json > artifacts/triage/license-report.json || true
          license-checker > artifacts/triage/license-report.txt || true

      - name: Check for restricted licenses in production deps
        run: |
          set +e
          
          # Extract production dependencies
          jq -r 'to_entries[] | select(.key | contains("node_modules") | not) | "\(.key): \(.value.licenses)"' \
            artifacts/triage/license-report.json > /tmp/prod-licenses.txt 2>/dev/null || true
          
          # Check for RESTRICTED licenses in production
          FORBIDDEN_LICENSES="GPL|AGPL|SSPL|BUSL"
          
          if grep -iE "$FORBIDDEN_LICENSES" /tmp/prod-licenses.txt 2>/dev/null; then
            echo "❌ RESTRICTED licenses detected in production dependencies" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Restricted licenses found (GPL, AGPL, SSPL, BUSL) are not permitted in runtime dependencies." >> $GITHUB_STEP_SUMMARY
            echo "Please use the alternatives documented in .license-policy.json" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            grep -iE "$FORBIDDEN_LICENSES" /tmp/prod-licenses.txt >> $GITHUB_STEP_SUMMARY || true
            exit 1
          else
            echo "✅ No restricted licenses found in production dependencies" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload license reports
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808  # v4.3.3
        if: always()
        with:
          name: license-reports
          path: artifacts/triage/license-report.*
          retention-days: 90

  audit-containers:
    name: Audit Container Base Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # v0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          trivy-config: trivy.yaml
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@8344ad989e4d6f48107686f0ba4cadbf1a6f1b48  # v2.25.0
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-container-scan'

      - name: Check for critical Trivy findings
        run: |
          if grep -i "CRITICAL" trivy-results.sarif; then
            echo "⚠️  Critical container vulnerabilities detected" >> $GITHUB_STEP_SUMMARY
            echo "Review Trivy scan results in Security tab" >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: true

  audit-python:
    name: Audit Python Dependencies
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.files.*.filename, 'requirements.txt') || contains(github.event.pull_request.files.*.filename, 'setup.py')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c  # v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: |
          mkdir -p artifacts/triage
          pip-audit -o json > artifacts/triage/pip-audit.json || true
          pip-audit > artifacts/triage/pip-audit.txt || true
        continue-on-error: true

      - name: Check for critical Python CVEs
        run: |
          if [ -f artifacts/triage/pip-audit.json ]; then
            critical_count=$(jq '[.vulnerabilities[] | select(.fix_available == false)] | length' artifacts/triage/pip-audit.json || echo "0")
            
            if [ "$critical_count" -gt 0 ]; then
              echo "⚠️  Unfixable Python CVEs detected" >> $GITHUB_STEP_SUMMARY
              echo "Review pip-audit results for remediation options" >> $GITHUB_STEP_SUMMARY
            fi
          fi
        continue-on-error: true

      - name: Upload Python audit reports
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808  # v4.3.3
        if: always()
        with:
          name: python-audit-reports
          path: artifacts/triage/pip-audit.*
          retention-days: 90

  generate-report:
    name: Generate Consolidated Report
    needs: [audit-nodejs, audit-licenses, audit-containers, audit-python]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Download all reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: /tmp/audit-reports

      - name: Generate consolidated report
        run: |
          mkdir -p artifacts/triage
          
          cat > artifacts/triage/dependency-audit-summary.md <<'REPORT'
          # Dependency Health Audit Summary
          
          This report consolidates findings from:
          - Node.js (pnpm) security audit
          - License compliance check
          - Container base image scan (Trivy)
          - Python dependency audit (if applicable)
          
          ## Results
          
          See attached artifact files for detailed reports:
          - `nodejs-audit-reports/pnpm-audit.json` — Full CVE data
          - `license-reports/license-report.json` — License inventory
          - GitHub Security tab — Trivy container findings
          - `python-audit-reports/pip-audit.json` — Python CVEs
          
          ## Next Steps
          
          1. **Review critical findings** in artifacts
          2. **Update dependencies** using remediation backlog
          3. **Document exemptions** in `.license-policy-exemptions.json` if needed
          4. **Rerun audit** after updates
          
          ---
          Generated: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          REPORT

      - name: Upload consolidated summary
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808  # v4.3.3
        with:
          name: dependency-audit-summary
          path: artifacts/triage/dependency-audit-summary.md
          retention-days: 90

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('artifacts/triage/dependency-audit-summary.md', 'utf8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary + '\n\n> Detailed reports available in Artifacts tab'
            });
