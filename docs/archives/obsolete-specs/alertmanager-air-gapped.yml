global:
  resolve_timeout: 5m
  # No external Slack/PagerDuty/etc - internal notifications only
  slack_api_url: ''
  pagerduty_url: ''

route:
  receiver: 'default'
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  routes:
    # Critical alerts: immediate notification
    - match:
        severity: critical
      receiver: 'critical'
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1h

    # Warning alerts: grouped notification
    - match:
        severity: warning
      receiver: 'warnings'
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 6h

    # Info alerts: daily digest (or not sent)
    - match:
        severity: info
      receiver: 'dev-null'
      group_wait: 1m
      repeat_interval: 24h

receivers:
  # Default receiver: log to stdout (accessible via docker logs)
  - name: 'default'
    webhook_configs:
      - url: 'http://localhost:9093/api/v1/alerts'

  # Critical alerts: immediate action required
  - name: 'critical'
    webhook_configs:
      - url: 'http://internal-webhook:8080/alerts/critical'
    # Optional: send to local system monitoring
    # - pagerduty_configs:
    #     - service_key: 'INTERNAL_SERVICE_KEY'

  # Warning alerts: review needed
  - name: 'warnings'
    webhook_configs:
      - url: 'http://internal-webhook:8080/alerts/warning'

  # Info/debug: suppressed for cleaner logs
  - name: 'dev-null'

inhibit_rules:
  # Suppress info alerts if warning exists for same service
  - source_match:
      severity: 'warning'
    target_match:
      severity: 'info'
    equal: ['alertname', 'cluster', 'service']

  # Suppress duplicate alerts within same group
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster', 'service']
