version: '3.9'

# PRODUCTION-GRADE DOCKER-COMPOSE FOR HA REPLICATION
# Deploy IDENTICALLY on both PRIMARY (192.168.168.31) and REPLICA (192.168.168.42)
# Services on PRIMARY:  master/primary role
# Services on REPLICA:  replica/standby role (auto-failover ready)

services:
  # ============================================================================
  # CORE INFRASTRUCTURE LAYER (Must be on BOTH nodes identically)
  # ============================================================================

  # PostgreSQL - Primary/Replica replication
  postgres:
    image: postgres:16-alpine
    container_name: code-server-postgres
    environment:
      POSTGRES_DB: app_db
      POSTGRES_PASSWORD: postgres_password_secure
      POSTGRES_INITDB_ARGS: >
        -c wal_level=replica
        -c max_wal_senders=10
        -c max_replication_slots=5
      REPLICATION_USER: replication_user
      REPLICATION_PASSWORD: replication_password_secure
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/db/init-replication.sh:/docker-entrypoint-initdb.d/10-init-replication.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - code-server-network
    restart: unless-stopped

  # Redis - Cache (Master/Replica replication via docker-compose synchronization)
  redis:
    image: redis:7-alpine
    container_name: code-server-redis
    command: redis-server --appendonly yes --appendfsync everysec --requirepass code_server_redis_password
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "code_server_redis_password", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - code-server-network
    restart: unless-stopped

  # MongoDB - Document store
  mongodb:
    image: mongo:7.0
    container_name: code-server-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo_admin
      MONGO_INITDB_ROOT_PASSWORD: mongo_password_secure
      MONGO_INITDB_DATABASE: app_db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - code-server-network
    restart: unless-stopped

  # Elasticsearch - Search & analytics
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: code-server-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: curl -s http://localhost:9200 >/dev/null || exit 1
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - code-server-network
    restart: unless-stopped

  # Qdrant - Vector database for ML embeddings
  qdrant:
    image: qdrant/qdrant:v1.7.0
    container_name: code-server-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - code-server-network
    restart: unless-stopped

  # ============================================================================
  # OBSERVABILITY LAYER (Must be on BOTH nodes for distributed tracing)
  # ============================================================================

  # Prometheus - Metrics collection
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: code-server-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--scrape_interval=15s'
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - code-server-network
    restart: unless-stopped

  # Grafana - Visualization & dashboards
  grafana:
    image: grafana/grafana:10.2.0
    container_name: code-server-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ADMIN_USER: admin
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - code-server-network
    restart: unless-stopped

  # Loki - Log aggregation
  loki:
    image: grafana/loki:2.9.4
    container_name: code-server-loki
    command: -config.file=/etc/loki/local-config.yml
    ports:
      - "3100:3100"
    volumes:
      - ./config/loki/loki-config.yml:/etc/loki/local-config.yml:ro
      - loki_data:/loki
    networks:
      - code-server-network
    restart: unless-stopped

  # Tempo - Distributed tracing
  tempo:
    image: grafana/tempo:2.4.1
    container_name: code-server-tempo
    command: [ "-config.file=/etc/tempo/tempo-config.yml" ]
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4319:4319"
    volumes:
      - ./config/tempo/tempo-config.yml:/etc/tempo/tempo-config.yml:ro
      - tempo_data:/var/tempo
    networks:
      - code-server-network
    restart: unless-stopped

  # AlertManager - Alert routing & management
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: code-server-alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "9093:9093"
    volumes:
      - ./config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks:
      - code-server-network
    restart: unless-stopped

  # ============================================================================
  # API GATEWAY LAYER
  # ============================================================================

  # Caddy - Reverse proxy & API gateway (TLS-ready)
  caddy:
    image: caddy:2.7.4
    container_name: code-server-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - code-server-network
    restart: unless-stopped
    depends_on:
      - api-service

  # ============================================================================
  # MICROSERVICES LAYER (Core business logic)
  # ============================================================================

  api-service:
    image: code-server-enterprise:api-service
    container_name: code-server-api-service
    build:
      context: ./services/api-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres_password_secure@postgres:5432/app_db
      REDIS_URL: redis://:code_server_redis_password@redis:6379/0
      LOG_LEVEL: info
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - code-server-network
    restart: unless-stopped

  web-service:
    image: code-server-enterprise:web-service
    container_name: code-server-web-service
    build:
      context: ./services/web-service
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    depends_on:
      - api-service
    networks:
      - code-server-network
    restart: unless-stopped

  user-service:
    image: code-server-enterprise:user-service
    container_name: code-server-user-service
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres_password_secure@postgres:5432/app_db
      REDIS_URL: redis://:code_server_redis_password@redis:6379/0
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - code-server-network
    restart: unless-stopped

  data-service:
    image: code-server-enterprise:data-service
    container_name: code-server-data-service
    build:
      context: ./services/data-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres_password_secure@postgres:5432/app_db
      MONGODB_URL: mongodb://mongo_admin:mongo_password_secure@mongodb:27017/app_db
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - code-server-network
    restart: unless-stopped

  analytics-service:
    image: code-server-enterprise:analytics-service
    container_name: code-server-analytics-service
    build:
      context: ./services/analytics-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres_password_secure@postgres:5432/app_db
      ELASTICSEARCH_URL: http://elasticsearch:9200
      REDIS_URL: redis://:code_server_redis_password@redis:6379/0
    ports:
      - "8005:8000"
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - code-server-network
    restart: unless-stopped

  # ============================================================================
  # SUPPORTING SERVICES
  # ============================================================================

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: code-server-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin_password
    ports:
      - "5050:80"
    networks:
      - code-server-network
    restart: unless-stopped

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: code-server-redis-commander
    environment:
      REDIS_HOSTS: local:redis:6379:0:code_server_redis_password
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - code-server-network
    restart: unless-stopped

  # ============================================================================
  # NETWORK & VOLUMES
  # ============================================================================

networks:
  code-server-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  mongodb_data:
  elasticsearch_data:
  qdrant_data:
  prometheus_data:
  grafana_data:
  loki_data:
  tempo_data:
  alertmanager_data:
  caddy_data:
  caddy_config:
