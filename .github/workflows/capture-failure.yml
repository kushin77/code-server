name: Capture CI Failure for Replay

on:
  workflow_run:
    workflows:
      - Build & Test  # Primary CI workflow
      - Integration Tests
    types:
      - completed

permissions:
  contents: read
  actions: read
  artifacts: write

jobs:
  capture-failure:
    name: Capture Failure for Replay
    runs-on: ubuntu-latest
    if: failure() || github.event.workflow_run.conclusion == 'failure'

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Download workflow artifacts
        uses: actions/download-artifact@v4
        with:
          path: workflow-artifacts

      - name: Load environment variables
        run: |
          if [ -f "workflow-artifacts/env-capture/env.yaml" ]; then
            cp workflow-artifacts/env-capture/env.yaml .
          fi
          echo "FAILED_WORKFLOW_RUN=${{ github.event.workflow_run.id }}" >> $GITHUB_ENV
          echo "FAILED_JOB_NAME=${{ github.event.workflow_run.name }}" >> $GITHUB_ENV

      - name: Capture failure metadata
        id: capture
        run: |
          FAILURE_PAYLOAD=$(cat <<EOF
          {
            "run_id": "${{ github.event.workflow_run.id }}",
            "workflow_name": "${{ github.event.workflow_run.name }}",
            "branch": "${{ github.event.workflow_run.head_branch }}",
            "git_commit": "${{ github.event.workflow_run.head_commit }}",
            "pr_number": "${{ github.event.pull_request.number || 'N/A' }}",
            "command": "See workflow logs",
            "failed_at": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "docker_version": "$(docker --version)",
            "node_version": "$(node --version || echo 'N/A')",
            "python_version": "$(python --version)",
            "terraform_version": "$(terraform version -json 2>/dev/null | jq -r '.terraform_version' || echo 'N/A')"
          }
          EOF
          )
          echo "failure_payload=${FAILURE_PAYLOAD}" >> $GITHUB_OUTPUT

      - name: Create replay archive
        id: archive
        run: |
          mkdir -p replay-archives
          
          # Tar capture data
          tar -czf "replay-archives/replay-${{ github.event.workflow_run.id }}.tar.gz" \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='dist' \
            env.yaml 2>/dev/null || true
          
          ARCHIVE_SIZE=$(du -h "replay-archives/replay-${{ github.event.workflow_run.id }}.tar.gz" | cut -f1)
          echo "archive_size=${ARCHIVE_SIZE}" >> $GITHUB_OUTPUT
          echo "archive_path=replay-archives/replay-${{ github.event.workflow_run.id }}.tar.gz" >> $GITHUB_OUTPUT

      - name: Upload replay archive to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: replay-${{ github.event.workflow_run.id }}
          path: replay-archives/
          retention-days: 30

      - name: Publish to Replay Engine API
        if: always()
        run: |
          # In production: call POST http://replay-engine:8082/capture
          # with failure payload
          
          echo "Failure captured for run: ${{ github.event.workflow_run.id }}"
          echo "Archive: ${{ steps.archive.outputs.archive_path }}"
          echo "Size: ${{ steps.archive.outputs.archive_size }}"

      - name: Notify via Kafka (production)
        if: false  # Disabled for now, enable after Kafka integration
        run: |
          # Publish event:
          # Topic: ci.failure
          # Payload: {run_id, archive_url, timestamp}
          echo "Would publish to Kafka..."

      - name: Comment on PR (if applicable)
        if: github.event.pull_request.number
        uses: actions/github-script@v7
        with:
          script: |
            const runId = '${{ github.event.workflow_run.id }}';
            const archiveSize = '${{ steps.archive.outputs.archive_size }}';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `⚠️ **CI Failure Detected** — Replay available\n\n\`\`\`\nelevatediq replay ${runId}\n\`\`\`\n\nArchive size: ${archiveSize}`
            });

      - name: Clean up old archives (>30 days)
        if: always()
        run: |
          # In production: call POST http://replay-engine:8082/cleanup
          echo "Archive retention policy: 30 days"
