name: Continuous Infrastructure Validation

on:
  schedule:
    # Run every 6 hours (4 times daily)
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/_common/**'
      - 'config/**'
      - 'docker-compose*.yml'
      - 'terraform/**'
      - '.github/workflows/continuous-validation.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pydantic docker

      - name: Validate SSOT config
        id: ssot_validation
        run: |
          source scripts/_common/config.env 2>/dev/null || true
          python3 -c "
          from apps._shared.python.config import Config
          config = Config(validate_required=False)
          required_vars = [
              'PRIMARY_HOST', 'REPLICA_HOST', 'APEX_DOMAIN', 'ADMIN_EMAIL',
              'POSTGRES_PASSWORD', 'REDIS_PASSWORD', 'OAUTH2_CLIENT_SECRET'
          ]
          missing = [v for v in required_vars if not config.get(v)]
          if missing:
              print(f'❌ Missing required vars: {missing}')
              exit(1)
          print('✅ SSOT config validation passed')
          "

      - name: Validate docker-compose files
        id: compose_validation
        run: |
          COMPOSE_FILES=("docker-compose.yml" "docker-compose.prod.yml" "docker-compose.cluster.yml")
          for file in "${COMPOSE_FILES[@]}"; do
            if [ -f "$file" ]; then
              docker-compose -f "$file" config > /dev/null 2>&1 || {
                echo "❌ Syntax error in $file"
                exit 1
              }
              echo "✅ $file: syntax valid"
            fi
          done

      - name: Validate health check functions
        id: health_check_validation
        run: |
          bash -n scripts/_common/health-checks.sh || {
            echo "❌ Syntax error in health-checks.sh"
            exit 1
          }
          echo "✅ health-checks.sh: syntax valid"

      - name: Validate terraform configurations
        id: terraform_validation
        run: |
          if command -v terraform &> /dev/null; then
            cd terraform
            terraform init -backend=false 2>/dev/null || true
            terraform validate || {
              echo "❌ Terraform validation failed"
              exit 1
            }
            echo "✅ Terraform configuration valid"
            cd ..
          else
            echo "⚠️  Terraform not installed, skipping terraform validation"
          fi
        continue-on-error: true

      - name: Run background test runner
        id: test_runner
        run: |
          python3 scripts/ci/background-test-runner.py --once || {
            echo "⚠️  Some tests failed, creating GitHub issue..."
          }
        continue-on-error: true

      - name: Parse test results and create issues
        if: failure() || (steps.test_runner.outcome == 'failure')
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = '.test-errors.jsonl';
            
            if (fs.existsSync(path)) {
              const errors = fs.readFileSync(path, 'utf8').trim().split('\n');
              
              for (const errorLine of errors) {
                try {
                  const error = JSON.parse(errorLine);
                  const title = `[Validation] ${error.test || 'Unknown test'} failed`;
                  const body = `
            **Test**: ${error.test}
            **Error**: ${error.message}
            **Timestamp**: ${error.timestamp}
            **Severity**: ${error.severity || 'medium'}
            
            This issue was automatically created by the continuous validation workflow.
            See [workflow logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.
                  `;
                  
                  // Check if similar issue exists
                  const issues = await github.rest.issues.listForRepo({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    labels: ['validation-failure', 'auto-created'],
                    state: 'open'
                  });
                  
                  const exists = issues.data.some(issue => 
                    issue.title.includes(error.test || 'Unknown')
                  );
                  
                  if (!exists) {
                    await github.rest.issues.create({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      title: title,
                      body: body,
                      labels: ['validation-failure', 'auto-created', 'audit-remediation']
                    });
                  }
                } catch (e) {
                  console.log('Error parsing test result:', e);
                }
              }
            }

      - name: Report validation status
        run: |
          echo "## Continuous Validation Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ SSOT config: ${{ steps.ssot_validation.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "✅ Docker-compose: ${{ steps.compose_validation.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "✅ Health checks: ${{ steps.health_check_validation.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "✅ Terraform: ${{ steps.terraform_validation.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "✅ Test runner: ${{ steps.test_runner.outcome }}" >> $GITHUB_STEP_SUMMARY

  notify:
    runs-on: ubuntu-latest
    needs: validate
    if: always()
    
    steps:
      - name: Report to workflow status page
        run: |
          echo "Validation workflow completed at $(date)"
          echo "Status: ${{ needs.validate.result }}"
