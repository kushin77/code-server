# @file        config/grafana/provisioning/datasources/datasources.yaml
# @module      observability/grafana
# @description Grafana datasource provisioning — Prometheus, Loki, Tempo
# @governance  GOV-002: Version-controlled, immutable, no hardcoded credentials

apiVersion: 1

datasources:
  # ── Prometheus — Metrics ─────────────────────────────────────────────────────
  - name: Prometheus
    type: prometheus
    uid: prometheus
    url: http://prometheus:9090
    access: proxy
    isDefault: true
    jsonData:
      timeInterval: "15s"
      httpMethod: POST
    version: 1
    editable: false

  # ── Loki — Logs ──────────────────────────────────────────────────────────────
  - name: Loki
    type: loki
    uid: loki
    url: http://loki:3100
    access: proxy
    jsonData:
      maxLines: 1000
      # Correlate Loki logs with Tempo traces
      derivedFields:
        - datasourceUid: tempo
          matcherRegex: '"trace_id":"([a-f0-9]+)"'
          name: TraceID
          url: "$${__value.raw}"
    version: 1
    editable: false

  # ── Tempo — Distributed Traces ───────────────────────────────────────────────
  # Issue #1532: Centralized Observability & SLOG — Distributed Tracing (OpenTelemetry)
  - name: Tempo
    type: tempo
    uid: tempo
    url: http://tempo:3200
    access: proxy
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true
        filterBySpanID: false
        tags:
          - key: service.name
            value: service
      tracesToMetrics:
        datasourceUid: prometheus
        tags:
          - key: service.name
            value: job
        queries:
          - name: "Sample query"
            query: "sum(rate(http_requests_total{$$__tags}[5m]))"
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
    version: 1
    editable: false
