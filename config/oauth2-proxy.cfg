# @file        config/oauth2-proxy.cfg
# @module      security/oauth2-proxy
# @description OAuth2 Proxy configuration — Google OAuth with subdomain session sharing
# @governance  GOV-002: IaC, immutable, idempotent
# Issue #1545: Endpoint & SSO — Single OAuth for All Subdomains
#
# Subdomain SSO: cookie_domains = ".kushnir.cloud" enables one session cookie
# shared across ide.kushnir.cloud, api.kushnir.cloud, grafana.kushnir.cloud, etc.

http_address = "0.0.0.0:4180"
reverse_proxy = true

# ── Provider: Google OAuth ─────────────────────────────────────────────────
# For GitHub OAuth, change to: provider = "github"
provider = "google"
redirect_url = "https://${APEX_DOMAIN}/oauth2/callback"

# Google OAuth scopes
scope = "openid email profile"

# ── Headers passed to upstream ─────────────────────────────────────────────
set_xauthrequest = true
pass_access_token = false
pass_user_headers = true

# Pass user identity headers to all upstream services
set_authorization_header = true

# ── Cookie configuration: Subdomain session sharing ───────────────────────
# cookie_domains = ".kushnir.cloud" — single session cookie for ALL subdomains:
#   ide.kushnir.cloud, api.kushnir.cloud, grafana.kushnir.cloud, etc.
# Override via OAUTH2_PROXY_COOKIE_DOMAINS env var
cookie_domains = [".${APEX_DOMAIN}"]
cookie_name = "_oauth2_proxy"
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_expire = "168h"    # 7-day session before re-auth
cookie_refresh = "1h"     # Background token refresh every hour (seamless)

# ── Email domain restriction ───────────────────────────────────────────────
# Restrict to specific domain (set via OAUTH2_PROXY_EMAIL_DOMAINS)
# "*" = allow all Google accounts (change for production to your org domain)
email_domains = ["*"]

# ── Session lifecycle ──────────────────────────────────────────────────────
# Static upstream — oauth2-proxy validates auth, Caddy handles routing
upstreams = ["static://202"]

# Skip button — redirect immediately to provider
skip_provider_button = false

# Force re-auth on cookie expiry (don't silently fail)
silence_ping_logging = true