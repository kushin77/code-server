# @file        config/loki/retention-overrides.yaml
# @description Stream-level retention overrides for Loki
# @governance  GOV-002: Compliance-driven log archiving

overrides:
  # Audit logs: 1 Year (Compliance)
  - labels: {job="audit"}
    retention_period: 8760h

  # Auth events: 1 Year (Security)
  - labels: {job="auth-server"}
    retention_period: 8760h

  # Infrastructure logs: 90 Days (Hot/Warm tier)
  - labels: {job="caddy"}
    retention_period: 2160h
  - labels: {job="postgres"}
    retention_period: 2160h

  # App metadata logs: 30 Days (Standard Tier) - Enforced by global retention_period
