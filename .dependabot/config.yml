# Dependabot Configuration for Automated Base Image Updates
# Purpose: Automatically update base images and dependencies, trigger rebuilds

version: 2
updates:
  # Docker base images
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"  # UTC
    target-branch: "develop"
    open-pull-requests-limit: 5
    reviewers:
      - "akushnir"
    assignees:
      - "akushnir"
    labels:
      - "dependencies"
      - "docker"
    pull-request-branch-name:
      separator: "/"
    rebase-strategy: "auto"
    commit-message:
      prefix: "chore(deps):"
      include: "scope"
    allow:
      - dependency-type: "direct"
    ignore:
      - dependency-name: "alpine"
        versions: ["3.10.*"]

  # Docker Compose files
  - package-ecosystem: "docker"
    directory: "/docker-compose-updates"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    target-branch: "develop"
    open-pull-requests-limit: 3

  # Python dependencies (for agent services, etc.)
  - package-ecosystem: "pip"
    directory: "/apps/multimodal-ai"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "03:00"
    target-branch: "develop"
    open-pull-requests-limit: 5
    reviewers:
      - "akushnir"
    security-updates-only: false
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"

  - package-ecosystem: "pip"
    directory: "/apps/agent-runtime"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "03:30"
    target-branch: "develop"
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/apps/edge_agent"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "04:00"
    target-branch: "develop"
    open-pull-requests-limit: 5

  # Node.js dependencies (if applicable)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "03:00"
    target-branch: "develop"
    open-pull-requests-limit: 5
    security-updates-only: true

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "03:00"
    target-branch: "develop"
    open-pull-requests-limit: 10
