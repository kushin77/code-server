name: acme/hello-world-agent
version: 0.1.0
author: acme-corp
type: agent

description: "Hello World example agent - demonstrates SDK capability declarations and event publishing"

capabilities:
  event_publish: true
  memory_read: true

permissions:
  event_bus:
    subscribe: []
    publish:
      - agent.audit

signatures:
  author_public_key: |
    ssh-rsa AAAA...  # Placeholder
  marketplace_signature: |
    sig_...  # Placeholder
