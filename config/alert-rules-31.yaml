---
# Prometheus Alert Rules for 192.168.168.31
# For: SLA enforcement, incident detection, capacity planning

groups:
  - name: GPU_Alerts
    interval: 15s
    rules:
      # GPU Availability
      - alert: GPUUnavailable
        expr: 'dcgm_gpu_active == 0'
        for: 2m
        labels:
          severity: critical
          component: gpu
          sla_impact: "yes"
        annotations:
          summary: "GPU {{ $labels.gpu_index }} is unavailable"
          description: "GPU {{ $labels.gpu_index }} not responding for 2 minutes. Check NVIDIA driver status."

      # GPU High Temperature
      - alert: GPUHighTemperature
        expr: 'dcgm_gpu_temp > 85'
        for: 5m
        labels:
          severity: warning
          component: gpu
        annotations:
          summary: "GPU {{ $labels.gpu_index }} temperature is {{ $value }}°C"
          description: "GPU running above 85°C for 5 minutes. Check cooling and reduce load."

      # GPU Critical Temperature
      - alert: GPUCriticalTemperature
        expr: 'dcgm_gpu_temp > 95'
        for: 1m
        labels:
          severity: critical
          component: gpu
        annotations:
          summary: "GPU {{ $labels.gpu_index }} CRITICAL temperature: {{ $value }}°C"
          description: "GPU exceeded 95°C. Shutting down workloads to prevent damage."

      # GPU Memory Exhaustion
      - alert: GPUMemoryExhaustion
        expr: '(dcgm_fb_free / (dcgm_fb_free + dcgm_fb_used)) < 0.1'
        for: 5m
        labels:
          severity: warning
          component: gpu
        annotations:
          summary: "GPU {{ $labels.gpu_index }} memory utilization > 90%"
          description: "Less than 10% free VRAM. Reduce batch size or offload inference."

      # GPU Power Limit
      - alert: GPUPowerLimit
        expr: 'dcgm_power_usage / dcgm_power_limit > 0.95'
        for: 5m
        labels:
          severity: warning
          component: gpu
        annotations:
          summary: "GPU {{ $labels.gpu_index }} power at {{ $value | humanizePercentage }} of limit"
          description: "Power consumption exceeds 95% of limit. Check thermal throttling."

      # GPU ECC Errors
      - alert: GPUECCErrors
        expr: 'increase(dcgm_ecc_errors_corrected[1h]) > 10'
        for: 5m
        labels:
          severity: warning
          component: gpu
        annotations:
          summary: "GPU {{ $labels.gpu_index }} ECC errors: {{ $value }} in last hour"
          description: "{{ $value }} ECC errors detected. Monitor for hardware degradation."

  - name: NAS_Alerts
    interval: 30s
    rules:
      # NAS Mount Point Down
      - alert: NASMountPointDown
        expr: 'nas_mount_up == 0'
        for: 2m
        labels:
          severity: critical
          component: nas
          sla_impact: "yes"
        annotations:
          summary: "NAS mount {{ $labels.mount_path }} is unavailable"
          description: "NAS mount not responding for 2 minutes. Check network and NAS health."

      # NAS Capacity Critical
      - alert: NASCapacityCritical
        expr: '(1 - (nas_fs_avail / nas_fs_size)) > 0.9'
        for: 5m
        labels:
          severity: critical
          component: nas
        annotations:
          summary: "NAS {{ $labels.mount_path }} capacity at {{ $value | humanizePercentage }}"
          description: "90%+ full. Immediate action required to prevent data loss."

      # NAS Capacity Warning
      - alert: NASCapacityWarning
        expr: '(1 - (nas_fs_avail / nas_fs_size)) > 0.75'
        for: 10m
        labels:
          severity: warning
          component: nas
        annotations:
          summary: "NAS {{ $labels.mount_path }} capacity at {{ $value | humanizePercentage }}"
          description: "75%+ full. Plan capacity expansion or cleanup."

      # NAS Latency Degradation
      - alert: NASLatencyDegraded
        expr: 'histogram_quantile(0.99, nas_io_latency_seconds) > 0.1'
        for: 5m
        labels:
          severity: warning
          component: nas
        annotations:
          summary: "NAS {{ $labels.mount_path }} p99 latency: {{ $value | humanizeDuration }}"
          description: "Latency exceeded 100ms threshold. Check network and NAS performance."

      # NAS IOPS Saturation
      - alert: NASIOPSSaturation
        expr: 'rate(nas_io_operations_total[5m]) > 100000'
        for: 5m
        labels:
          severity: warning
          component: nas
        annotations:
          summary: "NAS {{ $labels.mount_path }} IOPS: {{ $value | humanize }} ops/sec"
          description: ">100k IOPS sustained. Check for workload concentration."

      # NAS Backup Failure
      - alert: NASBackupFailure
        expr: 'nas_backup_last_success_epoch < (time() - 3600)'
        for: 10m
        labels:
          severity: critical
          component: nas
        annotations:
          summary: "NAS backup {{ $labels.backup_name }} failed for >1 hour"
          description: "Backup missing or failed. Check backup logs immediately."

      # PostgreSQL Cache Hit Ratio Low
      - alert: PostgreSQLCacheHitRatioLow
        expr: |
          (
            sum(rate(pg_stat_database_blks_hit{datname!~"template.*"}[5m])) /
            clamp_min(sum(rate(pg_stat_database_blks_hit{datname!~"template.*"}[5m])) + sum(rate(pg_stat_database_blks_read{datname!~"template.*"}[5m])), 1)
          ) < 0.8
        for: 10m
        labels:
          severity: warning
          component: postgres
          issue_category: perf-regression
        annotations:
          summary: "PostgreSQL cache hit ratio below 80%"
          description: "Cache efficiency dropped below the baseline target. Review workspace artifact caching and NAS tuning changes."

  - name: Application_Alerts
    interval: 15s
    rules:
      # Code-Server Service Down
      - alert: CodeServerUnhealthy
        expr: 'up{job="code-server"} == 0'
        for: 2m
        labels:
          severity: critical
          component: code-server
          sla_impact: "yes"
        annotations:
          summary: "Code-Server at {{ $labels.instance }} not responding"
          description: "Health check failed for 2 minutes. Check service logs."

      # Ollama Model Load Failure
      - alert: OllamaModelLoadFailure
        expr: 'increase(ollama_model_load_errors_total[5m]) > 0'
        for: 5m
        labels:
          severity: warning
          component: ollama
        annotations:
          summary: "Ollama model load failures detected"
          description: "{{ $value }} load failures in last 5 minutes. Check model availability."

      # Ollama Inference Timeout
      - alert: OllamaInferenceTimeout
        expr: 'histogram_quantile(0.99, ollama_inference_latency_seconds) > 5'
        for: 5m
        labels:
          severity: warning
          component: ollama
        annotations:
          summary: "Ollama p99 latency: {{ $value | humanizeDuration }}"
          description: "Exceeded 5 second target. Check GPU saturation."

  - name: System_Alerts
    interval: 15s
    rules:
      # System CPU High
      - alert: SystemCPUHigh
        expr: '100 - (avg by (instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80'
        for: 5m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "System CPU {{ $value | humanize }}%"
          description: "CPU utilization exceeded 80% for 5 minutes."

      # System Memory Pressure
      - alert: SystemMemoryPressure
        expr: '(1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.85'
        for: 5m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "System memory {{ $value | humanizePercentage }}"
          description: "Memory utilization exceeded 85%. Check processes."

  - name: SLO_Compliance
    interval: 60s
    rules:
      # GPU Availability SLO (99.99%)
      - alert: GPUAvailabilitySLOViolation
        expr: 'count(rate(dcgm_gpu_active == 0[30m])) / count(dcgm_gpu_active) > 0.0001'
        for: 1h
        labels:
          severity: critical
          slo: gpu_availability
        annotations:
          summary: "GPU availability SLO violated over 1 hour"
          description: "Availability fell below 99.99% target."

      # NAS Availability SLO (99.95%)
      - alert: NASAvailabilitySLOViolation
        expr: 'count(rate(nas_mount_up == 0[30m])) / count(nas_mount_up) > 0.0005'
        for: 1h
        labels:
          severity: critical
          slo: nas_availability
        annotations:
          summary: "NAS availability SLO violated over 1 hour"
          description: "Availability fell below 99.95% target."

      # Application Latency SLO (<500ms p99)
      - alert: ApplicationLatencySLOViolation
        expr: 'histogram_quantile(0.99, ollama_inference_latency_seconds) > 0.5'
        for: 15m
        labels:
          severity: warning
          slo: application_latency
        annotations:
          summary: "Application latency {{ $value | humanizeDuration }}"
          description: "Ollama p99 latency exceeds 500ms target."

  - name: SLO_Service_Burn_Rate
    interval: 5m
    rules:
      - record: slo:availability:ratio_5m:class_a
        expr: |
          avg by (job) (
            avg_over_time(up{job="caddy"}[5m])
          )

      - record: slo:availability:ratio_1h:class_a
        expr: |
          avg by (job) (
            avg_over_time(up{job="caddy"}[1h])
          )

      - record: slo:availability:ratio_6h:class_a
        expr: |
          avg by (job) (
            avg_over_time(up{job="caddy"}[6h])
          )

      - record: slo:availability:ratio_30d:class_a
        expr: |
          avg by (job) (
            avg_over_time(up{job="caddy"}[30d])
          )

      - record: slo:availability:ratio_5m:class_b
        expr: |
          avg by (job) (
            avg_over_time(up{job=~"code-server|oauth2-proxy|postgres|redis|session-broker|token-microservice"}[5m])
          )

      - record: slo:availability:ratio_1h:class_b
        expr: |
          avg by (job) (
            avg_over_time(up{job=~"code-server|oauth2-proxy|postgres|redis|session-broker|token-microservice"}[1h])
          )

      - record: slo:availability:ratio_6h:class_b
        expr: |
          avg by (job) (
            avg_over_time(up{job=~"code-server|oauth2-proxy|postgres|redis|session-broker|token-microservice"}[6h])
          )

      - record: slo:availability:ratio_30d:class_b
        expr: |
          avg by (job) (
            avg_over_time(up{job=~"code-server|oauth2-proxy|postgres|redis|session-broker|token-microservice"}[30d])
          )

      - record: slo:http_request_latency:p99_5m
        expr: |
          histogram_quantile(
            0.99,
            sum by (job, le) (
              rate(http_request_duration_seconds_bucket{job=~"code-server|oauth2-proxy|session-broker|token-microservice"}[5m])
            )
          )

      - record: slo:http_request_latency:p99_1h
        expr: |
          histogram_quantile(
            0.99,
            sum by (job, le) (
              rate(http_request_duration_seconds_bucket{job=~"code-server|oauth2-proxy|session-broker|token-microservice"}[1h])
            )
          )

      - record: slo:error_budget:remaining:class_a
        expr: |
          clamp_min(1 - ((1 - slo:availability:ratio_30d:class_a) / 0.0005), 0)

      - record: slo:error_budget:remaining:class_b
        expr: |
          clamp_min(1 - ((1 - slo:availability:ratio_30d:class_b) / 0.001), 0)

      - alert: SLOAvailabilityBurnRateWarningClassA
        expr: |
          ((1 - slo:availability:ratio_5m:class_a) / 0.0005 > 6)
          and
          ((1 - slo:availability:ratio_1h:class_a) / 0.0005 > 3)
        for: 5m
        labels:
          severity: warning
          slo: availability
          class: a
        annotations:
          summary: "Class A availability budget is burning quickly"
          description: "Caddy is burning its 99.95% availability budget faster than policy allows."

      - alert: SLOAvailabilityBurnRateCriticalClassA
        expr: |
          ((1 - slo:availability:ratio_5m:class_a) / 0.0005 > 14.4)
          and
          ((1 - slo:availability:ratio_1h:class_a) / 0.0005 > 6)
        for: 2m
        labels:
          severity: critical
          slo: availability
          class: a
        annotations:
          summary: "Class A availability burn rate is critical"
          description: "Caddy is consuming its monthly error budget too quickly and should page on-call."

      - alert: SLOAvailabilityBurnRateWarningClassB
        expr: |
          ((1 - slo:availability:ratio_5m:class_b) / 0.001 > 6)
          and
          ((1 - slo:availability:ratio_1h:class_b) / 0.001 > 3)
        for: 5m
        labels:
          severity: warning
          slo: availability
          class: b
        annotations:
          summary: "Class B availability budget is burning quickly"
          description: "A core production service is burning its 99.9% availability budget faster than policy allows."

      - alert: SLOAvailabilityBurnRateCriticalClassB
        expr: |
          ((1 - slo:availability:ratio_5m:class_b) / 0.001 > 14.4)
          and
          ((1 - slo:availability:ratio_1h:class_b) / 0.001 > 6)
        for: 2m
        labels:
          severity: critical
          slo: availability
          class: b
        annotations:
          summary: "Class B availability burn rate is critical"
          description: "A core production service is consuming its monthly error budget too quickly."

      - alert: SLOHttpP99LatencyWarning
        expr: 'slo:http_request_latency:p99_5m > 0.8'
        for: 10m
        labels:
          severity: warning
          slo: latency
        annotations:
          summary: "HTTP request P99 latency exceeds 800ms"
          description: "The request path is outside the latency target defined in docs/SLO.md."
