# Docker Compose configuration for Edge Agent services
# This file demonstrates how to integrate edge agents with the main deployment
# Reference: docker-compose.yml (include this via docker-compose -f)

services:
  # Control Plane API (orchestrates edge agents)
  control-plane-edge-api:
    image: paperclip/control-plane:latest
    container_name: code-server-control-plane-edge-api
    ports:
      - "8080:8080"
    environment:
      # Database
      DATABASE_URL: postgresql://appuser:apppass@postgres-db:5432/appdb
      
      # Redis
      REDIS_URL: redis://redis-cache:6379
      REDIS_SENTINEL_URL: redis-sentinel-1:26379,redis-sentinel-1:26380,redis-sentinel-1:26381
      
      # Edge Agent Configuration
      EDGE_AGENT_REGISTRY_ENABLED: "true"
      EDGE_AGENT_HEARTBEAT_TIMEOUT: "60"
      EDGE_AGENT_HEALTH_CHECK_INTERVAL: "10"
      
      # Security
      OAUTH2_CLIENT_ID: ${OAUTH2_CLIENT_ID}
      OAUTH2_CLIENT_SECRET: ${OAUTH2_CLIENT_SECRET}
    
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    
    volumes:
      - ./logs/control-plane:/var/log/control-plane
    
    networks:
      - paperclip-network

  # Edge Agent 1 (US West region)
  edge-agent-us-west-1:
    image: paperclip/edge-agent:latest
    container_name: code-server-edge-agent-us-west-1
    
    environment:
      # Agent Identity
      EDGE_AGENT_ID: edge-agent-us-west-1
      
      # Location & Capacity
      EDGE_LOCATION: us-west
      EDGE_CAPACITY: 8
      
      # Control Plane
      CONTROL_PLANE: http://control-plane-edge-api:8080
      
      # Heartbeat Configuration
      HEARTBEAT_INTERVAL: 30
      HEARTBEAT_TIMEOUT: 60
      REGISTRATION_RETRY_MAX: 3
      
      # Logging
      LOG_LEVEL: INFO
      LOG_DIR: /var/log/edge-agent
      
      # Security
      AGENT_TLS_ENABLED: "true"
      AGENT_TLS_CERT_PATH: /etc/edge-agent/certs/agent.crt
      AGENT_TLS_KEY_PATH: /etc/edge-agent/certs/agent.key
    
    depends_on:
      control-plane-edge-api:
        condition: service_healthy
    
    healthcheck:
      test: ["CMD", "bash", "-c", "curl -f http://localhost:8081/health || pgrep -f heartbeat"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    
    volumes:
      - ./logs/edge-agent-us-west-1:/var/log/edge-agent
      - ./certs/edge-agent:/etc/edge-agent/certs:ro
    
    networks:
      - paperclip-network
    
    restart: unless-stopped

  # Edge Agent 2 (US East region)
  edge-agent-us-east-1:
    image: paperclip/edge-agent:latest
    container_name: code-server-edge-agent-us-east-1
    
    environment:
      EDGE_AGENT_ID: edge-agent-us-east-1
      EDGE_LOCATION: us-east
      EDGE_CAPACITY: 8
      CONTROL_PLANE: http://control-plane-edge-api:8080
      HEARTBEAT_INTERVAL: 30
      HEARTBEAT_TIMEOUT: 60
      LOG_LEVEL: INFO
      LOG_DIR: /var/log/edge-agent
    
    depends_on:
      control-plane-edge-api:
        condition: service_healthy
    
    healthcheck:
      test: ["CMD", "bash", "-c", "curl -f http://localhost:8082/health || pgrep -f heartbeat"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    
    volumes:
      - ./logs/edge-agent-us-east-1:/var/log/edge-agent
      - ./certs/edge-agent:/etc/edge-agent/certs:ro
    
    networks:
      - paperclip-network
    
    restart: unless-stopped

  # Edge Agent 3 (EU Central region)
  edge-agent-eu-central-1:
    image: paperclip/edge-agent:latest
    container_name: code-server-edge-agent-eu-central-1
    
    environment:
      EDGE_AGENT_ID: edge-agent-eu-central-1
      EDGE_LOCATION: eu-central
      EDGE_CAPACITY: 8
      CONTROL_PLANE: http://control-plane-edge-api:8080
      HEARTBEAT_INTERVAL: 30
      HEARTBEAT_TIMEOUT: 60
      LOG_LEVEL: INFO
      LOG_DIR: /var/log/edge-agent
    
    depends_on:
      control-plane-edge-api:
        condition: service_healthy
    
    healthcheck:
      test: ["CMD", "bash", "-c", "curl -f http://localhost:8083/health || pgrep -f heartbeat"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    
    volumes:
      - ./logs/edge-agent-eu-central-1:/var/log/edge-agent
      - ./certs/edge-agent:/etc/edge-agent/certs:ro
    
    networks:
      - paperclip-network
    
    restart: unless-stopped

  # Edge Agent Health Monitor (centralized monitoring)
  edge-agent-health-monitor:
    image: paperclip/edge-agent-monitor:latest
    container_name: code-server-edge-agent-health-monitor
    
    environment:
      # Control Plane
      CONTROL_PLANE: http://control-plane-edge-api:8080
      
      # Health Check Configuration
      HEALTH_CHECK_INTERVAL: 10
      HEARTBEAT_TIMEOUT: 60
      
      # Logging
      LOG_LEVEL: INFO
      LOG_DIR: /var/log/health-monitor
      
      # Metrics
      PROMETHEUS_ENABLED: "true"
      PROMETHEUS_PORT: 9090
    
    depends_on:
      - control-plane-edge-api
      - edge-agent-us-west-1
      - edge-agent-us-east-1
      - edge-agent-eu-central-1
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
    
    volumes:
      - ./logs/health-monitor:/var/log/health-monitor
    
    networks:
      - paperclip-network
    
    restart: unless-stopped

networks:
  paperclip-network:
    driver: bridge

volumes:
  # These should match main docker-compose.yml
  postgres-data:
    driver: local
  redis-cache-data:
    driver: local
