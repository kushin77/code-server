  # ========================================================================
  # DATA STORES
  # ========================================================================

  postgres-init:
    image: alpine:3.20
    container_name: code-server-postgres-init
    user: "0:0"
    command:
      - sh
      - -lc
      - mkdir -p /var/lib/postgresql/data; owner="$$(stat -c '%u:%g' /var/lib/postgresql/data 2>/dev/null || true)"; [ "$$owner" = "999:999" ] || chown -R 999:999 /var/lib/postgresql/data
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: "no"
    networks:
      - services
      - database

  postgres:
    image: postgres:16-alpine@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
    container_name: code-server-postgres
    user: "999:999"  # @security P0 #969 - Run as non-root postgres user
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U ${DB_USER}"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    networks:
      - services
      - database
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4g
        reservations:
          cpus: "1.0"
          memory: 2g

  redis:
    image: redis:7-alpine@sha256:7aec734b2bb298a1d769fd8729f13b8514a41bf90fcdd1f38ec52267fbaa8ee6
    container_name: code-server-redis
    user: "999:999"  # @security P0 #969 - Run as non-root redis user
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - "--raw"
        - "incr"
        - "ping"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - services
    depends_on:
      redis-init:
        condition: service_completed_successfully
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4g
        reservations:
          cpus: "1.0"
          memory: 2g

  # ========================================================================
  # EVENT BUS & STREAMING
  # ========================================================================

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.1.6@sha256:e5b6aaecf38861d199b0d26d635b83da26dd6e6acf0684cd8b92f16b4f4b8733
    container_name: code-server-redpanda
    user: "101:101"  # @security P0 #969 - Run as non-root redpanda user
    command:
      - redpanda
      - start
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://redpanda:9092
      - --pandaproxy-addr=0.0.0.0:8082
      - --advertise-pandaproxy-addr=redpanda:8082
      - --schema-registry-addr=0.0.0.0:8081
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "${REDPANDA_PORT}:${REDPANDA_PORT}"      # Kafka external
      - "29092:29092"    # Kafka internal
      - "${REDPANDA_REST_PORT}:${REDPANDA_REST_PORT}"      # PandaProxy REST
      - "${REDPANDA_SCHEMA_PORT}:${REDPANDA_SCHEMA_PORT}"      # Schema Registry
      - "33145:33145"    # RPC
    volumes:
      - redpanda_data:/var/lib/redpanda/data
      - ./config:/redpanda-src:ro
    environment:
      - REDPANDA_BROKERS=redpanda:9092
      - TZ=UTC
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://redpanda:9644/v1/status/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - services
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8g
        reservations:
          cpus: "2.0"
          memory: 4g
    labels:
      io.elevatediq.component: "event-bus"
      io.elevatediq.tier: "infrastructure"

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v3.7.1@sha256:d5ec9a54339db74d8efa61b18576185903694bee1deb4c029befa492e41ac78f
    container_name: code-server-redpanda-console
    user: "101:101"  # @security P0 #969 - Run as non-root redpanda-console user
    ports:
      - "${MEMORY_ENGINE_PORT}:${MEMORY_ENGINE_PORT}"
    environment:
      - KAFKA_BROKERS=redpanda:9092
      - KAFKA_SCHEMAREGISTRY_ENABLED=true
      - KAFKA_SCHEMAREGISTRY_URLS=http://redpanda:${REDPANDA_SCHEMA_PORT}
      - CONSOLE_CONFIG_FILEPATH=/etc/redpanda/redpanda-console-config.yaml
      - SERVER_LISTENPORT=8080
    volumes:
      - ./config:/redpanda-console-src:ro
    depends_on:
      - redpanda
    healthcheck:
      test:
        - CMD
        - curl
        - "-f"
        - "http://redpanda-console:8080/overview"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - services
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
        reservations:
          cpus: "0.5"
          memory: 256m
    labels:
      io.elevatediq.component: "event-bus-ui"
      io.elevatediq.tier: "infrastructure"

  # ========================================================================
  # AI/ML SERVICES
  # ========================================================================

  ollama-init:
    image: alpine:3.20
    container_name: code-server-ollama-init
    user: "0:0"
    command:
      - sh
      - -lc
      - mkdir -p /home/ollama/.ollama; owner="$$(stat -c '%u:%g' /home/ollama/.ollama 2>/dev/null || true)"; [ "$$owner" = "11434:11434" ] || chown -R 11434:11434 /home/ollama/.ollama
    volumes:
      - ollama_models:/home/ollama/.ollama
    restart: "no"
    networks:
      - services

  ollama:
    image: ollama/ollama:0.1.16@sha256:3a3ec7ea8e006aea63ce13b7027069687ed34cc85bbd7bbebf1f565db587511a
    container_name: code-server-ollama
    user: "11434:11434"  # @security P0 #969 - Run as non-root ollama user
    profiles:
      - gpu  # @enhancement #3120 - GPU acceleration for NVIDIA-capable nodes
    volumes:
      - ollama_models:/home/ollama/.ollama
    environment:
      - HOME=/home/ollama
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_MODELS=/home/ollama/.ollama/models
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - ollama
        - --version
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - services
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: "8G"
        reservations:
          cpus: "2"
          memory: "4G"
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]  # @enhancement #3120 - Request all available NVIDIA GPUs

  edge-agent:
    build:
      context: .
      dockerfile: apps/edge-agent/Dockerfile
    container_name: code-server-edge-agent
    ports:
      - "${REPUTATION_ENGINE_PORT}:${REPUTATION_ENGINE_PORT}"
    environment:
      - AGENT_ID=${EDGE_AGENT_ID:-edge-agent-primary}
      - REDIS_URL=redis://redis:6379/1
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:9092
      - REPLICATION_TOPIC=edge.replication.events
      - LOG_LEVEL=INFO
    depends_on:
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - services
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://reputation-engine:${REPUTATION_ENGINE_PORT}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
        reservations:
          cpus: "0.2"
          memory: 256m
    profiles:
      - "infrastructure"
      - "all"

  # ── OpenTelemetry Collector ─────────────────────────────────────────────────
  # Receives OTLP traces/metrics/logs from all services; exports to Tempo, Prometheus, Loki
  # Issue #1532: Centralized Observability & SLOG — Distributed Tracing (OpenTelemetry)
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0@sha256:ef20ffeb9ae06d75f94bd031cde7713a1d1bcad20e5ebc0f7dc6c2ee52b8ae4a
    container_name: code-server-otel-collector
    user: "65534:65534"  # @security GOV-002 - run as non-root nobody user
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./config/monitoring/otel/collector-config.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "${OTEL_EXPORTER_OTLP_GRPC_PORT}:${OTEL_EXPORTER_OTLP_GRPC_PORT}"    # OTLP gRPC
      - "${OTEL_EXPORTER_OTLP_HTTP_PORT}:${OTEL_EXPORTER_OTLP_HTTP_PORT}"    # OTLP HTTP
      - "${PROMETHEUS_SELF_METRICS_PORT}:${PROMETHEUS_SELF_METRICS_PORT}"    # Prometheus metrics (self)
      - "13133:13133"  # Health check
    environment:
      - DEPLOYMENT_ENV=${DEPLOYMENT_ENV:-local}
    healthcheck:
      test:
        - CMD
        - /otelcol-contrib
        - --version
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - services
    depends_on:
      - loki
      - prometheus
      - tempo
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
        reservations:
          cpus: "0.1"
          memory: 128m
    profiles:
      - "observability"
      - "all"

  # ── Grafana Tempo ────────────────────────────────────────────────────────────
  # Distributed tracing backend — stores and queries traces via OTLP
  # Issue #1532: Centralized Observability & SLOG — Distributed Tracing
  tempo-init:
    image: alpine:3.20
    container_name: code-server-tempo-init
    user: "0:0"
    command:
      - sh
      - -lc
      - mkdir -p /var/tempo; owner="$$(stat -c '%u:%g' /var/tempo 2>/dev/null || true)"; [ "$$owner" = "10001:10001" ] || chown -R 10001:10001 /var/tempo
    volumes:
      - tempo_data:/var/tempo
    restart: "no"
    networks:
      - services
    profiles:
      - "observability"
      - "all"

  tempo:
    image: grafana/tempo:2.4.1@sha256:cf1ed1d5cc671c80d389f7c59cfa491a9e5b99d28a42fccb9d6cbbef0da378e4
    container_name: code-server-tempo
    user: "10001:10001"  # @security GOV-002 - run as non-root tempo user
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./config/monitoring/tempo/tempo-config.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "${TEMPO_HTTP_PORT}:${TEMPO_HTTP_PORT}"    # Tempo HTTP API
      - "${TEMPO_GRPC_PORT}:${TEMPO_GRPC_PORT}"    # Tempo gRPC API
    healthcheck:
      test:
        - CMD
        - wget
        - "--quiet"
        - "--tries=1"
        - "--spider"
        - "http://tempo:${TEMPO_HTTP_PORT}/ready"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - services
    depends_on:
      tempo-init:
        condition: service_completed_successfully
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
        reservations:
          cpus: "0.2"
          memory: 256m
    profiles:
      - "observability"
      - "all"

# ============================================================================
# NETWORKS & VOLUMES
# ============================================================================

networks:
  ingress:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-ingress
  services:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-services
  database:
    external: true
    name: database

volumes:
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  keepalived_config:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
  alertmanager_data:
    driver: local
  qdrant_data:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
  redpanda_data:
    driver: local
  ollama_models:
    driver: local
  tempo_data:
    driver: local
