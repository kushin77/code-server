# @file        config/model-registry.yaml
# @module      ai/models
# @description Model registry - metadata, capabilities, limits, health checks
# @owner       ai/security
# @status      production-ready
#
# Defines all AI models available through Prompt Gateway with their properties

models:
  # Llama 3 8B - Fast, general purpose
  llama3:8b:
    name: "Llama 3 8B"
    provider: "ollama"
    capabilities:
      - "code_generation"
      - "question_answering"
      - "summarization"
      - "general_purpose"
    
    limits:
      max_tokens_per_request: 4096
      max_tokens_per_day: 100000
      timeout_ms: 30000
    
    performance:
      avg_latency_ms: 500
      tokens_per_second: 20
      typical_cost_per_1k_tokens: 0.01  # Mock cost
    
    health_check:
      enabled: true
      interval_seconds: 30
      timeout_ms: 5000
      expected_response_time_ms: 2000
      failure_threshold: 3  # Failed checks before marking unhealthy
    
    fallback_chain: ["llama3:70b"]  # Fallback if this fails
    max_retry_attempts: 2
    
    tags:
      - "fast"
      - "production"
      - "lightweight"
  
  # Llama 3 70B - Powerful, slower
  llama3:70b:
    name: "Llama 3 70B"
    provider: "ollama"
    capabilities:
      - "code_generation"
      - "complex_reasoning"
      - "advanced_summarization"
      - "mathematical_reasoning"
    
    limits:
      max_tokens_per_request: 8192
      max_tokens_per_day: 500000
      timeout_ms: 60000
    
    performance:
      avg_latency_ms: 2000
      tokens_per_second: 10
      typical_cost_per_1k_tokens: 0.05
    
    health_check:
      enabled: true
      interval_seconds: 30
      timeout_ms: 10000
      expected_response_time_ms: 5000
      failure_threshold: 3
    
    fallback_chain: []  # Ultimate fallback, no further chain
    max_retry_attempts: 3
    
    tags:
      - "powerful"
      - "production"
      - "reasoning"
  
  # Code Llama 13B - Specialized for code
  codellama:13b:
    name: "Code Llama 13B"
    provider: "ollama"
    capabilities:
      - "code_generation"
      - "code_completion"
      - "code_review"
      - "bug_fixing"
      - "test_generation"
    
    limits:
      max_tokens_per_request: 4096
      max_tokens_per_day: 100000
      timeout_ms: 30000
    
    performance:
      avg_latency_ms: 800
      tokens_per_second: 15
      typical_cost_per_1k_tokens: 0.02
    
    health_check:
      enabled: true
      interval_seconds: 30
      timeout_ms: 5000
      expected_response_time_ms: 2000
      failure_threshold: 3
    
    fallback_chain: ["llama3:70b"]
    max_retry_attempts: 2
    
    tags:
      - "code"
      - "production"
      - "specialized"
  
  # Mistral 7B - Fast, capable
  mistral:7b:
    name: "Mistral 7B"
    provider: "ollama"
    capabilities:
      - "general_purpose"
      - "code_generation"
      - "question_answering"
      - "instruction_following"
    
    limits:
      max_tokens_per_request: 4096
      max_tokens_per_day: 100000
      timeout_ms: 25000
    
    performance:
      avg_latency_ms: 400
      tokens_per_second: 25
      typical_cost_per_1k_tokens: 0.01
    
    health_check:
      enabled: true
      interval_seconds: 30
      timeout_ms: 5000
      expected_response_time_ms: 1500
      failure_threshold: 3
    
    fallback_chain: ["llama3:8b"]
    max_retry_attempts: 2
    
    tags:
      - "fast"
      - "production"
      - "lightweight"

# Model groups for routing strategies
groups:
  # Fast models (< 1s average latency)
  fast:
    models: ["mistral:7b", "llama3:8b"]
    avg_latency_ms: 400
    use_case: "low-latency responses"
  
  # Balanced (medium cost/performance)
  balanced:
    models: ["llama3:8b", "codellama:13b"]
    avg_latency_ms: 700
    use_case: "general purpose"
  
  # Powerful (high capability, slower)
  powerful:
    models: ["llama3:70b"]
    avg_latency_ms: 2000
    use_case: "complex reasoning"
  
  # Code-specialized
  code:
    models: ["codellama:13b"]
    avg_latency_ms: 800
    use_case: "code generation"

# A/B Testing configuration (Phase 2)
ab_testing:
  enabled: false
  configurations: []
  
  # Example config (once feature complete):
  # - test_id: "llama_vs_mistral"
  #   control: "llama3:8b"
  #   variant: "mistral:7b"
  #   traffic_split_percent: 50
  #   success_threshold_percent: 10  # 10% better to auto-promote
  #   min_samples: 1000

# Fallback routing (Phase 2)
fallback:
  enabled: true
  default_chain:
    - "llama3:8b"
    - "mistral:7b"
    - "llama3:70b"
  
  retry_backoff_ms: 500
  max_total_retries: 3

# Model health check thresholds
health_check:
  global:
    unhealthy_after_failures: 3
    recovery_check_interval_seconds: 60
    mark_recovered_after_successes: 2

# Metrics collection (Prometheus)
metrics_collection:
  enabled: true
  models_to_track: ["llama3:8b", "llama3:70b", "codellama:13b", "mistral:7b"]
  latency_buckets_ms: [100, 500, 1000, 2000, 5000, 10000]
  error_rate_alert_threshold: 0.05  # Alert if > 5% error rate
