#!/bin/bash
# @file .github/workflows/gitops-drift-detection.yml (generated by script)
# @description P3-1531 Phase 3: GitOps continuous reconciliation workflow
# Runs daily drift detection, alerts on divergence, auto-creates issues

name: GitOps Drift Detection

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'docker-compose.yml'
      - 'Caddyfile'
      - 'terraform/**'
      - 'sync-slog-to-github.sh'
      - 'sync-slog-now.sh'
      - 'scripts/ci/validate-slog-issue-sync.sh'
      - 'scripts/ci/gitops-drift-detector.sh'
      - 'logs/**'
      - 'PRODUCTION_FIX_LOG.md'
      - '.github/workflows/gitops-drift-detection.yml'

jobs:
  drift-detection:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    
    steps:
      - uses: actions/checkout@a5ac7e51b41094c153705408e0e3a0dd2b15a8fd
        with:
          fetch-depth: 0
      
      - name: Run GitOps Drift Detection
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/ci/gitops-drift-detector.sh
          ./scripts/ci/gitops-drift-detector.sh --check --alert
      
      - name: Upload Drift Report
        if: always()
        uses: actions/upload-artifact@0b2256b2c1aaaf07d41658773d8e91fb221abb04
        with:
          name: drift-report
          path: artifacts/drift-report.json
          retention-days: 30

  validate-immutability:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@a5ac7e51b41094c153705408e0e3a0dd2b15a8fd
      
      - name: Check Docker Compose Idempotency
        run: |
          chmod +x scripts/ci/check-docker-compose-idempotency.sh
          ./scripts/ci/check-docker-compose-idempotency.sh --report
      
      - name: Validate Terraform Version Pins
        run: |
          chmod +x scripts/ci/validate-terraform-version-pins.sh
          ./scripts/ci/validate-terraform-version-pins.sh --check
      
      - name: Enforce Domain Variability
        run: |
          chmod +x scripts/ci/domain-variability-enforcer.sh
          ./scripts/ci/domain-variability-enforcer.sh --check

      - name: Validate Grouped SLOG Issue Sync
        run: |
          chmod +x scripts/ci/validate-slog-issue-sync.sh
          ./scripts/ci/validate-slog-issue-sync.sh
      
      - name: Upload Idempotency Report
        if: always()
        uses: actions/upload-artifact@0b2256b2c1aaaf07d41658773d8e91fb221abb04
        with:
          name: idempotency-reports
          path: artifacts/
          retention-days: 30