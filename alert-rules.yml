groups:
  - name: alerts
    interval: 30s
    rules:
      # Auth path observability
      - alert: OAuth2ProxyHighErrorRate
        expr: |
          sum(rate(oauth2_proxy_requests_total{status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(oauth2_proxy_requests_total[5m])), 1)
          > 0.05
        for: 5m
        annotations:
          summary: "oauth2-proxy is returning 5xx errors"
          description: "oauth2-proxy 5xx error rate is above 5% for 5 minutes. Check the IDE auth path and oauth2-proxy logs."
          runbook: "https://github.com/kushin77/code-server/issues/965"
        labels:
          severity: critical
          team: platform
          component: auth-path

      - alert: OAuth2ProxyUnauthorizedSpike
        expr: |
          sum(rate(oauth2_proxy_requests_total{status=~"401|403"}[5m])) > 5
        for: 2m
        annotations:
          summary: "oauth2-proxy unauthorized responses are spiking"
          description: "oauth2-proxy is returning a sustained spike of 401/403 responses, which can indicate CSRF or session cookie failures."
          runbook: "https://github.com/kushin77/code-server/issues/965"
        labels:
          severity: critical
          team: platform
          component: auth-path

      - alert: PortalAuthPathGatewayErrorRateHigh
        expr: |
          sum(rate(caddy_http_requests_total{status=~"5..", path=~".*/oauth2/.*"}[5m]))
          /
          clamp_min(sum(rate(caddy_http_requests_total{path=~".*/oauth2/.*"}[5m])), 1)
          > 0.05
        for: 5m
        annotations:
          summary: "Portal/auth gateway 5xx rate is elevated"
          description: "The OAuth portal/auth gateway is returning 5xx responses above 5% for 5 minutes. Appsmith or the proxy path may be unhealthy."
          runbook: "https://github.com/kushin77/code-server/issues/965"
        labels:
          severity: critical
          team: platform
          component: auth-path

      - alert: PortalAuthPathUnavailable
        expr: up{job="oauth2-proxy-portal"} == 0
        for: 2m
        annotations:
          summary: "Portal auth proxy is down"
          description: "oauth2-proxy-portal has not been reachable for 2 minutes. Portal login flow is unavailable."
          runbook: "https://github.com/kushin77/code-server/issues/965"
        labels:
          severity: critical
          team: platform
          component: auth-path

      - alert: SessionBrokerUnavailable
        expr: up{job="session-broker"} == 0
        for: 2m
        annotations:
          summary: "Session broker is down"
          description: "The session broker scrape target is unavailable, so IDE session routing may fail."
          runbook: "https://github.com/kushin77/code-server/issues/965"
        labels:
          severity: critical
          team: platform
          component: auth-path

      - alert: SessionBrokerLaunchDenialBurst
        expr: increase(session_broker_launch_denials_total_all[10m]) > 5
        for: 5m
        annotations:
          summary: "Session broker launch denials are bursting"
          description: "More than five launch denials were recorded in 10 minutes. Check auth load, quota settings, and container capacity."
          runbook: "https://github.com/kushin77/code-server/issues/965"
        labels:
          severity: critical
          team: platform
          component: auth-path

      - alert: OAuth2ProxyResponseLatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(oauth2_proxy_response_duration_seconds_bucket[5m]))
          ) > 1
        for: 10m
        annotations:
          summary: "oauth2-proxy p95 latency is above 1s"
          description: "The OAuth proxy is responding slowly, which increases auth-failure risk."
          runbook: "https://github.com/kushin77/code-server/issues/965"
        labels:
          severity: critical
          team: platform
          component: auth-path

      # Appsmith Container Health
      - alert: AppsmithContainerUnhealthy
        expr: up{job="appsmith"} == 0
        for: 2m
        annotations:
          summary: "Appsmith container is not healthy"
          description: "Appsmith healthcheck has been failing for 2 minutes. Portal access is degraded."
          runbook: "https://github.com/kushin77/code-server/issues/965"
        labels:
          severity: critical
          team: platform
          component: auth-path

      # Session Broker Error Rates
      - alert: SessionBrokerCreateErrorsHigh
        expr: |
          sum(rate(session_broker_create_errors_total[5m])) > 0.016
        for: 5m
        annotations:
          summary: "Session broker create errors elevated (>1 error/min)"
          description: "Session creation is failing at elevated rate. Check auth load and quota."
          runbook: "https://github.com/kushin77/code-server/issues/965"
        labels:
          severity: high
          team: platform
          component: auth-path

      - alert: SessionBrokerLookupErrorsHigh
        expr: |
          sum(rate(session_broker_lookup_errors_total[5m])) > 0.033
        for: 5m
        annotations:
          summary: "Session broker lookup errors elevated (>2 errors/min)"
          description: "Session lookups are failing, users may be unable to access existing sessions."
          runbook: "https://github.com/kushin77/code-server/issues/965"
        labels:
          severity: high
          team: platform
          component: auth-path

      # Redis Sentinel Health
      - alert: RedisActiveMasterSwitch
        expr: |
          changes(redis_master_repl_offset[5m]) < 0
        for: 30s
        annotations:
          summary: "Redis master failover detected"
          description: "Redis Sentinel has promoted a replica to master. Check replication status and verify session data."
          runbook: "https://github.com/kushin77/code-server/issues/965"
        labels:
          severity: warning
          team: platform
          component: auth-path

      - alert: RedisConnectedClientsDropped
        expr: |
          redis_connected_clients == 0
        for: 1m
        annotations:
          summary: "Redis has no connected clients"
          description: "Redis shows zero connected clients. Session store may be unavailable."
          runbook: "https://github.com/kushin77/code-server/issues/965"
        labels:
          severity: critical
          team: platform
          component: auth-path

      # Redis Sentinel Monitoring (#995)
      - alert: RedisSentinelMasterSwitch
        expr: changes(redis_sentinel_master_switch_total[5m]) > 0
        for: 1m
        annotations:
          summary: "Redis Sentinel performed master switch"
          description: "Redis Sentinel on {{ $labels.instance }} has triggered a master failover in the last 5 minutes"
          runbook: "https://github.com/kushin77/code-server/issues/995"
        labels:
          severity: warning
          team: platform
          component: data-store

      - alert: RedisSentinelQuorumLost
        expr: redis_sentinel_sentinels < 2
        for: 1m
        annotations:
          summary: "Redis Sentinel quorum lost"
          description: "Redis Sentinel quorum is insufficient. Current count: {{ $value }} (minimum: 2)"
          runbook: "https://github.com/kushin77/code-server/issues/995"
        labels:
          severity: critical
          team: platform
          component: data-store

      - alert: RedisReplicaLag
        expr: redis_connected_slaves == 0
        for: 2m
        annotations:
          summary: "Redis has no connected replicas"
          description: "Redis master on {{ $labels.instance }} has no connected slave replicas"
          runbook: "https://github.com/kushin77/code-server/issues/995"
        labels:
          severity: warning
          team: platform
          component: data-store

      - alert: RedisHighMemoryUsage
        expr: |
          (redis_memory_used_bytes / clamp_min(redis_memory_max_bytes, 1)) > 0.9
        for: 5m
        annotations:
          summary: "Redis memory usage is above 90%"
          description: "Redis on {{ $labels.instance }} is using {{ humanize $value }}% of max memory"
          runbook: "https://github.com/kushin77/code-server/issues/995"
        labels:
          severity: warning
          team: platform
          component: data-store

      # Caddy Upstream 5xx Spike
      - alert: CaddyUpstream5xxSpike
        expr: |
          sum(rate(caddy_http_requests_total{status=~"502|503|504"}[5m])) > 0.167
        for: 2m
        annotations:
          summary: "Caddy upstream errors spiking (>10 errors/min)"
          description: "Caddy is returning 502/503/504 errors indicating upstream failure. Check session-broker and appsmith health."
          runbook: "https://github.com/kushin77/code-server/issues/965"
        labels:
          severity: critical
          team: platform
          component: auth-path

      # P1: Database Failover Detected
      - alert: DatabaseFailoverDetected
        expr: pg_replication_lag_seconds > 60
        for: 1m
        annotations:
          summary: "PostgreSQL replication lag critical"
          description: "Replication lag {{ $value }}s - failover may be triggered"
        labels:
          severity: critical
          page: "true"

      # P1: Database Primary Down
      - alert: DatabasePrimaryDown
        expr: up{job="postgres"} == 0
        for: 30s
        annotations:
          summary: "PostgreSQL primary database unreachable"
          description: "Failed to connect to database primary - failover activated"
        labels:
          severity: critical
          page: "true"

      # P2: Latency Spike
      - alert: LatencySpike
        expr: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m])) > 0.2
        for: 5m
        annotations:
          summary: "High latency detected (p99 > 200ms)"
          description: "Latency spike detected - investigate slow queries"
        labels:
          severity: high
          page: "false"

      # P2: Error Rate High
      - alert: ErrorRateHigh
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.001
        for: 5m
        annotations:
          summary: "Error rate above threshold"
          description: "Error rate {{ $value }} - check application logs"
        labels:
          severity: high
          page: "false"

      # P2: Redis Memory Critical
      - alert: RedisMemoryCritical
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.9
        for: 5m
        annotations:
          summary: "Redis memory usage critical (>90%)"
          description: "Redis approaching memory limit - eviction policy active"
        labels:
          severity: high
          page: "false"

      # P3: Certificate Expiry
      - alert: CertificateNearExpiry
        expr: ssl_certificate_not_after_seconds - time() < 604800
        for: 1h
        annotations:
          summary: "SSL certificate expires in < 7 days"
          description: "Certificate {{ $labels.certificate }} expires soon"
        labels:
          severity: medium
          page: "false"

      # P3: Disk Space Low
      - alert: DiskSpaceLow
        expr: |
          node_filesystem_avail_bytes{fstype!~"tmpfs|fuse.lxcfs|squashfs|vfat",mountpoint="/"}
          /
          node_filesystem_size_bytes{fstype!~"tmpfs|fuse.lxcfs|squashfs|vfat",mountpoint="/"}
          < 0.1
        for: 10m
        annotations:
          summary: "Disk space running low (<10%)"
          description: "Available disk space: {{ $value }}%"
        labels:
          severity: medium
          page: "false"

  - name: slo_service
    interval: 5m
    rules:
      - record: slo:availability:ratio_5m:class_a
        expr: |
          avg by (job) (
            avg_over_time(up{job="caddy"}[5m])
          )

      - record: slo:availability:ratio_1h:class_a
        expr: |
          avg by (job) (
            avg_over_time(up{job="caddy"}[1h])
          )

      - record: slo:availability:ratio_6h:class_a
        expr: |
          avg by (job) (
            avg_over_time(up{job="caddy"}[6h])
          )

      - record: slo:availability:ratio_30d:class_a
        expr: |
          avg by (job) (
            avg_over_time(up{job="caddy"}[30d])
          )

      - record: slo:availability:ratio_5m:class_b
        expr: |
          avg by (job) (
            avg_over_time(up{job=~"code-server|oauth2-proxy|postgres|redis|session-broker|token-microservice"}[5m])
          )

      - record: slo:availability:ratio_1h:class_b
        expr: |
          avg by (job) (
            avg_over_time(up{job=~"code-server|oauth2-proxy|postgres|redis|session-broker|token-microservice"}[1h])
          )

      - record: slo:availability:ratio_6h:class_b
        expr: |
          avg by (job) (
            avg_over_time(up{job=~"code-server|oauth2-proxy|postgres|redis|session-broker|token-microservice"}[6h])
          )

      - record: slo:availability:ratio_30d:class_b
        expr: |
          avg by (job) (
            avg_over_time(up{job=~"code-server|oauth2-proxy|postgres|redis|session-broker|token-microservice"}[30d])
          )

      - record: slo:http_request_latency:p99_5m
        expr: |
          histogram_quantile(
            0.99,
            sum by (job, le) (
              rate(http_request_duration_seconds_bucket{job=~"code-server|oauth2-proxy|session-broker|token-microservice"}[5m])
            )
          )

      - record: slo:http_request_latency:p99_1h
        expr: |
          histogram_quantile(
            0.99,
            sum by (job, le) (
              rate(http_request_duration_seconds_bucket{job=~"code-server|oauth2-proxy|session-broker|token-microservice"}[1h])
            )
          )

      - record: slo:error_budget:remaining:class_a
        expr: |
          clamp_min(1 - ((1 - slo:availability:ratio_30d:class_a) / 0.0005), 0)

      - record: slo:error_budget:remaining:class_b
        expr: |
          clamp_min(1 - ((1 - slo:availability:ratio_30d:class_b) / 0.001), 0)

      - alert: SLOAvailabilityBurnRateWarningClassA
        expr: |
          ((1 - slo:availability:ratio_5m:class_a) / 0.0005 > 6)
          and
          ((1 - slo:availability:ratio_1h:class_a) / 0.0005 > 3)
        for: 5m
        labels:
          severity: warning
          slo: availability
          class: a
        annotations:
          summary: "Class A availability budget is burning quickly"
          description: "Caddy is burning its 99.95% availability budget faster than policy allows."

      - alert: SLOAvailabilityBurnRateCriticalClassA
        expr: |
          ((1 - slo:availability:ratio_5m:class_a) / 0.0005 > 14.4)
          and
          ((1 - slo:availability:ratio_1h:class_a) / 0.0005 > 6)
        for: 2m
        labels:
          severity: critical
          slo: availability
          class: a
        annotations:
          summary: "Class A availability burn rate is critical"
          description: "Caddy is consuming its monthly error budget too quickly and should page on-call."

      - alert: SLOAvailabilityBurnRateWarningClassB
        expr: |
          ((1 - slo:availability:ratio_5m:class_b) / 0.001 > 6)
          and
          ((1 - slo:availability:ratio_1h:class_b) / 0.001 > 3)
        for: 5m
        labels:
          severity: warning
          slo: availability
          class: b
        annotations:
          summary: "Class B availability budget is burning quickly"
          description: "A core production service is burning its 99.9% availability budget faster than policy allows."

      - alert: SLOAvailabilityBurnRateCriticalClassB
        expr: |
          ((1 - slo:availability:ratio_5m:class_b) / 0.001 > 14.4)
          and
          ((1 - slo:availability:ratio_1h:class_b) / 0.001 > 6)
        for: 2m
        labels:
          severity: critical
          slo: availability
          class: b
        annotations:
          summary: "Class B availability burn rate is critical"
          description: "A core production service is consuming its monthly error budget too quickly."

      - alert: SLOHttpP99LatencyWarning
        expr: slo:http_request_latency:p99_5m > 0.8
        for: 10m
        labels:
          severity: warning
          slo: latency
        annotations:
          summary: "HTTP request P99 latency exceeds 800ms"
          description: "The request path is outside the latency target defined in docs/SLO.md."

  # ── #374: Missing operational alert gaps ─────────────────────────────────
  - name: backup
    interval: 5m
    rules:
      # Gap 1a: Backup failure detection (25h silence = missed backup)
      - alert: BackupFailed
        expr: time() - backup_last_success_timestamp_seconds > 90000
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Backup has not completed in 25 hours"
          description: "Last successful backup was {{ $value | humanizeDuration }} ago. Data loss risk increasing."
          runbook: "docs/runbooks/backup-failure.md"

      # Gap 1b: Backup storage headroom
      - alert: BackupStorageLow
        expr: backup_storage_used_bytes / backup_storage_total_bytes > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Backup storage > 85% full — {{ $value | humanizePercentage }} used"

  - name: tls
    interval: 5m
    rules:
      # Gap 2a: SSL cert 30-day warning via Blackbox probe
      - alert: SSLCertExpiryWarning
        expr: (probe_ssl_earliest_cert_expiry{job="ssl-check"} - time()) / 86400 < 30
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "SSL certificate expires in {{ $value | humanize }} days"
          description: "Certificate for {{ $labels.instance }} expires soon. Check Caddy renewal logs."

      # Gap 2b: SSL cert 7-day critical
      - alert: SSLCertExpiryCritical
        expr: (probe_ssl_earliest_cert_expiry{job="ssl-check"} - time()) / 86400 < 7
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "CRITICAL: SSL certificate expires in {{ $value | humanize }} days"
          description: "Immediate action required — Caddy auto-renewal may be broken."

  - name: containers
    interval: 30s
    rules:
      # Gap 3a: Container restart loop (2+ restarts in 10 minutes)
      - alert: ContainerRestartLoop
        expr: increase(container_start_time_seconds{name!=""}[10m]) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} restarted {{ $value }} times in 10m"
          description: "Possible crash loop. Check: docker logs {{ $labels.name }}"

      # Gap 3b: Container crash loop (5+ restarts in 10 minutes)
      - alert: ContainerCrashLoop
        expr: increase(container_start_time_seconds{name!=""}[10m]) > 5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "CRITICAL: Container {{ $labels.name }} is crash-looping ({{ $value }} restarts in 10m)"
          description: "Service is non-functional. Check: docker logs {{ $labels.name }} --tail=100"

  - name: replication
    interval: 30s
    rules:
      # Gap 4a: Replication lag warning
      - alert: PostgreSQLReplicationLagWarning
        expr: pg_replication_lag_seconds > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL replication lag is {{ $value }}s (threshold: 30s)"

      # Gap 4b: Replication lag critical
      - alert: PostgreSQLReplicationLagCritical
        expr: pg_replication_lag_seconds > 120
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "CRITICAL: PostgreSQL replication lag {{ $value }}s — data loss risk if primary fails"
          runbook: "docs/runbooks/PHASE-8-AVAILABILITY-RUNBOOK.md"

      # Gap 4c: Replication completely broken
      - alert: PostgreSQLReplicationBroken
        expr: pg_replication_is_replica == 0 and on() pg_up{instance="replica.prod.internal:9187"} == 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "CRITICAL: PostgreSQL replication is completely broken"
          description: "Replica is no longer replicating from primary. Data may be diverging."
          runbook: "docs/runbooks/PHASE-8-AVAILABILITY-RUNBOOK.md"

  # ── #1011: Matrix Collaboration Hub Observability ──────────────────────────
  - name: matrix-synapse
    interval: 30s
    rules:
      # Synapse homeserver is down
      - alert: SynapseDown
        expr: up{job="synapse"} == 0
        for: 2m
        labels:
          severity: critical
          team: platform
          component: matrix-core
        annotations:
          summary: "Synapse homeserver is down"
          description: "Matrix homeserver at {{ $labels.instance }} is not responding to health checks."
          runbook: "docs/runbooks/matrix-synapse-recovery.md"

      # High response latency on homeserver
      - alert: SynapseHighLatency
        expr: synapse_http_requests_duration_seconds{quantile="0.99"} > 0.5
        for: 5m
        labels:
          severity: warning
          team: platform
          component: matrix-core
        annotations:
          summary: "Synapse p99 latency exceeds 500ms ({{ $value | humanizeDuration }})"
          description: "Matrix operations are slow. Check database performance and replication lag."

      # Database connection pool exhaustion
      - alert: SynapseDatabaseConnectionPoolLow
        expr: (synapse_database_available_connections / clamp_min(synapse_database_pool_size, 1)) < 0.2
        for: 5m
        labels:
          severity: warning
          team: platform
          component: matrix-core
        annotations:
          summary: "Synapse database connections: {{ $value | humanizePercentage }} available"
          description: "Database connection pool is running low. Check for slow queries or leaks."

      # Federation queue backlog building up
      - alert: SynapseFederationQueueBacklog
        expr: increase(synapse_federation_queue_size{direction="outbound"}[5m]) > 0
        for: 10m
        labels:
          severity: warning
          team: platform
          component: matrix-federation
        annotations:
          summary: "Synapse federation queue backlog growing ({{ $value }} events backed up)"
          description: "Outbound federation is falling behind. May indicate network issues or slow remote homeservers."

  - name: matrix-bridges
    interval: 30s
    rules:
      # Bridge connectivity down
      - alert: MatrixBridgeDown
        expr: up{job=~"slack-bridge|teams-bridge|google-chat-bridge"} == 0
        for: 2m
        labels:
          severity: critical
          team: platform
          component: matrix-bridges
        annotations:
          summary: "Matrix bridge {{ $labels.job }} is down"
          description: "Bridge to {{ $labels.job }} is not responding. Users cannot send messages to external systems."
          runbook: "docs/runbooks/matrix-bridge-recovery.md"

      # Bridge message backlog (unable to deliver messages)
      - alert: MatrixBridgeMessageQueueBacklog
        expr: matrix_bridge_queue_depth{job=~"slack-bridge|teams-bridge|google-chat-bridge"} > 100
        for: 5m
        labels:
          severity: warning
          team: platform
          component: matrix-bridges
        annotations:
          summary: "Bridge {{ $labels.job }} has {{ $value }} messages queued"
          description: "Bridge message delivery is slow. Check bridge logs and destination system connectivity."

      # Bridge sync latency
      - alert: MatrixBridgeSyncLatencyHigh
        expr: matrix_bridge_sync_duration_seconds{quantile="0.95"} > 10
        for: 5m
        labels:
          severity: warning
          team: platform
          component: matrix-bridges
        annotations:
          summary: "Bridge {{ $labels.job }} sync takes {{ $value | humanizeDuration }}"
          description: "Bridge is slow to sync messages. May indicate destination system latency."

  - name: matrix-presence
    interval: 15s
    rules:
      # Presence sidecar down
      - alert: PresenceSidecarDown
        expr: up{job="presence-sidecar"} == 0
        for: 1m
        labels:
          severity: critical
          team: platform
          component: matrix-presence
        annotations:
          summary: "Presence sidecar is down"
          description: "Real-time collaboration presence tracking is offline. Users cannot see each other's cursors/edits."
          runbook: "docs/runbooks/matrix-presence-recovery.md"

      # Presence update latency too high
      - alert: PresenceUpdateLatencyHigh
        expr: presence_update_latency{quantile="0.50"} > 500
        for: 5m
        labels:
          severity: warning
          team: platform
          component: matrix-presence
        annotations:
          summary: "Presence update latency is {{ $value | humanizeDuration }} (p50)"
          description: "Real-time collaboration updates are slow. Users may see stale presence info."

      # Presence sync falling behind
      - alert: PresenceSyncFalling
        expr: increase(presence_sync_errors_total[5m]) > 10
        for: 2m
        labels:
          severity: warning
          team: platform
          component: matrix-presence
        annotations:
          summary: "Presence sync errors: {{ $value }} in last 5m"
          description: "Presence sidecar is failing to keep up with sync. May indicate high load or network issues."

  - name: disk
    interval: 60s
    rules:
      # Gap 5a: Disk usage warning (node_exporter metrics, both hosts)
      - alert: DiskSpaceWarning
        expr: |
          (node_filesystem_size_bytes{mountpoint="/"} - node_filesystem_free_bytes{mountpoint="/"})
          / node_filesystem_size_bytes{mountpoint="/"} > 0.80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk usage > 80% on {{ $labels.instance }}: {{ $value | humanizePercentage }}"
          description: "Run: df -h / && du -sh /var/lib/docker && du -sh /opt/prometheus-data"

      # Gap 5b: Disk usage critical
      - alert: DiskSpaceCritical
        expr: |
          (node_filesystem_size_bytes{mountpoint="/"} - node_filesystem_free_bytes{mountpoint="/"})
          / node_filesystem_size_bytes{mountpoint="/"} > 0.93
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "CRITICAL: Disk {{ $value | humanizePercentage }} full on {{ $labels.instance }}"
          description: "Immediate action: docker system prune -af OR extend volume. Data writes may fail."

  - name: ollama
    interval: 60s
    rules:
      # Gap 6a: Ollama model server down
      - alert: OllamaDown
        expr: up{job="ollama"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Ollama model server is down"
          description: "AI features in code-server will be degraded. Check: docker logs ollama"

      # Gap 6b: GPU memory near capacity
      - alert: OllamaGPUMemoryHigh
        expr: nvidia_smi_memory_used_bytes / nvidia_smi_memory_total_bytes > 0.95
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "GPU memory {{ $value | humanizePercentage }} used — Ollama may OOM soon"
          description: "Run: nvidia-smi to inspect GPU state. Consider unloading unused models."

  - name: jwt-auth
    interval: 30s
    rules:
      # Phase 2 — JWT service-to-service authentication

      # Validation error rate elevated
      - alert: JWTValidationErrorRateHigh
        expr: >
          sum(rate(jwt_validation_errors_total[5m])) /
          (sum(rate(jwt_validations_total[5m])) + 0.001) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "JWT validation error rate > 5% over last 5 minutes"
          description: >
            Error rate is {{ $value | humanizePercentage }}.
            Check service logs for expired tokens, signature failures, or JWKS fetch errors.
            Run: docker logs backend | grep 'jwt'

      # Validation error rate critical
      - alert: JWTValidationErrorRateCritical
        expr: >
          sum(rate(jwt_validation_errors_total[5m])) /
          (sum(rate(jwt_validations_total[5m])) + 0.001) > 0.20
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "JWT validation error rate > 20% — service-to-service auth degraded"
          description: >
            Error rate is {{ $value | humanizePercentage }}.
            Possible causes: OIDC issuer unreachable, JWKS key rotation mismatch, clock skew.
            Immediate check: curl http://oauth2-oidc-issuer:4182/.well-known/jwks.json

      # JWKS fetch failures
      - alert: JWTJwksFetchErrors
        expr: sum(rate(jwt_jwks_fetch_errors_total[5m])) > 0
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "JWKS endpoint fetch errors detected"
          description: >
            JWKS fetch is failing — JWT validators cannot refresh public keys.
            Check OIDC issuer health: curl http://oauth2-oidc-issuer:4182/.well-known/openid-configuration
            If issuer is down, token validation will fail after JWKS cache TTL expires (1 hour).

      # JWKS cache hit rate low
      - alert: JWTJwksCacheHitRateLow
        expr: >
          sum(rate(jwt_jwks_cache_hits_total[10m])) /
          (sum(rate(jwt_jwks_cache_hits_total[10m])) + sum(rate(jwt_jwks_cache_misses_total[10m])) + 0.001)
          < 0.70
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "JWKS cache hit rate below 70% — excessive OIDC issuer load"
          description: >
            Cache hit rate is {{ $value | humanizePercentage }}.
            This may indicate Redis connectivity issues or excessive cache invalidation.
            Check Redis health and jwt-redis-cache configuration.

      # Token TTL low — imminent forced refresh
      - alert: JWTTokenTTLLow
        expr: jwt_token_ttl_seconds < 120
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Service JWT token TTL below 2 minutes — refresh should already be in progress"
          description: >
            Remaining TTL is {{ $value }}s. The token client should proactively refresh at 5-minute mark.
            If this persists, token refresh is failing. Check: docker logs backend | grep 'token refresh'

      # Token acquisition errors
      - alert: JWTTokenAcquisitionErrors
        expr: sum(rate(jwt_token_errors_total[5m])) > 0
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "JWT token acquisition errors from OIDC issuer"
          description: >
            Error rate: {{ $value }} req/s.
            Services cannot acquire bearer tokens for outbound calls.
            Check OIDC issuer credentials and service account configuration.

      # High validation latency
      - alert: JWTValidationLatencyHigh
        expr: >
          histogram_quantile(0.95,
            sum(rate(jwt_validator_duration_ms_bucket[5m])) by (le)
          ) > 500
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "JWT validation p95 latency > 500ms"
          description: >
            p95 validation latency is {{ $value }}ms.
            High latency may indicate JWKS cache misses causing network round-trips to the OIDC issuer.
            Check JWKS cache hit rate and Redis connectivity.

