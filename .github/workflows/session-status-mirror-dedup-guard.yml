name: Session Status Mirror Dedup Guard

on:
  pull_request:
    paths:
      - "docs/status/**"
      - "docs/operations/session-history/historical/2026/**"
      - "scripts/ci/check-session-status-mirror-dedup.sh"
      - ".github/workflows/session-status-mirror-dedup-guard.yml"
  push:
    branches: [main]
    paths:
      - "docs/status/**"
      - "docs/operations/session-history/historical/2026/**"
      - "scripts/ci/check-session-status-mirror-dedup.sh"
      - ".github/workflows/session-status-mirror-dedup-guard.yml"

permissions:
  contents: read

jobs:
  validate-session-status-dedup:
    name: Validate session status mirror dedup policy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate mirror dedup policy
        run: bash scripts/ci/check-session-status-mirror-dedup.sh
