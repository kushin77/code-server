# @file docker-compose.yml
# @module infrastructure
# @description Production-grade Docker Compose for ElevatedIQ DevOS stack
# @governance GOV-002 - All services must have health checks and logging

# ============================================================================
# INIT CONTAINER PATTERN EXPLANATION
# ============================================================================
# This compose file uses init containers for one-time storage setup:
#
# Purpose: Initialize volumes with correct ownership and permissions
# Design:
#   1. Init container runs with root to set UID/GID ownership
#   2. Creates/initializes directories for the main service
#   3. Exits after setup (restart: "no")
#   4. Main service depends_on init with: service_completed_successfully
#   5. Main service runs as non-root with permissions already prepared
#
# Security Benefit: All production services run as non-root users
# Examples:
#   - grafana-init → sets /var/lib/grafana to grafana user (472:472)
#   - redis-init → sets /data to redis user (999:999)
#   - postgres-init → sets /var/lib/postgresql/data to postgres user (999:999)
#   - qdrant-init → sets /qdrant/storage to qdrant user (1000:1000)
#   - tempo-init → sets /var/tempo to tempo user (10001:10001)
#   - ollama-init → sets /home/ollama/.ollama to ollama user (11434:11434)
#
# Note: Init containers don't appear in "docker ps" after completion
# They exit with status 0 and are invisible once their task completes
# ============================================================================

services:
  # ========================================================================
  # INITIALIZATION CONTAINERS (One-time setup, then exit)
  # ========================================================================

  grafana-init:
    image: alpine:3.20
    container_name: code-server-grafana-init
    user: "0:0"
    command:
      - sh
      - -lc
      - mkdir -p /var/lib/grafana; owner="$$(stat -c '%u:%g' /var/lib/grafana 2>/dev/null || true)"; [ "$$owner" = "472:472" ] || chown -R 472:472 /var/lib/grafana
    volumes:
      - grafana_data:/var/lib/grafana
    restart: "no"
    networks:
      - services

  redis-init:
    image: alpine:3.20
    container_name: code-server-redis-init
    user: "0:0"
    command:
      - sh
      - -lc
      - mkdir -p /data; owner="$$(stat -c '%u:%g' /data 2>/dev/null || true)"; [ "$$owner" = "999:999" ] || chown -R 999:999 /data
    volumes:
      - redis_data:/data
    restart: "no"
    networks:
      - services

  redpanda-init:
    image: alpine:3.20
    container_name: code-server-redpanda-init
    user: "0:0"
    command:
      - sh
      - -lc
      - mkdir -p /var/lib/redpanda/data; owner="$$(stat -c '%u:%g' /var/lib/redpanda/data 2>/dev/null || true)"; [ "$$owner" = "101:101" ] || chown -R 101:101 /var/lib/redpanda/data
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    restart: "no"
    networks:
      - services

  prometheus-init:
    image: alpine:3.20
    container_name: code-server-prometheus-init
    user: "0:0"
    command:
      - sh
      - -lc
      - mkdir -p /prometheus; owner="$$(stat -c '%u:%g' /prometheus 2>/dev/null || true)"; [ "$$owner" = "65534:65534" ] || chown -R 65534:65534 /prometheus
    volumes:
      - prometheus_data:/prometheus
    restart: "no"
    networks:
      - services

  loki-init:
    image: alpine:3.20
    container_name: code-server-loki-init
    user: "0:0"
    command:
      - sh
      - -lc
      - mkdir -p /loki; owner="$$(stat -c '%u:%g' /loki 2>/dev/null || true)"; [ "$$owner" = "10001:10001" ] || chown -R 10001:10001 /loki
    volumes:
      - loki_data:/loki
    restart: "no"
    networks:
      - services

  alertmanager-init:
    image: alpine:3.20
    container_name: code-server-alertmanager-init
    user: "0:0"
    command:
      - sh
      - -lc
      - mkdir -p /alertmanager; owner="$$(stat -c '%u:%g' /alertmanager 2>/dev/null || true)"; [ "$$owner" = "65534:65534" ] || chown -R 65534:65534 /alertmanager
    volumes:
      - alertmanager_data:/alertmanager
    restart: "no"
    networks:
      - services

  caddy-init:
    image: alpine:3.20
    container_name: code-server-caddy-init
    user: "0:0"
    command:
      - sh
      - -lc
      - mkdir -p /data /config; chown -R 101:101 /data /config
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    restart: "no"
    networks:
      - services

  opa:
    image: openpolicyagent/opa:0.58.0@sha256:63186b7f0d95e51cf4c7ee38cae6fd2cf9168020abd09d48104bd87c99f863fe
    container_name: code-server-opa
    user: "101:101"  # @security P0 #969 - Run as non-root openpolicyagent user
    command: run --server --log-level=info --set decision_logs.console=true
    ports:
      - "18181:8181"
    volumes:
      - ./policies:/policies:ro
      - ./config:/opa-src:ro
    environment:
      - OPA_ADDR=0.0.0.0:8181
      - LOG_LEVEL=info
    healthcheck:
      test:
          - CMD
          - /opa
          - version
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - services
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
        reservations:
          cpus: "0.25"
          memory: 256m
    labels:
      io.elevatediq.component: "policy-engine"
      io.elevatediq.tier: "infrastructure"

  # ========================================================================
  # IDENTITY & AUTHENTICATION
  # ========================================================================

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.5.1@sha256:e797b3934eb8d7cb2756b67e59be2ef29c18c2b45da763f540ece66d843cec85
    container_name: code-server-oauth2-proxy
    user: "65534:65534"  # @security P0 #969 - Run as non-root nobody user
    command:
      - --config=/etc/oauth2-proxy/oauth2-proxy.cfg
    ports:
      - "${OAUTH2_PROXY_PORT}:${OAUTH2_PROXY_PORT}"
    volumes:
      - ./config/oauth2-proxy/oauth2-proxy.cfg:/etc/oauth2-proxy/oauth2-proxy.cfg:ro
    environment:
      - OAUTH2_PROXY_CLIENT_ID=${OAUTH2_CLIENT_ID}
      - OAUTH2_PROXY_CLIENT_SECRET=${OAUTH2_CLIENT_SECRET}
      - OAUTH2_PROXY_COOKIE_SECRET=${OAUTH2_COOKIE_SECRET:?OAUTH2_COOKIE_SECRET must be set}
      - OAUTH2_PROXY_UPSTREAMS=http://code-server-ide:8080/
    healthcheck:
      test:
        - CMD
        - /bin/oauth2-proxy
        - --version
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - services
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
        reservations:
          cpus: "0.25"
          memory: 128m

  # ========================================================================
  # REVERSE PROXY & GATEWAY
  # ========================================================================

  caddy:
    image: caddy:2.7.4@sha256:505de4e957da923672a8c79f16581e9b717a2479a8d5ddb909ab2d1b351f2ba4
    container_name: code-server-caddy
    user: "101:101"  # Run as caddy user, init container sets permissions
    depends_on:
      caddy-init:
        condition: service_completed_successfully
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - APEX_DOMAIN=${APEX_DOMAIN}
      - TLS_EMAIL=${TLS_EMAIL}
      - LOG_LEVEL=${LOG_LEVEL}
    healthcheck:
      test:
        - CMD
        - caddy
        - version
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - services
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
        reservations:
          cpus: "0.5"
          memory: 256m
    labels:
      io.elevatediq.component: "gateway"
      io.elevatediq.tier: "infrastructure"

  # ========================================================================
  # KEEPALIVED - VRRP HIGH AVAILABILITY
  # ========================================================================

  keepalived-init:
    image: alpine:3.20
    container_name: code-server-keepalived-init
    user: "0:0"
    command:
      - sh
      - -lc
      - |
        mkdir -p /etc/keepalived
        # Generate keepalived config based on HOST_ROLE environment variable
        if [ "$$HOST_ROLE" = "primary" ]; then
          state="MASTER"
          priority="100"
        else
          state="BACKUP"
          priority="90"
        fi
        cat > /etc/keepalived/keepalived.conf << EOF
        global_defs {
          router_id CODE_SERVER_HA
          script_user root
          enable_script_security
        }
        vrrp_script check_caddy {
          script "/usr/local/bin/check-caddy-health.sh"
          interval 3
          fall 3
          rise 2
          weight -20
        }
        vrrp_instance VI_1 {
          state $$state
          interface eth0
          virtual_router_id 51
          priority $$priority
          advert_int 1
          authentication {
            auth_type PASS
            auth_pass CODE_SERVER_HA_2026
          }
          virtual_ipaddress {
            192.168.168.30/24
          }
          track_script {
            check_caddy
          }
          notify_master "/usr/local/bin/notify-vrrp.sh master"
          notify_backup "/usr/local/bin/notify-vrrp.sh backup"
        }
        EOF
        chown -R root:root /etc/keepalived
        chmod 600 /etc/keepalived/keepalived.conf
    volumes:
      - keepalived_config:/etc/keepalived
    environment:
      - HOST_ROLE=${HOST_ROLE:-primary}
    restart: "no"
    networks:
      - services

  keepalived:
    image: keepalived:2.2.7
    container_name: code-server-keepalived
    user: "0:0"
    depends_on:
      keepalived-init:
        condition: service_completed_successfully
      caddy:
        condition: service_started
    cap_add:
      - NET_ADMIN
      - NET_BROADCAST
      - NET_RAW
      - SYS_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.ip_nonlocal_bind=1
      - net.ipv6.conf.all.forwarding=1
    network_mode: "host"
    volumes:
      - keepalived_config:/etc/keepalived:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./scripts/ha/check-caddy-health.sh:/usr/local/bin/check-caddy-health.sh:ro
      - ./scripts/ha/notify-vrrp.sh:/usr/local/bin/notify-vrrp.sh:ro
    environment:
      - HOST_ROLE=${HOST_ROLE:-primary}
      - KEEPALIVED_CMD_LINE_ARGUMENTS=-l -D
    healthcheck:
      test:
        - CMD
        - sh
        - -c
        - "ps aux | grep -v grep | grep keepalived || exit 1"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      io.elevatediq.component: "ha-vrrp"
      io.elevatediq.tier: "infrastructure"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
        reservations:
          cpus: "0.25"
          memory: 128m

  # ========================================================================
  # OBSERVABILITY
  # ========================================================================

  prometheus:
    image: prom/prometheus:v2.48.0@sha256:b440bc0e8aa5bab44a782952c09516b6a50f9d7b2325c1ffafac7bc833298e2e
    container_name: code-server-prometheus
    user: "65534:65534"  # @security P0 #969 - Run as non-root nobody user
    command:
      - "--config.file=/prometheus-config/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-remote-write-receiver"
    ports:
      - "${PROMETHEUS_PORT}:${PROMETHEUS_PORT}"
    volumes:
      - ./config:/prometheus-config:ro
      - ./monitoring/alerts:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    environment:
      - TZ=UTC
    healthcheck:
      test:
        - CMD-SHELL
        - "(prometheus --version >/dev/null && echo OK || exit 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - services
    depends_on:
      prometheus-init:
        condition: service_completed_successfully
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
        reservations:
          cpus: "0.5"
          memory: 512m

  grafana:
    image: grafana/grafana:10.2.0@sha256:1ee0c54286b8ca09a3dd1419ff8653e7780a148a006ac088544203bb0affe550
    container_name: code-server-grafana
    user: "472:472"  # @security P0 #969 - Run as non-root grafana user
    ports:
      - "${GRAFANA_PORT}:${GRAFANA_PORT}"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    healthcheck:
      test:
        - CMD
        - curl
        - "-f"
        - "http://grafana:${GRAFANA_PORT}/api/health"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - services
    depends_on:
      - prometheus
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
        reservations:
          cpus: "0.5"
          memory: 256m

  loki:
    image: grafana/loki:2.9.4@sha256:f379a20ce9dd815884ed6446aad8819b81a8ba4d36b548ca14be8cecbc6cbca0
    container_name: code-server-loki
    user: "10001:10001"  # @security P0 #969 - Run as non-root loki user
    ports:
      - "${LOKI_PORT}:${LOKI_PORT}"
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./config/monitoring/loki:/etc/loki:ro
      - loki_data:/loki
    environment:
      - LOG_LEVEL=info
    healthcheck:
      test:
        - CMD-SHELL
        - "(loki --version >/dev/null && echo OK || exit 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - services
    depends_on:
      loki-init:
        condition: service_completed_successfully
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
        reservations:
          cpus: "0.5"
          memory: 256m

  alertmanager:
    image: prom/alertmanager:v0.27.0@sha256:e13b6ed5cb929eeaee733479dce55e10eb3bc2e9c4586c705a4e8da41e5eacf5
    container_name: code-server-alertmanager
    user: "65534:65534"  # @security P0 #969 - Run as non-root nobody user
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--web.external-url=http://alertmanager:${ALERTMANAGER_PORT}"
    ports:
      - "${ALERTMANAGER_PORT}:${ALERTMANAGER_PORT}"
    volumes:
      - ./config/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    healthcheck:
      test:
        - CMD-SHELL
        - "(amtool --version >/dev/null && echo OK || exit 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - services
    depends_on:
      prometheus:
        condition: service_started
      alertmanager-init:
        condition: service_completed_successfully
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
        reservations:
          cpus: "0.25"
          memory: 128m

  # ========================================================================
  # VECTOR DATABASE & SEARCH
  # ========================================================================

  qdrant-init:
    image: alpine:3.20
    container_name: code-server-qdrant-init
    user: "0:0"
    command:
      - sh
      - -lc
      - mkdir -p /qdrant/storage; owner="$$(stat -c '%u:%g' /qdrant/storage 2>/dev/null || true)"; [ "$$owner" = "1000:1000" ] || chown -R 1000:1000 /qdrant/storage
    volumes:
      - qdrant_data:/qdrant/storage
    restart: "no"
    networks:
      - services

  qdrant:
    image: qdrant/qdrant:v1.7.0@sha256:ff1639878418c0572f50a7e1314874e399537eb97e6d2f42d6b987a07a2c4c4f
    container_name: code-server-qdrant
    user: "1000:1000"  # @security P0 #969 - Run as non-root qdrant user
    ports:
      - "${QDRANT_PORT}:${QDRANT_PORT}"
      - "${QDRANT_GRPC_PORT}:${QDRANT_GRPC_PORT}"
    volumes:
      - ./config/qdrant-config.yaml:/qdrant/config/local_config.yaml:ro
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - QDRANT__STORAGE__STORAGE_PATH=/qdrant/storage
      - QDRANT__STORAGE__SNAPSHOTS_PATH=/qdrant/storage/snapshots
      - QDRANT__STORAGE__WAL_PATH=/qdrant/storage/wal
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    depends_on:
      qdrant-init:
        condition: service_completed_successfully
    networks:
      - services
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
        reservations:
          cpus: "1.0"
          memory: 1g

  memory-engine:
    build:
      context: apps/memory-engine
      dockerfile: Dockerfile
    container_name: code-server-memory-engine
    user: "1000:1000"
    ports:
      - "${REPUTATION_PORT}:${REPUTATION_PORT}"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - OLLAMA_HOST=${OLLAMA_URL}
      - MEMORY_ENGINE_PORT=8001
      - MEMORY_ENGINE_HOST=0.0.0.0
      - LOG_LEVEL=INFO
    depends_on:
      qdrant:
        condition: service_started
      ollama:
        condition: service_healthy
    volumes:
      - ./apps/memory-engine:/app
    healthcheck:
      test:
        - CMD
        - curl
        - "-f"
        - "http://reputation:${REPUTATION_PORT}/health"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - services
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
        reservations:
          cpus: "0.5"
          memory: 512m
    profiles:
      - "ai"

  multimodal-ai:
    build:
      context: apps/multimodal-ai
      dockerfile: Dockerfile
    container_name: code-server-multimodal-ai
    user: "1000:1000"
    ports:
      - "${MULTIMODAL_AI_PORT}:${MULTIMODAL_AI_PORT}"
    environment:
      - VISION_BACKEND=${VISION_BACKEND:-ollama}
      - OLLAMA_BASE_URL=${OLLAMA_URL}
      - OLLAMA_VISION_MODEL=${OLLAMA_VISION_MODEL:-llava:13b}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3:8b}
      - DIAGRAM_LLM_BACKEND=${DIAGRAM_LLM_BACKEND:-ollama}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - WHISPER_MODEL=${WHISPER_MODEL:-base}
      - TTS_BACKEND=${TTS_BACKEND:-gtts}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${MULTIMODAL_AI_PORT:-8040}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - services
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4g
        reservations:
          cpus: "0.5"
          memory: 512m
    profiles:
      - "ai"
    labels:
      io.elevatediq.component: "multimodal-ai"
      io.elevatediq.tier: "application"

  reputation-engine:
    build:
      context: apps/reputation_engine
      dockerfile: Dockerfile
    container_name: code-server-reputation-engine
    user: "1001:1001"
    ports:
      - "${RAG_ENGINE_PORT}:${RAG_ENGINE_PORT}"
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@code-server-postgres:5432/${DB_NAME}
      - KAFKA_BROKER=redpanda:9092
      - OPA_URL=${OPA_URL}
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      opa:
        condition: service_healthy
    volumes:
      - ./apps/reputation_engine:/app
    restart: unless-stopped
    networks:
      - services
      - database
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
