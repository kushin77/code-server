name: DNS Service Discovery & Hardcoded IP Enforcement

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  check-hardcoded-ips:
    name: Enforce DNS-based networking (issue #888)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Run hardcoded IP enforcement guard
        shell: bash
        run: |
          set -euo pipefail
          
          echo "🔍 Checking for hardcoded IPs (issue #888 DNS service discovery mandate)"
          bash scripts/ci/check-hardcoded-ips.sh
          exit_code=$?
          
          if [[ $exit_code -ne 0 ]]; then
            echo ""
            echo "❌ DNS enforcement FAILED"
            echo ""
            echo "Issue #888 mandates DNS-based service discovery:"
            echo "❌ Hardcoded IPs found — must use DNS names or env variables"
            echo ""
            echo "To fix:"
            echo "1. Replace hardcoded IPs with environment variables: \$DEPLOY_HOST, \$REPLICA_HOST, \$VIP_HOST"
            echo "2. Use DNS names for cross-service communication: primary.prod.internal, replica.prod.internal"
            echo "3. Keep IPs ONLY in: .env files, terraform/variables defaults, docs/"
            echo "4. See: docs/dns-architecture.md and issue #888"
            echo ""
            exit 1
          fi
          
          echo "✅ DNS enforcement PASSED (zero hardcoded IPs in active code)"
          exit 0

      - name: Upload violations report
        if: always()
        uses: actions/upload-artifact@65462800fd760344e62e32a76ebc27f8506e98e1  # v4.3.3
        with:
          name: hardcoded-ips-report
          path: artifacts/triage/hardcoded-ips-violations.log
          retention-days: 30
