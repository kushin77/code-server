name: "✨ Feature"
description: "New capability or enhancement to kushin77/code-server"
title: "<type>: <short description>"
labels: ["feature", "P2", "needs-priority"]
assignees: []
body:
  - type: dropdown
    id: priority
    attributes:
      label: "Priority"
      options:
        - P0 — Critical/Outage
        - P1 — High/Degradation
        - P2 — Medium/Enhancement (default)
        - P3 — Low/Nice-to-have
      default: 2
    validations:
      required: true

  - type: dropdown
    id: epic
    attributes:
      label: "Epic"
      description: "Which initiative does this belong to?"
      options:
        - "epic:pmo-excellence"
        - "epic:oidc-auth"
        - "epic:resilience"
        - "epic:observability"
        - "epic:security-hardening"
        - "epic:kushnir-cloud"
      default: 5
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "📝 Description"
      description: "What capability should be built?"
      placeholder: "As a [user], I want [capability] so that [outcome]"
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: "✅ Acceptance Criteria"
      description: "How do we know this is done?"
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
        - [ ] Tests pass
        - [ ] Code reviewed
        - [ ] Deployed to 192.168.168.31
    validations:
      required: true

  - type: textarea
    id: implementation_hints
    attributes:
      label: "💡 Implementation Hints"
      description: "Files to modify, patterns to follow, dependencies"
      placeholder: |
        Files to create/modify:
        - src/feature.ts
        - tests/feature.test.ts

        Dependencies:
        - No breaking changes
        - Follows Script Writing Guide
    validations:
      required: false

  - type: textarea
    id: agent_steps
    attributes:
      label: "🤖 Agent Execution Steps"
      description: "Step-by-step instructions for Copilot"
      placeholder: |
        1. Create feature branch: git checkout -b feat/epic-name-N-description
        2. Implement feature in src/
        3. Add tests in tests/
        4. Commit with conventional commit: git add . && git commit -m "feat: ..."
        5. Push branch: git push -u origin HEAD
        6. Create PR with "Closes #N" in body
        7. Merge PR when approved
        8. Run: bash scripts/pmo/complete-issue.sh kushin77/code-server N
    validations:
      required: true

  - type: checkboxes
    id: completion_gate
    attributes:
      label: "🎯 Completion Gate"
      description: "All must be satisfied before issue closes"
      options:
        - label: "gate:committed — Changes committed to branch"
        - label: "gate:merged — PR merged to main"
        - label: "gate:deployed — Deployed on 192.168.168.31"
        - label: "gate:cleaned — Branches deleted, repo clean"
    validations:
      required: true
