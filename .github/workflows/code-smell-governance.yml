name: Governance - Code Smell Gate

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  code-smell-audit:
    name: Governance - code smell audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable corepack
        run: corepack enable

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run code smell guard
        run: bash scripts/ci/check-code-smells.sh

      - name: Upload code smell report
        if: always()
        uses: actions/upload-artifact@5d5d22fc38ceea83b5bc9c7ff5a5109b73852e9f  # v4.3.1
        with:
          name: code-smell-audit-report
          path: artifacts/triage/code-smell-audit-report.md