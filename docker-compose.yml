version: "3.9"

# @file docker-compose.yml
# @module infrastructure
# @description Production-grade Docker Compose for ElevatedIQ DevOS stack
# @governance GOV-002 - All services must have health checks and logging

services:
  # ========================================================================
  # CORE INFRASTRUCTURE
  # ========================================================================

  opa:
    image: openpolicyagent/opa:0.58.0@sha256:63186b7f0d95e51cf4c7ee38cae6fd2cf9168020abd09d48104bd87c99f863fe
    container_name: opa-service
    user: "101:101"  # @security P0 #969 - Run as non-root openpolicyagent user
    command: run --server --log-level=info --set decision_logs.console.enabled=true
    ports:
      - "8181:8181"
    volumes:
      - ./policies:/policies:ro
      - ./config:/opa-src:ro
    environment:
      - OPA_ADDR=0.0.0.0:8181
      - LOG_LEVEL=info
    healthcheck:
      test:
        - CMD
        - curl
        - "-f"
        - "http://localhost:8181/health"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - services
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
        reservations:
          cpus: "0.25"
          memory: 256m
    labels:
      io.elevatediq.component: "policy-engine"
      io.elevatediq.tier: "infrastructure"

  # ========================================================================
  # IDENTITY & AUTHENTICATION
  # ========================================================================

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.5.1@sha256:e797b3934eb8d7cb2756b67e59be2ef29c18c2b45da763f540ece66d843cec85
    container_name: oauth2-proxy
    user: "65534:65534"  # @security P0 #969 - Run as non-root nobody user
    command:
      - --config=/etc/oauth2-proxy/oauth2-proxy.cfg
    ports:
      - "4180:4180"
    volumes:
      - ./config:/oauth2src:ro
    environment:
      - OAUTH2_PROXY_CLIENT_ID=${OAUTH2_CLIENT_ID}
      - OAUTH2_PROXY_CLIENT_SECRET=${OAUTH2_CLIENT_SECRET}
      - OAUTH2_PROXY_COOKIE_SECRET=${OAUTH2_COOKIE_SECRET}
    healthcheck:
      test:
        - CMD
        - curl
        - "-f"
        - "http://localhost:4180/ping"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - services
    depends_on:
      - caddy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
        reservations:
          cpus: "0.25"
          memory: 128m

  # ========================================================================
  # REVERSE PROXY & GATEWAY
  # ========================================================================

  caddy:
    image: caddy:2.7.4@sha256:505de4e957da923672a8c79f16581e9b717a2479a8d5ddb909ab2d1b351f2ba4
    container_name: caddy-gateway
    user: "101:101"  # @security P0 #969 - Run as non-root www-data user
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./config/caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - APEX_DOMAIN=${APEX_DOMAIN}
      - TLS_EMAIL=${TLS_EMAIL}
      - LOG_LEVEL=${LOG_LEVEL}
    healthcheck:
      test:
        - CMD
        - curl
        - "-f"
        - "http://localhost:2019/health"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - services
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
        reservations:
          cpus: "0.5"
          memory: 256m
    labels:
      io.elevatediq.component: "gateway"
      io.elevatediq.tier: "infrastructure"

  # ========================================================================
  # OBSERVABILITY
  # ========================================================================

  prometheus:
    image: prom/prometheus:v2.48.0@sha256:b440bc0e8aa5bab44a782952c09516b6a50f9d7b2325c1ffafac7bc833298e2e
    container_name: prometheus
    user: "65534:65534"  # @security P0 #969 - Run as non-root nobody user
    command:
      - "--config.file=/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    ports:
      - "9090:9090"
    volumes:
      - ./config:/prometheus-config:ro
      - prometheus_data:/prometheus
    environment:
      - TZ=UTC
    healthcheck:
      test:
        - CMD
        - wget
        - "--quiet"
        - "--tries=1"
        - "--spider"
        - "http://localhost:9090/-/healthy"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - services
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
        reservations:
          cpus: "0.5"
          memory: 512m

  grafana:
    image: grafana/grafana:10.2.0@sha256:1ee0c54286b8ca09a3dd1419ff8653e7780a148a006ac088544203bb0affe550
    container_name: grafana-dashboards
    user: "472:472"  # @security P0 #969 - Run as non-root grafana user
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    healthcheck:
      test:
        - CMD
        - curl
        - "-f"
        - "http://localhost:3000/api/health"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - services
    depends_on:
      - prometheus
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
        reservations:
          cpus: "0.5"
          memory: 256m

  loki:
    image: grafana/loki:2.9.4@sha256:f379a20ce9dd815884ed6446aad8819b81a8ba4d36b548ca14be8cecbc6cbca0
    container_name: loki-logs
    user: "10001:10001"  # @security P0 #969 - Run as non-root loki user
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./config/loki:/etc/loki:ro
      - loki_data:/loki
    environment:
      - LOG_LEVEL=info
    healthcheck:
      test:
        - CMD
        - wget
        - "--quiet"
        - "--tries=1"
        - "--spider"
        - "http://localhost:3100/ready"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - services
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
        reservations:
          cpus: "0.5"
          memory: 256m

  # ========================================================================
  # VECTOR DATABASE & SEARCH
  # ========================================================================

  qdrant:
    image: qdrant/qdrant:v1.7.0@sha256:ff1639878418c0572f50a7e1314874e399537eb97e6d2f42d6b987a07a2c4c4f
    container_name: qdrant-vectors
    user: "101:101"  # @security P0 #969 - Run as non-root qdrant user
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./config:/qdrant-src:ro
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT_API_KEY=${QDRANT_API_KEY}
    healthcheck:
      test:
        - CMD
        - curl
        - "-f"
        - "http://localhost:6333/health"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - services
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
        reservations:
          cpus: "1.0"
          memory: 1g

  memory-engine:
    build:
      context: apps/memory-engine
      dockerfile: Dockerfile
    container_name: memory-engine
    user: "1000:1000"
    ports:
      - "8001:8001"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - OLLAMA_HOST=http://ollama:11434
      - MEMORY_ENGINE_PORT=8001
      - MEMORY_ENGINE_HOST=0.0.0.0
      - LOG_LEVEL=INFO
    depends_on:
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
    volumes:
      - ./apps/memory-engine:/app
    healthcheck:
      test:
        - CMD
        - curl
        - "-f"
        - "http://localhost:8001/health"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - services
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
        reservations:
          cpus: "0.5"
          memory: 512m
    profiles:
      - "ai"

  reputation-engine:
    build:
      context: apps/reputation_engine
      dockerfile: Dockerfile
    container_name: reputation-engine
    user: "1001:1001"
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres-db:5432/reputation
      - KAFKA_BROKER=redpanda:9092
      - OPA_URL=http://opa:8181
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      opa:
        condition: service_healthy
    volumes:
      - ./apps/reputation_engine:/app
    restart: unless-stopped
    networks:
      - services
      - database
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
        reservations:
          cpus: "0.25"
          memory: 256m
    profiles:
      - "ai"
      - "governance"

  agent-runtime:
    build:
      context: apps/agent-runtime
      dockerfile: Dockerfile
    container_name: agent-runtime
    user: "1003:1003"  # @security P0 #969 - Run as non-root agent-runtime user
    ports:
      - "8004:8004"
    environment:
      - AGENT_RUNTIME_PORT=8004
      - AGENT_RUNTIME_HOST=0.0.0.0
      - LOG_LEVEL=INFO
      - OPA_URL=http://opa:8181
      - REPUTATION_ENGINE_URL=http://reputation-engine:8002
    depends_on:
      opa:
        condition: service_healthy
      reputation-engine:
        condition: service_healthy
    volumes:
      - ./apps/agent-runtime:/app
    healthcheck:
      test:
        - CMD
        - curl
        - "-f"
        - "http://localhost:8004/health"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - services
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
        reservations:
          cpus: "0.5"
          memory: 256m
    profiles:
      - "ai"
      - "governance"
      - "all"

  env-provisioner:
    build:
      context: apps/env-provisioner
      dockerfile: Dockerfile
    container_name: env-provisioner
    user: "1002:1002"
    ports:
      - "8050:8050"
    environment:
      - LOG_LEVEL=INFO
      - REPO_ROOT=/app
    volumes:
      - ./apps/env-provisioner:/app
      - ./config:/app/config:ro
      - ./artifacts:/app/artifacts
      - ./docker-compose.yml:/app/docker-compose.yml:ro
    restart: unless-stopped
    networks:
      - ingress
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
        reservations:
          cpus: "0.25"
          memory: 256m
    profiles:
      - "infrastructure"
      - "all"

  activity-feed:
    build:
      context: apps/activity_feed
      dockerfile: ../reputation_engine/Dockerfile
    container_name: activity-feed
    user: "1001:1001"
    ports:
      - "8003:8000"
    environment:
      - KAFKA_BROKER=redpanda:9092
      - LOG_LEVEL=INFO
    depends_on:
      redpanda:
        condition: service_healthy
    volumes:
      - ./apps/activity_feed:/app
    restart: unless-stopped
    networks:
      - services
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
        reservations:
          cpus: "0.25"
          memory: 256m
    profiles:
      - "ai"
      - "governance"

  paperclip:
    build:
      context: apps/paperclip
      dockerfile: Dockerfile
    container_name: paperclip-control-plane
    user: "1002:1002"
    ports:
      - "8010:8010"
    environment:
      - OPA_URL=http://opa:8181
      - REPUTATION_ENGINE_URL=http://reputation-engine:8002
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      opa:
        condition: service_healthy
      reputation-engine:
        condition: service_healthy
    volumes:
      - ./apps/paperclip:/app
    restart: unless-stopped
    networks:
      - services
      - database
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - curl
        - "-f"
        - "http://localhost:8010/health"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
        reservations:
          cpus: "0.25"
          memory: 256m
    profiles:
      - "governance"
      - "all"

  execution-scheduler:
    build:
      context: apps/execution-scheduler
      dockerfile: Dockerfile
    container_name: execution-scheduler
    user: "1003:1003"
    ports:
      - "8080:8080"
    environment:
      - KAFKA_BROKER=redpanda:9092
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      - SCHEDULER_API_KEY=${SCHEDULER_API_KEY:-scheduler-default-key-dev-only}
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    volumes:
      - ./apps/execution-scheduler:/app
    restart: unless-stopped
    networks:
      - services
      - database
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - curl
        - "-f"
        - "http://localhost:8080/health"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
        reservations:
          cpus: "0.5"
          memory: 512m
    profiles:
      - "infrastructure"
      - "all"

  agent-code-reviewer:
    build:
      context: apps/agent-runtime
      dockerfile: Dockerfile
    container_name: agent-code-reviewer
    user: "1004:1004"
    ports:
      - "9001:9000"
    environment:
      - AGENT_TYPE=code-reviewer
      - PAPERCLIP_URL=http://paperclip-control-plane:8010
      - REPUTATION_URL=http://reputation-engine:8002
      - SCHEDULER_URL=http://execution-scheduler:8080
      - OIDC_ISSUER=https://auth.internal
      - LOG_LEVEL=INFO
    depends_on:
      paperclip:
        condition: service_healthy
      reputation-engine:
        condition: service_healthy
      execution-scheduler:
        condition: service_healthy
    volumes:
      - ./apps/agent-runtime:/app
    restart: unless-stopped
    networks:
      - services
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - curl
        - "-f"
        - "http://localhost:9000/health"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
        reservations:
          cpus: "0.5"
          memory: 512m
    profiles:
      - "agents"
      - "all"

  agent-incident-responder:
    build:
      context: apps/agent-runtime
      dockerfile: Dockerfile
    container_name: agent-incident-responder
    user: "1004:1004"
    ports:
      - "9002:9000"
    environment:
      - AGENT_TYPE=incident-responder
      - PAPERCLIP_URL=http://paperclip-control-plane:8010
      - REPUTATION_URL=http://reputation-engine:8002
      - SCHEDULER_URL=http://execution-scheduler:8080
      - OIDC_ISSUER=https://auth.internal
      - LOG_LEVEL=INFO
    depends_on:
      paperclip:
        condition: service_healthy
      reputation-engine:
        condition: service_healthy
      execution-scheduler:
        condition: service_healthy
    volumes:
      - ./apps/agent-runtime:/app
    restart: unless-stopped
    networks:
      - services
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - curl
        - "-f"
        - "http://localhost:9000/health"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
        reservations:
          cpus: "1.0"
          memory: 1g
    profiles:
      - "agents"
      - "all"

  agent-doc-writer:
    build:
      context: apps/agent-runtime
      dockerfile: Dockerfile
    container_name: agent-doc-writer
    user: "1004:1004"
    ports:
      - "9003:9000"
    environment:
      - AGENT_TYPE=doc-writer
      - PAPERCLIP_URL=http://paperclip-control-plane:8010
      - REPUTATION_URL=http://reputation-engine:8002
      - SCHEDULER_URL=http://execution-scheduler:8080
      - OIDC_ISSUER=https://auth.internal
      - LOG_LEVEL=INFO
    depends_on:
      paperclip:
        condition: service_healthy
      reputation-engine:
        condition: service_healthy
      execution-scheduler:
        condition: service_healthy
    volumes:
      - ./apps/agent-runtime:/app
    restart: unless-stopped
    networks:
      - services
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - curl
        - "-f"
        - "http://localhost:9000/health"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
        reservations:
          cpus: "0.25"
          memory: 256m
    profiles:
      - "agents"
      - "all"

  agent-test-generator:
    build:
      context: apps/agent-runtime
      dockerfile: Dockerfile
    container_name: agent-test-generator
    user: "1004:1004"
    ports:
      - "9004:9000"
    environment:
      - AGENT_TYPE=test-generator
      - PAPERCLIP_URL=http://paperclip-control-plane:8010
      - REPUTATION_URL=http://reputation-engine:8002
      - SCHEDULER_URL=http://execution-scheduler:8080
      - OIDC_ISSUER=https://auth.internal
      - LOG_LEVEL=INFO
    depends_on:
      paperclip:
        condition: service_healthy
      reputation-engine:
        condition: service_healthy
      execution-scheduler:
        condition: service_healthy
    volumes:
      - ./apps/agent-runtime:/app
    restart: unless-stopped
    networks:
      - services
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - curl
        - "-f"
        - "http://localhost:9000/health"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
        reservations:
          cpus: "0.5"
          memory: 512m
    profiles:
      - "agents"
      - "all"

  # ========================================================================
  # DATA STORES
  # ========================================================================

  postgres:
    image: postgres:16-alpine@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
    container_name: postgres-db
    user: "999:999"  # @security P0 #969 - Run as non-root postgres user
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U ${DB_USER}"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - services
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4g
        reservations:
          cpus: "1.0"
          memory: 2g

  redis:
    image: redis:7-alpine@sha256:7aec734b2bb298a1d769fd8729f13b8514a41bf90fcdd1f38ec52267fbaa8ee6
    container_name: redis-cache
    user: "999:999"  # @security P0 #969 - Run as non-root redis user
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - "--raw"
        - "incr"
        - "ping"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - services
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
        reservations:
          cpus: "0.5"
          memory: 512m

  # ========================================================================
  # EVENT BUS & STREAMING
  # ========================================================================

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.1.6@sha256:e5b6aaecf38861d199b0d26d635b83da26dd6e6acf0684cd8b92f16b4f4b8733
    container_name: redpanda-broker
    user: "101:101"  # @security P0 #969 - Run as non-root redpanda user
    command:
      - redpanda
      - start
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
      - --pandaproxy-addr=0.0.0.0:8082
      - --advertise-pandaproxy-addr=localhost:8082
      - --schema-registry-addr=0.0.0.0:8081
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "9092:9092"      # Kafka external
      - "29092:29092"    # Kafka internal
      - "8082:8082"      # PandaProxy REST
      - "8081:8081"      # Schema Registry
      - "33145:33145"    # RPC
    volumes:
      - redpanda_data:/var/lib/redpanda/data
      - ./config:/redpanda-src:ro
    environment:
      - REDPANDA_BROKERS=redpanda:9092
      - TZ=UTC
    healthcheck:
      test:
        - CMD
        - redpanda
        - admin
        - brokers
        - list
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - services
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8g
        reservations:
          cpus: "2.0"
          memory: 4g
    labels:
      io.elevatediq.component: "event-bus"
      io.elevatediq.tier: "infrastructure"

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v3.7.1@sha256:d5ec9a54339db74d8efa61b18576185903694bee1deb4c029befa492e41ac78f
    container_name: redpanda-console
    user: "101:101"  # @security P0 #969 - Run as non-root redpanda-console user
    ports:
      - "8080:8080"
    environment:
      - KAFKA_BROKERS=redpanda:9092
      - KAFKA_SCHEMAREGISTRY_ENABLED=true
      - KAFKA_SCHEMAREGISTRY_URLS=http://redpanda:8081
      - CONSOLE_CONFIG_FILEPATH=/etc/redpanda/redpanda-console-config.yaml
      - SERVER_LISTENPORT=8080
    volumes:
      - ./config:/redpanda-console-src:ro
    depends_on:
      - redpanda
    healthcheck:
      test:
        - CMD
        - curl
        - "-f"
        - "http://localhost:8080/api/v1/health"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - services
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
        reservations:
          cpus: "0.5"
          memory: 256m
    labels:
      io.elevatediq.component: "event-bus-ui"
      io.elevatediq.tier: "infrastructure"

  # ========================================================================
  # AI/ML SERVICES
  # ========================================================================

  ollama:
    image: ollama/ollama:0.1.16@sha256:3a3ec7ea8e006aea63ce13b7027069687ed34cc85bbd7bbebf1f565db587511a
    container_name: ollama-models
    user: "11434:11434"  # @security P0 #969 - Run as non-root ollama user
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/home/ollama/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_MODELS=/home/ollama/.ollama/models
    healthcheck:
      test:
        - CMD
        - curl
        - "-f"
        - "http://localhost:11434/api/tags"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - services
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: "8G"
        reservations:
          cpus: "2"
          memory: "4G"

# ============================================================================
# NETWORKS & VOLUMES
# ============================================================================

networks:
  services:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-services

volumes:
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
  qdrant_data:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
  redpanda_data:
    driver: local
  ollama_models:
    driver: local
