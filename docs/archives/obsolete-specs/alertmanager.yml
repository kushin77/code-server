global:
  resolve_timeout: 5m
  slack_api_url: '${SLACK_WEBHOOK_URL}'
  github_api_url: 'https://api.github.com/'

# Alert routing configuration
# - P0 Critical alerts: GitHub issues + Slack
# - P1 High priority: Slack + logs
# - P2 Medium: Logs only
route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical-alerts'
      repeat_interval: 15m
      group_wait: 10s
    - match:
        severity: warning
      receiver: 'warnings'
      repeat_interval: 1h
    - match:
        severity: info
      receiver: 'info'

receivers:
  # Default receiver - sends alerts to logs
  - name: 'default'
    slack_configs:
      - channel: '#alerts'
        api_url: '${SLACK_WEBHOOK_URL}'
        title: 'Alert: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true

  # Critical alerts - GitHub issues + Slack
  - name: 'critical-alerts'
    slack_configs:
      - channel: '#critical-alerts'
        api_url: '${SLACK_WEBHOOK_URL}'
        title: 'CRITICAL: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true
    # Webhook for GitHub issue creation on critical alerts
    webhook_configs:
      - url: '${GITHUB_WEBHOOK_URL:-http://localhost:8080/alerts}'
        send_resolved: true

  # Warning alerts - Slack only
  - name: 'warnings'
    slack_configs:
      - channel: '#warnings'
        api_url: '${SLACK_WEBHOOK_URL}'
        title: 'Warning: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true

  # Info alerts - Slack only
  - name: 'info'
    slack_configs:
      - channel: '#alerts'
        api_url: '${SLACK_WEBHOOK_URL}'
        title: 'Info: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true

inhibit_rules:
  # Silence info and warning alerts if critical is firing
  - source_match:
      severity: 'critical'
    target_match_re:
      severity: 'warning|info'
    equal: ['alertname', 'cluster', 'service']
