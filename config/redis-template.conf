# Redis Configuration Template
# For use in docker-compose.yml or standalone deployment
# Version: 2.0 (April 25, 2026)
# Compliance: GOV-002 (immutable, template-driven, no hardcoding)

# ── Redis Server Configuration ────────────────────────────────────────────────

# Network & Security
port {{ REDIS_PORT | default: 6379 }}
bind {{ REDIS_BIND | default: "redis" }}
protected-mode yes

# Authentication (use environment variables for secrets)
# requirepass ${REDIS_PASSWORD}

# ── Memory Management ────────────────────────────────────────────────────────

# Maximum memory Redis can use (default: no limit)
# For production: set to 2/3 of available system memory
maxmemory {{ REDIS_MAXMEMORY | default: "2gb" }}

# Eviction policy when maxmemory is reached
# Options:
#   - noeviction: Returns error when memory limit reached (safe, prevents data loss)
#   - allkeys-lru: Evict any key using LRU algorithm (performance-oriented)
#   - allkeys-lfu: Evict any key using LFU algorithm (best for caching)
#   - volatile-lru: Evict keys with TTL, using LRU (balanced)
#   - volatile-ttl: Evict keys with shortest TTL
#
# RECOMMENDATION: Use allkeys-lru for general caching, allkeys-lfu for hot data
maxmemory-policy {{ REDIS_EVICTION_POLICY | default: "allkeys-lru" }}

# ── Persistence ──────────────────────────────────────────────────────────────

# RDB (Snapshot-based) persistence
# Trade-off: Smaller files but potential data loss on crash
save 900 1          # Save if 1 change in 900s (15 minutes)
save 300 10         # Save if 10 changes in 300s (5 minutes)
save 60 10000       # Save if 10000 changes in 60s

# AOF (Append-Only File) persistence
# Trade-off: Larger files but better durability
appendonly {{ REDIS_AOF_ENABLED | default: "yes" }}
appendfsync {{ REDIS_APPENDFSYNC | default: "everysec" }}
# Options:
#   - always: Write after each command (slowest, safest)
#   - everysec: Write every second (balanced, recommended)
#   - no: Let OS decide when to write (fastest, least safe)

# Hybrid persistence (RDB + AOF for best reliability)
aof-use-rdb-preamble yes

# ── Replication (for HA setups) ──────────────────────────────────────────────

# Primary-Replica replication
# Uncomment for replica instances:
# replicaof {{ REDIS_REPLICA_OF | default: "redis-primary:6379" }}
# replica-serve-stale-data yes
# replica-read-only yes
# repl-diskless-sync no

# ── Performance Optimization ─────────────────────────────────────────────────

# TCP backlog for incoming connections
tcp-backlog {{ REDIS_TCP_BACKLOG | default: "511" }}

# TCP keepalive (seconds)
tcp-keepalive {{ REDIS_TCP_KEEPALIVE | default: "300" }}

# Timeout (seconds) for idle clients (0 = never timeout)
timeout {{ REDIS_TIMEOUT | default: "0" }}

# Number of database namespaces
databases {{ REDIS_DATABASES | default: "16" }}

# ── Logging ──────────────────────────────────────────────────────────────────

# Log level
# Options: debug, verbose, notice, warning
loglevel {{ REDIS_LOG_LEVEL | default: "notice" }}

# Log file path (empty = stdout)
logfile {{ REDIS_LOGFILE | default: '""' }}

# Enable system logging
syslog-enabled {{ REDIS_SYSLOG_ENABLED | default: "no" }}

# ── Client Connection Handling ───────────────────────────────────────────────

# Maximum number of connected clients
maxclients {{ REDIS_MAXCLIENTS | default: "10000" }}

# Disable specific commands for security
# Examples: FLUSHDB, FLUSHALL, CONFIG, SHUTDOWN, KEYS
# disable-commands CONFIG,SHUTDOWN

# ── Monitoring & Health ──────────────────────────────────────────────────────

# Slowlog (queries slower than threshold)
slowlog-log-slower-than {{ REDIS_SLOWLOG_THRESHOLD | default: "10000" }}  # microseconds
slowlog-max-len {{ REDIS_SLOWLOG_MAX_LEN | default: "128" }}

# Latency monitoring
latency-monitor-threshold {{ REDIS_LATENCY_THRESHOLD | default: "0" }}  # 0 = disabled

# ── Advanced Settings ────────────────────────────────────────────────────────

# Lazy freeing (non-blocking deletion)
lazyfree-lazy-eviction {{ REDIS_LAZYFREE_EVICTION | default: "yes" }}
lazyfree-lazy-expire {{ REDIS_LAZYFREE_EXPIRE | default: "yes" }}
lazyfree-lazy-server-del {{ REDIS_LAZYFREE_SERVER_DEL | default: "yes" }}

# Key expiration sampling
hz {{ REDIS_HZ | default: "10" }}

# ── Module Loading (optional) ────────────────────────────────────────────────

# Load external modules (if using Redis modules like RedisJSON, RedisSearch)
# loadmodule /path/to/module.so

# ── Docker Compose Integration ───────────────────────────────────────────────

# NOTES FOR DOCKER COMPOSE:
# 1. Mount this file as /usr/local/etc/redis/redis.conf
# 2. Use environment variables for all {{ VARIABLE }} placeholders
# 3. Set REDIS_PASSWORD via secrets or environment variables
# 4. Mount data directory for persistence:
#    volumes:
#      - redis_data:/data
#      - ./redis.conf:/usr/local/etc/redis/redis.conf
# 5. Health check:
#    healthcheck:
#      test: ["CMD", "redis-cli", "ping"]
#      interval: 5s
#      timeout: 3s
#      retries: 5
