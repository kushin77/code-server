# @file        config/model-router.yaml
# @module      ai/routing
# @description Model routing configuration - hot-reloadable every 30s from GSM
# @owner       ai/routing
# @status      production

# Routing rules evaluated in priority order (highest first)
# Each rule specifies conditions and target model
# Conditions support: request_type, token_count_min, token_count_max, user_reputation_min, user_reputation_max

routing_rules:
  # Rule 1: Code generation → CodeLlama (specialized)
  - priority: 900
    name: "code_generation_to_codellama"
    conditions:
      request_type: "code_generation"
    target_model: "codellama:13b"
    fallback_chain:
      - "llama3:8b"
      - "mistral:7b"

  # Rule 2: Complex reasoning → Llama3:70B (most capable)
  - priority: 850
    name: "reasoning_to_llama_large"
    conditions:
      request_type: "reasoning"
      token_count_min: 500
    target_model: "llama3:70b"
    fallback_chain:
      - "llama3:8b"

  # Rule 3: Restricted users → Mistral (fastest, cheap)
  - priority: 800
    name: "restricted_user_fast_model"
    conditions:
      user_reputation_max: 49
    target_model: "mistral:7b"
    fallback_chain:
      - "llama3:8b"

  # Rule 4: Low token count → Mistral (fast response)
  - priority: 700
    name: "low_tokens_fast_model"
    conditions:
      token_count_max: 100
    target_model: "mistral:7b"
    fallback_chain:
      - "llama3:8b"

  # Rule 5: Elite users → Llama3:70B (best model)
  - priority: 600
    name: "elite_user_best_model"
    conditions:
      user_reputation_min: 90
    target_model: "llama3:70b"
    fallback_chain:
      - "llama3:8b"
      - "mistral:7b"

  # Rule 6: Default → Llama3:8B (balanced, default)
  - priority: 0
    name: "default_balanced"
    conditions: {}
    target_model: "llama3:8b"
    fallback_chain:
      - "mistral:7b"
      - "llama3:70b"

# Fallback chain configuration
fallback_config:
  timeout_ms: 30000
  max_retries: 3
  backoff_ms: 500
  failure_threshold: 2  # Mark unhealthy after 2 consecutive failures
  recovery_threshold: 2  # Mark recovered after 2 consecutive successes

# Health check configuration
health_check:
  interval_seconds: 30
  timeout_seconds: 5
  unhealthy_timeout_seconds: 60  # Wait before retrying unhealthy models

# A/B testing configuration
ab_testing:
  enabled: true
  # Example experiment (uncomment to enable):
  # - experiment_id: "llama3-70b-vs-mistral"
  #   name: "Llama3:70B vs Mistral:7B Comparison"
  #   description: "Compare quality and latency between large and small models"
  #   control_model: "llama3:70b"
  #   variant_model: "mistral:7b"
  #   variant_percentage: 20  # Route 20% to mistral for testing
  #   excluded_users: []  # User IDs to exclude from experiment
  #   metrics: ["latency_ms", "quality_score", "error_rate", "token_count"]

# Metrics collection
metrics:
  enabled: true
  prometheus_port: 8001
  push_interval_seconds: 60
  metrics_tracked:
    - "routing_decisions_total"  # Counter: total routing decisions
    - "routing_by_rule"  # Counter: decisions by rule name
    - "fallback_total"  # Counter: total fallbacks triggered
    - "fallback_by_reason"  # Counter: fallbacks by reason (timeout/error/degradation)
    - "model_latency_ms"  # Histogram: latency per model
    - "model_tokens"  # Histogram: tokens per model
    - "model_errors_total"  # Counter: errors per model
    - "health_check_failures"  # Counter: health check failures

# Model preferences by reputation tier
reputation_tiers:
  ELITE:  # Reputation score 90-100
    preferred_models: ["llama3:70b", "llama3:8b"]
    max_latency_ms: 45000
    fallback_enabled: true
  SENIOR:  # Reputation score 70-89
    preferred_models: ["llama3:8b", "mistral:7b"]
    max_latency_ms: 35000
    fallback_enabled: true
  STANDARD:  # Reputation score 50-69
    preferred_models: ["llama3:8b", "mistral:7b"]
    max_latency_ms: 30000
    fallback_enabled: true
  RESTRICTED:  # Reputation score 0-49
    preferred_models: ["mistral:7b", "llama3:8b"]
    max_latency_ms: 20000
    fallback_enabled: true

# Token budget limits per reputation tier (per day)
token_budgets:
  ELITE:
    daily_limit: 1000000
    hourly_limit: 100000
    request_timeout_ms: 60000
  SENIOR:
    daily_limit: 500000
    hourly_limit: 50000
    request_timeout_ms: 45000
  STANDARD:
    daily_limit: 100000
    hourly_limit: 10000
    request_timeout_ms: 30000
  RESTRICTED:
    daily_limit: 10000
    hourly_limit: 1000
    request_timeout_ms: 15000

# Logging configuration
logging:
  level: "INFO"
  format: "json"
  include_fields:
    - "timestamp"
    - "session_id"
    - "user_id"
    - "request_type"
    - "token_count"
    - "user_reputation"
    - "routed_model"
    - "is_fallback"
    - "latency_ms"
    - "error"
    - "policy_decisions"

# Hot-reload settings
reload:
  enabled: true
  interval_seconds: 30
  source: "gsm"  # Google Secret Manager
  gsm_secret_name: "prompt-gateway-router-config"
# @module      ai/routing
# @description Routing rules for Prompt Gateway - intent-based model selection

routing_rules:
  - intent: "code_generation"
    preferred_model: "codellama:13b"
    fallback_model: "llama3:8b"
    min_tokens: 0
    max_tokens: 4096

  - intent: "complex_reasoning"
    preferred_model: "llama3:70b"
    fallback_model: "llama3:8b"
    min_tokens: 0
    max_tokens: 8192

  - intent: "general_purpose"
    preferred_model: "llama3:8b"
    fallback_model: "mistral:7b"
    min_tokens: 0
    max_tokens: 4096

  - intent: "fast_summary"
    preferred_model: "mistral:7b"
    fallback_model: "llama3:8b"
    min_tokens: 0
    max_tokens: 2048

# Default fallback if no intent matches
default_model: "llama3:8b"
max_fallback_depth: 2
enable_ab_testing: true
ab_test_ratio: 0.1  # 10% for variant model
variant_model: "mistral:7b"
