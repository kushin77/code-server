server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://code-server-loki:3100/loki/api/v1/push
    tenant_id: tenant1

scrape_configs:
  - job_name: docker
    docker:
      host: unix:///var/run/docker.sock
      labels:
        job: docker
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        target_label: 'container'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
      - source_labels: ['__meta_docker_container_id']
        target_label: 'container_id'
      - source_labels: ['__meta_docker_container_name']
        regex: '(.*)-(\\d+)$'
        target_label: 'service'

  - job_name: application-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: applications
          __path__: /var/log/containers/*/*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: time
            level: level
            message: msg
            service: service
      - timestamp:
          format: RFC3339Nano
          source: timestamp
      - labels:
          level:
          service:

  - job_name: syslog
    syslog:
      listen_address: 0.0.0.0:514
      protocol: tcp
      location: UTC
      labels:
        job: syslog
    relabel_configs:
      - source_labels: ['__syslog_message_severity']
        target_label: 'severity'
      - source_labels: ['__syslog_message_facility']
        target_label: 'facility'

  - job_name: postgresql
    static_configs:
      - targets:
          - localhost
        labels:
          job: postgresql
          __path__: /var/log/postgresql/*.log
    pipeline_stages:
      - regex:
          expression: '(?P<time>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})\s+\[(?P<pid>\d+)\]\s+(?P<level>\S+):\s+(?P<message>.*)'
      - labels:
          level:

  - job_name: redis
    static_configs:
      - targets:
          - localhost
        labels:
          job: redis
          __path__: /var/log/redis/*.log
    pipeline_stages:
      - regex:
          expression: '(?P<time>\d+:\d+:\d+\.\d+)\s+#\s+(?P<level>\w+)\s+(?P<message>.*)'
      - labels:
          level:
