groups:
  - name: load-testing-slos
    rules:
      - record: loadtest:oauth2_proxy_latency:p99_5m
        expr: histogram_quantile(0.99, sum by (le) (rate(oauth2_proxy_requests_duration_seconds_bucket[5m])))

      - record: loadtest:session_broker_latency:p99_5m
        expr: histogram_quantile(0.99, sum by (le) (rate(session_broker_request_duration_seconds_bucket[5m])))

      - record: loadtest:rbac_latency:p99_5m
        expr: histogram_quantile(0.99, sum by (le) (rate(rbac_authorization_duration_seconds_bucket[5m])))

      - record: loadtest:database_query_latency:p99_5m
        expr: histogram_quantile(0.99, sum by (le) (rate(postgres_query_duration_seconds_bucket[5m])))

      - record: loadtest:failover_recovery_seconds:p95_5m
        expr: histogram_quantile(0.95, sum by (le) (rate(failover_recovery_seconds_bucket[5m])))

  - name: load-testing-alerts
    rules:
      - alert: LoadTestOAuthP99High
        expr: loadtest:oauth2_proxy_latency:p99_5m > 0.5
        for: 5m
        labels:
          severity: warning
          service: oauth2-proxy
        annotations:
          summary: "OAuth2 proxy latency exceeds target"
          description: "OAuth2 proxy p99 latency is above 500ms. Review proxy capacity and upstream identity-provider health."

      - alert: LoadTestSessionBrokerP99High
        expr: loadtest:session_broker_latency:p99_5m > 0.2
        for: 5m
        labels:
          severity: warning
          service: session-broker
        annotations:
          summary: "Session broker latency exceeds target"
          description: "Session broker p99 latency is above 200ms. Review connection pools, database load, and queue depth."

      - alert: LoadTestRBACP99High
        expr: loadtest:rbac_latency:p99_5m > 0.05
        for: 5m
        labels:
          severity: warning
          service: rbac
        annotations:
          summary: "RBAC authorization latency exceeds target"
          description: "RBAC p99 latency is above 50ms. Review JWT verification and policy cache behavior."

      - alert: LoadTestDatabaseP99High
        expr: loadtest:database_query_latency:p99_5m > 0.1
        for: 5m
        labels:
          severity: warning
          service: postgres
        annotations:
          summary: "Database query latency exceeds target"
          description: "Database p99 latency is above 100ms. Review query plans, indexes, and pool saturation."

      - alert: LoadTestFailoverRTOHigh
        expr: loadtest:failover_recovery_seconds:p95_5m > 30
        for: 1m
        labels:
          severity: critical
          service: failover
        annotations:
          summary: "Failover recovery exceeds target"
          description: "Failover recovery p95 is above 30 seconds. Review health checks, routing convergence, and replica readiness."
