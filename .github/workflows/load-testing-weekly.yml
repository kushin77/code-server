name: Load Testing - Weekly Capacity Planning

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  load-tests:
    name: Weekly load test suite
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install k6
        run: |
          sudo apt-get update
          sudo apt-get install -y k6 jq

      - name: Run load test suite
        env:
          DRY_RUN: '0'
          TEST_SUITE: all
          VUS: '75'
          DURATION: '10m'
        run: bash scripts/load-testing/run-k6-load-tests.sh

      - name: Run failover load test
        env:
          DRY_RUN: '1'
          ENDPOINT: https://ide.kushnir.cloud
        run: bash scripts/load-testing/run-failover-load-test.sh monitor

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08618f1bbf20e25d568f5c8 # v4.4.3
        with:
          name: weekly-load-tests
          path: artifacts/load-tests
