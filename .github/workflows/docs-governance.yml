name: Docs Governance

on:
  pull_request:
    paths:
      - "docs/**"
      - "scripts/ci/validate-docs-governance.py"
      - ".github/workflows/docs-governance.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/ci/validate-docs-governance.py"
      - ".github/workflows/docs-governance.yml"
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  validate-docs:
    name: Validate docs metadata, links, and governance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5.1.0
        with:
          python-version: "3.12"

      - name: Validate docs governance
        run: python3 scripts/ci/validate-docs-governance.py

      - name: Upload docs governance artifacts
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: docs-governance-report
          path: |
            artifacts/triage/docs-governance-report.json
            artifacts/triage/docs-governance-report.md
          if-no-files-found: warn