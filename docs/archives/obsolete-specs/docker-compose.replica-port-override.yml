# docker-compose.replica-port-override.yml
# Temporary workaround for Replica 2 port 80 phantom binding issue
# 
# USAGE on Replica 2 (.42):
#   docker-compose -f docker-compose.yml -f docker-compose.replica.yml -f docker-compose.replica-port-override.yml up -d
#
# This override removes port bindings for Caddy to work around kernel-level port 80 phantom binding.
# Caddy will still run and process requests internally, but won't expose host ports 80/443.
# Production traffic should be routed through Replica 1 (192.168.168.31) Caddy until Replica 2 reboot.
#
# Issue: #1641 (kernel port 80 phantom binding)
# Resolution: Requires OS-level reboot on .42 with admin/sudo access

version: '3.8'

services:
  caddy:
    # Remove problematic host port bindings - Caddy still runs internally
    ports: []
