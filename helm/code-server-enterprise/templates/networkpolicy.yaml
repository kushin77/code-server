# GOV-002: Enterprise Governance Header
# METADATA: NETWORKPOLICY_TEMPLATE
# PURPOSE: Zero-trust network segmentation and access control
# PATTERN: Deny-all default with explicit allow rules

{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "code-server-enterprise.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "code-server-enterprise.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 3100
  egress:
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: {{ include "code-server-enterprise.name" . }}
    ports:
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 6379
{{- end }}
