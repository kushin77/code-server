global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'production'
    env: 'prod'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/alert-rules.yml
  - /etc/prometheus/alert-rules-audit-phase4.yml
  - /etc/prometheus/prometheus-rules-phase-23.yml
  - /etc/prometheus/alerts-phase-23.yml
  - /etc/prometheus/prometheus-rules-slo-phase-8.yml
  - /etc/prometheus/prometheus-rules-alerts-operational.yml

scrape_configs:
  - job_name: 'prometheus'
    metrics_path: /metrics
    static_configs:
      - targets: ['localhost:9090']  # prometheus scrapes itself via localhost

  - job_name: 'code-server'
    static_configs:
      - targets: ['code-server:8080']

  - job_name: 'oauth2-proxy'
    static_configs:
      - targets: ['oauth2-proxy:4180']
    metrics_path: /metrics
    scrape_interval: 30s
    metric_relabel_configs:
      - source_labels: [user]
        regex: 'qa@kushnir\.cloud'
        action: drop

  - job_name: 'oauth2-proxy-portal'
    static_configs:
      - targets: ['oauth2-proxy-portal:4181']
    metrics_path: /metrics
    scrape_interval: 30s
    metric_relabel_configs:
      - source_labels: [user]
        regex: 'qa@kushnir\.cloud'
        action: drop

  - job_name: 'caddy'
    static_configs:
      - targets: ['caddy:2019']
        labels:
          instance: caddy-proxy

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']

  # ── Phase 23: OTel Collector metrics ──────────────────────────────────────
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']
        labels:
          instance: otel-collector

  # Phase 23: OTel Collector exported metrics (app traces → Prometheus metrics)
  - job_name: 'otel-collector-prom'
    static_configs:
      - targets: ['otel-collector:8889']
        labels:
          instance: otel-exporter

  # Phase 23: Anomaly detector sidecar metrics
  - job_name: 'anomaly-detector'
    static_configs:
      - targets: ['anomaly-detector:9095']
        labels:
          instance: anomaly-detector

  # Phase 23: Jaeger metrics
  - job_name: 'jaeger'
    static_configs:
      - targets: ['jaeger:14269']
        labels:
          instance: jaeger-backend

  # Session broker metrics (#995)
  - job_name: 'session-broker'
    metrics_path: /metrics
    static_configs:
      - targets: ['session-broker:5000']
        labels:
          instance: session-broker

  # Redis exporter for both Master-Replica and Sentinel metrics (#995)
  - job_name: 'redis-exporter'
    metrics_path: /metrics
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          instance: redis-sentinel-exporter
    scrape_interval: 30s
    scrape_timeout: 10s
    metric_relabel_configs:
      # Keep only essential Redis metrics
      - source_labels: [__name__]
        regex: 'redis_(info|command_calls|command_duration|connected_clients|evicted_keys|expired_keys|maxmemory|memory|used_memory|keyspace|db|slaves|replication|sentinel|master)'
        action: keep
    scrape_interval: 30s
