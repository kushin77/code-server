#!/usr/bin/env yaml
# @file        apps/backend/config/model-registry.yml
# @module      ai/router
# @description AI model routing configuration and provider registry
# @owner       ai-services
# @status      active

providers:
  ollama:
    base_url: "http://localhost:11434"
    api_key_env: null
    egress_allowlist:
      - "localhost:11434"
      - "127.0.0.1:11434"
  
  huggingface:
    base_url: "https://api-inference.huggingface.co"
    api_key_env: "HF_API_TOKEN"
    egress_allowlist:
      - "api-inference.huggingface.co"

models:
  - id: "codegemma"
    provider: "ollama"
    task: ["code"]
    capabilities: ["code-generation", "code-completion"]
    routing_policy: "local_only"
    privacy_class: "local"
    cost_per_1k_tokens: 0
    latency_ms: 500
    
  - id: "mistral"
    provider: "ollama"
    task: ["chat", "code-review"]
    capabilities: ["chat", "code-review"]
    routing_policy: "local_only"
    privacy_class: "local"
    cost_per_1k_tokens: 0
    latency_ms: 600
    
  - id: "mixtral-hf"
    provider: "huggingface"
    hf_model: "Mixtral-8x7B-Instruct-v0.1"
    task: ["code", "chat", "code-review"]
    capabilities: ["code-generation", "chat", "code-review"]
    routing_policy: "egress_allowed"
    privacy_class: "egress"
    cost_per_1k_tokens: 0.0001
    latency_ms: 1200

routing:
  default_policy: "cost-optimized"
  fallback_enabled: true
  fallback_timeout_ms: 5000
  egress_enabled_env: "AI_EGRESS_ENABLED"
  
  task_routing:
    code_completion:
      primary: "codegemma"
      fallback: "mixtral-hf"
    
    chat:
      primary: "mistral"
      fallback: "mixtral-hf"
    
    code_review:
      primary: "mistral"
      fallback: "mixtral-hf"
