"""
pytest.ini Configuration
Issue #1537 Week 2: Integration Tests

Configures:
- Test discovery patterns
- Markers for integration/unit/database tests
- Coverage settings
- Output formatting
- Database configuration for tests
"""

[pytest]
# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    integration: Integration tests requiring database (deselect with -m 'not integration')
    unit: Unit tests (no external dependencies)
    database: Tests requiring PostgreSQL
    oauth: OAuth2 server tests
    team: Team management tests
    gateway: API gateway tests
    slow: Slow tests (deselect with -m 'not slow')

# Test paths
testpaths = apps/auth-server/tests

# Coverage
addopts = 
    --strict-markers
    --tb=short
    --disable-warnings
    -ra

# Environment
asyncio_mode = auto

# Output
console_output_style = progress
junit_family = xunit2

# Test timeout
timeout = 300

# Database configuration
postgresql_url = postgresql://test:test@localhost:5432/paperclip_test
sqlite_url = sqlite:///:memory:
