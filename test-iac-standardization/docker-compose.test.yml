version: '3.9'
services:
  code-server:
    image: code-server-enterprise:4.115.0
    container_name: code-server
    restart: unless-stopped
    ports:
      - "8080:8080"
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    ports:
      - "5432:5432"
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
