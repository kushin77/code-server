name: Secrets Rotation Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'

permissions:
  contents: read

jobs:
  secrets-rotation-audit:
    name: Verify secrets rotation cadence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Generate rotation report snapshot
        run: bash scripts/security/rotate-secrets-quarterly.sh --dry-run

      - name: Enforce quarterly rotation evidence SLA
        run: bash scripts/ci/check-secrets-rotation-sla.sh
