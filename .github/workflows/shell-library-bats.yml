name: Shell Library Bats

on:
  pull_request:
    paths:
      - "scripts/_common/**/*.sh"
      - "scripts/lib/**/*.sh"
      - "scripts/ci/run-shell-library-bats.sh"
      - "tests/unit/**/*.bats"
      - ".github/workflows/shell-library-bats.yml"
  push:
    branches: [main]
    paths:
      - "scripts/_common/**/*.sh"
      - "scripts/lib/**/*.sh"
      - "scripts/ci/run-shell-library-bats.sh"
      - "tests/unit/**/*.bats"
      - ".github/workflows/shell-library-bats.yml"

permissions:
  contents: read

jobs:
  bats:
    name: bats-core shared library coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install bats-core and kcov
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bats kcov

      - name: Run shared library bats suite
        run: bash scripts/ci/run-shell-library-bats.sh --coverage

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808  # v4.3.3
        with:
          name: shell-library-bats-coverage
          path: coverage/bats
          if-no-files-found: warn
