<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found — KC IDE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #e0e0e0;
        }
        .container {
            text-align: center;
            max-width: 500px;
            padding: 40px;
        }
        .icon {
            font-size: 72px;
            margin-bottom: 24px;
        }
        h1 {
            font-size: 48px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #ff6b6b, #ff8787);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .status {
            font-size: 18px;
            color: #a0a0a0;
            margin-bottom: 24px;
        }
        .message {
            font-size: 14px;
            color: #808080;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .suggestions {
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid rgba(255, 107, 107, 0.3);
            border-radius: 8px;
            padding: 16px;
            text-align: left;
            margin-bottom: 24px;
        }
        .suggestions h3 {
            font-size: 14px;
            color: #ff6b6b;
            margin-bottom: 8px;
        }
        .suggestions ul {
            list-style: none;
            font-size: 12px;
        }
        .suggestions li {
            padding: 4px 0;
            color: #a0a0a0;
        }
        .home-button {
            display: inline-block;
            background: rgba(0, 212, 255, 0.2);
            border: 1px solid rgba(0, 212, 255, 0.3);
            color: #00d4ff;
            padding: 12px 24px;
            border-radius: 6px;
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .home-button:hover {
            background: rgba(0, 212, 255, 0.3);
            border-color: rgba(0, 212, 255, 0.6);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🚫</div>
        <h1>Page Not Found</h1>
        <div class="status">404 Error</div>
        <div class="message">
            The page you're looking for doesn't exist or may have been moved.
        </div>
        <div class="suggestions">
            <h3>Things to try:</h3>
            <ul>
                <li>✓ Check the URL for typos</li>
                <li>✓ Return to the home page</li>
                <li>✓ Contact your administrator if you believe this is an error</li>
            </ul>
        </div>
        <a href="/" class="home-button">Return Home</a>
        <div style="margin-top: 32px; font-size: 12px; color: #606060;">
            Error ID: 404-${Date.now()}
        </div>
    </div>
</body>
</html>
