openapi: 3.1.0
info:
  title: Token Microservice API
  version: 1.0.0
  description: JWT token issuance and validation for service-to-service authentication.
servers:
  - url: http://localhost:5001
paths:
  /token:
    post:
      summary: Issue a JWT access token
      operationId: issueToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: Token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /validate:
    post:
      summary: Validate a JWT access token
      operationId: validateToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateRequest'
      responses:
        '200':
          description: Token valid or invalid result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /jwks:
    get:
      summary: Get the JWKS public key set
      operationId: getJwks
      responses:
        '200':
          description: JWKS document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JwksResponse'
  /revoke:
    post:
      summary: Revoke a JWT access token
      operationId: revokeToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeRequest'
      responses:
        '200':
          description: Token revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /health:
    get:
      summary: Health check
      operationId: healthCheck
      responses:
        '200':
          description: Service healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
components:
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      properties:
        error:
          type: string
      required:
        - error
    TokenRequest:
      type: object
      additionalProperties: false
      properties:
        grant_type:
          type: string
          enum: [client_credentials]
        client_id:
          type: string
        client_secret:
          type: string
        scope:
          type: string
          default: ""
      required:
        - grant_type
        - client_id
        - client_secret
    TokenResponse:
      type: object
      additionalProperties: false
      properties:
        access_token:
          type: string
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
        scope:
          type: string
      required:
        - access_token
        - token_type
        - expires_in
        - scope
    ValidateRequest:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
        audience:
          type: string
      required:
        - token
    ValidateResponse:
      oneOf:
        - type: object
          additionalProperties: false
          properties:
            valid:
              type: boolean
              const: true
            claims:
              type: object
              additionalProperties: true
          required:
            - valid
            - claims
        - type: object
          additionalProperties: false
          properties:
            valid:
              type: boolean
              const: false
            error:
              type: string
          required:
            - valid
            - error
    JwksResponse:
      type: object
      additionalProperties: false
      properties:
        keys:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              kty:
                type: string
              use:
                type: string
              kid:
                type: string
              n:
                type: string
              e:
                type: string
      required:
        - keys
    RevokeRequest:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
      required:
        - token
    RevokeResponse:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          const: revoked
      required:
        - status
    HealthResponse:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
        timestamp:
          type: string
          format: date-time
        service_accounts:
          type: integer
      required:
        - status
        - timestamp
        - service_accounts