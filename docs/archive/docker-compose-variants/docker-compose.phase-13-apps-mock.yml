version: '3.8'

# Phase 13 Application Deployment - Mock Services for Testing
# These are placeholder services that demonstrate the application layer deployment
# Replace with your actual application container images for production

services:
  # Mock API Service
  api-service:
    image: alpine:3.20
    container_name: code-server-api-service
    networks:
      - code-server-network
    command: |
      sh -c "
        echo 'Starting API Service...'
        while true; do
          sleep 60
        done
      "
    environment:
      SERVICE_NAME: "api-service"
      SERVICE_PORT: "8000"
    restart: unless-stopped
    labels:
      tier: "application"

