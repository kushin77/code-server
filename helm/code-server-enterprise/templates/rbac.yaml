# GOV-002: Enterprise Governance Header
# METADATA: RBAC_TEMPLATE
# PURPOSE: Kubernetes RBAC for least-privilege service access
# PATTERN: Per-service role binding with minimal permissions

apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "code-server-enterprise.serviceAccountName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "code-server-enterprise.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.annotations | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "code-server-enterprise.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "code-server-enterprise.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "code-server-enterprise.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "code-server-enterprise.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "code-server-enterprise.fullname" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "code-server-enterprise.serviceAccountName" . }}
  namespace: {{ .Release.Namespace | quote }}
