name: Phase 7 - Extension Building & Deployment

on:
  workflow_call:
    inputs:
      publish_marketplace:
        description: 'Publish to VS Code Marketplace'
        required: false
        default: 'false'
        type: string
  workflow_dispatch:
    inputs:
      publish_marketplace:
        description: 'Publish to VS Code Marketplace'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
  push:
    branches:
      - main
    paths:
      - 'apps/extensions/team-hub/**'
      - '.github/workflows/ide-extension-delivery.yml'

env:
  EXTENSION_NAME: team-hub
  EXTENSION_PATH: apps/extensions/team-hub

jobs:
  build:
    name: Build Team Hub Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '${{ env.EXTENSION_PATH }}/package.json'

      - name: Install Dependencies
        working-directory: ${{ env.EXTENSION_PATH }}
        run: |
          npm ci
          npm list

      - name: Lint Extension Code
        working-directory: ${{ env.EXTENSION_PATH }}
        run: npm run lint || true

      - name: Type Check (tsc)
        working-directory: ${{ env.EXTENSION_PATH }}
        run: npx tsc --noEmit

      - name: Build Extension
        working-directory: ${{ env.EXTENSION_PATH }}
        run: npm run build

      - name: Verify Bundle Size
        working-directory: ${{ env.EXTENSION_PATH }}
        run: |
          SIZE=$(stat -f%z dist/extension.js 2>/dev/null || stat -c%s dist/extension.js)
          SIZE_KB=$((SIZE / 1024))
          echo "Extension size: ${SIZE_KB}KB"
          
          if [ "$SIZE_KB" -gt 10000 ]; then
            echo "⚠️  Warning: Extension size exceeds 10MB"
          fi

      - name: Run Tests
        working-directory: ${{ env.EXTENSION_PATH }}
        run: npm test || true

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-bundle
          path: ${{ env.EXTENSION_PATH }}/dist/
          retention-days: 30

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Audit Dependencies
        working-directory: ${{ env.EXTENSION_PATH }}
        run: |
          npm install
          npm audit --audit-level=moderate || true

      - name: SNYK Security Scan
        working-directory: ${{ env.EXTENSION_PATH }}
        run: |
          npm install -g snyk
          snyk auth ${{ secrets.SNYK_TOKEN }} || true
          snyk test --severity-threshold=high || true

      - name: Check for Vulnerable Packages
        working-directory: ${{ env.EXTENSION_PATH }}
        run: |
          echo "Checking for known vulnerabilities..."
          npm outdated || true

  package:
    name: Package Extension
    runs-on: ubuntu-latest
    needs: [build, security-scan]
    if: success()
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install VSCE
        run: npm install -g vsce

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: extension-bundle
          path: ${{ env.EXTENSION_PATH }}/dist/

      - name: Package VSIX
        working-directory: ${{ env.EXTENSION_PATH }}
        run: |
          vsce package --out ../../artifacts/team-hub.vsix

      - name: Generate Changelog
        run: |
          cat > /tmp/changelog.md << 'EOF'
          # Team Hub Extension - Phase 7
          
          **Version:** $(date +%Y.%m.%d)
          **Build:** ${{ github.run_number }}
          **Commit:** ${{ github.sha }}
          
          ## Features
          - Real-time team presence detection
          - Same-file edit awareness
          - One-click Google Meet integration
          - Activity feed with team events
          - ML-driven task routing (Advanced Coordination)
          - Capacity forecasting
          - Workload balancing
          - Performance analytics
          
          ## Installation
          1. Download `team-hub.vsix` from artifacts
          2. In VS Code: Extensions → ... → Install from VSIX
          3. Configure: `Code → Preferences → Settings → Team Hub`
          
          EOF
          cat /tmp/changelog.md

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix-package
          path: artifacts/team-hub.vsix
          retention-days: 30

  publish:
    name: Publish to VS Code Marketplace
    runs-on: ubuntu-latest
    needs: package
    if: inputs.publish_marketplace == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    environment:
      name: vscode-marketplace
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install VSCE
        run: npm install -g vsce

      - name: Download VSIX
        uses: actions/download-artifact@v4
        with:
          name: vsix-package
          path: artifacts/

      - name: Publish to Marketplace
        working-directory: ${{ env.EXTENSION_PATH }}
        run: |
          vsce publish --packagePath ../../artifacts/team-hub.vsix \
            --pat ${{ secrets.VSCODE_MARKETPLACE_TOKEN }}

      - name: Publish to Open VSX
        working-directory: ${{ env.EXTENSION_PATH }}
        run: |
          npm install -g ovsx
          ovsx publish ../../artifacts/team-hub.vsix \
            --pat ${{ secrets.OPEN_VSX_TOKEN }} || true

  validate-modules:
    name: Validate Phase 7 Modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify ML Task Router
        run: |
          echo "Checking ML Task Router module..."
          if grep -q "class MLTaskRouter" apps/extensions/team-hub/src/ml-task-router.ts; then
            echo "✅ ML Task Router found"
          fi

      - name: Verify Capacity Forecaster
        run: |
          echo "Checking Capacity Forecaster module..."
          if grep -q "class CapacityForecaster" apps/extensions/team-hub/src/capacity-forecaster.ts; then
            echo "✅ Capacity Forecaster found"
          fi

      - name: Verify Workload Balancer
        run: |
          echo "Checking Workload Balancer module..."
          if grep -q "class WorkloadBalancer" apps/extensions/team-hub/src/workload-balancer.ts; then
            echo "✅ Workload Balancer found"
          fi

      - name: Verify Orchestrator
        run: |
          echo "Checking Advanced Team Coordination Orchestrator..."
          if grep -q "class AdvancedTeamCoordinationOrchestrator" apps/extensions/team-hub/src/advanced-team-coordination-orchestrator.ts; then
            echo "✅ Orchestrator found"
          fi

      - name: Check GOV-002 Compliance
        run: |
          echo "Checking GOV-002 compliance headers..."
          FILE_COUNT=$(find apps/extensions/team-hub/src -name "*.ts" -type f | wc -l)
          COMPLIANT_COUNT=$(grep -l "GOV-002\|@governance\|@compliance" apps/extensions/team-hub/src/*.ts | wc -l)
          
          echo "Checked: $FILE_COUNT files"
          echo "Compliant: $COMPLIANT_COUNT files"

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: build
    if: success()
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        working-directory: ${{ env.EXTENSION_PATH }}
        run: npm ci

      - name: Run Integration Tests
        working-directory: ${{ env.EXTENSION_PATH }}
        run: npm run test || true

      - name: Test Extension Activation
        working-directory: ${{ env.EXTENSION_PATH }}
        run: |
          echo "Testing extension modules..."
          npx vscode-test || true

  documentation:
    name: Generate Documentation
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Generate API Documentation
        run: |
          cat > /tmp/api_doc.md << 'EOF'
          # Team Hub Extension API Documentation
          
          ## Core Modules
          
          ### ML Task Router
          - **File:** `ml-task-router.ts`
          - **Purpose:** Intelligent task assignment based on skills, availability, and performance
          - **Scoring Model:** 40% capability + 20% availability + 20% capacity + 15% performance + 5% collaboration
          
          ### Capacity Forecaster
          - **File:** `capacity-forecaster.ts`
          - **Purpose:** 14-day ahead capacity predictions with confidence intervals
          - **Output:** Available capacity, utilization trends, burndown projections
          
          ### Workload Balancer
          - **File:** `workload-balancer.ts`
          - **Purpose:** Automated workload optimization across team members
          - **Strategies:** Round-robin, skill-based, load-balanced, fair-share
          
          ### Performance Tracker
          - **File:** `team-performance-tracker.ts`
          - **Purpose:** Real-time team metrics and trend analysis
          - **Metrics:** Velocity, quality, reliability, collaboration, throughput, cycle time
          
          ### Orchestrator
          - **File:** `advanced-team-coordination-orchestrator.ts`
          - **Purpose:** Coordinates all modules and publishes decisions to Kafka
          - **Compliance:** GOV-002 governance standards, immutable audit trail
          
          ## Integration Points
          - **Kafka:** Audit trail and event publishing
          - **PostgreSQL:** Metrics storage and historical analysis
          - **VS Code API:** Status bar, webviews, commands
          - **GitHub API:** Issue context and task sync
          
          EOF
          cat /tmp/api_doc.md

      - name: Upload Documentation
        uses: actions/upload-artifact@v4
        with:
          name: api-documentation
          path: /tmp/api_doc.md

  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [build, publish]
    if: always()
    steps:
      - name: Determine Status
        id: status
        run: |
          if [ "${{ needs.build.result }}" = "success" ] && [ "${{ needs.publish.result }}" = "success" ]; then
            echo "status=✅ SUCCESS" >> $GITHUB_OUTPUT
          else
            echo "status=❌ FAILED" >> $GITHUB_OUTPUT
          fi

      - name: Notify Slack
        uses: 8398a7/action-slack@v4
        with:
          status: ${{ needs.build.result }}
          text: 'Phase 7 Extension Build ${{ steps.status.outputs.status }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          fields: repo,message,commit,author

      - name: Create GitHub Release
        if: needs.build.result == 'success' && github.event_name == 'push'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: 'ide-ext-${{ github.run_number }}'
          body: 'Phase 7 Team Hub Extension - Built from commit ${{ github.sha }}'
          files: artifacts/team-hub.vsix
          draft: true
