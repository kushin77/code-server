name: P3-1676 SSO Validation

on:
  schedule:
    # Daily at 2 AM UTC (10 PM EST)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      verbose:
        description: 'Verbose logging'
        required: false
        type: boolean
        default: false

jobs:
  sso-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    env:
      TEST_BASE_URL: https://ide.kushnir.cloud
      PORTAL_BASE_URL: https://kushnir.cloud
      IDE_BASE_URL: https://ide.kushnir.cloud
      REQUIRE_VPN: 0
      REQUIRE_SINGLE_LOGIN: 1
      NODE_ENV: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run SSO validation tests
        run: npx playwright test tests/e2e/sso-flows.spec.ts --reporter=html,json,junit
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: sso-test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sso-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 30

      - name: Parse test results
        if: always()
        id: parse
        run: |
          if [ -f "test-results/sso-test-results.xml" ]; then
            TOTAL=$(grep -c "<testcase" test-results/sso-test-results.xml || echo "0")
            FAILED=$(grep -c "<failure" test-results/sso-test-results.xml || echo "0")
            PASSED=$((TOTAL - FAILED))
            echo "total=$TOTAL" >> $GITHUB_OUTPUT
            echo "passed=$PASSED" >> $GITHUB_OUTPUT
            echo "failed=$FAILED" >> $GITHUB_OUTPUT
          fi

      - name: Slack notification - Start
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "🔵 P3-1676 SSO Validation Started",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*P3-1676 SSO Validation*\n*Status:* Starting\n*Environment:* ${{ github.event.inputs.environment || 'production' }}\n*Workflow:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                }
              ]
            }
        if: always() && secrets.SLACK_WEBHOOK_URL != ''

      - name: Slack notification - Success
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "✅ P3-1676 SSO Validation Passed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*P3-1676 SSO Validation*\n*Status:* ✅ PASSED\n*Tests:* ${{ steps.parse.outputs.total }} total, ${{ steps.parse.outputs.passed }} passed, ${{ steps.parse.outputs.failed }} failed\n*Workflow:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                }
              ]
            }
        if: success() && secrets.SLACK_WEBHOOK_URL != ''

      - name: Slack notification - Failure
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "❌ P3-1676 SSO Validation Failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*P3-1676 SSO Validation*\n*Status:* ❌ FAILED\n*Tests:* ${{ steps.parse.outputs.total }} total, ${{ steps.parse.outputs.passed }} passed, ${{ steps.parse.outputs.failed }} failed\n*Workflow:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                }
              ]
            }
        if: failure() && secrets.SLACK_WEBHOOK_URL != ''

  # Archive results for trending
  archive-results:
    needs: sso-validation
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: sso-test-results

      - name: Create summary document
        run: |
          mkdir -p artifacts/sso-results
          cat > artifacts/sso-results/summary-${{ github.run_id }}.md << 'EOF'
          # P3-1676 SSO Validation Results
          
          **Run ID:** ${{ github.run_id }}
          **Date:** $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          **Environment:** ${{ github.event.inputs.environment || 'production' }}
          **Status:** ${{ job.status }}
          
          ## Test Results
          - Total Tests: ${{ needs.sso-validation.outputs.total || 'N/A' }}
          - Passed: ${{ needs.sso-validation.outputs.passed || 'N/A' }}
          - Failed: ${{ needs.sso-validation.outputs.failed || 'N/A' }}
          
          ## Artifacts
          - HTML Report: [playwright-report/index.html](playwright-report/index.html)
          - JUnit XML: [test-results/sso-test-results.xml](test-results/sso-test-results.xml)
          EOF

      - name: Upload summary
        uses: actions/upload-artifact@v4
        with:
          name: sso-summary-${{ github.run_id }}
          path: artifacts/sso-results/
          retention-days: 90

  # Post to issue if provided
  post-to-issue:
    needs: sso-validation
    runs-on: ubuntu-latest
    if: always() && github.event.inputs.issue_number != ''
    
    steps:
      - name: Post results to issue
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = parseInt('${{ github.event.inputs.issue_number }}' || '0');
            if (issueNumber === 0) return;
            
            const status = '${{ job.status }}' === 'success' ? '✅ PASSED' : '❌ FAILED';
            const comment = `## P3-1676 SSO Validation Results
            
            **Status:** ${status}
            **Run ID:** ${{ github.run_id }}
            **Timestamp:** ${new Date().toISOString()}
            
            [View detailed results](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;
            
            await github.rest.issues.createComment({
              issue_number: issueNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
