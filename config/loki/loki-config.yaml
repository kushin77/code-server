# @file loki-config.yaml
# @module config
# @description Loki log aggregation configuration for centralized logging

auth_enabled: false

ingester:
  chunk_idle_period: 3m
  chunk_retain_period: 1m
  max_chunk_age: 1h
  max_streams_matcher_size: 10000
  autoforget_unhealthy: true

limits_config:
  retention_period: 720h  # 30 days retention
  enforce_metric_name: false
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 20
  max_line_length: 256000

storage_config:
  filesystem:
    directory: /loki/chunks
  index_cache_validity: 5m
  shared_store: filesystem
  cache_config:
    enable_fifocache: true
    default_validity: 1h
    background:
      writeback_goroutines: 1
      writeback_batch_size: 1000

schema_config:
  configs:
    - from: 2024-01-01
      store: filesystem
      object_store: filesystem
      schema: v9
      index:
        prefix: index_
        period: 24h

server:
  http_listen_port: 3100
  log_level: info
  log_format: json

# Scrape configs for log sources
scrape_configs:
  # OPA decision logs
  - job_name: opa
    static_labels:
      job: opa
      component: policy-engine
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # Docker logs
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        target_label: container_name
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      - source_labels: [__meta_docker_container_log_stream]
        target_label: stream

  # Kubernetes logs (if used)
  - job_name: kubernetes
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_namespace_name]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

# Policy to prevent sensitive data in logs
table_manager:
  retention_deletes_enabled: true
  retention_period: 720h

# Metrics endpoint
metrics_enabled: true
