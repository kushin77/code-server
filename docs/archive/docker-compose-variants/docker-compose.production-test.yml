version: '3.9'

# PRODUCTION DEPLOYMENT - IaC TEST CONFIGURATION
# 18 services, Infrastructure as Code validated
# Uses public images for infrastructure/observability + simple mock services for testing

services:
  # ============================================================================
  # INFRASTRUCTURE LAYER (5 services)
  # ============================================================================

  postgres:
    image: postgres:16-alpine
    container_name: code-server-enterprise-postgres
    environment:
      POSTGRES_DB: app_db
      POSTGRES_PASSWORD: postgres_password_secure
      POSTGRES_INITDB_ARGS: -c wal_level=replica -c max_wal_senders=10 -c max_replication_slots=5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - code-server-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: code-server-enterprise-redis
    command: redis-server --appendonly yes --requirepass code_server_redis_password
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "code_server_redis_password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - code-server-network
    restart: unless-stopped

  mongodb:
    image: mongo:7.0
    container_name: code-server-enterprise-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo_admin
      MONGO_INITDB_ROOT_PASSWORD: mongo_password_secure
      MONGO_INITDB_DATABASE: app_db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - code-server-network
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: code-server-enterprise-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: curl -f http://localhost:9200/_cluster/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - code-server-network
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.7.0
    container_name: code-server-enterprise-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: curl -f http://localhost:6333/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - code-server-network
    restart: unless-stopped

  # ============================================================================
  # OBSERVABILITY LAYER (5 services)
  # ============================================================================

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: code-server-enterprise-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
    networks:
      - code-server-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.0
    container_name: code-server-enterprise-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: curl -f http://localhost:3000/api/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - prometheus
    networks:
      - code-server-network
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.4
    container_name: code-server-enterprise-loki
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    networks:
      - code-server-network
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.4.1
    container_name: code-server-enterprise-tempo
    command: ["-config.file=/etc/tempo.yml"]
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4319:4319"
    volumes:
      - tempo_data:/var/tempo
    networks:
      - code-server-network
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: code-server-enterprise-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - alertmanager_data:/alertmanager
    networks:
      - code-server-network
    restart: unless-stopped

  # ============================================================================
  # API GATEWAY (1 service)
  # ============================================================================

  caddy:
    image: caddy:2.7.4
    container_name: code-server-enterprise-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - code-server-network
    restart: unless-stopped

  # ============================================================================
  # MICROSERVICES (5 mock services - replace with actual implementations)
  # ============================================================================

  api-service:
    image: alpine:latest
    container_name: code-server-enterprise-api-service
    command: /bin/sh -c "echo 'API Service running' && sleep infinity"
    ports:
      - "8000:8000"
    environment:
      SERVICE_NAME: api-service
      SERVICE_PORT: "8000"
    networks:
      - code-server-network
    restart: unless-stopped

  web-service:
    image: alpine:latest
    container_name: code-server-enterprise-web-service
    command: /bin/sh -c "echo 'Web Service running' && sleep infinity"
    ports:
      - "3001:3001"
    environment:
      SERVICE_NAME: web-service
      SERVICE_PORT: "3001"
    networks:
      - code-server-network
    restart: unless-stopped

  user-service:
    image: alpine:latest
    container_name: code-server-enterprise-user-service
    command: /bin/sh -c "echo 'User Service running' && sleep infinity"
    ports:
      - "8001:8001"
    environment:
      SERVICE_NAME: user-service
      SERVICE_PORT: "8001"
    networks:
      - code-server-network
    restart: unless-stopped

  data-service:
    image: alpine:latest
    container_name: code-server-enterprise-data-service
    command: /bin/sh -c "echo 'Data Service running' && sleep infinity"
    ports:
      - "8002:8002"
    environment:
      SERVICE_NAME: data-service
      SERVICE_PORT: "8002"
    networks:
      - code-server-network
    restart: unless-stopped

  analytics-service:
    image: alpine:latest
    container_name: code-server-enterprise-analytics-service
    command: /bin/sh -c "echo 'Analytics Service running' && sleep infinity"
    ports:
      - "8005:8005"
    environment:
      SERVICE_NAME: analytics-service
      SERVICE_PORT: "8005"
    networks:
      - code-server-network
    restart: unless-stopped

  # ============================================================================
  # SUPPORTING SERVICES (2 services)
  # ============================================================================

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: code-server-enterprise-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - code-server-network
    restart: unless-stopped

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: code-server-enterprise-redis-commander
    environment:
      REDIS_HOSTS: local:redis:6379:0:code_server_redis_password
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - code-server-network
    restart: unless-stopped

networks:
  code-server-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  mongodb_data:
  elasticsearch_data:
  qdrant_data:
  prometheus_data:
  grafana_data:
  loki_data:
  tempo_data:
  alertmanager_data:
  caddy_data:
  caddy_config:
  pgadmin_data:
