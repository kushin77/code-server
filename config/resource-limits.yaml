# Resource Limits Configuration for docker-compose.yml
# Add these deploy sections to each service for production safety
#
# Example:
#   service_name:
#     deploy:
#       resources:
#         limits:
#           cpus: '2.0'
#           memory: 4g
#         reservations:
#           cpus: '1.0'
#           memory: 2g

OPA:
  deploy:
    resources:
      limits:
        cpus: '0.5'
        memory: 512m
      reservations:
        cpus: '0.25'
        memory: 256m

oauth2-proxy:
  deploy:
    resources:
      limits:
        cpus: '0.5'
        memory: 256m
      reservations:
        cpus: '0.25'
        memory: 128m

