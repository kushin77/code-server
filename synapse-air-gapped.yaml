# Synapse Configuration for Air-Gapped Deployment
# Based on synapse documentation but with all external dependencies removed

server_name: "matrix.internal"
pid_file: /data/homeserver.pid

# Listeners: Client API only (no federation on public internet)
listeners:
  # Client API (private network only)
  - port: 8008
    type: http
    x_forwarded: true
    resources:
      - names:
          - client
          - consent
          - federation
        compress: false

# TLS: Disabled (handled by reverse proxy - Caddy)
# In production air-gapped, use self-signed certificates via Caddy
tls_certificate_path: null
tls_private_key_path: null

# Database: PostgreSQL (shared with code-server infrastructure)
database:
  name: psycopg2
  args:
    user: synapse
    password: "${POSTGRES_PASSWORD}"
    database: synapse_db
    host: postgres
    port: 5432
    cp_min: 10
    cp_max: 20
    max_overflow: 10
    pool_recycle: 3600
    pool_pre_ping: true

# Redis: For caching and worker coordination
redis:
  enabled: true
  host: redis
  port: 6379
  password: "${REDIS_PASSWORD}"

# Logging
log_config: "/data/logs.yaml"

# Working directory
media_store_path: "/data/media_store"

# Signing key
signing_key_path: "/data/matrix.signing.key"

# === FEDERATION CONFIGURATION (DISABLED FOR AIR-GAPPED) ===

# Allow only internal federation (same server)
# NO external server federation
federation_domain_whitelist:
  - "matrix.internal"
  - "localhost"

# Disable public room discovery
allow_public_rooms_without_auth: false

# Disable federation receiver (no incoming federation)
federation_sender_enabled: false

# No well-known federation (air-gapped doesn't need .well-known)
# This prevents external discovery attempts
allow_federation: false

# Disable federation listener (no port 8448)
federation_port: null

# === END FEDERATION CONFIGURATION ===

# Root signing key
root_client_auth_secret: "{{ require_secret('root_client_auth_secret') }}"

# Registration
enable_registration: false  # Admin-only user creation via API

# Disable password auth token expiry (internal use only)
access_token_lifetime: 1d
refresh_token_lifetime: 7d

# Room history
default_room_version: "9"
room_retention:
  enabled: true
  default:
    min_lifetime: 1d
    max_lifetime: 90d
  purge_jobs:
    - shortest_max_lifetime: 1d
      longest_max_lifetime: 90d
      batch_size: 100

# Modules: None (air-gapped, no external modules)
modules: []

# Email: Disabled (no SMTP in air-gapped)
email:
  enable_notifs: false

# Push notifications: Disabled
push:
  enabled: false

# Metrics: Via Prometheus (internal scrape only)
metrics_flags:
  known_servers: false  # Don't report known servers to Prometheus

enable_metrics: true

# Trusted key servers: None (air-gapped)
trusted_key_servers: []

# Allow experimental features: No
experimental_features_enabled: false

# Rate limiting
rc_message:
  per_second: 1
  burst_count: 100
rc_registration:
  per_second: 0.1
  burst_count: 5
rc_registration_token_validity:
  per_second: 0.1
  burst_count: 5

# Spam checking: Disabled (no external services)
spam_checker: []

# Rate limiter backend
rate_limit_ms: 50
burst_count: 100

# User consent
user_consent:
  version: "1.0"
  server_notice_content:
    msgtype: m.text
    body: >-
      To continue using this service, you must review and accept the terms
      and conditions. See the Consent section for more information.
  block_events_error: >-
    You have not accepted the privacy policy of this server. You may not post.
  require_at_registration: false
  policy_name: "Synapse Terms of Service"

# Configure trusted proxies (for Caddy reverse proxy)
trusted_proxies:
  - "caddy"
  - "127.0.0.1"

# Content repository
max_upload_size: "50M"
max_image_pixels: "32M"

# Allow guests: No (internal use only)
allow_guest_access: false

# Third party event filters: None
third_party_event_filters: []

# Key validity: Disable key expiry for internal federation
key_validity_period: 24h

# Account validity: No expiration (air-gapped)
account_validity:
  enabled: false

# Session configuration
forget_fully_on_logout: false

# Password authentication (internal users only)
password_config:
  enabled: true
  localdb_enabled: true

# Disable JWT tokens (air-gapped)
jwt_config:
  enabled: false

# OID Providers: None (air-gapped doesn't integrate with external OIDC)
oidc_providers: []

# Multi-sign-on: None
saml_config: null

# Cas servers: None
cas_config: null

# Apple SignIn: None
apple_signin_config: null

# Token lifetime
token_lifetime: 24h

# Admin contact information
admin_contact: "admin@matrix.internal"

# Server notices
server_notices:
  enabled: false

# Redaction
redaction_retention_period: 30d

# Event signing
event_signing_key_rotation_period: 604800  # 1 week

# Restricting access by IP
# (Optional: restrict to local network)
# trusted_third_party_id_servers: []

# Sentry error reporting: Disabled
# sentry_dsn: null

# Performance: Disable external lookups
# cross_origin_file_requests: false
