global:
  resolve_timeout: 5m

# Simplified routing - just send all alerts to null receiver
# In production, configure Slack, PagerDuty, etc. via environment variables
route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h
  receiver: 'null'

receivers:
  - name: 'null'

inhibit_rules: []
