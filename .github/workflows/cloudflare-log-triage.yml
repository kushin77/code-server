name: Cloudflare Log Triage

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run without creating/updating issues'
        required: false
        default: 'false'

permissions:
  contents: read
  issues: write

jobs:
  triage-cloudflare:
    name: Classify Cloudflare signals and route issues
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Prepare Cloudflare event payload
        id: payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/triage

          if [[ -n "${CLOUDFLARE_LOG_EVENTS_B64:-}" ]]; then
            printf '%s' "${CLOUDFLARE_LOG_EVENTS_B64}" | base64 --decode > artifacts/triage/cloudflare-events.jsonl
            echo "has_payload=true" >> "$GITHUB_OUTPUT"
          else
            echo "No CLOUDFLARE_LOG_EVENTS_B64 secret provided; skipping triage run"
            echo "has_payload=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          CLOUDFLARE_LOG_EVENTS_B64: ${{ secrets.CLOUDFLARE_LOG_EVENTS_B64 }}

      - name: Route Cloudflare failures to issues
        if: steps.payload.outputs.has_payload == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          args=(
            --cloudflare-jsonl artifacts/triage/cloudflare-events.jsonl
            --repo "$GH_REPO"
            --window-minutes 15
            --sustained-threshold 3
          )

          if [[ "$DRY_RUN_INPUT" == "true" ]]; then
            args+=(--dry-run)
          fi

          bash scripts/ops/cloudflare-log-triage.sh "${args[@]}"
