name: Test Kubernetes OIDC Integration

on:
  push:
    branches: [main]
    paths:
      - kubernetes/oidc-*.yaml
      - kubernetes/token-exchange.sh
      - kubernetes/test-oidc-integration.sh
      - kubernetes/api-client-example.sh
      - tests/unit/kubernetes-oidc/**
      - tests/oidc/**
      - tests/integration/kubernetes-oidc-e2e.test.ts
      - .github/workflows/test-kubernetes-oidc.yml
  pull_request:
    branches: [main]
    paths:
      - kubernetes/**
      - tests/unit/kubernetes-oidc/**
      - tests/oidc/**
      - tests/integration/kubernetes-oidc-e2e.test.ts
      - .github/workflows/test-kubernetes-oidc.yml

jobs:
  # Validate Kubernetes manifests
  validate-manifests:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeval
        run: |
          mkdir -p ~/.local/bin
          wget https://github.com/instrumenta/kubeval/releases/latest/download/kubeval-linux-amd64.tar.gz
          tar xf kubeval-linux-amd64.tar.gz -C ~/.local/bin
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Validate OIDC manifests
        run: |
          kubeval kubernetes/oidc-serviceaccounts.yaml --strict --schema-location https://raw.githubusercontent.com/instrumenta/kubernetes-json-schema/master

      - name: Validate manifests with kubeconform
        run: |
          docker run --rm -v $(pwd):/workspace ghcr.io/yannh/kubeconform:latest -summary -output json kubernetes/oidc-*.yaml

  # Run BATS unit tests
  bats-tests:
    name: BATS Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install BATS
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Run BATS tests
        run: |
          bats tests/unit/kubernetes-oidc/test_serviceaccount_config.bats
          bats tests/unit/kubernetes-oidc/test_token_exchange.bats

  # Run Jest unit tests
  jest-tests:
    name: Jest Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --workspaces

      - name: Run OIDC unit tests
        run: npm test -- tests/oidc/kubernetes-serviceaccount.test.ts

  # Syntax validation
  syntax-check:
    name: Bash Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check shell script syntax
        run: |
          bash -n kubernetes/token-exchange.sh
          bash -n kubernetes/test-oidc-integration.sh
          bash -n kubernetes/api-client-example.sh

  # Documentation validation
  docs-validation:
    name: Documentation Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check documentation exists
        run: |
          test -f docs/KUBERNETES-OIDC-INTEGRATION.md || (echo "Missing KUBERNETES-OIDC-INTEGRATION.md"; exit 1)
          test -f docs/PHASE-5-KUBERNETES-OIDC-IMPLEMENTATION-PLAN.md || (echo "Missing PHASE-5-KUBERNETES-OIDC-IMPLEMENTATION-PLAN.md"; exit 1)

      - name: Validate Markdown
        uses: nosborn/github-action-markdown-cli@v3.3.0
        with:
          files: docs/KUBERNETES-OIDC-INTEGRATION.md docs/PHASE-5-KUBERNETES-OIDC-IMPLEMENTATION-PLAN.md

  # Create summary
  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [validate-manifests, bats-tests, jest-tests, syntax-check, docs-validation]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Generate test summary
        run: |
          echo "## Kubernetes OIDC Integration Tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Manifest validation: ${{ needs.validate-manifests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "✅ BATS unit tests: ${{ needs.bats-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "✅ Jest unit tests: ${{ needs.jest-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "✅ Syntax checks: ${{ needs.syntax-check.result }}" >> $GITHUB_STEP_SUMMARY
          echo "✅ Documentation: ${{ needs.docs-validation.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: Phase 5 Kubernetes OIDC Integration Tests Complete" >> $GITHUB_STEP_SUMMARY

      - name: Check for failures
        if: failure()
        run: |
          echo "❌ One or more test jobs failed"
          exit 1
