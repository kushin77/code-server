# Redis Sentinel Configuration
# Master: redis (primary on .31)
# Replica: redis-replica (on .42)
# Sentinels: sentinel-1 (on .31), sentinel-2 (on .42), sentinel-arbiter (lightweight arbiter)

# Listen on all interfaces
bind 0.0.0.0
protected-mode no
port 26379
daemonize no
pidfile /var/run/redis-sentinel.pid
logfile ""
loglevel notice

# Monitored Redis master
# sentinel monitor <master-name> <master-ip> <master-port> <quorum>
# Quorum = 2 means 2 out of 3 Sentinels must agree before promotion
sentinel monitor mymaster __REDIS_MASTER_HOST__ 6379 2

# Authentication password for sentinel to connect to Redis master/replica
sentinel auth-pass mymaster __REDIS_PASSWORD__

# Timeout for detecting if a master is down (milliseconds)
# 30 seconds before Sentinel considers master down
sentinel down-after-milliseconds mymaster 30000

# Timeout for reconfiguration (milliseconds)
# Must complete failover + replication within 180 seconds
sentinel failover-timeout mymaster 180000

# Number of replicas to reconfigure in parallel during failover
sentinel parallel-syncs mymaster 1

# Notification script (optional, called when events occur)
# sentinel notification-script mymaster /path/to/notification.sh

# Clients redirecting script (optional, called to redirect clients)
# sentinel client-reconfig-script mymaster /path/to/client-reconfig.sh

# Replica replication configuration
# Keep replicas read-only after failover
replica-priority 100

# Logging
loglevel notice

# Deny protected mode (allow non-TLS connections on internal network)
protected-mode no
