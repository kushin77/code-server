name: Build Session Broker Image

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/session-broker/**'
      - '.github/workflows/build-session-broker.yml'
  workflow_run:
    workflows: [CI Validate]
    types: [completed]
    branches: [main]

permissions:
  contents: read

env:
  COST_CATEGORY: "ci-build"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/session-broker

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
        with:
          context: .
          file: apps/session-broker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Report metrics
        run: |
          echo "::notice::Cost-Category: ci-build"
          echo "::notice::Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "::notice::Tags: ${{ steps.meta.outputs.tags }}"

      - name: Cleanup
        if: always()
        run: docker system prune -af