name: Code Quality

on:
  push:
    branches: [main]
    paths:
      - 'apps/**/*.py'
      - 'scripts/**/*.py'
      - 'scripts/**/*.sh'
      - 'pyproject.toml'
      - '.github/workflows/code-quality.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/**/*.py'
      - 'scripts/**/*.py'
      - 'scripts/**/*.sh'

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff Lint + Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@0c50fcf487b9e45395f457b55cd37dda4d53a0b3
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install --no-cache-dir ruff==0.4.4

      - name: Lint
        run: ruff check apps/ scripts/ --output-format=github

      - name: Format check
        run: ruff format --check apps/ scripts/

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: |
          find scripts/ -name "*.sh" -print0 \
            | xargs -0 shellcheck --severity=warning --shell=bash

  verify-code-quality:
    name: Repository Code Quality Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run code quality verification script
        run: bash scripts/ci/verify-code-quality.sh

  test-suite:
    name: Repository Test Suite
    runs-on: ubuntu-latest
    needs: [ruff, shellcheck, verify-code-quality]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@0c50fcf487b9e45395f457b55cd37dda4d53a0b3
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc
          python -m pip install --upgrade pip setuptools wheel
          pip install pytest pytest-cov pytest-asyncio pytest-timeout pytest-xdist coverage[toml]
          find apps -mindepth 2 -maxdepth 2 -name requirements.txt -print0 \
            | xargs -0 -I{} pip install -r {}

      - name: Run repository tests
        run: bash scripts/ci/run-tests.sh
