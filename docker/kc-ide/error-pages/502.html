<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>502 Bad Gateway — KC IDE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #e0e0e0;
        }
        .container {
            text-align: center;
            max-width: 500px;
            padding: 40px;
        }
        .icon {
            font-size: 72px;
            margin-bottom: 24px;
            animation: spin 2s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        h1 {
            font-size: 48px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .status {
            font-size: 18px;
            color: #a0a0a0;
            margin-bottom: 24px;
        }
        .message {
            font-size: 14px;
            color: #808080;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(0, 212, 255, 0.2);
            border-top: 3px solid #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">⚙️</div>
        <h1>KC IDE is Starting Up</h1>
        <div class="status">Cluster Initialization in Progress</div>
        <div class="message">
            Your development environment is being prepared for optimal performance.
            This typically takes 1-3 minutes on first start.
        </div>
        <div class="spinner"></div>
        <div style="margin-top: 32px; font-size: 12px; color: #606060;">
            If this persists longer than 5 minutes, contact your administrator.
        </div>
    </div>
</body>
</html>
