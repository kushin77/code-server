services:
  app:
    environment:
      ENV_MODE: local
      ENV_NAME: kc-ide-standard
      PROFILES: ai,tracing,monitoring
    image: kushin77/kc-ide:latest
  db:
    environment:
      POSTGRES_DB: kc_ide
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_USER: admin
    image: postgres:15
version: '3.8'
