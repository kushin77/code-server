name: Secret Scanning

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, staging, develop]

permissions:
  contents: read
  security-events: write

jobs:
  secret-scanning:
    runs-on: ubuntu-latest
    name: Scan for secrets with TruffleHog
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog secret scanning
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified --fail

      - name: Run git-secrets check
        run: |
          bash scripts/setup/install-git-secrets.sh
          git secrets --scan

  git-secrets-commit-hook:
    runs-on: ubuntu-latest
    name: Verify git-secrets hook is installed
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install git-secrets
        run: bash scripts/setup/install-git-secrets.sh

      - name: Check git-secrets hook exists
        run: |
          if [ -f .git/hooks/pre-commit ]; then
            if grep -q "git secrets" .git/hooks/pre-commit; then
              echo "✓ git-secrets pre-commit hook is installed"
              exit 0
            fi
          fi
          echo "⚠ git-secrets pre-commit hook not installed"
          echo "Run: git secrets --install -f"
          exit 1
