name: CI Validate

on:
  pull_request:
  push:
    branches: [ main ]

# Ref: #390 — least-privilege permissions
permissions:
  contents: read
  issues: read

jobs:
  pre-commit:
    name: Pre-commit hooks (shellcheck, yamllint, governance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c  # v4
        with:
          python-version: '3.12'

      - name: Install pre-commit + shellcheck
        run: |
          python -m pip install --upgrade pip pre-commit
          sudo apt-get install -y shellcheck

      - name: Cache pre-commit envs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit (all files)
        # P0 blocking: shellcheck, yamllint, and governance hooks must pass
        run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: mandatory-redeploy,terraform_fmt,terraform_validate

  governance:
    name: Governance audit (library adoption + MANIFEST)
    runs-on: ubuntu-latest
    # P0 blocking (#702): governance violations must block merge — no silent pass-through
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install make + bash
        run: sudo apt-get install -y make bash

      - name: Library adoption audit (make lib-check)
        run: make lib-check

      - name: MANIFEST registry validation (make index)
        # P0: unregistered scripts are a governance violation — must block
        run: |
          make SHELL=/bin/bash index
          violations=$(make SHELL=/bin/bash index 2>&1 | grep -c '✗' || true)
          if [[ "$violations" -gt 0 ]]; then
            echo "::error::$violations script(s) not registered in scripts/MANIFEST.toml"
            echo "Run: make manifest-init to regenerate, then commit"
            exit 1
          fi
          echo "✅ MANIFEST registry: no violations"

      - name: Zero active log_info() governance violations
        # P1 advisory: inline log_info() is tech debt — annotate but do not block (#702 classification)
        run: |
          count=$(grep -rl "^log_info() {" scripts/*.sh 2>/dev/null \
            | grep -vE "_common/|logging\.sh|common-functions\.sh" | wc -l || echo 0)
          echo "Active log_info() violations: $count"
          if [[ "$count" -gt 0 ]]; then
            grep -rl "^log_info() {" scripts/*.sh 2>/dev/null \
              | grep -vE "_common/|logging\.sh|common-functions\.sh" | sed 's/^/  /'
            echo "::warning::P1-advisory: $count script(s) define inline log_info() — migrate to _common/init.sh"
          else
            echo "✅ Zero log_info() governance violations"
          fi

  service-registry:
    name: Governance — service registry SSOT
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Validate service registry against docker-compose topology
        run: bash scripts/ci/validate-service-registry.sh

      - name: Validate service registry health script syntax
        run: bash -n scripts/ci/validate-service-registry-health.sh

  test-matrix:
    name: Governance — test matrix enforcement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable corepack
        run: corepack enable

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate test matrix SSOT and PR test linkage
        run: bash scripts/ci/validate-test-matrix.sh

      - name: Backend coverage gate
        run: pnpm --dir apps/backend test:coverage

      - name: Frontend coverage gate
        run: pnpm --dir apps/frontend test:coverage

  backlog-triage:
    name: Governance — open backlog triage validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install GitHub CLI
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gh

      - name: Validate open backlog triage SSOT
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/validate-triage-open-backlog.sh

  readme-docs-integrity:
    name: README docs integrity (markdown + local links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install markdownlint-cli
        run: |
          set -euo pipefail
          sudo npm install -g markdownlint-cli@0.39.0

      - name: Lint README markdown structure
        run: |
          set -euo pipefail
          markdownlint README.md

      - name: Validate README local markdown links
        run: |
          set -euo pipefail
          failures=0
          # Validate only local relative links: [text](path)
          while IFS= read -r raw; do
            target=$(echo "$raw" | sed -E 's/^.*\]\(([^)#]+)(#[^)]+)?\).*/\1/')
            # Skip URLs, mailto, and empty anchors.
            if [[ "$target" =~ ^https?:// ]] || [[ "$target" =~ ^mailto: ]] || [[ -z "$target" ]]; then
              continue
            fi
            if [[ ! -e "$target" ]]; then
              echo "::error::README link target does not exist: $target"
              failures=1
            fi
          done < <(grep -oE '\[[^]]+\]\(([^)]+)\)' README.md || true)

          if [[ "$failures" -ne 0 ]]; then
            exit 1
          fi
          echo "README local link check passed"

  # Ref: #400 — explicit shellcheck job (also run via pre-commit above; this gives
  # clear per-file annotations in the PR diff view)
  shellcheck:
    name: Shellcheck — bash-only standards enforcement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Run shellcheck on all bash scripts
        run: |
          mapfile -t scripts < <(git ls-files --cached '*.sh' '*.bash' \
            | grep -v 'archived/' | grep -v '_archive/' | grep -v 'node_modules/' \
            | grep -v 'scripts/automated-iac-validation.sh' \
            | grep -v 'scripts/ollama-init.sh' \
            | grep -v 'scripts/pre-flight-checklist.sh' \
            | grep -v 'scripts/priority-issue-cli.sh' \
            | grep -v 'scripts/redeploy.sh' \
            | grep -v 'scripts/security-audit.sh' \
            | grep -v 'scripts/validate-topology.sh' \
            | grep -v 'scripts/ci/admin-merge.sh' \
            | grep -v 'scripts/configure-workload-federation-phase2.sh' \
            | grep -v 'scripts/memory-budget-guard.sh')
          if [[ ${#scripts[@]} -eq 0 ]]; then
            echo "No shell scripts found"; exit 0
          fi
          echo "Checking ${#scripts[@]} shell scripts..."
          shellcheck --severity=error --shell=bash "${scripts[@]}"
          echo "✅ Shellcheck passed"

  # Ref: #399 — automated Windows-specific content detection
  linux-mandate:
    name: Linux mandate — no Windows-specific content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Check for Windows-specific content
        run: bash scripts/ci/check-no-windows-content.sh

  credentials-governance:
    name: Governance — no hardcoded credentials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Check active scripts for hardcoded credential literals
        run: bash scripts/ci/check-no-hardcoded-credentials.sh

  config-drift-detection:
    name: Governance — no config drift (SSOT validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Detect hardcoded config values (IPs, domains, ports)
        run: bash scripts/ci/detect-config-drift.sh

  config-ssot-report:
    name: Governance — config SSOT report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Generate canonical config SSOT report
        run: bash scripts/ci/generate-config-ssot-report.sh

  documentation-gap-sync:
    name: Governance — documentation gap sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Verify documentation gaps remain synced to issue tracking
        run: bash scripts/ci/sync-documentation-gaps.sh --check-only

  api-specification:
    name: Governance — API specification SSOT
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Validate checked-in OpenAPI 3.1 specifications
        run: bash scripts/ci/validate-api-specification.sh

  test-matrix:
    name: Governance — test matrix enforcement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Validate matrix updates for production-facing changes
        run: bash scripts/ci/validate-test-matrix.sh

  terraform-backend-hardening:
    name: Governance — terraform backend hardening
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Verify remote backend locking and encryption controls
        run: bash scripts/ci/check-terraform-backend-hardening.sh

  image-immutability:
    name: Governance — pinned image tags only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Block floating image tags in active manifests
        run: bash scripts/ci/check-image-immutability.sh

  script-error-handling-consistency:
    name: Governance — script error-handling baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Enforce strict mode and init sourcing on critical scripts
        run: bash scripts/ci/check-error-handling-consistency.sh --strict

  authenticated-e2e:
    name: E2E — authenticated session persistence (seeded storage state)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22

      - name: Decode authenticated storage state
        shell: bash
        env:
          PLAYWRIGHT_STORAGE_STATE_B64: ${{ secrets.PLAYWRIGHT_STORAGE_STATE_B64 }}
        run: |
          set -euo pipefail
          if [[ -z "${PLAYWRIGHT_STORAGE_STATE_B64:-}" ]]; then
            echo "::error::PLAYWRIGHT_STORAGE_STATE_B64 secret is not set" >&2
            exit 1
          fi

          mkdir -p /tmp/e2e-auth
          if [[ "${PLAYWRIGHT_STORAGE_STATE_B64#\{}" != "$PLAYWRIGHT_STORAGE_STATE_B64" ]]; then
            printf '%s' "$PLAYWRIGHT_STORAGE_STATE_B64" > /tmp/e2e-auth/storage-state.json
          else
            if ! printf '%s' "$PLAYWRIGHT_STORAGE_STATE_B64" | tr -d '\r\n\t ' | base64 -d > /tmp/e2e-auth/storage-state.json 2>/tmp/e2e-auth/decode.err; then
              echo "::error::Failed to decode PLAYWRIGHT_STORAGE_STATE_B64 as base64" >&2
              cat /tmp/e2e-auth/decode.err >&2
              exit 1
            fi
          fi

          test -s /tmp/e2e-auth/storage-state.json
          node -e "JSON.parse(require('fs').readFileSync('/tmp/e2e-auth/storage-state.json', 'utf8'));"

      - name: Set up Playwright kit
        run: bash scripts/ci/setup-e2e-playwright.sh

      - name: Run authenticated Appsmith login E2E
        env:
          PORTAL_BASE_URL: https://kushnir.cloud
          IDE_BASE_URL: https://ide.kushnir.cloud
          PLAYWRIGHT_STORAGE_STATE: /tmp/e2e-auth/storage-state.json
          REQUIRE_VPN: 1
          REQUIRE_QA_STORAGE_STATE: 1
          REQUIRE_SINGLE_LOGIN: 1
        run: bash scripts/ci/run-kushnir-cloud-appsmith-login-e2e.sh

  duplicate-helper-detection:
    name: Governance — duplicate helper detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Detect duplicated helper implementations
        run: bash scripts/ci/detect-duplicate-helpers.sh

  role-profile-policy-lint:
    name: Governance — role profile recommendation policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Verify extension recommendation policy in role profiles
        run: bash scripts/ci/lint-role-profiles.sh

  extension-supply-chain:
    name: Governance — extension supply chain integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Validate curated extension manifest and marketplace block
        run: bash scripts/ci/validate-extension-supply-chain.sh

  waiver-registry-conformance:
    name: Governance — centralized waiver registry conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install jq
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq

      - name: Validate waiver registry (no expired active waivers, all entries valid)
        run: |
          mkdir -p .github/reports/governance
          bash scripts/governance/validate-waiver-registry.sh \
            --registry config/governance-waivers.json \
            --report .github/reports/governance/waiver_registry_validation.json \
            --events .github/reports/governance/waiver_audit_events.jsonl \
            --expired .github/reports/governance/waiver_expired_active.json
          echo "Waiver registry conformance: PASS"

  dockerfile-lint:
    name: Dockerfile lint (hadolint v2.12.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install hadolint
        run: |
          set -euo pipefail
          curl -fsSL -o /usr/local/bin/hadolint \
            "https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64"
          chmod +x /usr/local/bin/hadolint
          hadolint --version

      - name: Lint active Dockerfiles
        run: |
          set -euo pipefail
          hadolint Dockerfile Dockerfile.code-server Dockerfile.caddy Dockerfile.ssh-proxy Dockerfile.token-microservice
          echo "✅ Dockerfile linting passed"

  file-header-coverage:
    name: GOV-002 — @file header coverage (active scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Check active scripts satisfy GOV-002 metadata policy
        run: bash scripts/ci/check-metadata-headers.sh

  root-hygiene:
    name: Repository root taxonomy check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Check root-level file hygiene
        run: bash scripts/ci/check-root-hygiene.sh --warn-only

  pnpm-lock-governance:
    name: pnpm workspace lockfile governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 20

      - name: Enable corepack
        run: corepack enable

      - name: Validate pnpm workspace lockfile
        run: bash scripts/ci/check-pnpm-lockfile.sh

  monorepo-target:
    name: Monorepo target contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Validate monorepo architecture and layout contract
        run: bash scripts/ci/validate-monorepo-target.sh

  # ── P0 #702: Fail-closed regression test ─────────────────────────────────
  # Proves that governance checks actually block — a synthetic violation must
  # cause the validate-extension-supply-chain.sh script to exit non-zero.
  fail-closed-regression:
    name: Governance — fail-closed regression proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Synthetic violation — tampered manifest must fail
        run: |
          set -euo pipefail
          # Corrupt the manifest signature; expect non-zero exit
          tmpfile=$(mktemp)
          python3 -c "
          import json, sys
          with open('config/code-server/extensions/extensions-approved.json') as f:
              d = json.load(f)
          d['manifest_signature'] = 'deadbeef000000000000000000000000'
          with open('$tmpfile', 'w') as f:
              json.dump(d, f, indent=2)
          "
          cp config/code-server/extensions/extensions-approved.json /tmp/orig-approved.json
          cp "$tmpfile" config/code-server/extensions/extensions-approved.json
          if bash scripts/ci/validate-extension-supply-chain.sh 2>/dev/null; then
            echo "::error::FAIL-CLOSED REGRESSION: tampered manifest was NOT detected"
            cp /tmp/orig-approved.json config/code-server/extensions/extensions-approved.json
            exit 1
          fi
          cp /tmp/orig-approved.json config/code-server/extensions/extensions-approved.json
          echo "✅ Fail-closed regression: tampered manifest correctly rejected"

      - name: Synthetic violation — missing gallery block must fail
        run: |
          set -euo pipefail
          tmpfile=$(mktemp)
          python3 -c "
          import json
          with open('config/role-settings/viewer-profile.json') as f:
              d = json.load(f)
          for k in ['extensions.gallery.serviceUrl','extensions.gallery.itemUrl','extensions.gallery.resourceUrlTemplate']:
              d['settings'].pop(k, None)
          with open('$tmpfile', 'w') as f:
              json.dump(d, f, indent=2)
          "
          cp config/role-settings/viewer-profile.json /tmp/orig-viewer.json
          cp "$tmpfile" config/role-settings/viewer-profile.json
          if bash scripts/ci/validate-extension-supply-chain.sh 2>/dev/null; then
            echo "::error::FAIL-CLOSED REGRESSION: missing gallery block was NOT detected"
            cp /tmp/orig-viewer.json config/role-settings/viewer-profile.json
            exit 1
          fi
          cp /tmp/orig-viewer.json config/role-settings/viewer-profile.json
          echo "✅ Fail-closed regression: missing gallery block correctly rejected"

  # ── P1 #701: Org governance workflows ────────────────────────────────────
  org-governance-drift:
    name: Governance — org ruleset drift scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Validate org ruleset baseline schema
        run: |
          set -euo pipefail
          python3 -c "
          import json, sys
          with open('config/github-org-ruleset-baseline.json') as f:
              data = json.load(f)
          required = ['schema_version', 'org', 'rulesets']
          missing = [k for k in required if k not in data]
          if missing:
              print('ERROR: Missing required fields:', missing)
              sys.exit(1)
          print('✅ Org ruleset baseline schema valid:', len(data['rulesets']), 'rulesets defined')
          "

  # ── P1 #705: Waiver governance validation ────────────────────────────────
  waiver-governance:
    name: Governance — waiver registry validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Validate waiver registry against schema
        run: |
          set -euo pipefail
          mkdir -p /tmp/waiver-report
          exit_code=0
          bash scripts/governance/validate-waiver-registry.sh \
            --registry config/governance-waivers.json \
            --report /tmp/waiver-report/report.json \
            --events /tmp/waiver-report/events.jsonl \
            --expired /tmp/waiver-report/expired.json || exit_code=$?
          # Exit code 2 = expired active waivers; treat as blocking
          if [[ "$exit_code" -eq 2 ]]; then
            echo "::error::Expired active waivers detected — revoke or renew before merging"
            jq . /tmp/waiver-report/expired.json
            exit 1
          elif [[ "$exit_code" -eq 3 ]]; then
            echo "::error::Invalid waiver entries detected"
            jq . /tmp/waiver-report/report.json
            exit 1
          fi
          echo "✅ Waiver registry validation passed"

      - name: Upload waiver audit report
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: waiver-audit-report
          path: /tmp/waiver-report/
          retention-days: 90

  # ── P2 #704: Policy SSOT guard ───────────────────────────────────────────
  policy-ssot-guard:
    name: Governance — policy SSOT deduplication check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Check policy SSOT (no duplicate normative sections)
        # P2 advisory: duplicate policy is tech debt, not a blocking security violation
        run: |
          bash scripts/ci/check-policy-ssot.sh || \
            echo "::warning::P2-advisory: policy SSOT violations found - resolve before next release"
  # ── P1 #703: Policy version integrity guard ──────────────────────────────
  policy-version-integrity:
    name: Policy runtime — version hash integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Validate policy-version.json SHA256 hashes
        # P1 blocking: if settings.json or extensions-approved.json changed without
        # updating policy-version.json, this detects the drift and blocks the merge.
        run: bash scripts/ci/validate-policy-version.sh
