# Falco runtime anomaly detection — DaemonSet deployment
# Implements: https://github.com/kushin77/code-server/issues/873
#
# Falco monitors syscall patterns and fires alerts on anomalous behavior.
# Alerts route to AlertManager → PagerDuty/Slack via prometheus-alertmanager integration.
#
# Deploy via Helm (recommended):
#   helm repo add falcosecurity https://falcosecurity.github.io/charts
#   helm install falco falcosecurity/falco \
#     --namespace falco --create-namespace \
#     --set falco.grpc.enabled=true \
#     --set falco.grpcOutput.enabled=true \
#     --set driver.kind=ebpf \
#     --values kubernetes/security/falco-values.yaml
#
# This file provides the Helm values for the above command.
# Requires Falco chart >= 3.8.0, Falco >= 0.36.

---
# falco-values.yaml — Helm values for Falco deployment
# Save as kubernetes/security/falco-values.yaml and reference in helm install
apiVersion: v1
kind: ConfigMap
metadata:
  name: falco-helm-values-ref
  namespace: falco
  annotations:
    description: "Reference values for Falco Helm install — see file header for helm command"
data:
  note: "Use helm install with --values kubernetes/security/falco-values.yaml"
---
# Falco custom rules — project-specific anomaly detection
# Augments Falco's default ruleset with rules tailored to this stack.
apiVersion: v1
kind: ConfigMap
metadata:
  name: falco-custom-rules
  namespace: falco
  labels:
    app: falco
data:
  custom-rules.yaml: |
    # ──────────────────────────────────────────────────────────────────────────
    # Rule: Shell spawned inside a container
    # Detects exec of /bin/sh, /bin/bash, /bin/dash in any running container
    # ──────────────────────────────────────────────────────────────────────────
    - rule: Shell Spawned in Container (kushnir)
      desc: A shell was spawned inside a running container — potential RCE or breakout
      condition: >
        spawned_process and container
        and proc.name in (shell_binaries)
        and not proc.pname in (shell_binaries)
        and not container.image.repository in (known_shell_spawner_images)
      output: >
        Shell spawned in container
        (user=%user.name user_loginuid=%user.loginuid
         image=%container.image.repository:%container.image.tag
         container=%container.name cmd=%proc.cmdline
         parent=%proc.pname pcmdline=%proc.pcmdline)
      priority: WARNING
      tags: [container, shell, T1059]

    # ──────────────────────────────────────────────────────────────────────────
    # Rule: Privileged container exec
    # Detects exec into a running container with CAP_SYS_ADMIN or as UID 0
    # ──────────────────────────────────────────────────────────────────────────
    - rule: Privileged Exec in Container (kushnir)
      desc: Command executed in a privileged container or as root
      condition: >
        spawned_process and container
        and (user.uid = 0 or container.privileged = true)
        and not container.image.repository in (allowed_privileged_images)
      output: >
        Privileged exec detected
        (user=%user.name uid=%user.uid
         image=%container.image.repository:%container.image.tag
         container=%container.name cmd=%proc.cmdline)
      priority: ERROR
      tags: [container, privilege-escalation, T1611]

    # ──────────────────────────────────────────────────────────────────────────
    # Rule: Sensitive file read from container
    # Detects reads of /etc/shadow, /etc/passwd, /root/.ssh/* from containers
    # ──────────────────────────────────────────────────────────────────────────
    - rule: Sensitive File Read in Container (kushnir)
      desc: A container process read a sensitive host file
      condition: >
        open_read and container
        and (fd.name startswith /etc/shadow
             or fd.name startswith /root/.ssh
             or fd.name startswith /etc/kubernetes/admin.kubeconfig)
        and not proc.name in (known_sensitive_file_readers)
      output: >
        Sensitive file read
        (user=%user.name file=%fd.name
         image=%container.image.repository:%container.image.tag
         container=%container.name cmd=%proc.cmdline)
      priority: ERROR
      tags: [container, credential-access, T1552]

    # ──────────────────────────────────────────────────────────────────────────
    # Rule: Unexpected network connection from container
    # Detects outbound connections to unexpected destinations
    # ──────────────────────────────────────────────────────────────────────────
    - rule: Unexpected Network Connection (kushnir)
      desc: Container opened a connection to an unexpected external host
      condition: >
        outbound and container
        and not fd.sip in (allowed_container_destinations)
        and not fd.sport in (allowed_container_ports)
        and not container.image.repository in (known_external_access_images)
      output: >
        Unexpected network connection from container
        (user=%user.name
         image=%container.image.repository:%container.image.tag
         container=%container.name
         connection=%fd.name
         cmd=%proc.cmdline)
      priority: WARNING
      tags: [container, network, T1041]

    # ──────────────────────────────────────────────────────────────────────────
    # Macros and lists
    # ──────────────────────────────────────────────────────────────────────────
    - list: shell_binaries
      items: [bash, sh, dash, zsh, fish]

    - list: known_shell_spawner_images
      items:
        # code-server is a legitimate shell-spawning environment
        - "code-server-enterprise"
        - "code-server/session"

    - list: allowed_privileged_images
      items:
        # Falco itself (in falco namespace) is allowed privileged
        - "falcosecurity/falco"

    - list: known_sensitive_file_readers
      items:
        - sshd
        - su
        - sudo

    - list: allowed_container_destinations
      items:
        # Docker bridge network ranges — inter-service communication
        - "172.28.0.0/14"
        # DNS
        - "8.8.8.8"
        - "1.1.1.1"

    - list: allowed_container_ports
      items: [53, 443, 80, 8080]

    - list: known_external_access_images
      items:
        - "ollama/ollama"          # pulls models from ollama.ai

---
# Falco AlertManager integration — FalcoSidekick deployment
# FalcoSidekick forwards Falco events to AlertManager
apiVersion: apps/v1
kind: Deployment
metadata:
  name: falcosidekick
  namespace: falco
  labels:
    app: falcosidekick
spec:
  replicas: 1
  selector:
    matchLabels:
      app: falcosidekick
  template:
    metadata:
      labels:
        app: falcosidekick
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: falcosidekick
          image: falcosecurity/falcosidekick:2.28.0
          ports:
            - containerPort: 2801
          env:
            - name: ALERTMANAGER_HOSTPORT
              value: "http://alertmanager.monitoring.svc.cluster.local:9093"
            - name: ALERTMANAGER_MINIMUMPRIORITY
              value: "warning"
            - name: ALERTMANAGER_CHECKCERT
              value: "false"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: falcosidekick
  namespace: falco
  labels:
    app: falcosidekick
spec:
  selector:
    app: falcosidekick
  ports:
    - name: http
      port: 2801
      targetPort: 2801
