name: E2E Full Test Suite (Issues #986-990)

on:
  push:
    branches: [main]
    paths:
      - 'tests/e2e/**'
      - '.github/workflows/e2e-full-suite.yml'
  pull_request:
    branches: [main]
  schedule:
    # Run tests daily at 2 AM UTC (after production deployments)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_profile:
        description: 'Test execution profile'
        required: false
        default: 'standard'
        type: choice
        options:
          - quick
          - standard
          - comprehensive
      environment:
        description: 'Test environment'
        required: false
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  TEST_BASE_URL: ${{ secrets.TEST_BASE_URL || 'https://kushnir.cloud' }}
  PLAYWRIGHT_WORKERS: 1
  REQUIRE_VPN: 1

jobs:
  preflight-checks:
    name: Pre-Flight Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ready: ${{ steps.check.outputs.ready }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Run pre-flight checks
        id: check
        run: |
          bash scripts/ci/pre-flight-e2e-checks.sh --strict --quiet
          if [ $? -eq 0 ]; then
            echo "ready=true" >> $GITHUB_OUTPUT
          else
            echo "ready=false" >> $GITHUB_OUTPUT
            exit 1
          fi

  oauth-login-tests:
    name: 'Issue #986 - OAuth Login Flow'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: preflight-checks
    if: needs.preflight-checks.outputs.ready == 'true'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Fetch E2E credentials
        uses: google-github-actions/get-secretmanager-secrets@v2
        with:
          secrets_manifest:
            - name: 'qa_email'
              key: 'qa-user-email'
            - name: 'qa_password'
              key: 'qa-user-password'

      - name: Set environment variables
        env:
          QA_EMAIL: ${{ steps.secrets.outputs.qa_email }}
          QA_PASSWORD: ${{ steps.secrets.outputs.qa_password }}
        run: |
          echo "E2E_USER_EMAIL=$QA_EMAIL" >> $GITHUB_ENV
          echo "E2E_USER_PASSWORD=$QA_PASSWORD" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm ci

      - name: Run OAuth login tests
        run: npm test -- tests/e2e/specs/oauth-login.spec.ts

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oauth-login-results
          path: artifacts/
          retention-days: 30

  appsmith-portal-tests:
    name: 'Issue #987 - Appsmith Portal Testing'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: preflight-checks
    if: needs.preflight-checks.outputs.ready == 'true'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Fetch E2E credentials
        uses: google-github-actions/get-secretmanager-secrets@v2
        with:
          secrets_manifest:
            - name: 'qa_email'
              key: 'qa-user-email'
            - name: 'qa_password'
              key: 'qa-user-password'

      - name: Set environment variables
        env:
          QA_EMAIL: ${{ steps.secrets.outputs.qa_email }}
          QA_PASSWORD: ${{ steps.secrets.outputs.qa_password }}
        run: |
          echo "E2E_USER_EMAIL=$QA_EMAIL" >> $GITHUB_ENV
          echo "E2E_USER_PASSWORD=$QA_PASSWORD" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm ci

      - name: Run Appsmith portal tests
        run: npm test -- tests/e2e/specs/appsmith-login.spec.ts

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appsmith-portal-results
          path: artifacts/
          retention-days: 30

  ide-launch-tests:
    name: 'Issue #988 - IDE Launch & Operations'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: preflight-checks
    if: needs.preflight-checks.outputs.ready == 'true'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Fetch E2E credentials
        uses: google-github-actions/get-secretmanager-secrets@v2
        with:
          secrets_manifest:
            - name: 'qa_email'
              key: 'qa-user-email'
            - name: 'qa_password'
              key: 'qa-user-password'

      - name: Set environment variables
        env:
          QA_EMAIL: ${{ steps.secrets.outputs.qa_email }}
          QA_PASSWORD: ${{ steps.secrets.outputs.qa_password }}
        run: |
          echo "E2E_USER_EMAIL=$QA_EMAIL" >> $GITHUB_ENV
          echo "E2E_USER_PASSWORD=$QA_PASSWORD" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm ci

      - name: Run IDE launch tests
        run: npm test -- tests/e2e/specs/ide-launch-workspace.spec.ts

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ide-launch-results
          path: artifacts/
          retention-days: 30

  session-persistence-tests:
    name: 'Issue #989 - Session Persistence & Failover'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: preflight-checks
    if: needs.preflight-checks.outputs.ready == 'true'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Fetch E2E credentials
        uses: google-github-actions/get-secretmanager-secrets@v2
        with:
          secrets_manifest:
            - name: 'qa_email'
              key: 'qa-user-email'
            - name: 'qa_password'
              key: 'qa-user-password'

      - name: Set environment variables
        env:
          QA_EMAIL: ${{ steps.secrets.outputs.qa_email }}
          QA_PASSWORD: ${{ steps.secrets.outputs.qa_password }}
        run: |
          echo "E2E_USER_EMAIL=$QA_EMAIL" >> $GITHUB_ENV
          echo "E2E_USER_PASSWORD=$QA_PASSWORD" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm ci

      - name: Run session persistence tests
        run: npm test -- tests/e2e/specs/session-persistence-failover.spec.ts

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session-persistence-results
          path: artifacts/
          retention-days: 30

  error-handling-tests:
    name: 'Issue #990 - Error Handling & Edge Cases'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: preflight-checks
    if: needs.preflight-checks.outputs.ready == 'true'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Fetch E2E credentials
        uses: google-github-actions/get-secretmanager-secrets@v2
        with:
          secrets_manifest:
            - name: 'qa_email'
              key: 'qa-user-email'
            - name: 'qa_password'
              key: 'qa-user-password'

      - name: Set environment variables
        env:
          QA_EMAIL: ${{ steps.secrets.outputs.qa_email }}
          QA_PASSWORD: ${{ steps.secrets.outputs.qa_password }}
        run: |
          echo "E2E_USER_EMAIL=$QA_EMAIL" >> $GITHUB_ENV
          echo "E2E_USER_PASSWORD=$QA_PASSWORD" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm ci

      - name: Run error handling tests
        run: npm test -- tests/e2e/specs/error-handling-edge-cases.spec.ts

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: error-handling-results
          path: artifacts/
          retention-days: 30

  test-summary:
    name: Test Results Summary
    runs-on: ubuntu-latest
    needs: [oauth-login-tests, appsmith-portal-tests, ide-launch-tests, session-persistence-tests, error-handling-tests]
    if: always()
    timeout-minutes: 10

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-results

      - name: Publish test summary
        run: |
          echo "## E2E Test Suite Results (Issues #986-990)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Suites" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Issue #986: OAuth Login Flow" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Issue #987: Appsmith Portal Testing" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Issue #988: IDE Launch & Operations" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Issue #989: Session Persistence & Failover" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Issue #990: Error Handling & Edge Cases" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Total Tests" >> $GITHUB_STEP_SUMMARY
          echo "- 120+ E2E tests executed" >> $GITHUB_STEP_SUMMARY
          echo "- Covering: OAuth, portal, IDE, session management, error scenarios" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- [Download Test Results](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

      - name: Check job status
        if: |
          needs.oauth-login-tests.result != 'success' ||
          needs.appsmith-portal-tests.result != 'success' ||
          needs.ide-launch-tests.result != 'success' ||
          needs.session-persistence-tests.result != 'success' ||
          needs.error-handling-tests.result != 'success'
        run: |
          echo "❌ One or more test suites failed"
          exit 1

      - name: Success notification
        if: success()
        run: |
          echo "✅ All E2E test suites passed successfully!"
