services:
  opa:
    image: openpolicyagent/opa:0.58.0@sha256:63186b7f0d95e51cf4c7ee38cae6fd2cf9168020abd09d48104bd87c99f863fe
    container_name: code-server-opa
    user: 101:101
    command: run --server --log-level=info --set decision_logs.console=true
    ports:
    - 8181:8181
    volumes:
    - ./policies:/policies:ro
    - ./config:/opa-src:ro
    environment:
    - OPA_ADDR=0.0.0.0:8181
    - LOG_LEVEL=info
    healthcheck:
      test:
      - CMD
      - /opa
      - version
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
    - services
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512m
        reservations:
          cpus: '0.25'
          memory: 256m
    labels:
      io.elevatediq.component: policy-engine
      io.elevatediq.tier: infrastructure
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.5.1@sha256:e797b3934eb8d7cb2756b67e59be2ef29c18c2b45da763f540ece66d843cec85
    container_name: code-server-oauth2-proxy
    user: 65534:65534
    command:
    - --config=/etc/oauth2-proxy/oauth2-proxy.cfg
    ports:
    - 4180:4180
    volumes:
    - ./config/oauth2-proxy/oauth2-proxy.cfg:/etc/oauth2-proxy/oauth2-proxy.cfg:ro
    environment:
    - OAUTH2_PROXY_CLIENT_ID=${OAUTH2_CLIENT_ID}
    - OAUTH2_PROXY_CLIENT_SECRET=${OAUTH2_CLIENT_SECRET}
    - OAUTH2_PROXY_COOKIE_SECRET=${OAUTH2_COOKIE_SECRET:?OAUTH2_COOKIE_SECRET must
      be set}
    healthcheck:
      test:
      - CMD
      - /bin/oauth2-proxy
      - --version
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
    - services
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256m
        reservations:
          cpus: '0.25'
          memory: 128m
  caddy:
    image: caddy:2.7.4@sha256:505de4e957da923672a8c79f16581e9b717a2479a8d5ddb909ab2d1b351f2ba4
    container_name: code-server-caddy
    user: 0:0
    ports:
    - 80:80
    - 443:443
    - 443:443/udp
    volumes:
    - ./config/caddy:/etc/caddy:ro
    - caddy_data:/data
    - caddy_config:/config
    environment:
    - APEX_DOMAIN=${APEX_DOMAIN}
    - TLS_EMAIL=${TLS_EMAIL}
    - LOG_LEVEL=${LOG_LEVEL}
    healthcheck:
      test:
      - CMD
      - caddy
      - version
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
    - services
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512m
        reservations:
          cpus: '0.5'
          memory: 256m
    labels:
      io.elevatediq.component: gateway
      io.elevatediq.tier: infrastructure
  prometheus:
    image: prom/prometheus:v2.48.0@sha256:b440bc0e8aa5bab44a782952c09516b6a50f9d7b2325c1ffafac7bc833298e2e
    container_name: code-server-prometheus
    user: 65534:65534
    command:
    - --config.file=/prometheus-config/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --storage.tsdb.retention.time=30d
    - --web.enable-remote-write-receiver
    ports:
    - 9090:9090
    volumes:
    - ./config:/prometheus-config:ro
    - ./monitoring/alerts:/etc/prometheus/rules:ro
    - prometheus_data:/prometheus
    environment:
    - TZ=UTC
    healthcheck:
      test:
      - CMD-SHELL
      - (prometheus --version >/dev/null && echo OK || exit 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
    - services
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1g
        reservations:
          cpus: '0.5'
          memory: 512m
  grafana:
    image: grafana/grafana:10.2.0@sha256:1ee0c54286b8ca09a3dd1419ff8653e7780a148a006ac088544203bb0affe550
    container_name: code-server-grafana
    user: 472:472
    ports:
    - 3000:3000
    environment:
    - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
    - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    - GF_USERS_ALLOW_SIGN_UP=false
    - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
    - grafana_data:/var/lib/grafana
    - ./config/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    - ./config/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:3000/api/health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
    - services
    depends_on:
    - prometheus
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512m
        reservations:
          cpus: '0.5'
          memory: 256m
  loki:
    image: grafana/loki:2.9.4@sha256:f379a20ce9dd815884ed6446aad8819b81a8ba4d36b548ca14be8cecbc6cbca0
    container_name: code-server-loki
    user: 10001:10001
    ports:
    - 3100:3100
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
    - ./config/monitoring/loki:/etc/loki:ro
    - loki_data:/loki
    environment:
    - LOG_LEVEL=info
    healthcheck:
      test:
      - CMD-SHELL
      - (loki --version >/dev/null && echo OK || exit 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
    - services
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512m
        reservations:
          cpus: '0.5'
          memory: 256m
  alertmanager:
    image: prom/alertmanager:v0.27.0@sha256:e13b6ed5cb929eeaee733479dce55e10eb3bc2e9c4586c705a4e8da41e5eacf5
    container_name: code-server-alertmanager
    user: 65534:65534
    command:
    - --config.file=/etc/alertmanager/alertmanager.yml
    - --storage.path=/alertmanager
    - --web.external-url=http://localhost:9093
    ports:
    - 9093:9093
    volumes:
    - ./config/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    - alertmanager_data:/alertmanager
    healthcheck:
      test:
      - CMD-SHELL
      - (amtool --version >/dev/null && echo OK || exit 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
    - services
    depends_on:
      prometheus:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256m
        reservations:
          cpus: '0.25'
          memory: 128m
  qdrant:
    image: qdrant/qdrant:v1.7.0@sha256:ff1639878418c0572f50a7e1314874e399537eb97e6d2f42d6b987a07a2c4c4f
    container_name: code-server-qdrant
    user: 1000:1000
    ports:
    - 6333:6333
    - 6334:6334
    volumes:
    - ./config/qdrant-config.yaml:/qdrant/config/local_config.yaml:ro
    - qdrant_data:/qdrant/storage
    environment:
    - QDRANT_API_KEY=${QDRANT_API_KEY}
    - QDRANT__STORAGE__STORAGE_PATH=/qdrant/storage
    - QDRANT__STORAGE__SNAPSHOTS_PATH=/qdrant/storage/snapshots
    - QDRANT__STORAGE__WAL_PATH=/qdrant/storage/wal
    healthcheck:
      test:
      - CMD-SHELL
      - bash -c 'echo > /dev/tcp/localhost/6333' || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
    - services
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2g
        reservations:
          cpus: '1.0'
          memory: 1g
  postgres:
    image: postgres:16-alpine@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
    container_name: code-server-postgres
    user: 999:999
    ports:
    - 5432:5432
    environment:
    - POSTGRES_DB=${DB_NAME}
    - POSTGRES_USER=${DB_USER}
    - POSTGRES_PASSWORD=${DB_PASSWORD}
    - POSTGRES_INITDB_ARGS=--encoding=UTF8
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${DB_USER}
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
    - services
    - database
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4g
        reservations:
          cpus: '1.0'
          memory: 2g
  redis:
    image: redis:7-alpine@sha256:7aec734b2bb298a1d769fd8729f13b8514a41bf90fcdd1f38ec52267fbaa8ee6
    container_name: code-server-redis
    user: 999:999
    ports:
    - 6379:6379
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
    - redis_data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - --raw
      - incr
      - ping
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
    - services
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4g
        reservations:
          cpus: '1.0'
          memory: 2g
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.1.6@sha256:e5b6aaecf38861d199b0d26d635b83da26dd6e6acf0684cd8b92f16b4f4b8733
    container_name: code-server-redpanda
    user: 101:101
    command:
    - redpanda
    - start
    - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
    - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://redpanda:9092
    - --pandaproxy-addr=0.0.0.0:8082
    - --advertise-pandaproxy-addr=redpanda:8082
    - --schema-registry-addr=0.0.0.0:8081
    - --rpc-addr=0.0.0.0:33145
    - --advertise-rpc-addr=redpanda:33145
    ports:
    - 9092:9092
    - 29092:29092
    - 8082:8082
    - 8081:8081
    - 33145:33145
    volumes:
    - redpanda_data:/var/lib/redpanda/data
    - ./config:/redpanda-src:ro
    environment:
    - REDPANDA_BROKERS=redpanda:9092
    - TZ=UTC
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:9644/v1/status/ready
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
    - services
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8g
        reservations:
          cpus: '2.0'
          memory: 4g
    labels:
      io.elevatediq.component: event-bus
      io.elevatediq.tier: infrastructure
  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v3.7.1@sha256:d5ec9a54339db74d8efa61b18576185903694bee1deb4c029befa492e41ac78f
    container_name: code-server-redpanda-console
    user: 101:101
    ports:
    - 8085:8080
    environment:
    - KAFKA_BROKERS=redpanda:9092
    - KAFKA_SCHEMAREGISTRY_ENABLED=true
    - KAFKA_SCHEMAREGISTRY_URLS=http://redpanda:8081
    - CONSOLE_CONFIG_FILEPATH=/etc/redpanda/redpanda-console-config.yaml
    - SERVER_LISTENPORT=8080
    volumes:
    - ./config:/redpanda-console-src:ro
    depends_on:
    - redpanda
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8080/
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
    - services
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512m
        reservations:
          cpus: '0.5'
          memory: 256m
    labels:
      io.elevatediq.component: event-bus-ui
      io.elevatediq.tier: infrastructure
  ollama:
    image: ollama/ollama:0.1.16@sha256:3a3ec7ea8e006aea63ce13b7027069687ed34cc85bbd7bbebf1f565db587511a
    container_name: code-server-ollama
    user: 11434:11434
    ports:
    - 11434:11434
    volumes:
    - ollama_models:/home/ollama/.ollama
    environment:
    - HOME=/home/ollama
    - OLLAMA_HOST=0.0.0.0:11434
    - OLLAMA_MODELS=/home/ollama/.ollama/models
    healthcheck:
      test:
      - CMD
      - ollama
      - --version
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
    - services
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
networks:
  ingress:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-ingress
  services:
    external: true
    name: code-server-enterprise_services
  database:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-database
  paperclip-network:
    driver: bridge
volumes:
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
  alertmanager_data:
    driver: local
  qdrant_data:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
  redpanda_data:
    driver: local
  ollama_models:
    driver: local
  tempo_data:
    driver: local
  postgres-data:
    driver: local
  redis-cache-data:
    driver: local
  promtail_positions:
    driver: local
