openapi: 3.1.0
info:
  title: Session Broker API
  version: 1.0.0
  description: Session lifecycle API for isolated code-server sessions.
servers:
  - url: http://localhost:5000
paths:
  /sessions:
    post:
      summary: Create a new isolated session
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreateRequest'
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionCreateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /oauth2/callback:
    post:
      summary: Create or reuse a session after oauth2-proxy authentication
      operationId: oauthCallback
      parameters:
        - $ref: '#/components/parameters/AuthRequestEmail'
        - $ref: '#/components/parameters/AuthRequestUser'
      responses:
        '200':
          description: Session bootstrap response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionCallbackResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /oauth2/logout:
    post:
      summary: Terminate the current session during logout
      operationId: oauthLogout
      parameters:
        - $ref: '#/components/parameters/SessionIdHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Session terminated
        '500':
          $ref: '#/components/responses/InternalError'
  /sessions/{sessionId}:
    get:
      summary: Get session details
      operationId: getSession
      parameters:
        - $ref: '#/components/parameters/SessionIdPath'
      responses:
        '200':
          description: Session record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDetailsResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      summary: Terminate a session
      operationId: deleteSession
      parameters:
        - $ref: '#/components/parameters/SessionIdPath'
      responses:
        '204':
          description: Session terminated
        '500':
          $ref: '#/components/responses/InternalError'
  /users/{userId}/sessions:
    get:
      summary: List active sessions for a user
      operationId: listUserSessions
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        '200':
          description: Session list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSessionsResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /sessions/{sessionId}/activity:
    put:
      summary: Refresh session activity timestamp
      operationId: updateSessionActivity
      parameters:
        - $ref: '#/components/parameters/SessionIdPath'
      responses:
        '204':
          description: Activity updated
        '500':
          $ref: '#/components/responses/InternalError'
  /health:
    get:
      summary: Health check
      operationId: healthCheck
      responses:
        '200':
          description: Service healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
components:
  parameters:
    SessionIdPath:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserIdPath:
      name: userId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    AuthRequestEmail:
      name: X-Auth-Request-Email
      in: header
      required: true
      schema:
        type: string
        format: email
    AuthRequestUser:
      name: X-Auth-Request-User
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    SessionIdHeader:
      name: X-Session-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      properties:
        error:
          type: string
      required:
        - error
    SessionCreateRequest:
      type: object
      additionalProperties: false
      properties:
        userId:
          type: string
          format: uuid
        username:
          type: string
          minLength: 3
          maxLength: 32
        email:
          type: string
          format: email
        dataProfile:
          $ref: '#/components/schemas/SessionDataProfile'
        ttlSeconds:
          type: integer
          minimum: 3600
          maximum: 86400
          default: 28800
        provenance:
          $ref: '#/components/schemas/SessionProvenanceManifest'
      required:
        - userId
        - username
        - email
        - dataProfile
        - provenance
    SessionProvenanceManifest:
      type: object
      additionalProperties: false
      properties:
        manifestVersion:
          type: string
          enum: [v1]
        imageDigest:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'
        attestationRef:
          type: string
          minLength: 1
        signerIdentity:
          type: string
          minLength: 1
        verifiedAt:
          type: string
          format: date-time
        verificationResult:
          type: string
          enum: [verified, rejected]
        policyVersion:
          type: string
          minLength: 1
        freshnessHours:
          type: integer
          minimum: 1
        sessionFingerprint:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'
      required:
        - manifestVersion
        - imageDigest
        - attestationRef
        - signerIdentity
        - verifiedAt
        - verificationResult
        - policyVersion
        - freshnessHours
    SessionCreateResponse:
      type: object
      additionalProperties: false
      properties:
        sessionId:
          type: string
        dataProfile:
          $ref: '#/components/schemas/SessionDataProfile'
        dataProfileValidated:
          type: boolean
        containerPort:
          type: integer
        containerName:
          type: string
        url:
          type: string
        publicUrl:
          type: string
        expiresAt:
          type: string
          format: date-time
        provenance:
          $ref: '#/components/schemas/SessionProvenanceManifest'
      required:
        - sessionId
        - dataProfile
        - dataProfileValidated
        - containerPort
        - containerName
        - url
        - publicUrl
        - expiresAt
        - provenance
    SessionCallbackResponse:
      type: object
      additionalProperties: false
      properties:
        sessionId:
          type: string
        dataProfile:
          $ref: '#/components/schemas/SessionDataProfile'
        dataProfileValidated:
          type: boolean
        containerPort:
          type: integer
        url:
          type: string
        publicUrl:
          type: string
        provenance:
          $ref: '#/components/schemas/SessionProvenanceManifest'
      required:
        - sessionId
        - dataProfile
        - dataProfileValidated
        - containerPort
        - url
        - publicUrl
        - provenance
    LogoutRequest:
      type: object
      additionalProperties: false
      properties:
        sessionId:
          type: string
          format: uuid
    SessionDetailsResponse:
      type: object
      additionalProperties: false
      properties:
        sessionId:
          type: string
        dataProfile:
          $ref: '#/components/schemas/SessionDataProfile'
        dataProfileValidated:
          type: boolean
        status:
          type: string
          enum: [creating, running, paused, terminated]
        containerPort:
          type: integer
        containerName:
          type: string
        url:
          type: string
        publicUrl:
          type: string
        expiresAt:
          type: string
          format: date-time
        lastActivity:
          type: string
          format: date-time
        quotas:
          type: object
          additionalProperties:
            type: string
        provenance:
          $ref: '#/components/schemas/SessionProvenanceManifest'
      required:
        - sessionId
        - dataProfile
        - dataProfileValidated
        - status
        - containerPort
        - containerName
        - url
        - publicUrl
        - expiresAt
        - lastActivity
        - quotas
        - provenance
    UserSessionsResponse:
      type: object
      additionalProperties: false
      properties:
        userId:
          type: string
        sessions:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              sessionId:
                type: string
              dataProfile:
                $ref: '#/components/schemas/SessionDataProfile'
              dataProfileValidated:
                type: boolean
              status:
                type: string
                enum: [creating, running, paused, terminated]
              containerPort:
                type: integer
              publicUrl:
                type: string
              createdAt:
                type: string
                format: date-time
              expiresAt:
                type: string
                format: date-time
              lastActivity:
                type: string
                format: date-time
              provenance:
                $ref: '#/components/schemas/SessionProvenanceManifest'
            required:
              - sessionId
              - dataProfile
              - dataProfileValidated
              - status
              - containerPort
              - publicUrl
              - createdAt
              - expiresAt
              - lastActivity
              - provenance
      required:
        - userId
        - sessions
    SessionDataProfile:
      type: string
      enum: [synthetic, masked, redacted]