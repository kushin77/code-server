version: '3.8'

# Phase 14: Additional Application Services Deployment
# Expanding from 6 to 16 services per node (12 additional)
# This brings us closer to 25 services per node capacity

services:
  # ─────────────────────────────────────────────────────────────────────────
  # WEB & FRONTEND SERVICES
  # ─────────────────────────────────────────────────────────────────────────

  web-service:
    image: code-server/web-service:latest
    container_name: code-server-web-service
    networks:
      - code-server-network
    environment:
      SERVICE_NAME: "web-service"
      SERVICE_PORT: "3000"
      BACKEND_API_URL: "http://code-server-api-service:8000"
      PROMETHEUS_PORT: "9010"
      LOG_LEVEL: "info"
    ports:
      - "3000:3000"
      - "9010:9010"
    depends_on:
      - code-server-api-service
    restart: unless-stopped
    labels:
      tier: "application"
      domain: "web"

  mobile-api-service:
    image: code-server/mobile-api-service:latest
    container_name: code-server-mobile-api-service
    networks:
      - code-server-network
    environment:
      SERVICE_NAME: "mobile-api-service"
      SERVICE_PORT: "8007"
      DATABASE_URL: "postgresql://postgres:postgres_password_secure@code-server-postgres:5432/app_db"
      PROMETHEUS_PORT: "9011"
      LOG_LEVEL: "info"
    ports:
      - "8007:8007"
      - "9011:9011"
    depends_on:
      code-server-postgres:
        condition: service_healthy
    restart: unless-stopped
    labels:
      tier: "application"
      domain: "mobile"

  # ─────────────────────────────────────────────────────────────────────────
  # REPORTING & BUSINESS INTELLIGENCE
  # ─────────────────────────────────────────────────────────────────────────

  reports-service:
    image: code-server/reports-service:latest
    container_name: code-server-reports-service
    networks:
      - code-server-network
    environment:
      SERVICE_NAME: "reports-service"
      SERVICE_PORT: "8008"
      DATABASE_URL: "postgresql://postgres:postgres_password_secure@code-server-postgres:5432/app_db"
      ELASTICSEARCH_URL: "http://code-server-elastic:9200"
      PROMETHEUS_PORT: "9012"
      LOG_LEVEL: "info"
    ports:
      - "8008:8008"
      - "9012:9012"
    depends_on:
      code-server-postgres:
        condition: service_healthy
      code-server-elastic:
        condition: service_started
    restart: unless-stopped
    labels:
      tier: "application"
      domain: "reporting"

  export-service:
    image: code-server/export-service:latest
    container_name: code-server-export-service
    networks:
      - code-server-network
    environment:
      SERVICE_NAME: "export-service"
      SERVICE_PORT: "8009"
      MINIO_ENDPOINT: "http://code-server-minio:9000"
      DATABASE_URL: "postgresql://postgres:postgres_password_secure@code-server-postgres:5432/app_db"
      PROMETHEUS_PORT: "9013"
      LOG_LEVEL: "info"
    ports:
      - "8009:8009"
      - "9013:9013"
    depends_on:
      code-server-postgres:
        condition: service_healthy
    restart: unless-stopped
    labels:
      tier: "application"
      domain: "export"

  # ─────────────────────────────────────────────────────────────────────────
  # CONFIGURATION & SETTINGS
  # ─────────────────────────────────────────────────────────────────────────

  config-service:
    image: code-server/config-service:latest
    container_name: code-server-config-service
    networks:
      - code-server-network
    environment:
      SERVICE_NAME: "config-service"
      SERVICE_PORT: "8010"
      REDIS_URL: "redis://:code_server_redis_password@code-server-redis:6379/6"
      PROMETHEUS_PORT: "9014"
      LOG_LEVEL: "info"
    ports:
      - "8010:8010"
      - "9014:9014"
    depends_on:
      code-server-redis:
        condition: service_started
    restart: unless-stopped
    labels:
      tier: "application"
      domain: "config"

  # ─────────────────────────────────────────────────────────────────────────
  # PAYMENT & TRANSACTIONS
  # ─────────────────────────────────────────────────────────────────────────

  payment-service:
    image: code-server/payment-service:latest
    container_name: code-server-payment-service
    networks:
      - code-server-network
    environment:
      SERVICE_NAME: "payment-service"
      SERVICE_PORT: "8011"
      DATABASE_URL: "postgresql://postgres:postgres_password_secure@code-server-postgres:5432/app_db"
      KAFKA_BROKERS: "code-server-redpanda:9092"
      PROMETHEUS_PORT: "9015"
      LOG_LEVEL: "info"
    ports:
      - "8011:8011"
      - "9015:9015"
    depends_on:
      code-server-postgres:
        condition: service_healthy
      code-server-redpanda:
        condition: service_started
    restart: unless-stopped
    labels:
      tier: "application"
      domain: "payment"

  # ─────────────────────────────────────────────────────────────────────────
  # ADVANCED SEARCH & INDEXING
  # ─────────────────────────────────────────────────────────────────────────

  search-indexer-service:
    image: code-server/search-indexer-service:latest
    container_name: code-server-search-indexer-service
    networks:
      - code-server-network
    environment:
      SERVICE_NAME: "search-indexer-service"
      SERVICE_PORT: "8012"
      ELASTICSEARCH_URL: "http://code-server-elastic:9200"
      KAFKA_BROKERS: "code-server-redpanda:9092"
      PROMETHEUS_PORT: "9016"
      LOG_LEVEL: "info"
    ports:
      - "8012:8012"
      - "9016:9016"
    depends_on:
      code-server-elastic:
        condition: service_started
      code-server-redpanda:
        condition: service_started
    restart: unless-stopped
    labels:
      tier: "application"
      domain: "search"

  # ─────────────────────────────────────────────────────────────────────────
  # BATCH PROCESSING & SCHEDULED JOBS
  # ─────────────────────────────────────────────────────────────────────────

  batch-processor-service:
    image: code-server/batch-processor-service:latest
    container_name: code-server-batch-processor-service
    networks:
      - code-server-network
    environment:
      SERVICE_NAME: "batch-processor-service"
      KAFKA_BROKERS: "code-server-redpanda:9092"
      DATABASE_URL: "postgresql://postgres:postgres_password_secure@code-server-postgres:5432/app_db"
      PROMETHEUS_PORT: "9017"
      LOG_LEVEL: "info"
    ports:
      - "9017:9017"
    depends_on:
      code-server-postgres:
        condition: service_healthy
      code-server-redpanda:
        condition: service_started
    restart: unless-stopped
    labels:
      tier: "application"
      domain: "batch"

  # ─────────────────────────────────────────────────────────────────────────
  # EXTERNAL INTEGRATIONS & WEBHOOKS
  # ─────────────────────────────────────────────────────────────────────────

  webhook-service:
    image: code-server/webhook-service:latest
    container_name: code-server-webhook-service
    networks:
      - code-server-network
    environment:
      SERVICE_NAME: "webhook-service"
      SERVICE_PORT: "8013"
      DATABASE_URL: "postgresql://postgres:postgres_password_secure@code-server-postgres:5432/app_db"
      REDIS_URL: "redis://:code_server_redis_password@code-server-redis:6379/7"
      PROMETHEUS_PORT: "9018"
      LOG_LEVEL: "info"
    ports:
      - "8013:8013"
      - "9018:9018"
    depends_on:
      code-server-postgres:
        condition: service_healthy
    restart: unless-stopped
    labels:
      tier: "application"
      domain: "webhooks"

  integration-service:
    image: code-server/integration-service:latest
    container_name: code-server-integration-service
    networks:
      - code-server-network
    environment:
      SERVICE_NAME: "integration-service"
      SERVICE_PORT: "8014"
      REDIS_URL: "redis://:code_server_redis_password@code-server-redis:6379/8"
      PROMETHEUS_PORT: "9019"
      LOG_LEVEL: "info"
    ports:
      - "8014:8014"
      - "9019:9019"
    depends_on:
      code-server-redis:
        condition: service_started
    restart: unless-stopped
    labels:
      tier: "application"
      domain: "integration"

  # ─────────────────────────────────────────────────────────────────────────
  # HEALTH CHECK & MONITORING AGENT
  # ─────────────────────────────────────────────────────────────────────────

  health-monitor-service:
    image: code-server/health-monitor-service:latest
    container_name: code-server-health-monitor-service
    networks:
      - code-server-network
    environment:
      SERVICE_NAME: "health-monitor-service"
      SERVICE_PORT: "8015"
      PROMETHEUS_PORT: "9020"
      LOG_LEVEL: "info"
    ports:
      - "8015:8015"
      - "9020:9020"
    restart: unless-stopped
    labels:
      tier: "application"
      domain: "monitoring"

networks:
  code-server-network:
    external: true
    name: code-server_code-server-network
