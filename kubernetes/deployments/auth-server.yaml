apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-server
  namespace: code-server
spec:
  replicas: 3
  selector:
    matchLabels:
      app: auth-server
  template:
    metadata:
      labels:
        app: auth-server
    spec:
      containers:
      - name: auth-server
        image: kushin77/code-server-auth:v1.12.0
        ports:
        - containerPort: 8080
