groups:
  - name: production_slos
    interval: 30s
    rules:
      # Error rate alerts
      - alert: HighErrorRate
        expr: (rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m])) > 0.001
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "High error rate detected ({{ $value | humanizePercentage }})"
          description: "Error rate is above 0.1% on {{ $labels.instance }}"

      # Latency alerts
      - alert: HighP99Latency
        expr: histogram_quantile(0.99, http_request_duration_seconds_bucket) > 0.1
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High p99 latency detected ({{ $value }}s)"
          description: "p99 latency is above 100ms on {{ $labels.instance }}"

      # CPU alerts
      - alert: HighCPUUsage
        expr: (100 - (avg by (instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)) > 80
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High CPU usage detected ({{ $value | humanize }}%)"
          description: "CPU usage is above 80% on {{ $labels.instance }}"

      # Memory alerts
      - alert: HighMemoryUsage
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) < 0.1
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High memory usage detected"
          description: "Available memory is below 10% on {{ $labels.instance }}"

      # Service availability
      - alert: ServiceDown
        expr: up{job!="prometheus"} == 0
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "{{ $labels.instance }} has been unreachable for 2 minutes"

      # Session broker quota pressure
      - alert: SessionBrokerQuotaPressure
        expr: max by (team_id) (session_broker_team_active_sessions) / session_broker_policy_max_concurrent_per_team > 0.8
        for: 10m
        labels:
          severity: warning
          team: platform
          component: session-broker
        annotations:
          summary: "Session broker quota pressure for {{ $labels.team_id }}"
          description: "Active sessions are at least 80% of the team quota for 10 minutes. Review the FinOps dashboard before raising limits."

      # Session broker launch denial burst
      - alert: SessionBrokerQuotaDenialBurst
        expr: increase(session_broker_launch_denials_total_all[10m]) > 5
        for: 5m
        labels:
          severity: critical
          team: platform
          component: session-broker
        annotations:
          summary: "Session broker quota denial burst detected"
          description: "More than five launch denials were recorded in 10 minutes. Check team demand and session limits."

      # Session broker reaper stalled
      - alert: SessionBrokerReaperStalled
        expr: session_broker_reaper_last_success_epoch_seconds > 0 and (time() - session_broker_reaper_last_success_epoch_seconds) > 1800
        for: 10m
        labels:
          severity: critical
          team: platform
          component: session-broker
        annotations:
          summary: "Session broker stale-session reaper has stalled"
          description: "The stale-session reaper has not reported a successful run for 30 minutes."

      # Disk space
      - alert: LowDiskSpace
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|fuse.lxcfs|squashfs|vfat"} / node_filesystem_size_bytes) < 0.1
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Low disk space warning"
          description: "Available disk space is below 10% on {{ $labels.device }}"

      # Redis memory
      - alert: RedisHighMemory
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.9
        for: 5m
        labels:
          severity: warning
          team: cache
        annotations:
          summary: "Redis memory usage high ({{ $value | humanizePercentage }})"
          description: "Redis memory usage is above 90%"

      # Prometheus targets down
      - alert: PrometheusTargetsDown
        expr: up == 0
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Prometheus scrape target down"
          description: "Target {{ $labels.instance }} (job: {{ $labels.job }}) is down"
