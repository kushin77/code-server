# Redpanda Console Configuration
# Kafka event bus administration UI
# Accessible at kafka.kushnir.cloud:8080

# Server configuration
server:
  listenPort: 8080
  listenAddress: "0.0.0.0"
  basePath: ""
  stripPrefix: false

# Kafka connection
kafka:
  brokers:
    - "redpanda:9092"
  clientId: "redpanda-console"
  sasl:
    enabled: false
  tls:
    enabled: false
  schemaRegistry:
    enabled: false

# Redpanda Admin API integration
redpanda:
  adminApi:
    enabled: true
    urls:
      - "redpanda:9644"
    tls:
      enabled: false

# Console features
console:
  topicData:
    maxMessageCount: 100
    search:
      enabled: true
      timeoutMs: 5000
  protobuf:
    enabled: false
  messageSearch:
    enabled: true
    searchTimeoutMs: 5000
  topicDocumentation:
    enabled: true
    git:
      enabled: false

# Authentication (disabled for internal use)
login:
  enabled: false

# Metrics
metrics:
  enabled: true
  namespace: "redpanda_console"

# Logging
logger:
  level: "info"