# NVMe Drive Monitoring Alerts - P0 #1635
# Alerts for hardware failures to prevent cascade outages
#
# Monitoring targets:
# - NVMe drive SMART status
# - Disk I/O latency
# - Disk error rates
# - Temperature

groups:
  - name: nvme_hardware_alerts
    interval: 30s
    rules:
      # CRITICAL: NVMe SMART status indicates failure
      - alert: NVMeDriveFailure
        expr: node_filesystem_device_error > 0
        for: 2m
        labels:
          severity: critical
          component: hardware
          incident: P0_1635
        annotations:
          summary: "NVMe drive failure detected on {{ $labels.device }}"
          description: "NVMe drive {{ $labels.device }} has SMART errors. Immediate failover required. Incident P0 #1635."
          runbook: "P0-INCIDENT-RESPONSE-EXECUTION-RUNBOOK.sh"

      # WARNING: High disk I/O latency (potential degradation)
      - alert: HighDiskIOLatency
        expr: node_disk_io_time_weighted_seconds_total > 5000
        for: 5m
        labels:
          severity: warning
          component: hardware
        annotations:
          summary: "High disk I/O latency on {{ $labels.device }}"
          description: "Disk {{ $labels.device }} showing high I/O latency. May indicate failing drive."

      # WARNING: Disk error rate increasing
      - alert: DiskErrorRateHigh
        expr: rate(node_disk_io_errs_total[5m]) > 1
        for: 3m
        labels:
          severity: warning
          component: hardware
        annotations:
          summary: "High error rate on {{ $labels.device }}"
          description: "Disk {{ $labels.device }} error rate is {{ $value }} errors/sec"

      # INFO: Disk temperature warning (if available)
      - alert: DiskTemperatureHigh
        expr: node_hwmon_temp_celsius > 60
        for: 10m
        labels:
          severity: warning
          component: hardware
        annotations:
          summary: "High temperature on {{ $labels.chip }}"
          description: "Temperature {{ $value }}°C exceeds safe threshold"

      # CRITICAL: Replica 2 unreachable (potential hardware failure impact)
      - alert: Replica2Unreachable
        expr: up{job="replica-2"} == 0
        for: 1m
        labels:
          severity: critical
          component: infrastructure
          incident: P0_1635
        annotations:
          summary: "Replica 2 (192.168.168.42) is unreachable"
          description: "Replica 2 health check failed. May be due to NVMe failure. Activating failover procedures."
          runbook: "P0-INCIDENT-RESPONSE-EXECUTION-RUNBOOK.sh"

      # CRITICAL: Both replicas unreachable (total outage)
      - alert: AllReplicasDown
        expr: count(up{job=~"replica-[12]"} == 1) == 0
        for: 30s
        labels:
          severity: critical
          component: infrastructure
          incident: P0_COMPLETE_OUTAGE
        annotations:
          summary: "ALL REPLICAS DOWN - COMPLETE OUTAGE"
          description: "Both Replica 1 and Replica 2 are unreachable. Immediate escalation required."
