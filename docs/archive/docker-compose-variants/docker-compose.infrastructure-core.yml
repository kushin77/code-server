# Core Infrastructure Services - Simplified, Config-Free
version: '3.9'

services:
  # Database
  postgres:
    image: postgres:16-alpine
    container_name: code-server-postgres
    user: "999:999"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password_phase6
      POSTGRES_DB: code_server
      POSTGRES_INITDB_ARGS: "-c max_connections=200"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - code-server-network

  # Cache
  redis:
    image: redis:7-alpine
    container_name: code-server-redis
    user: "999:999"
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - code-server-network

  # Message Queue
  redpanda:
    image: redpandadata/redpanda:v24.1.1
    container_name: code-server-redpanda
    user: "999:999"
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - "512M"
      - --reserve-memory
      - "100M"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    ports:
      - "9092:9092"
      - "9644:9644"
    healthcheck:
      test: ["CMD", "curl", "-s", "-f", "http://localhost:9644/v1/status/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - code-server-network

  # Vector Database
  qdrant:
    image: qdrant/qdrant:v1.7.0
    container_name: code-server-qdrant
    user: "1000:1000"
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      QDRANT_ALLOW_RECOVERY_MODE: "false"
      QDRANT_TELEMETRY_DISABLED: "true"
    restart: unless-stopped
    networks:
      - code-server-network

  # LLM Inference
  ollama:
    image: ollama/ollama:latest
    container_name: code-server-ollama
    user: "11434:11434"
    volumes:
      - ollama_data:/home/ollama/.ollama
    ports:
      - "11434:11434"
    environment:
      OLLAMA_MODELS: "llama2:7b"
    restart: unless-stopped
    networks:
      - code-server-network

  # Metrics Collection
  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: code-server-prometheus
    user: "65534:65534"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    volumes:
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - code-server-network

  # Visualization
  grafana:
    image: grafana/grafana:10.2.0
    container_name: code-server-grafana
    user: "472:472"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: "grafana-piechart-panel"
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - code-server-network

  # Logging
  loki:
    image: grafana/loki:2.9.1
    container_name: code-server-loki
    user: "10001:10001"
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    environment:
      - LOKI_CONFIG_FILE=/etc/loki/local-config.yaml
    restart: unless-stopped
    networks:
      - code-server-network

  # Tracing
  tempo:
    image: grafana/tempo:latest
    container_name: code-server-tempo
    user: "10001:10001"
    command: [ "-config.file=/etc/tempo/tempo.yml" ]
    ports:
      - "3200:3200"
      - "4317:4317"
    volumes:
      - tempo_data:/var/tempo
    restart: unless-stopped
    networks:
      - code-server-network

  # Alerts
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: code-server-alertmanager
    user: "65534:65534"
    ports:
      - "9093:9093"
    restart: unless-stopped
    networks:
      - code-server-network

  # Policy Engine
  opa:
    image: openpolicyagent/opa:0.58.0
    container_name: code-server-opa
    command:
      - "run"
      - "--server"
      - "--log-level=debug"
    ports:
      - "8181:8181"
    restart: unless-stopped
    networks:
      - code-server-network

  # TLS Gateway
  caddy:
    image: caddy:2.7.4-alpine
    container_name: code-server-caddy
    user: "65534:65534"
    command: caddy run --config /etc/caddy/Caddyfile
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    networks:
      - code-server-network

volumes:
  postgres_data:
  redis_data:
  redpanda_data:
  qdrant_data:
  ollama_data:
  prometheus_data:
  grafana_data:
  tempo_data:

networks:
  code-server-network:
    driver: bridge
