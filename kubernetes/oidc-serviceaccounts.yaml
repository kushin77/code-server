apiVersion: v1
kind: Namespace
metadata:
  name: code-server-workloads
  labels:
    app: code-server
    component: oidc-workloads
---
# ────────────────────────────────────────────────────────────────────────────
# GitHub Actions CI/CD ServiceAccount
# Allows GitHub Actions runners in-cluster to authenticate as CI service
# ────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-actions-ci
  namespace: code-server-workloads
  labels:
    app: code-server
    workload: github-actions
    env: production
---
# ────────────────────────────────────────────────────────────────────────────
# Batch Jobs ServiceAccount
# For scheduled jobs, data processing, database migrations, etc.
# ────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: batch-processor
  namespace: code-server-workloads
  labels:
    app: code-server
    workload: batch
    env: production
---
# ────────────────────────────────────────────────────────────────────────────
# Webhook Receiver ServiceAccount
# For external webhook services that need to call our API
# ────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: webhook-receiver
  namespace: code-server-workloads
  labels:
    app: code-server
    workload: webhooks
    env: production
---
# ────────────────────────────────────────────────────────────────────────────
# Cluster Admin ServiceAccount
# For administrative operations (deployments, monitoring, etc.)
# ────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-admin
  namespace: code-server-workloads
  labels:
    app: code-server
    workload: admin
    env: production
---
# ────────────────────────────────────────────────────────────────────────────
# ClusterRole for CI/CD operations
# Defines permissions for GitHub Actions workloads
# ────────────────────────────────────────────────────────────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: code-server-github-actions
  labels:
    app: code-server
spec:
  rules:
  # Read deployments, services, configmaps (for deployment info)
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "secrets"]
    verbs: ["get", "list"]
  # Ability to create/update resources in specific namespaces
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["code-server", "oauth2-proxy", "session-broker"]
    namespaces: ["code-server-workloads"]
    verbs: ["get", "patch", "update"]
  # Create pods for testing
  - apiGroups: [""]
    resources: ["pods"]
    namespaces: ["code-server-workloads"]
    verbs: ["create", "get", "list", "delete"]
  # Read logs for debugging
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
---
# ────────────────────────────────────────────────────────────────────────────
# ClusterRole for batch processing operations
# ────────────────────────────────────────────────────────────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: code-server-batch-processor
  labels:
    app: code-server
spec:
  rules:
  # Read configuration
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
  # Create/read batch jobs
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  # Read persistent volumes for data
  - apiGroups: [""]
    resources: ["persistentvolumes", "persistentvolumeclaims"]
    verbs: ["get", "list"]
---
# ────────────────────────────────────────────────────────────────────────────
# ClusterRoleBinding for GitHub Actions ServiceAccount
# ────────────────────────────────────────────────────────────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: code-server-github-actions-binding
  labels:
    app: code-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: code-server-github-actions
subjects:
- kind: ServiceAccount
  name: github-actions-ci
  namespace: code-server-workloads
---
# ────────────────────────────────────────────────────────────────────────────
# ClusterRoleBinding for Batch Processor ServiceAccount
# ────────────────────────────────────────────────────────────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: code-server-batch-processor-binding
  labels:
    app: code-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: code-server-batch-processor
subjects:
- kind: ServiceAccount
  name: batch-processor
  namespace: code-server-workloads
---
# ────────────────────────────────────────────────────────────────────────────
# Example: Pod with OIDC Token Projection
#
# This demonstrates how to mount an OIDC token in a pod's filesystem
# The pod can then read the token from the projected volume and use it
# to authenticate with the API server.
#
# Key components:
#   1. serviceAccountName: References the ServiceAccount above
#   2. volumes[].projected: Mounts OIDC token from Kubernetes
#   3. containers[].volumeMounts: Mounts token into container filesystem
#   4. Token available at: /var/run/secrets/tokens/oidc/token
# ────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Pod
metadata:
  name: github-actions-test-pod
  namespace: code-server-workloads
  labels:
    app: code-server
    workload: github-actions
spec:
  serviceAccountName: github-actions-ci
  containers:
  - name: ci-worker
    image: ubuntu:22.04
    command: ["/bin/bash"]
    args: 
      - -c
      - |
        echo "Token location: /var/run/secrets/tokens/oidc/token"
        
        # Display token (first 50 chars)
        head -c 50 /var/run/secrets/tokens/oidc/token
        echo ""
        echo ""
        
        # Verify token is JWT format (3 parts separated by dots)
        JWT_PARTS=$(grep -o '\.' /var/run/secrets/tokens/oidc/token | wc -l)
        echo "JWT parts found: $JWT_PARTS (expected: 2)"
        
        # Keep pod alive for inspection
        sleep 3600
    volumeMounts:
    - name: oidc-token
      mountPath: /var/run/secrets/tokens/oidc
      readOnly: true
    - name: oidc-ca
      mountPath: /var/run/secrets/tokens/ca
      readOnly: true
  volumes:
  - name: oidc-token
    projected:
      sources:
      - serviceAccountToken:
          path: token
          expirationSeconds: 3600
          # Issuer URL must match OIDC_JWT_ISSUER_URL from oauth2-oidc-issuer config
          audience: kubernetes
  - name: oidc-ca
    projected:
      sources:
      - configMap:
          name: kube-root-ca.crt
          optional: true
          items:
          - key: ca.crt
            path: ca.crt
  restartPolicy: OnFailure
  terminationGracePeriodSeconds: 5
---
# ────────────────────────────────────────────────────────────────────────────
# Deployment Example: CI/CD Runner with OIDC Token
#
# This is a production-ready example of a deployment that:
# 1. Mounts an OIDC token from projected volume
# 2. Periodically exchanges token for API access_token
# 3. Uses the access_token to authenticate API calls
# ────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-actions-runner
  namespace: code-server-workloads
  labels:
    app: code-server
    component: github-actions
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: code-server
      component: github-actions
  template:
    metadata:
      labels:
        app: code-server
        component: github-actions
      annotations:
        oidc.kubernetes.io/issuer: "https://ide.kushnir.cloud"
        oidc.kubernetes.io/audience: "kubernetes"
    spec:
      serviceAccountName: github-actions-ci
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: runner
        image: myregistry.azurecr.io/ci-runner:latest@sha256:abc123...
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: OIDC_ISSUER_URL
          value: "https://ide.kushnir.cloud"
        - name: OIDC_AUDIENCE
          value: "kubernetes"
        - name: OIDC_TOKEN_PATH
          value: "/var/run/secrets/tokens/oidc/token"
        - name: API_SERVER_URL
          value: "http://api:3000"
        - name: LOG_LEVEL
          value: "info"
        volumeMounts:
        - name: oidc-token
          mountPath: /var/run/secrets/tokens/oidc
          readOnly: true
        - name: config
          mountPath: /etc/ci-runner
          readOnly: true
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 2
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2"
            memory: "2Gi"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: oidc-token
        projected:
          sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 3600
              audience: kubernetes
      - name: config
        configMap:
          name: github-actions-runner-config
          optional: true
      terminationGracePeriodSeconds: 30
      nodeSelector:
        kubernetes.io/os: linux
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: component
                  operator: In
                  values:
                  - github-actions
              topologyKey: kubernetes.io/hostname
---
# ────────────────────────────────────────────────────────────────────────────
# NetworkPolicy: CI Runner can only call API and OIDC issuer
# ────────────────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: github-actions-network-policy
  namespace: code-server-workloads
spec:
  podSelector:
    matchLabels:
      component: github-actions
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 8080
  egress:
  # Allow DNS
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: UDP
      port: 53
  # Allow OIDC token exchange
  - to:
    - podSelector:
        matchLabels:
          component: oauth2-oidc-issuer
    ports:
    - protocol: TCP
      port: 4182
  # Allow API calls
  - to:
    - podSelector:
        matchLabels:
          component: api
    ports:
    - protocol: TCP
      port: 3000
