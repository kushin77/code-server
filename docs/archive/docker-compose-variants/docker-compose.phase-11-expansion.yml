services:
  # ===== CORE DATA LAYER (5 services) =====
  postgres:
    image: postgres:16-alpine
    container_name: code-server-postgres
    environment:
      POSTGRES_PASSWORD: postgres_password_secure
      POSTGRES_DB: code_server
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - code-server-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres-backup:
    image: postgres:16-alpine
    container_name: code-server-postgres-backup
    environment:
      POSTGRES_PASSWORD: postgres_password_backup
      POSTGRES_DB: code_server_backup
    ports:
      - "5433:5432"
    volumes:
      - postgres_backup_data:/var/lib/postgresql/data
    networks:
      - code-server-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: code-server-redis
    command: redis-server --requirepass code_server_redis_password --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - code-server-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis-replica:
    image: redis:7-alpine
    container_name: code-server-redis-replica
    command: redis-server --requirepass code_server_redis_password --port 6380 --appendonly yes
    ports:
      - "6380:6380"
    volumes:
      - redis_replica_data:/data
    networks:
      - code-server-network
    restart: unless-stopped

  redpanda:
    image: redpandadata/redpanda:v24.1.1
    container_name: code-server-redpanda
    command: redpanda start --smp 2 --memory 512M --overprovisioned
    ports:
      - "9092:9092"
      - "29092:29092"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    networks:
      - code-server-network
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.7.0
    container_name: code-server-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - code-server-network
    restart: unless-stopped

  # ===== OBSERVABILITY STACK (12 services) =====
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: code-server-prometheus
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - code-server-network
    restart: unless-stopped

  prometheus-replica:
    image: prom/prometheus:v2.48.0
    container_name: code-server-prometheus-replica
    ports:
      - "9091:9090"
    volumes:
      - prometheus_replica_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - code-server-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.0
    container_name: code-server-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-piechart-panel,grafana-worldmap-panel
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - code-server-network
    depends_on:
      - prometheus
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.4
    container_name: code-server-loki
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    networks:
      - code-server-network
    restart: unless-stopped

  loki-distributor:
    image: grafana/loki:2.9.4
    container_name: code-server-loki-distributor
    ports:
      - "3101:3100"
    command: -config.file=/etc/loki/local-config.yaml -target=distributor
    volumes:
      - loki_distributor_data:/loki
    networks:
      - code-server-network
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.4.1
    container_name: code-server-tempo
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4319:4319"
    volumes:
      - tempo_data:/var/tempo
    networks:
      - code-server-network
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: code-server-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - alertmanager_data:/alertmanager
    networks:
      - code-server-network
    restart: unless-stopped

  alertmanager-replica:
    image: prom/alertmanager:v0.27.0
    container_name: code-server-alertmanager-replica
    ports:
      - "9094:9093"
    volumes:
      - alertmanager_replica_data:/alertmanager
    networks:
      - code-server-network
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: code-server-otel-collector
    ports:
      - "4318:4318"
      - "8888:8888"
      - "9411:9411"
    volumes:
      - otel_collector_data:/var/otel
    networks:
      - code-server-network
    restart: unless-stopped

  # ===== GATEWAY & SECURITY (6 services) =====
  caddy:
    image: caddy:2.7.4
    container_name: code-server-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - code-server-network
    restart: unless-stopped

  caddy-secondary:
    image: caddy:2.7.4
    container_name: code-server-caddy-secondary
    ports:
      - "8084:80"
      - "8443:443"
    volumes:
      - caddy_secondary_data:/data
      - caddy_secondary_config:/config
    networks:
      - code-server-network
    restart: unless-stopped

  opa:
    image: openpolicyagent/opa:0.58.0
    container_name: code-server-opa
    ports:
      - "8181:8181"
    command: run --server
    networks:
      - code-server-network
    restart: unless-stopped

  opa-evaluator:
    image: openpolicyagent/opa:0.58.0
    container_name: code-server-opa-evaluator
    ports:
      - "8182:8181"
    command: run --server
    networks:
      - code-server-network
    restart: unless-stopped

  vault:
    image: vault:1.15
    container_name: code-server-vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    command: server -dev
    networks:
      - code-server-network
    restart: unless-stopped

  vault-replica:
    image: vault:1.15
    container_name: code-server-vault-replica
    ports:
      - "8201:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    command: server -dev
    networks:
      - code-server-network
    restart: unless-stopped

  # ===== MANAGEMENT & UI (6 services) =====
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: code-server-redis-commander
    environment:
      REDIS_HOSTS: primary:redis:6379:0:code_server_redis_password
    ports:
      - "8086:8081"
    networks:
      - code-server-network
    depends_on:
      - redis
    restart: unless-stopped

  redpanda-console:
    image: redpandadata/console:latest
    container_name: code-server-redpanda-console
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8082:8080"
    networks:
      - code-server-network
    depends_on:
      - redpanda
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: code-server-postgres-exporter
    environment:
      DATA_SOURCE_NAME: postgresql://postgres:postgres_password_secure@postgres:5432/postgres?sslmode=disable
    ports:
      - "9187:9187"
    networks:
      - code-server-network
    depends_on:
      - postgres
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: code-server-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@kushnir.cloud
      PGADMIN_DEFAULT_PASSWORD: pgadmin_password
    ports:
      - "5050:80"
    networks:
      - code-server-network
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: code-server-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - code-server-network
    restart: unless-stopped

  minio-mc:
    image: minio/mc:latest
    container_name: code-server-minio-mc
    ports:
      - "9002:9001"
    networks:
      - code-server-network
    restart: unless-stopped

  # ===== AI & INFERENCE (2 services) =====
  ollama:
    image: ollama/ollama:0.1.16
    container_name: code-server-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - code-server-network
    restart: unless-stopped

  ollama-webui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: code-server-ollama-webui
    ports:
      - "8085:8080"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    networks:
      - code-server-network
    depends_on:
      - ollama
    restart: unless-stopped

  # ===== UTILITY & INFRASTRUCTURE (10 services) =====
  utility-sidecar-1:
    image: alpine:3.20
    container_name: code-server-utility-sidecar-1
    command: tail -f /dev/null
    networks:
      - code-server-network
    restart: unless-stopped

  utility-sidecar-2:
    image: alpine:3.20
    container_name: code-server-utility-sidecar-2
    command: tail -f /dev/null
    networks:
      - code-server-network
    restart: unless-stopped

  utility-sidecar-3:
    image: alpine:3.20
    container_name: code-server-utility-sidecar-3
    command: tail -f /dev/null
    networks:
      - code-server-network
    restart: unless-stopped

  utility-sidecar-4:
    image: alpine:3.20
    container_name: code-server-utility-sidecar-4
    command: tail -f /dev/null
    networks:
      - code-server-network
    restart: unless-stopped

  utility-sidecar-5:
    image: alpine:3.20
    container_name: code-server-utility-sidecar-5
    command: tail -f /dev/null
    networks:
      - code-server-network
    restart: unless-stopped

  utility-sidecar-6:
    image: alpine:3.20
    container_name: code-server-utility-sidecar-6
    command: tail -f /dev/null
    networks:
      - code-server-network
    restart: unless-stopped

  utility-sidecar-7:
    image: alpine:3.20
    container_name: code-server-utility-sidecar-7
    command: tail -f /dev/null
    networks:
      - code-server-network
    restart: unless-stopped

  utility-sidecar-8:
    image: alpine:3.20
    container_name: code-server-utility-sidecar-8
    command: tail -f /dev/null
    networks:
      - code-server-network
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.10
    container_name: code-server-etcd
    ports:
      - "2379:2379"
      - "2380:2380"
    environment:
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
    volumes:
      - etcd_data:/etcd-data
    networks:
      - code-server-network
    restart: unless-stopped

  consul:
    image: consul:1.17
    container_name: code-server-consul
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    command: agent -server -ui -node=server-1 -bootstrap-expect=1 -client=0.0.0.0
    volumes:
      - consul_data:/consul/data
    networks:
      - code-server-network
    restart: unless-stopped

networks:
  code-server-network:
    driver: bridge

volumes:
  # Core data
  postgres_data:
  postgres_backup_data:
  redis_data:
  redis_replica_data:
  redpanda_data:
  qdrant_data:
  
  # Observability
  prometheus_data:
  prometheus_replica_data:
  grafana_data:
  loki_data:
  loki_distributor_data:
  tempo_data:
  alertmanager_data:
  alertmanager_replica_data:
  otel_collector_data:
  
  # Gateway & security
  caddy_data:
  caddy_config:
  caddy_secondary_data:
  caddy_secondary_config:
  
  # AI & Inference
  ollama_data:
  
  # Management
  minio_data:
  
  # Infrastructure
  etcd_data:
  consul_data:
