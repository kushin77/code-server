name: Test Edge Agent

on:
  push:
    paths:
      - 'apps/edge-agent/**'
      - 'apps/edge_agent/**'
      - 'scripts/edge-agent/**'
      - 'apps/control-plane/edge_agent_handlers.py'
      - '.github/workflows/test-edge-agent.yml'
    branches:
      - main
  pull_request:
    paths:
      - 'apps/edge-agent/**'
      - 'apps/edge_agent/**'
      - 'scripts/edge-agent/**'
      - 'apps/control-plane/edge_agent_handlers.py'
      - '.github/workflows/test-edge-agent.yml'
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: apppass
          POSTGRES_DB: appdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@a5ac7e51b41094c153705408e0e3a0dd2b15a8fd

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@0c50fcf487b9e45395f457b55cd37dda4d53a0b3
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/edge-agent/requirements.txt

      - name: Lint Python files
        run: |
          flake8 apps/edge-agent/ apps/control-plane/edge_agent_handlers.py \
            --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Type check with mypy
        run: |
          mypy apps/edge-agent/models.py apps/control-plane/edge_agent_handlers.py \
            --ignore-missing-imports --show-error-codes || true

      - name: Format check with black
        run: |
          black --check apps/edge-agent/ apps/control-plane/edge_agent_handlers.py || true

      - name: Validate shell scripts
        run: |
          sudo apt-get install -y shellcheck
          shellcheck scripts/edge-agent/*.sh

      - name: Run Python tests
        run: |
          pytest apps/edge_agent/tests/test_edge_agent.py -v --cov=apps/edge_agent --cov-report=xml || true
        env:
          DATABASE_URL: postgresql://appuser:apppass@localhost:5432/appdb
          REDIS_URL: redis://localhost:6379

      - name: Build Docker image
        run: |
          docker build -t paperclip/edge-agent:test -f apps/edge-agent/Dockerfile .

      - name: Test Docker image
        run: |
          # Run container with health check
          docker run --rm -d \
            --name edge-agent-test \
            -e CONTROL_PLANE=http://localhost:8080 \
            -e EDGE_LOCATION=us-west \
            paperclip/edge-agent:test

          # Wait for health check
          sleep 10

          # Verify container is running
          docker ps | grep edge-agent-test

          # Cleanup
          docker stop edge-agent-test

      - name: Upload coverage reports
        uses: codecov/codecov-action@5ecb98a3c6b747a27063fa0cfb40d486605eab2d
        with:
          files: ./coverage.xml
          flags: edge-agent
          name: edge-agent-coverage
        if: always()

      - name: Comment PR with test results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ **Edge Agent Tests Passed**\n\n- ✓ Python linting (flake8)\n- ✓ Type checking (mypy)\n- ✓ Shell script validation\n- ✓ Docker build successful\n- ✓ Health check verified'
            })

      - name: Create deployment artifact
        if: github.ref == 'refs/heads/main' && success()
        run: |
          echo "EDGE_AGENT_IMAGE=paperclip/edge-agent:$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Notify deployment readiness
        if: github.ref == 'refs/heads/main' && success()
        run: |
          echo "🚀 Edge Agent ready for deployment: ${{ env.EDGE_AGENT_IMAGE }}"

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@a5ac7e51b41094c153705408e0e3a0dd2b15a8fd

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@f9d7f7ce84b5ff6c1db95dfeb2f9b7e7c1a7e9b1
        with:
          scan-type: 'fs'
          scan-ref: 'apps/edge-agent'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@47b3685406db198331def50aa2487e3ff62b5776
        with:
          sarif_file: 'trivy-results.sarif'
        if: always()

  lint-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@a5ac7e51b41094c153705408e0e3a0dd2b15a8fd

      - name: Validate Markdown
        uses: nosborn/github-action-markdown-cli@c0c9b1f4f5f5f5f5f5f5f5f5f5f5f5f5f5f5f5f5
        with:
          files: docs/edge-agent/PHASE-3-*.md
        continue-on-error: true
