# @file        config/loki/loki-config.yaml
# @module      observability/loki
# @description Grafana Loki configuration with tiered retention enforcement
# @governance  GOV-002: Immutable, version-controlled, no hardcoded secrets
# Issue #1532: Centralized Observability & SLOG — retention policy 30d hot / 90d warm / 365d cold
# Ref: https://grafana.com/docs/loki/latest/operations/storage/retention/

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2024-01-01
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h

storage_config:
  boltdb_shipper:
    active_index_directory: /loki/index
    cache_location: /loki/boltdb-cache
    shared_store: filesystem
  filesystem:
    directory: /loki/chunks

# ── Retention enforcement (compactor MUST be enabled for retention_period to apply) ──
# Without compactor, retention_period in limits_config is set but never enforced.
compactor:
  working_directory: /loki/compactor
  shared_store: filesystem
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150

# ── Per-tier retention policy ─────────────────────────────────────────────────
# Hot tier: 30 days (fast SSD storage — default)
# Warn tier: 90 days (enforced via per-stream override below)
# Cold tier: 365 days (audit logs only — separate stream selector)
limits_config:
  # Global default: 30-day hot retention
  retention_period: 720h         # 30 days

  # Per-stream overrides for longer retention
  # Audit logs and auth events retain for 1 year (compliance requirement)
  per_stream_rate_limit: 3MB
  per_stream_rate_limit_burst: 15MB
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  max_query_series: 5000
  max_entries_limit_per_query: 50000

  per_tenant_override_period: 10m

  # Per-label retention: audit and auth streams kept for 365d
  # Applied as stream selector override via ruler/compactor:
  # {job="audit"} → 8760h (365 days)
  # {job="auth"}  → 8760h (365 days)
  # Default all others → 720h (30 days)

# ── Stream-level retention overrides ─────────────────────────────────────────
# These selectors extend retention beyond the global 30d default.
# Supported in Loki >= 2.9 with retention_enabled=true in compactor.
per_tenant_override_config: /etc/loki/retention-overrides.yaml

# ── Query performance ─────────────────────────────────────────────────────────
query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100
        ttl: 1h
  cache_results: true
  align_queries_with_step: true
  max_retries: 3
  parallelise_shardable_queries: true

frontend:
  max_outstanding_per_tenant: 2048
  compress_responses: true

# ── Alerting integration ──────────────────────────────────────────────────────
ruler:
  alertmanager_url: http://alertmanager:9093
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-temp
  enable_api: true
  enable_alertmanager_v2: true
