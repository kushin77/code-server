name: OPA Policy Production Conformance

on:
  schedule:
    # Daily at 5:30 AM UTC — after waiver audit (5 AM), before business hours
    - cron: '30 5 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Bundle channel to validate (default: stable)'
        required: false
        default: stable
      promote_on_pass:
        description: 'Promote canary to stable if conformance passes (only when channel=canary)'
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths:
      - 'opa/policies/**'
      - 'config/policy-bundles/**'
      - 'scripts/governance/build-policy-bundle.sh'
      - 'scripts/governance/promote-policy-bundle.sh'

concurrency:
  group: opa-policy-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Build + verify policy bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    env:
      CHANNEL: ${{ inputs.channel || 'stable' }}
      CATALOG_FILE: config/policy-bundles/bundle-catalog.json

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Resolve bundle version
        id: version
        run: |
          version=$(python3 - <<'PY'
          import json, sys
          with open('config/policy-bundles/bundle-catalog.json', 'r') as f:
              data = json.load(f)
          ch = '${{ env.CHANNEL }}'
          print(data.get('channels', {}).get(ch, {}).get('version', '1.0.0'))
          PY
          )
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build policy bundle
        run: |
          bash scripts/governance/build-policy-bundle.sh \
            --version "${{ steps.version.outputs.version }}" \
            --channel "${{ env.CHANNEL }}"

      - name: Verify bundle integrity
        id: verify
        run: |
          bash scripts/governance/verify-policy-bundle.sh \
            --manifest "artifacts/policy-bundles/policy-bundle-${{ steps.version.outputs.version }}-${{ env.CHANNEL }}.manifest.json"
          echo "verified=true" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Run OPA policy conformance checks
        id: conformance
        run: |
          if ! command -v opa >/dev/null 2>&1; then
            echo "Installing OPA..."
            curl -fsSL -o /usr/local/bin/opa \
              https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
            chmod +x /usr/local/bin/opa
          fi

          fail=0
          declare -a results=()

          for policy_file in opa/policies/*.rego; do
            policy_name=$(basename "$policy_file" .rego)
            result=$(opa check "$policy_file" 2>&1 && echo "PASS" || echo "FAIL")
            if [[ "$result" == *"FAIL"* ]]; then
              fail=1
              results+=("FAIL: $policy_name")
            else
              results+=("PASS: $policy_name")
            fi
          done

          echo "## OPA Policy Conformance" >> "$GITHUB_STEP_SUMMARY"
          for r in "${results[@]}"; do
            echo "- $r" >> "$GITHUB_STEP_SUMMARY"
          done

          printf '%s\n' "${results[@]}" > artifacts/policy-bundles/conformance-results.txt
          echo "fail=$fail" >> "$GITHUB_OUTPUT"

      - name: Export decision log (synthetic)
        run: |
          mkdir -p artifacts/policy-logs
          # Generate a synthetic decision log entry for CI validation
          cat > artifacts/policy-logs/ci-decision-log.log <<'EOF'
          {"timestamp":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'","decision":"allow","policy_domain":"security","actor":"ci"}
          POLICY_DECISION allow policy=security actor=ci@ci
          POLICY_DECISION allow policy=compliance actor=ci@ci
          EOF
          bash scripts/governance/export-policy-decision-log.sh \
            --input artifacts/policy-logs/ci-decision-log.log \
            --out-jsonl artifacts/policy-logs/decision-log.jsonl \
            --out-summary artifacts/policy-logs/summary.json

      - name: Promote canary to stable (if requested and passing)
        if: |
          inputs.promote_on_pass == true &&
          env.CHANNEL == 'canary' &&
          steps.verify.outputs.verified == 'true' &&
          steps.conformance.outputs.fail == '0'
        run: |
          # Capture current stable as rollback before promoting
          bash scripts/governance/promote-policy-bundle.sh --from stable --to rollback
          # Promote canary to stable
          bash scripts/governance/promote-policy-bundle.sh --from canary --to stable

          # Commit updated catalog
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add config/policy-bundles/bundle-catalog.json artifacts/policy-bundles/promotion-audit.jsonl
          git commit -m "chore: promote canary bundle ${{ steps.version.outputs.version }} to stable [skip ci]"
          git push

      - name: Upload conformance artifacts
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.1
        with:
          name: opa-policy-conformance
          path: |
            artifacts/policy-bundles/**
            artifacts/policy-logs/**
          retention-days: 90

      - name: Open issue on failure
        if: steps.verify.outputs.verified != 'true' || steps.conformance.outputs.fail != '0'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- opa-policy-conformance-failure -->';
            const title = '[AUTO-TRIAGE] OPA policy conformance failure';
            const body = `${marker}
            ## OPA Policy Conformance Failure

            **Workflow run**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            **Channel**: ${{ env.CHANNEL }}
            **Version**: ${{ steps.version.outputs.version }}
            **Timestamp**: ${new Date().toISOString()}

            ## Failures

            - Bundle verified: ${{ steps.verify.outputs.verified }}
            - Conformance pass: ${{ steps.conformance.outputs.fail == '0' }}

            ## Remediation

            1. Check OPA policy syntax: \`opa check opa/policies/*.rego\`
            2. Rebuild bundle: \`bash scripts/governance/build-policy-bundle.sh --version <ver> --channel ${{ env.CHANNEL }}\`
            3. Verify bundle: \`bash scripts/governance/verify-policy-bundle.sh --manifest <path>\`
            4. Fix failing policies and commit to re-trigger conformance.

            Relates to #708 (OPA Policy Service Evolution)`;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['P2'],
            });

            const existing = issues.find(i => i.body && i.body.includes(marker));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Re-triggered: ${new Date().toISOString()} — run ${{ github.run_id }}`
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['P2', 'governance'],
              });
            }

  distribute:
    name: Distribute stable bundle
    runs-on: ubuntu-latest
    needs: build-and-verify
    if: |
      (github.event_name == 'push' || github.event_name == 'schedule') &&
      needs.build-and-verify.result == 'success'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Distribute stable bundle
        env:
          POLICY_BUNDLE_OPA_URL: ${{ vars.POLICY_BUNDLE_OPA_URL || '' }}
          POLICY_BUNDLE_OPA_TOKEN: ${{ secrets.POLICY_BUNDLE_OPA_TOKEN || '' }}
        run: |
          bash scripts/governance/distribute-policy-bundle.sh \
            --channel stable
