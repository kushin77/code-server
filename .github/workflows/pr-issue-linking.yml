name: PR-Issue Linking Automation
# @governance GOV-002 - All gh calls use --repo flag

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: pr-linking-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  link-issues:
    name: Auto-Link PR to Issues
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
      contents: read
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set Up Environment
        run: |
          mkdir -p artifacts
          echo "GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> $GITHUB_ENV
          echo "GITHUB_REPO=${{ github.repository }}" >> $GITHUB_ENV
      
      - name: Extract PR Metadata
        id: extract
        run: |
          echo "pr_number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          echo "pr_title=${{ github.event.pull_request.title }}" >> $GITHUB_OUTPUT
          echo "pr_body=${{ github.event.pull_request.body }}" >> $GITHUB_OUTPUT
          echo "branch_name=${{ github.event.pull_request.head.ref }}" >> $GITHUB_OUTPUT
      
      - name: Run Auto-Link Script
        run: |
          chmod +x scripts/ops/auto-link-pr-issue.sh
          scripts/ops/auto-link-pr-issue.sh \
            "${{ steps.extract.outputs.pr_number }}" \
            "${{ steps.extract.outputs.pr_title }}" \
            "${{ steps.extract.outputs.pr_body }}" \
            "${{ steps.extract.outputs.branch_name }}" || true
      
      - name: Comment on PR with Link Status
        if: always()
        run: |
          if [ -f artifacts/pr-issue-linking-report.json ]; then
            status=$(jq -r '.status' artifacts/pr-issue-linking-report.json)
            linked=$(jq -r '.issues_linked' artifacts/pr-issue-linking-report.json)
            
            if [ "$status" = "SUCCESS" ] && [ "$linked" -gt 0 ]; then
              message="✅ **PR Linked**: This PR is linked to $linked issue(s). "
            else
              message="⚠️ **Link Status**: No issues linked. Ensure PR title/branch contains 'Fixes #N', 'Closes #N', or 'issue-#N' format. "
            fi
            
            gh pr comment ${{ github.event.pull_request.number }} \
              --body "$message" \
              --repo "$GITHUB_REPO" || true
          fi
      
      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-issue-linking-report
          path: artifacts/pr-issue-linking-report.json
          retention-days: 30
