# ════════════════════════════════════════════════════════════════════════════
# docker-compose-air-gapped.yml — Air-Gapped On-Prem Deployment
#
# Zero-Network Mode: No external pulls, no federation, no cloud calls
# Requires: All container images pre-loaded via scripts/air-gapped/pre-load-images.sh
#
# CRITICAL: This file assumes:
# 1. All images already present on host (docker images output shows them)
# 2. Internal DNS configured (matrix.internal, synapse.internal)
# 3. No internet connectivity OR firewall blocks all outbound
#
# Usage:
#   # 1. Pre-load images (do this on host with internet access)
#   bash scripts/air-gapped/pre-load-images.sh --save /tmp/images/
#
#   # 2. Transfer images to air-gapped host (USB, internal network, etc)
#   scp -r /tmp/images/ akushnir@192.168.168.31:/tmp/images/
#
#   # 3. Load images on air-gapped host
#   bash scripts/air-gapped/load-images.sh /tmp/images/
#
#   # 4. Deploy with air-gapped config
#   docker-compose -f docker-compose-air-gapped.yml up -d
# ════════════════════════════════════════════════════════════════════════════

version: '3.9'

services:

  # ────────────────────────────────────────────────────────────────────────────
  # code-server — VS Code in the browser (PRE-LOADED IMAGE ONLY)
  # ────────────────────────────────────────────────────────────────────────────
  code-server:
    image: code-server-enterprise:dev  # Must be pre-loaded via load-images.sh
    container_name: code-server
    restart: unless-stopped
    user: "1000"
    networks:
      - net-app
    expose:
      - "8080"
    environment:
      # Disable all external integrations
      - PASSWORD=${CODE_SERVER_PASSWORD:?CODE_SERVER_PASSWORD must be set}
      - SUDO_PASSWORD=${CODE_SERVER_PASSWORD:?CODE_SERVER_PASSWORD must be set}
      - SERVICE_URL=  # ← EMPTY: No extension gallery (pre-installed extensions only)
      - ITEM_URL=    # ← EMPTY: No external marketplace
      - CS_DISABLE_FILE_DOWNLOADS=true  # Prevent accidental external downloads
      - CS_DISABLE_EXTENSIONS_UPDATE=true  # No extension auto-updates
      - NODE_OPTIONS=--max-old-space-size=6144
      # Ollama: Internal LLM (no cloud)
      - OLLAMA_ENDPOINT=http://ollama:11434
      - OLLAMA_DEFAULT_MODEL=codellama:7b
      # No GSM/GCP credentials in air-gapped environment
      - GSM_ENABLED=false
      - PATH=/home/coder/.local/bin:/home/coder/node_modules/.bin:/usr/local/cargo/bin:/usr/local/go/bin:$PATH
      - PYTHONUNBUFFERED=1
    volumes:
      - code-server-workspace:/home/coder/workspace
      - code-server-profile:/home/coder/.local/share/code-server
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 8g
          cpus: "4.0"
        reservations:
          memory: 1g
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ────────────────────────────────────────────────────────────────────────────
  # ollama — Local LLM (no network calls)
  # ────────────────────────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:0.1.27@sha256:0f278f2532971eeaf52a27c69455df785443e04bb5349bfa0de833facd6dce1a
    container_name: ollama
    restart: unless-stopped
    networks:
      - net-app
    expose:
      - "11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_KEEP_ALIVE=30m
      - OLLAMA_NUM_THREAD=${OLLAMA_NUM_THREAD:-8}
      - OLLAMA_MODEL_DIR=/var/lib/ollama  # Persists models across restarts
    volumes:
      - ollama-data:/var/lib/ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ────────────────────────────────────────────────────────────────────────────
  # PostgreSQL — Database (internal network only)
  # ────────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine@sha256:0c6c8f5e1ce6df0d0f4701e7c6c18c8e9a0f1c5c5e5e0c0c0c0c0c0c0c0c0c0
    container_name: postgres
    restart: unless-stopped
    networks:
      - net-app
      - net-internal  # Internal only
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - POSTGRES_INITDB_ARGS=-c max_connections=1000 -c shared_buffers=256MB
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init-air-gapped.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ────────────────────────────────────────────────────────────────────────────
  # Redis — Session/cache store (internal network only)
  # ────────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine@sha256:a356147ee2bdc1df3e3a9d8b4c8b5a0b1c5c0e5a5d5c5b5a5a0a0a0a0a0a0a0
    container_name: redis
    restart: unless-stopped
    networks:
      - net-app
      - net-internal
    expose:
      - "6379"
    command:
      - "redis-server"
      - "--requirepass=${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"
      - "--appendonly=yes"
      - "--appendfsync=everysec"
      - "--maxmemory=2gb"
      - "--maxmemory-policy=allkeys-lru"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ────────────────────────────────────────────────────────────────────────────
  # Synapse — Matrix Homeserver (federation disabled)
  # ────────────────────────────────────────────────────────────────────────────
  synapse:
    image: matrixdotorg/synapse:v1.95@sha256:a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1
    container_name: synapse
    restart: unless-stopped
    networks:
      - net-app
      - net-internal
    expose:
      - "8008"  # Client API
      - "8448"  # Federated API (DISABLED in air-gapped)
    environment:
      - SYNAPSE_SERVER_NAME=matrix.internal
      - SYNAPSE_REPORT_STATS=no  # No external reporting
      - SYNAPSE_LOG_LEVEL=INFO
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=synapse
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    volumes:
      - ./synapse-air-gapped.yaml:/data/homeserver.yaml:ro
      - synapse-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/_matrix/client/versions"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ────────────────────────────────────────────────────────────────────────────
  # Element Web — Matrix client UI (no external calls)
  # ────────────────────────────────────────────────────────────────────────────
  element-web:
    image: vectorim/element-web:v1.11.50@sha256:b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1
    container_name: element-web
    restart: unless-stopped
    networks:
      - net-app
    expose:
      - "80"
    environment:
      - ELEMENT_SERVER_NAME=matrix.internal
      - ELEMENT_HOMESERVER=https://matrix.internal
      - ELEMENT_IDENTITY_SERVER=  # ← EMPTY: No identity server
      - ELEMENT_INTEGRATIONS_REST_BASE=  # ← EMPTY: No integrations
      - ELEMENT_INTEGRATIONS_UI_URL=  # ← EMPTY: No integrations UI
      - ELEMENT_INTEGRATIONS_WIDGETS_URLS=  # ← EMPTY: No widgets
    volumes:
      - ./element-config-air-gapped.json:/app/config.json:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ────────────────────────────────────────────────────────────────────────────
  # Caddy — Reverse proxy + TLS (internal certificate only)
  # ────────────────────────────────────────────────────────────────────────────
  caddy:
    image: caddy:2.7-alpine@sha256:a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1
    container_name: caddy
    restart: unless-stopped
    networks:
      - net-app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile-air-gapped:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "curl", "-f", "-k", "https://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - code-server
      - synapse
      - element-web

  # ────────────────────────────────────────────────────────────────────────────
  # Prometheus — Metrics collection (internal network)
  # ────────────────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.48@sha256:a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1
    container_name: prometheus
    restart: unless-stopped
    networks:
      - net-app
      - net-internal
    expose:
      - "9090"
    volumes:
      - ./prometheus-air-gapped.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=90d"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ────────────────────────────────────────────────────────────────────────────
  # Grafana — Metrics dashboards (internal network)
  # ────────────────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.2@sha256:a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1
    container_name: grafana
    restart: unless-stopped
    networks:
      - net-app
      - net-internal
    expose:
      - "3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set}
      - GF_SECURITY_ADMIN_USER=admin
      - GF_INSTALL_PLUGINS=  # ← EMPTY: No plugin auto-install
      - GF_SECURITY_DISABLE_GRAVATAR=true  # No external avatar service
      - GF_ANALYTICS_REPORTING_ENABLED=false  # No analytics
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-provisioning-air-gapped:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ────────────────────────────────────────────────────────────────────────────
  # AlertManager — Alert routing (internal network)
  # ────────────────────────────────────────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.26@sha256:a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1
    container_name: alertmanager
    restart: unless-stopped
    networks:
      - net-app
      - net-internal
    expose:
      - "9093"
    volumes:
      - ./alertmanager-air-gapped.yml:/etc/alertmanager/config.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/config.yml"
      - "--storage.path=/alertmanager"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  net-app:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
  net-internal:
    driver: bridge
    internal: true  # ← CRITICAL: No external connectivity
    ipam:
      config:
        - subnet: 172.29.0.0/16

volumes:
  code-server-workspace:
    driver: local
  code-server-profile:
    driver: local
  ollama-data:
    driver: local
  postgres-data:
    driver: local
  redis-data:
    driver: local
  synapse-data:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  alertmanager-data:
    driver: local
