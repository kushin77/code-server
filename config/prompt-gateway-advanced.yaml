#!/usr/bin/env yaml
# @file        config/prompt-gateway-advanced.yaml
# @module      configuration
# @description Advanced Prompt Gateway configuration for caching and batch processing
#
# Defines caching strategy, batch processing limits, and response filtering policies

# ============================================================================
# Response Caching Configuration
# ============================================================================
cache:
  enabled: true
  backend: redis  # redis or memory
  ttl_hours: 24
  max_size_per_user: 10000  # Max cached entries
  
  # Semantic matching configuration (Phase 2)
  semantic_matching:
    enabled: false  # Disabled in Phase 1
    model: "all-MiniLM-L6-v2"  # Embedding model
    similarity_threshold: 0.85
  
  # Metrics
  metrics:
    track_hit_rate: true
    track_cache_size: true
    export_to_prometheus: true
    prometheus_prefix: "prompt_gateway_cache"
  
  # Eviction policy
  eviction:
    policy: "lru"  # least recently used
    check_interval_seconds: 300
    gc_enabled: true


# ============================================================================
# Response Filtering Configuration
# ============================================================================
filtering:
  enabled: true
  
  # PII redaction
  pii_detection:
    enabled: true
    patterns:
      - email
      - phone
      - ssn
      - credit_card
      - ip_address
      - hostname
    redaction_strategy: "placeholder"  # placeholder or removal
    redaction_placeholder: "[REDACTED_{TYPE}]"
  
  # Secret filtering
  secret_detection:
    enabled: true
    block_on_detection: false  # Just redact, don't block
    log_redactions: true
    patterns:
      - private_key
      - aws_secret
      - database_url
      - connection_string
  
  # URL filtering (for air-gapped environments)
  url_filtering:
    enabled: false  # Disabled in Phase 1
    block_external: false
    whitelist:
      - "localhost"
      - "127.0.0.1"
      - "192.168.168.0/24"
  
  # Code preservation
  code_preservation:
    preserve_syntax: true
    preserve_structure: true
    smart_redaction: true  # Only redact actual values, not patterns


# ============================================================================
# Batch Processing Configuration
# ============================================================================
batch:
  enabled: true
  
  # Concurrency
  max_concurrent_items: 10
  timeout_per_prompt_sec: 60
  max_batch_size: 10000
  
  # Storage
  storage:
    backend: redis  # redis or postgresql
    retention_days: 7
    cleanup_enabled: true
  
  # Progress tracking
  progress:
    track_enabled: true
    update_interval_sec: 5
    webhook_enabled: false  # Phase 2 feature
  
  # Error handling
  error_handling:
    retry_on_failure: true
    max_retries: 3
    retry_backoff_ms: 500
    partial_batch_allowed: true  # Complete even if some fail
  
  # Metrics
  metrics:
    track_queue_depth: true
    track_processing_time: true
    track_success_rate: true
    export_to_prometheus: true


# ============================================================================
# Advanced Gateway Settings
# ============================================================================
gateway:
  # Cache-aware routing
  use_cached_for_routing: true  # Use cache to optimize model selection
  
  # Response modification
  modify_responses:
    add_cache_metadata: true  # Include cache hit info in response
    add_latency_metrics: true  # Include latency breakdown
    add_token_estimate: true
  
  # User-level customization
  user_preferences:
    per_user_cache_size: true
    per_user_filtering_rules: true
    per_user_batch_limits: true


# ============================================================================
# Logging & Monitoring
# ============================================================================
logging:
  level: INFO
  
  # Cache operations logging
  cache_logging:
    log_hits: false  # Too verbose, disable in production
    log_misses: false
    log_evictions: true
    log_errors: true
  
  # Filtering logging
  filter_logging:
    log_redactions: true
    log_blocked_responses: true
    redaction_log_destination: "loki"  # loki or postgres
  
  # Batch logging
  batch_logging:
    log_submissions: true
    log_completions: true
    log_cancellations: true
    batch_log_destination: "postgres"  # For historical analysis


# ============================================================================
# Performance Tuning
# ============================================================================
performance:
  # Cache performance
  cache_warm_up:
    enabled: false
    preload_common_prompts: false
    preload_file: "config/common-prompts.json"
  
  # Batch performance
  batch_optimization:
    parallelize_scanning: true
    parallelize_opa_checks: true
    batch_ollama_calls: false  # Ollama doesn't support batching
  
  # Memory limits
  memory:
    max_cache_mb: 500
    max_batch_queue_mb: 1000
    gc_triggered_mb: 800


# ============================================================================
# Integration with Other Modules
# ============================================================================
integrations:
  
  # Cache integration with OPA
  opa:
    cache_policy_decisions: true
    policy_cache_ttl_hours: 1
  
  # Cache integration with Scanner
  scanner:
    cache_scan_results: true  # Cache PII detection results
    scan_cache_ttl_hours: 12
  
  # Cache integration with Router
  router:
    cache_routing_decisions: true
    routing_cache_ttl_hours: 1
