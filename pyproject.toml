[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "elevatediq-backend"
version = "0.1.0"
description = "ElevatedIQ DevOS Enterprise Platform"
requires-python = ">=3.11"
authors = [{name = "Team", email = "team@kushnir.cloud"}]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["apps"]
python_files = ["test_*.py", "*_test.py"]
python_classes = "Test*"
python_functions = "test_*"

# Coverage configuration
addopts = [
    "--strict-markers",
    "--tb=short",
    "--cov=apps",
    "--cov-report=html:htmlcov",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=json",
    "--cov-report=xml",
    "--cov-report=lcov",
    "--cov-branch",
    "--cov-fail-under=75",
    "-v",
    "--color=yes",
    "-ra"
]

markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests with real dependencies (medium speed)",
    "e2e: End-to-end tests (slow, comprehensive)",
    "performance: Performance and load tests",
    "slow: Slow tests (timeout > 10s)",
    "skip_ci: Skip in CI environment",
    "requires_db: Tests requiring database connection",
    "requires_cache: Tests requiring cache (Redis)",
    "requires_kafka: Tests requiring Kafka connection",
]

# Timeout for all tests (seconds)
timeout = 300
timeout_method = "thread"

# Asyncio mode for async tests
asyncio_mode = "auto"

# Logging
log_cli = false
log_file = "test-results.log"
log_file_level = "DEBUG"

[tool.coverage.run]
branch = true
source = ["src"]
parallel = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "class .*\\(Protocol\\):",
]

precision = 2
skip_covered = false
skip_empty = true
show_missing = true

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.json]
output = ".coverage.json"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["apps/_shared/python/test_utilities.py"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in default arguments (FastAPI pattern)
]

[tool.ruff.lint.isort]
known-first-party = ["apps"]
