# GOV-002: Enterprise Governance Header
# METADATA: HELM_VALUES
# PURPOSE: Default configuration values for code-server-enterprise Helm deployment
# IMMUTABILITY: All values are versioned in Git

# Global configuration
global:
  # Image registry and pull policy
  imageRegistry: "docker.io"
  imagePullPolicy: "IfNotPresent"
  
  # Domain and TLS configuration
  domain: "example.com"
  tlsEnabled: true
  tlsEmail: "admin@example.com"
  
  # Log level across all services
  logLevel: "info"
  
  # Resource limits (can be overridden per service)
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "250m"
      memory: "256Mi"

# Labels and annotations applied to all resources
labels:
  app: "code-server-enterprise"
  version: "1.0.0"
  managed-by: "helm"
  environment: "production"

annotations:
  governance/policy: "GOV-002"
  governance/compliance: "required"

# Service account configuration
serviceAccount:
  create: true
  name: ""

# Service definitions for 20 microservices
services:
  # Core API & Gateway
  api:
    enabled: true
    name: "api"
    replicas: 3
    image: "code-server-enterprise-api:v1.0.0"
    port: 3100
    resources:
      limits:
        cpu: "1000m"
        memory: "1Gi"
      requests:
        cpu: "500m"
        memory: "512Mi"
  
  # Frontend
  frontend:
    enabled: true
    name: "frontend"
    replicas: 2
    image: "code-server-enterprise-frontend:v1.0.0"
    port: 3000
    resources:
      limits:
        cpu: "500m"
        memory: "512Mi"
      requests:
        cpu: "250m"
        memory: "256Mi"
  
  # Governance Services
  reputation_engine:
    enabled: true
    name: "reputation-engine"
    replicas: 2
    image: "code-server-enterprise-reputation-engine:v1.0.0"
    port: 5000
    resources:
      limits:
        cpu: "500m"
        memory: "512Mi"
      requests:
        cpu: "250m"
        memory: "256Mi"
  
  activity_feed:
    enabled: true
    name: "activity-feed"
    replicas: 2
    image: "code-server-enterprise-activity-feed:v1.0.0"
    port: 5001
    resources:
      limits:
        cpu: "500m"
        memory: "512Mi"
      requests:
        cpu: "250m"
        memory: "256Mi"
  
  # Session Management
  session_broker:
    enabled: true
    name: "session-broker"
    replicas: 2
    image: "code-server-enterprise-session-broker:v1.0.0"
    port: 5002
    resources:
      limits:
        cpu: "500m"
        memory: "512Mi"
      requests:
        cpu: "250m"
        memory: "256Mi"
  
  # Agent Runtime - Autonomous Agent Execution
  agent_runtime:
    enabled: true
    name: "agent-runtime"
    replicas: 2
    image: "code-server-enterprise-agent-runtime:v1.0.0"
    port: 8004
    resources:
      limits:
        cpu: "1000m"
        memory: "512Mi"
      requests:
        cpu: "500m"
        memory: "256Mi"
  
  # Infrastructure services (managed separately)
  postgres:
    enabled: true
    name: "postgres"
    replicas: 1
    image: "postgres:16-alpine"
    port: 5432
  
  redis:
    enabled: true
    name: "redis"
    replicas: 1
    image: "redis:7-alpine"
    port: 6379

  edge_agent:
    enabled: true
    name: "edge-agent"
    replicas: 2
    image: "code-server-enterprise-edge-agent:v1.0.0"
    port: 8060
    resources:
      limits:
        cpu: "500m"
        memory: "512Mi"
      requests:
        cpu: "250m"
        memory: "256Mi"
  
  prometheus:
    enabled: true
    name: "prometheus"
    replicas: 1
    image: "prom/prometheus:v2.48.0"
    port: 9090
  
  grafana:
    enabled: true
    name: "grafana"
    replicas: 1
    image: "grafana/grafana:10.2.0"
    port: 3000
  
  loki:
    enabled: true
    name: "loki"
    replicas: 1
    image: "grafana/loki:2.9.4"
    port: 3100

# Environment variables
environment:
  LOG_LEVEL: "info"
  NODE_ENV: "production"

# Secrets (should be mounted from external secret manager)
secrets:
  databaseUrl: ""
  redisPassword: ""
  oauthClientId: ""
  oauthClientSecret: ""

# Persistence configuration
persistence:
  enabled: true
  storageClass: "fast-ssd"
  size: "100Gi"

# Network policies
networkPolicy:
  enabled: true
  ingressAllowed: ["ingress-controller"]
  egressAllowed: ["dns", "external-api"]

# Pod Security Standards
podSecurity:
  enforce: "baseline"
  audit: "restricted"
  warn: "restricted"

# Istio Service Mesh Configuration (Phase 4: K8s Migration)
istio:
  enabled: true
  namespace: "istio-system"
  ingressGateway:
    enabled: true
    replicas: 3
    resources:
      limits:
        cpu: "2000m"
        memory: "1024Mi"
      requests:
        cpu: "1000m"
        memory: "512Mi"
  # Traffic management policies
  trafficPolicy:
    connectionPool:
      http:
        http1MaxPendingRequests: 100
        http2MaxRequests: 200
      tcp:
        maxConnections: 200
    loadBalancing:
      simple: ROUND_ROBIN
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
  # mTLS configuration
  mtls:
    mode: STRICT
    certificateRefreshInterval: "24h"
  # Monitoring and observability
  monitoring:
    prometheus:
      enabled: true
      interval: "15s"
    jaeger:
      enabled: true
      samplingRate: 0.1

# Horizontal Pod Autoscaling Configuration (Phase 4: K8s Migration)
autoscaling:
  enabled: true
  default:
    minReplicas: 2
    maxReplicas: 10
    targetCpuUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  # Custom metrics support (requires Prometheus/metrics-server)
  customMetrics:
    enabled: true
    # Example: scale based on HTTP requests per second
    http_requests_per_second:
      enabled: true
      threshold: 1000
    # Example: scale based on task queue depth
    pending_tasks:
      enabled: true
      threshold: 30
  # Per-service autoscaling overrides
  services:
    api:
      minReplicas: 3
      maxReplicas: 20
      targetCpuUtilizationPercentage: 60
    frontend:
      minReplicas: 2
      maxReplicas: 15
      targetCpuUtilizationPercentage: 75
    agent_runtime:
      minReplicas: 1
      maxReplicas: 8
      targetCpuUtilizationPercentage: 65

# Kubernetes Resource Quotas (for namespace isolation)
resourceQuota:
  enabled: true
  requests:
    cpu: "50"
    memory: "100Gi"
  limits:
    cpu: "100"
    memory: "200Gi"

# Network Policies (Zero-trust networking)
networkPolicies:
  enabled: true
  default:
    policyTypes:
    - Ingress
    - Egress
  # Service-to-service communication rules
  serviceCommunication:
    api:
      ingressFrom:
      - frontend
      - orchestrator
      egressTo:
      - postgres
      - redis
      - reputation-engine
    frontend:
      ingressFrom:
      - ingress-controller
      egressTo:
      - api
    agent_runtime:
      ingressFrom:
      - orchestrator
      egressTo:
      - api
      - postgres
      - kafka

# Pod Disruption Budgets (High availability)
podDisruptionBudgets:
  enabled: true
  default:
    minAvailable: 1
  # Per-service overrides
  services:
    api:
      minAvailable: 2
    reputation_engine:
      minAvailable: 1
