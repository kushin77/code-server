name: Compose File Validation

on:
  schedule:
    # Run every 4 hours
    - cron: '0 0,4,8,12,16,20 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'docker-compose*.yml'
      - '.github/workflows/compose-validation.yml'
  push:
    branches:
      - main
    paths:
      - 'docker-compose*.yml'
      - 'scripts/ci/check-docker-compose-idempotency.sh'
      - 'scripts/ci/enforce-compose-templates.sh'

jobs:
  validate-compose-syntax:
    name: Validate Compose Syntax
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@a5ac7e51b41094c153705408e0e3a0dd2b15a8fd
        with:
          fetch-depth: 1

      - name: Set up Docker
        uses: docker/setup-buildx-action@c47758b664febf8e1a0b8345089e8fd1e94c3298

      - name: Validate compose file syntax with docker
        run: |
          # Primary compose file
          docker run --rm -v "$PWD:$PWD" -w "$PWD" \
            docker:latest docker compose -f docker-compose.yml config --quiet
          
          # Enterprise overlay
          docker run --rm -v "$PWD:$PWD" -w "$PWD" \
            docker:latest docker compose -f docker-compose.yml -f docker-compose.enterprise.yml config --quiet
          
          # Production overlay
          docker run --rm -v "$PWD:$PWD" -w "$PWD" \
            docker:latest docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
          
          echo "✓ All compose files pass syntax validation"

  validate-image-pins:
    name: Validate Image Pin Integrity
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@a5ac7e51b41094c153705408e0e3a0dd2b15a8fd
        with:
          fetch-depth: 1

      - name: Check for :latest tags in compose files
        run: |
          LATEST_TAGS=$(grep -n ':latest' docker-compose*.yml || true)
          if [ -n "$LATEST_TAGS" ]; then
            echo "❌ ERROR: Found :latest tags (floating tags not allowed):"
            echo "$LATEST_TAGS"
            exit 1
          fi
          echo "✓ No floating :latest tags found"

      - name: Verify image digest pins (@sha256:)
        run: |
          # Count images with sha256 digests
          PINNED_COUNT=$(grep -o '@sha256:[a-f0-9]\{64\}' docker-compose*.yml | wc -l)
          TOTAL_IMAGES=$(grep -oE 'image: [^[:space:]]+' docker-compose*.yml | wc -l)
          
          echo "Image pin verification:"
          echo "  Pinned images (with @sha256:): $PINNED_COUNT"
          echo "  Total images: $TOTAL_IMAGES"
          
          if [ "$PINNED_COUNT" -lt 15 ]; then
            echo "⚠ WARNING: Less than 15 images use SHA256 digests"
          fi
          echo "✓ Image pin check complete"

  validate-health-checks:
    name: Validate Health Check Definitions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@a5ac7e51b41094c153705408e0e3a0dd2b15a8fd
        with:
          fetch-depth: 1

      - name: Check health check definitions
        run: |
          # Extract all services
          SERVICES=$(grep -E '^\s{2}[a-zA-Z0-9_-]+:$' docker-compose.yml | sed 's/://g' | xargs)
          
          MISSING_HEALTH_CHECK=0
          for service in $SERVICES; do
            # Skip init containers and non-service entries
            if [[ "$service" == *"-init" ]] || [[ "$service" == "version" ]] || [[ "$service" == "networks" ]] || [[ "$service" == "volumes" ]]; then
              continue
            fi
            
            # Check if service has healthcheck
            if ! grep -A 30 "^  $service:" docker-compose.yml | grep -q "healthcheck:"; then
              echo "⚠ Service '$service' missing healthcheck definition"
              ((MISSING_HEALTH_CHECK++))
            fi
          done
          
          if [ "$MISSING_HEALTH_CHECK" -gt 0 ]; then
            echo "⚠ WARNING: $MISSING_HEALTH_CHECK services missing health checks"
          else
            echo "✓ All services have health check definitions"
          fi

  validate-idempotency:
    name: Validate Compose Idempotency
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@a5ac7e51b41094c153705408e0e3a0dd2b15a8fd
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@0c50fcf487b9e45395f457b55cd37dda4d53a0b3
        with:
          python-version: '3.11'

      - name: Run idempotency checks
        run: |
          # Make scripts executable
          chmod +x scripts/ci/check-docker-compose-idempotency.sh
          chmod +x scripts/ci/enforce-compose-templates.sh
          
          # Run idempotency validation
          ./scripts/ci/check-docker-compose-idempotency.sh --report || true
          
          echo "✓ Idempotency validation complete"

  validate-template-enforcement:
    name: Validate Template Enforcement
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@a5ac7e51b41094c153705408e0e3a0dd2b15a8fd
        with:
          fetch-depth: 1

      - name: Enforce compose templates and patterns
        run: |
          chmod +x scripts/ci/enforce-compose-templates.sh
          ./scripts/ci/enforce-compose-templates.sh || true
          
          echo "✓ Template enforcement validation complete"

  report-validation-status:
    name: Report Validation Status
    runs-on: ubuntu-latest
    needs: [validate-compose-syntax, validate-image-pins, validate-health-checks]
    if: always()
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Check validation results
        run: |
          if [ "${{ needs.validate-compose-syntax.result }}" = "failure" ] || \
             [ "${{ needs.validate-image-pins.result }}" = "failure" ] || \
             [ "${{ needs.validate-health-checks.result }}" = "failure" ]; then
            echo "❌ Compose validation failed"
            exit 1
          fi
          echo "✓ All compose validations passed"
