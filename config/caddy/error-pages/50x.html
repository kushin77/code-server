<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KC IDE — Service Error</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #0a1428 0%, #1a2d47 100%);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .error-container {
            text-align: center;
            background: rgba(10, 20, 40, 0.9);
            border: 1px solid #2d4a6f;
            border-radius: 12px;
            padding: 60px 40px;
            max-width: 600px;
            backdrop-filter: blur(10px);
        }
        .error-code {
            font-size: 72px;
            font-weight: 700;
            color: #ff6b6b;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 32px;
            color: #ffffff;
            margin-bottom: 15px;
        }
        p {
            font-size: 16px;
            color: #a0b0c8;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .status {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #ff6b6b;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        .action {
            display: inline-block;
            padding: 12px 24px;
            background: linear-gradient(135deg, #4a9eff 0%, #7b68ee 100%);
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .action:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(74, 158, 255, 0.3);
        }
        .brand {
            font-size: 14px;
            color: #607080;
            margin-top: 30px;
            border-top: 1px solid #1e3250;
            padding-top: 20px;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">500</div>
        <h1>Service Error</h1>
        <p>Our team is working on fixing this issue. We apologize for the inconvenience. Please try again in a few moments.</p>
        <p><span class="status"></span>System recovery in progress</p>
        <a href="/" class="action">Return to Home</a>
        <div class="brand">KC IDE — Developer Operating System</div>
    </div>
</body>
</html>
