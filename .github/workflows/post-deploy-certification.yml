name: Post-Deploy Certification

on:
  pull_request:
    types: [closed]
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]

concurrency:
  group: post-deploy-certification-${{ github.event.pull_request.number || github.event.issue.number || github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  reopen-linked-issues:
    name: Reopen linked issues until certification is complete
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Reopen linked issues for non-trivial changes
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || "";
            const marker = "<!-- post-deploy-certification -->";

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });

            const nonTrivial = files.some((f) => {
              const p = f.filename.toLowerCase();
              return !(
                p.startsWith("docs/") ||
                p.endsWith(".md") ||
                p.startsWith(".github/issue_template/")
              );
            });

            if (!nonTrivial) {
              core.info("Docs-only or trivial change detected; skipping post-deploy certification reopen path.");
              return;
            }

            const issueNumbers = [...body.matchAll(/(?:closes|fixes|resolves)\s+#(\d+)/ig)].map((m) => Number(m[1]));
            if (issueNumbers.length === 0) {
              core.info("No linked issues found in PR body.");
              return;
            }

            for (const issue_number of [...new Set(issueNumbers)]) {
              const issue = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
              });

              const commentBody = [
                marker,
                "## Post-Deploy Certification Required",
                "",
                `Merged PR: #${pr.number}`,
                "",
                "Complete this checklist in a new issue comment using the same marker before closing the issue:",
                "- [ ] 1-hour post-deploy monitoring completed",
                "- [ ] SLA/SLO target verified against Phase 1 target",
                "- [ ] Error budget impact reviewed",
                "- [ ] Rollback was not required, or rollback drill/result documented",
                "- [ ] Linked PR and telemetry evidence attached",
              ].join("\n");

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body: commentBody,
              });

              if (issue.data.state === "closed") {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number,
                  state: "open",
                });
              }
            }

  close-certified-issues:
    name: Auto-close certified issues
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    steps:
      - name: Close issue when certification checklist is complete
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = context.payload.comment.body || "";
            const marker = "<!-- post-deploy-certification -->";
            if (!body.includes(marker)) {
              core.info("Certification marker not present; skipping.");
              return;
            }

            const requiredChecks = [
              /- \[x\] 1-hour post-deploy monitoring completed/i,
              /- \[x\] SLA\/SLO target verified against Phase 1 target/i,
              /- \[x\] Error budget impact reviewed/i,
              /- \[x\] Rollback was not required, or rollback drill\/result documented/i,
              /- \[x\] Linked PR and telemetry evidence attached/i,
            ];

            const incomplete = requiredChecks.filter((pattern) => !pattern.test(body));
            if (incomplete.length > 0) {
              core.info("Certification marker found, but checklist is incomplete; leaving issue open.");
              return;
            }

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed",
              state_reason: "completed",
            });

  phase-4-sla-certification:
    name: Validate Phase 4 Post-Deploy SLA Certification
    if: >-
      (github.event_name == 'issues' || github.event_name == 'issue_comment') &&
      (contains(github.event.issue.body || '', '## Phase 4: Post-Deploy SLA Certification') ||
       contains(github.event.comment.body || '', '## Phase 4: Post-Deploy SLA Certification'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Check for Phase 4 completion
        id: check-phase-4
        shell: bash
        env:
          ISSUE_BODY: ${{ github.event.issue.body || '' }}
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
        run: |
          CONTENT="$ISSUE_BODY"
          if [ -z "$CONTENT" ]; then
            CONTENT="$COMMENT_BODY"
          fi

          if echo "$CONTENT" | grep -q "## Phase 4: Post-Deploy SLA Certification"; then
            monitoring_items=$(echo "$CONTENT" | sed -n '/## Phase 4: Post-Deploy SLA Certification/,/^##/p' | grep -c '^\- \[x\]' || true)
            if [ "$monitoring_items" -ge 4 ]; then
              if echo "$CONTENT" | grep -q "SLA Status:" && \
                 echo "$CONTENT" | grep -q "Error Budget:" && \
                 echo "$CONTENT" | grep -q "Author Certification:"; then
                echo "PHASE_4_COMPLETE=true" >> "$GITHUB_OUTPUT"
              else
                echo "PHASE_4_COMPLETE=false" >> "$GITHUB_OUTPUT"
                echo "REASON=Phase 4 missing SLA Status, Error Budget, or Author Certification" >> "$GITHUB_OUTPUT"
              fi
            else
              echo "PHASE_4_COMPLETE=false" >> "$GITHUB_OUTPUT"
              echo "REASON=Phase 4 section incomplete - fewer than 4 certification items checked" >> "$GITHUB_OUTPUT"
            fi
            echo "PHASE_4_FOUND=true" >> "$GITHUB_OUTPUT"
          else
            echo "PHASE_4_FOUND=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post guidance if Phase 4 incomplete
        if: steps.check-phase-4.outputs.PHASE_4_FOUND == 'true' && steps.check-phase-4.outputs.PHASE_4_COMPLETE == 'false'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7
        with:
          script: |
            const reason = `${{ steps.check-phase-4.outputs.REASON }}`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Phase 4 Post-Deploy SLA Certification Incomplete

**This issue requires Phase 4 post-deploy certification** per [Production Readiness Gate Framework](docs/production-readiness-gate.md#phase-4-production-acceptance-gate).

**What's missing:**
${reason}

**Action Required:**

Author must complete 1-hour post-deploy monitoring and certify:

1. **Monitoring Period**: \`YYYY-MM-DDTHH:MM UTC → HH:MM UTC\` (at least 1 hour)
2. **SLA Status**: Compare actual vs. Phase 1 target
   - P99 latency: [actual] ms (target [target] ms) ✅ / ⚠️ / ❌
   - Hit rate: [actual]% (target [target]%) ✅ / ⚠️ / ❌
3. **Error Budget Impact**: Quantify cost of any issues found
4. **Incidents**: Log any errors/alerts and resolution
5. **Author Certification**: \`@[author] — READY FOR PRODUCTION\` or \`NEEDS ROLLBACK\`

**Example**:
\`\`\`markdown
## Phase 4: Post-Deploy SLA Certification ✅

- [x] 1-Hour post-deploy monitoring completed (2026-04-17 14:30 → 15:30 UTC)
- [x] SLA Status: P99 latency 48ms (target <50ms) ✅; hit rate 82% (target >80%) ✅
- [x] Error Budget: 0% impact (new feature, no existing traffic affected)
- [x] Incidents: None detected during monitoring window
- [x] Author Certification: @akushnir — READY FOR PRODUCTION

Issue ready for closure.
\`\`\`

See [Phase 4 section](https://github.com/kushin77/code-server/blob/main/.github/pull_request_template.md#phase-4-post-deploy-sla-certification) for full details.`
            });

      - name: Close issue if Phase 4 complete
        if: steps.check-phase-4.outputs.PHASE_4_COMPLETE == 'true'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Phase 4 Post-Deploy SLA Certification complete. Issue is ready for closure.'
            });
