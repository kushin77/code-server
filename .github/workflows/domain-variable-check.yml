# @file        .github/workflows/domain-variable-check.yml
# @module      ci/governance
# @description Validates all domain references use env vars — no hardcoded kushnir.cloud in code
# @governance  GOV-002: IaC, immutable, idempotent
# Issue #1536: Networking/DNS — Domain Variability (Criterion 6)

name: Domain Variable Validation

on:
  push:
    branches: [main]
    paths:
      - 'Caddyfile*'
      - 'docker-compose*.yml'
      - 'terraform/**'
      - 'scripts/**'
      - 'config/**'
      - '.github/workflows/domain-variable-check.yml'
  pull_request:
    branches: [main]

jobs:
  # ── envsubst smoke test — domain variables resolve correctly ────────────────
  envsubst-domain-smoke:
    name: envsubst domain variable smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate APEX_DOMAIN is declared in .env.schema.json
        run: |
          for VAR in APEX_DOMAIN IDE_DOMAIN REGISTRY_URL; do
            if ! python3 -c "
import json, sys
schema = json.load(open('.env.schema.json'))
keys = set(schema.get('variables', schema.get('properties', {})).keys())
if '$VAR' not in keys:
    sys.exit(1)
" 2>/dev/null; then
              echo "❌ $VAR missing from .env.schema.json"
              exit 1
            fi
            echo "✅ $VAR declared in .env.schema.json"
          done

      - name: envsubst smoke test with dummy domain
        run: |
          # Export dummy values — confirms template variables resolve without errors
          export APEX_DOMAIN="example.test"
          export IDE_DOMAIN="ide.example.test"
          export REGISTRY_URL="registry.example.test"
          export PRIMARY_HOST="10.0.0.1"
          export REPLICA_HOST="10.0.0.2"
          export NAS_HOST="10.0.0.3"

          # Test .env.schema.json parses cleanly as JSON
          python3 -c "import json; json.load(open('.env.schema.json'))" && echo "✅ .env.schema.json valid JSON"

          # Verify Caddyfile has no hardcoded production domain
          if grep -qE "kushnir\.cloud" Caddyfile 2>/dev/null; then
            # Allow it only in comments
            FUNCTIONAL=$(grep -E "kushnir\.cloud" Caddyfile | grep -v "^[[:space:]]*#" || true)
            if [ -n "$FUNCTIONAL" ]; then
              echo "❌ Hardcoded kushnir.cloud found in Caddyfile (non-comment):"
              echo "$FUNCTIONAL"
              exit 1
            fi
          fi
          echo "✅ Caddyfile: no hardcoded production domain"

  # ── Hardcoded IP audit ───────────────────────────────────────────────────────
  hardcoded-ip-audit:
    name: No hardcoded IPs in operational code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for hardcoded IPs in scripts/terraform/compose
        run: |
          # Scan files — exclude comments and SSOT config files that legitimately define defaults
          VIOLATIONS=$(grep -rE "192\.168\.168\.(31|42|56)" \
            scripts/ terraform/ docker-compose*.yml Caddyfile* 2>/dev/null \
            | grep -v "^\s*#" \
            | grep -v "_base-config\.env\|_common/_\|\.conftest\|dns-records\.tf:.*description" \
            | grep -v "deploy-ollama-external\|manage-hosts-file\|audit-network-hardcoding" \
            | grep -v "q3-phase4-phase1\|q3-phase4-phase4\|q2-2026\|q2-completion\|q3-phase4-helm\|domain-variability\|epic-1536-phase1\|epic-1536-phase2" \
            | grep -v "TARGET_HOST=.*:-192\." \
            || true)

          if [ -n "$VIOLATIONS" ]; then
            echo "❌ Hardcoded infrastructure IPs found (use \$PRIMARY_HOST/\$REPLICA_HOST/\$NAS_HOST):"
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "✅ No hardcoded IPs found in operational code"

  # ── Domain variable completeness check ──────────────────────────────────────
  domain-vars-complete:
    name: Required domain env vars are declared
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required domain vars in .env.schema.json
        run: |
          REQUIRED=(APEX_DOMAIN IDE_DOMAIN REGISTRY_URL)
          MISSING=()

          for VAR in "${REQUIRED[@]}"; do
            if ! python3 -c "
import json, sys
schema = json.load(open('.env.schema.json'))
# Support both {properties: ...} and {variables: ...} schema shapes
keys = set(schema.get('variables', schema.get('properties', {})).keys())
if '$VAR' not in keys:
    sys.exit(1)
" 2>/dev/null; then
              MISSING+=("$VAR")
            fi
          done

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "❌ Missing domain variables in .env.schema.json: ${MISSING[*]}"
            exit 1
          fi
          echo "✅ All required domain variables declared: ${REQUIRED[*]}"
