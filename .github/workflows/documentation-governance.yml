name: Documentation Governance & PMO Automation

on:
  schedule:
    # Run weekly on Mondays at 06:00 UTC
    - cron: '0 6 * * 1'
  # Also run on push to docs and on PRs
  push:
    paths:
      - 'docs/**'
      - 'CHANGELOG.md'
      - '.github/workflows/documentation-governance.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'CHANGELOG.md'
  workflow_dispatch:

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_REPO: ${{ github.repository }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_REPO: ${{ github.repository }}

jobs:
  documentation-gaps:
    name: Analyze Documentation Gaps
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@a5ac7e51b41094c153705408e0e3a0dd2b15a8fd
        with:
          fetch-depth: 0

      - name: Run documentation gap analysis
        continue-on-error: true
        run: |
          source scripts/_common/init.sh
          bash scripts/ci/analyze-documentation-gaps.sh

      - name: Upload gap analysis artifacts
        if: always()
        uses: actions/upload-artifact@0b2256b2c1aaaf07d41658773d8e91fb221abb04
        with:
          name: documentation-gap-reports
          path: artifacts/documentation-gap-*.{json,md}
          retention-days: 30

      - name: Comment on PR with gaps (if PR)
        if: github.event_name == 'pull_request' && always()
        continue-on-error: true
        run: |
          source scripts/_common/init.sh
          if [ -f artifacts/documentation-gap-analysis-report.json ]; then
            MISSING=$(grep -o '"missing_count": [0-9]*' artifacts/documentation-gap-analysis-report.json | grep -o '[0-9]*')
            COVERAGE=$(grep -o '"coverage_percentage": [0-9]*' artifacts/documentation-gap-analysis-report.json | grep -o '[0-9]*')

            if [ "$MISSING" -gt 0 ]; then
                REPORT=$(cat artifacts/documentation-gap-issues.md)
                BODY=$(printf "## Documentation Gap Analysis\n\n**Coverage**: %s%%\n**Missing Documents**: %s\n\n\`\`\`\n%s\n\`\`\`\n\nPlease address documentation gaps before merge." "${COVERAGE}" "${MISSING}" "${REPORT}")
                github_gh pr comment "${{ github.event.pull_request.number }}" --repo "${GH_REPO}" -b "${BODY}"
              fi
          fi

  issue-lifecycle:
    name: Enforce Issue Lifecycle Governance
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@a5ac7e51b41094c153705408e0e3a0dd2b15a8fd

      - name: Check PR has issue reference
        run: |
          source scripts/_common/init.sh
          PR_BODY="${{ github.event.pull_request.body }}"
          PR_TITLE="${{ github.event.pull_request.title }}"

          # Look for issue references (Fixes #123, closes #456, etc.)
          if [[ ! "$PR_BODY $PR_TITLE" =~ (Fixes|Closes|Resolves|fix|close|resolve)\ #[0-9]+ ]]; then
            echo "❌ ERROR: PR must reference an issue (e.g., 'Fixes #123')"
            exit 1
          fi
          echo "✅ PR has issue reference"

      - name: Validate linked issue has priority label
        continue-on-error: true
        run: |
          source scripts/_common/init.sh
          # Extract issue number from PR
          ISSUE_NUM=$(grep -oE '(Fixes|Closes|Resolves|fix|close|resolve)\ #([0-9]+)' <<< "${{ github.event.pull_request.body }}" | grep -oE '[0-9]+' | head -1)

          if [ -n "$ISSUE_NUM" ]; then
            ISSUE_JSON=$(github_gh issue view "$ISSUE_NUM" --json labels -q '.labels[].name' --repo "${GH_REPO}" || echo "")

            if ! echo "$ISSUE_JSON" | grep -E '^P[0-3]$'; then
              echo "⚠️ WARNING: Linked issue #$ISSUE_NUM does not have a priority label (P0/P1/P2/P3)"
              echo "Please add a priority label to issue #$ISSUE_NUM"
            fi
          fi

  pmo-automation:
    name: PMO Workflow Automation
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      issues: write
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@a5ac7e51b41094c153705408e0e3a0dd2b15a8fd
        with:
          fetch-depth: 0

      - name: Scan for TODOs and create issues
        continue-on-error: true
        run: |
          source scripts/_common/init.sh
          # Find all TODO, FIXME, HACK comments
          TODOS=$(grep -r "TODO:\|FIXME:\|HACK:" --include="*.ts" --include="*.tsx" --include="*.js" --include="*.sh" --include="*.py" . 2>/dev/null | grep -v node_modules | grep -v ".git" | head -20)

          if [ -n "$TODOS" ]; then
            echo "Found TODOs in code:"
            echo "$TODOS"

            # Group by type and file
            echo "$TODOS" | while IFS= read -r line; do
              FILE=$(echo "$line" | cut -d: -f1)
              TEXT=$(echo "$line" | cut -d: -f3-)
              TYPE=$(echo "$TEXT" | grep -o '^[A-Z]*' | head -1)

              # Create concise issue title
              TITLE="${TYPE}: $(echo "$TEXT" | cut -c1-60)"

              # Check if similar issue already exists
              EXISTING=$(github_gh issue list -S "$TITLE" -s open --json number --limit 1 --repo "${GH_REPO}" 2>/dev/null || echo "")

              if [ -z "$EXISTING" ]; then
                echo "Creating issue: $TITLE"
                echo "File: $FILE"
                ./scripts/_common/issue-create-unified.sh \
                  --title "$TITLE" \
                  --body "**Source**: $FILE\n\n$TEXT\n\nAuto-created from code scan." \
                  --labels "P2,agent-ready,tech-debt" || true
              fi
            done
          fi

  stale-issue-detection:
    name: Detect & Mark Stale Issues
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    permissions:
      issues: write
      pull-requests: read

    steps:
      - name: Find stale issues (30+ days inactive)
        run: |
          source scripts/_common/init.sh
          # Find issues updated more than 30 days ago
          SINCE=$(date -u -d "30 days ago" +'%Y-%m-%dT%H:%M:%SZ')

          github_gh issue list --repo "${GH_REPO}" \
            --state open \
            --updated "<${SINCE}" \
            --json number,title,updatedAt \
            --limit 100 \
            | jq -r '.[] | "\(.number) - \(.title)"' | while IFS=' - ' read -r NUM TITLE; do

            # Check if already marked stale
            HAS_STALE=$(github_gh issue view "$NUM" --json labels -q '.labels[].name' --repo "${GH_REPO}" | grep -c "stale" || echo 0)

            if [ "$HAS_STALE" -eq 0 ]; then
              echo "Marking issue #$NUM as stale"
              github_gh issue comment "$NUM" --repo "${GH_REPO}" \
                -b "⚠️ This issue has been inactive for 30+ days. Adding 'stale' label. Will auto-close in 14 days if no activity." || true

              github_gh issue edit "$NUM" --add-label "stale" --repo "${GH_REPO}" || true
            fi
          done

  close-stale-issues:
    name: Auto-Close Issues Stale for 14+ Days
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    permissions:
      issues: write
      pull-requests: read

    steps:
      - name: Close stale issues with no activity
        run: |
          source scripts/_common/init.sh
          # Find stale issues marked 14+ days ago
          SINCE=$(date -u -d "44 days ago" +'%Y-%m-%dT%H:%M:%SZ')

          github_gh issue list --repo "${GH_REPO}" \
            --state open \
            --label "stale" \
            --updated "<${SINCE}" \
            --json number,title \
            --limit 100 \
            | jq -r '.[] | .number' | while read -r NUM; do

            echo "Auto-closing stale issue #$NUM"
            github_gh issue close "$NUM" --repo "${GH_REPO}" \
              --reason "not_planned" \
              -c "Auto-closed due to inactivity (stale for 44+ days). Please reopen if this is still needed." || true
          done

  broken-link-check:
    name: Check for Broken Documentation Links
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@a5ac7e51b41094c153705408e0e3a0dd2b15a8fd

      - name: Install markdown-link-check
        run: npm install -g markdown-link-check

      - name: Check documentation links
        continue-on-error: true
        run: |
          source scripts/_common/init.sh
          for md_file in $(find docs -name "*.md" 2>/dev/null); do
            echo "Checking: $md_file"
            markdown-link-check "$md_file" -c .markdown-link-check.json || true
          done

      - name: Report broken links on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          source scripts/_common/init.sh
          BROKEN=$(for md_file in $(find docs -name "*.md" 2>/dev/null); do
            markdown-link-check "$md_file" -q || true
          done | grep -c "ERROR" || echo 0)

          if [ "$BROKEN" -gt 0 ]; then
            github_gh pr comment "${{ github.event.pull_request.number }}" --repo "${GH_REPO}" \
              -b "⚠️ Documentation contains $BROKEN broken links. Please fix before merge." || true
          fi

  weekly-status-report:
    name: Generate Weekly Status Report
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    permissions:
      contents: read
      issues: read
      pull-requests: read

    steps:
      - name: Generate weekly digest
        run: |
          source scripts/_common/init.sh
          WEEK_SINCE=$(date -u -d "7 days ago" +'%Y-%m-%dT%H:%M:%SZ')

          OPEN_ISSUES=$(github_gh issue list --state open --json number --limit 1 --repo "${GH_REPO}" | jq 'length')
          NEW_ISSUES=$(github_gh issue list --state open --created ">=${WEEK_SINCE}" --json number --repo "${GH_REPO}" | jq 'length')
          CLOSED_ISSUES=$(github_gh issue list --state closed --updated ">=${WEEK_SINCE}" --json number --limit 100 --repo "${GH_REPO}" | jq 'length')
          OPEN_PRS=$(github_gh pr list --state open --json number --repo "${GH_REPO}" | jq 'length')
          MERGED_PRS=$(github_gh pr list --state closed --updated ">=${WEEK_SINCE}" --json number --limit 100 --repo "${GH_REPO}" | jq 'length')

          echo "## Weekly Status Report — $(date -u +'%Y-%m-%d')" > /tmp/weekly-report.md
          echo "" >> /tmp/weekly-report.md
          echo "**Period**: Last 7 days" >> /tmp/weekly-report.md
          echo "" >> /tmp/weekly-report.md
          echo "### Issues" >> /tmp/weekly-report.md
          echo "- Open: ${OPEN_ISSUES}" >> /tmp/weekly-report.md
          echo "- New this week: ${NEW_ISSUES}" >> /tmp/weekly-report.md
          echo "- Closed this week: ${CLOSED_ISSUES}" >> /tmp/weekly-report.md
          echo "" >> /tmp/weekly-report.md
          echo "### Pull Requests" >> /tmp/weekly-report.md
          echo "- Open: ${OPEN_PRS}" >> /tmp/weekly-report.md
          echo "- Merged this week: ${MERGED_PRS}" >> /tmp/weekly-report.md

          cat /tmp/weekly-report.md

          # Create release note if there were significant changes
          if [ "$MERGED_PRS" -gt 0 ]; then
            echo "" >> /tmp/weekly-report.md
            echo "### Recent Merges" >> /tmp/weekly-report.md
            github_gh pr list --state closed --updated ">=${WEEK_SINCE}" --json number,title,mergedAt --limit 10 --repo "${GH_REPO}" | \
              jq -r '.[] | "- #\(.number): \(.title)"' >> /tmp/weekly-report.md || true
          fi

          cat /tmp/weekly-report.md
