version: "1"

# LOCAL DEVELOPMENT CONFIGURATION
# Use on Docker Desktop for maximum resource availability
# Intended for: Single developer, full feature set

runtime:
  mode: local
  fallback: none
  resource_limits:
    cpu: 4
    memory: 8Gi

services:
  - name: postgres
    image: postgres:16-alpine@sha256:9f1f3f0f6e6e6e6e6e6e6e6e6e6e6e6e6e6e6e6e6e6e6e6e6e6e6e6e6e6e6e6e
    persistent: true
    env:
      POSTGRES_DB: local_dev
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev_password
  
  - name: redis
    image: redis:7-alpine@sha256:8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e
    persistent: false
  
  - name: ollama
    image: ollama/ollama:0.1.27@sha256:7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f
    persistent: true
    env:
      OLLAMA_BASE_URL: http://ollama:11434

ai:
  model: llama3:8b
  provider: ollama
  fallback_chain:
    - local
  constraints:
    - no_external_unless_explicit
    - log_all_interactions

policies:
  - no_prod_without_human
  - secrets_never_leave_boundary
  - full_audit_all_actions

compliance:
  frameworks:
    - SOC2
  data_classification: internal
