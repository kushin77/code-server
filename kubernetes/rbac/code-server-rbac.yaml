apiVersion: v1
kind: Namespace
metadata:
  name: code-server
  labels:
    app.kubernetes.io/name: code-server-enterprise
    project: code-server
    environment: production
  annotations:
    description: "Dedicated namespace for code-server-enterprise deployment. Isolated from other workloads."
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: code-server
  namespace: code-server
  labels:
    app.kubernetes.io/name: code-server-enterprise
    project: code-server
    app.kubernetes.io/component: rbac
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: code-server-deployment
  namespace: code-server
  labels:
    app.kubernetes.io/name: code-server-enterprise
    project: code-server
rules:
# Deployments - manage all
- apiGroups: ["apps"]
  resources: ["deployments", "deployments/scale", "deployments/status"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# StatefulSets - manage all
- apiGroups: ["apps"]
  resources: ["statefulsets", "statefulsets/scale", "statefulsets/status"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# DaemonSets - manage all
- apiGroups: ["apps"]
  resources: ["daemonsets", "daemonsets/status"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# Services - manage all
- apiGroups: [""]
  resources: ["services", "services/status"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# ConfigMaps - manage all
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# Secrets - manage all
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# PersistentVolumeClaims - manage all
- apiGroups: [""]
  resources: ["persistentvolumeclaims", "persistentvolumeclaims/status"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# Pods - read only (troubleshooting)
- apiGroups: [""]
  resources: ["pods", "pods/status", "pods/log"]
  verbs: ["get", "list", "watch"]
# Pod Exec - for debugging
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["get", "create"]
# HPA - manage all
- apiGroups: ["autoscaling"]
  resources: ["horizontalpodautoscalers", "horizontalpodautoscalers/status"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# PDB - manage all
- apiGroups: ["policy"]
  resources: ["poddisruptionbudgets", "poddisruptionbudgets/status"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# NetworkPolicies - read only (managed separately)
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["get", "list", "watch"]
# Ingress - manage all code-server resources
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses", "ingresses/status"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# Events - read only
- apiGroups: [""]
  resources: ["events"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: code-server-deployment
  namespace: code-server
  labels:
    app.kubernetes.io/name: code-server-enterprise
    project: code-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: code-server-deployment
subjects:
- kind: ServiceAccount
  name: code-server
  namespace: code-server
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: code-server-readonly-cluster
  labels:
    app.kubernetes.io/name: code-server-enterprise
    project: code-server
rules:
# StorageClasses - read only (cluster-wide, needed for PVC provisioning)
- apiGroups: ["storage.k8s.io"]
  resources: ["storageclasses"]
  verbs: ["get", "list", "watch"]
# PersistentVolumes - read only (cluster-wide, needed for PVC binding)
- apiGroups: [""]
  resources: ["persistentvolumes"]
  verbs: ["get", "list", "watch"]
# APIResources - read only (discovery)
- apiGroups: [""]
  resources: ["apiresources"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: code-server-readonly-cluster
  labels:
    app.kubernetes.io/name: code-server-enterprise
    project: code-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: code-server-readonly-cluster
subjects:
- kind: ServiceAccount
  name: code-server
  namespace: code-server
---
# RESTRICTIONS: Prevent code-server from accessing other namespaces
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: code-server-deny-other-namespaces
  labels:
    app.kubernetes.io/name: code-server-enterprise
    project: code-server
rules:
# Explicitly deny all namespace access
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: code-server-deny-other-namespaces
  labels:
    app.kubernetes.io/name: code-server-enterprise
    project: code-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: code-server-deny-other-namespaces
subjects:
- kind: ServiceAccount
  name: code-server
  namespace: code-server
